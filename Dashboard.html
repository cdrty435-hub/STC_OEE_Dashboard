<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>안전·전기 개선 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f6;--surface:#fff;--sunk:#f8f9fa;--ink:#111827;--ink2:#4b5563;--muted:#8b95a1;--line:#e5e7eb;--line2:#f0f1f3;
  --navy:#0f1d33;--navy2:#1b2d4a;
  --ok:#16a34a;--ok-t:#15803d;--ok-bg:#ecfdf3;
  --run:#2a78d6;--run-t:#1d5fb0;--run-bg:#eef5fe;
  --bad:#d03b3b;--bad-t:#b42323;--bad-bg:#fdf0f0;
  --hold:#eda100;--hold-t:#8a5d00;--hold-bg:#fff7e1;
  --plan:#c3cad3;--plan-t:#4b5563;--plan-bg:#f1f3f5;
  --ext:#eb6834;
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:10px;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font:14px/1.5 'Noto Sans KR','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
body.th{font-family:'Noto Sans Thai','Noto Sans KR',system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:-.2px}

/* header */
header{background:var(--navy);color:#fff}
.hwrap{max-width:1360px;margin:0 auto;padding:18px 24px 0;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.brand{flex:1;min-width:240px}
.brand small{display:block;color:#9fb0c8;font-size:12px;letter-spacing:.3px}
.brand h1{margin:2px 0 0;font-size:22px;font-weight:700;letter-spacing:-.3px}
.hmeta{display:flex;gap:10px;align-items:center;padding-bottom:4px;flex-wrap:wrap}
.stamp{font-size:12px;color:#b8c5d8}
.stamp b{color:#fff;font-weight:500}
.seg{display:inline-flex;background:var(--navy2);border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;color:#b8c5d8;padding:5px 12px;border-radius:6px;font-size:13px;font-weight:500}
.seg button[aria-pressed=true]{background:#fff;color:var(--navy)}
.hbtn{border:1px solid #33496b;background:transparent;color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.hbtn:disabled{opacity:.5;cursor:wait}
nav{max-width:1360px;margin:14px auto 0;padding:0 24px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:transparent;color:#b8c5d8;padding:10px 14px;font-size:14px;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-selected=true]{color:#fff;border-bottom-color:#5aa2ff}

main{max-width:1360px;margin:0 auto;padding:20px 24px 48px}
.view[hidden]{display:none}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.15fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1000px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);min-width:0}
.ch{display:flex;align-items:baseline;gap:10px;padding:14px 18px 0;flex-wrap:wrap}
.ch h2{margin:0;font-size:15px;font-weight:700}
.ch .note{color:var(--muted);font-size:12px}
.ch .sp{flex:1}
.cb{padding:12px 18px 16px}
.empty{color:var(--muted);text-align:center;padding:28px 0;font-size:13px}

/* KPI */
.kpis{display:grid;grid-template-columns:1.6fr repeat(5,1fr);gap:12px;margin-bottom:16px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.kpi.hero{grid-column:1/-1}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.kpi .k{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1.15}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:6px}
.kpi .dot{width:8px;height:8px;border-radius:50%}
.kpi.hero .row{display:flex;align-items:baseline;gap:14px}
.kpi.hero .gap{font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px}
.meter{position:relative;height:10px;background:var(--line2);border-radius:5px;margin-top:8px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ok)}
.meter b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.mleg{display:flex;gap:14px;font-size:11px;color:var(--ink2);margin-top:6px}
.mleg span{display:inline-flex;align-items:center;gap:5px}
.mleg i{width:10px;height:6px;border-radius:2px;background:var(--ok)}
.mleg b{width:2px;height:10px;background:var(--ink)}

/* bullet bars (분야) */
.bl{display:grid;grid-template-columns:minmax(150px,1.3fr) 2fr 92px;gap:6px 14px;align-items:center}
.bl .nm{font-size:13px;display:flex;gap:8px;align-items:center;min-width:0}
.bl .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl .nm em{font-style:normal;color:var(--muted);font-size:12px;flex:none}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.bt{position:relative;height:14px;background:var(--line2);border-radius:4px}
.bt i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ok)}
.bt b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.bl .num{font-size:12px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.bl .num strong{color:var(--ink);font-size:13px}
@media(max-width:560px){.bl{grid-template-columns:1fr 70px}.bl .nm{grid-column:1/-1}}

/* stacked (팀) */
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px}
.sl{display:grid;grid-template-columns:minmax(120px,1fr) 2fr 64px;gap:8px 14px;align-items:center;margin-top:12px}
.sl .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stk{display:flex;gap:2px;height:16px}
.stk i{border-radius:3px;min-width:4px;position:relative}
.stk i:first-child{border-radius:4px 3px 3px 4px}
.sl .num{font-size:12px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}

/* reason bars */
.rb{display:grid;grid-template-columns:minmax(120px,1fr) 2fr 36px;gap:8px 12px;align-items:center}
.rb .nm{font-size:13px}
.rb .bar{height:14px;border-radius:0 4px 4px 0;background:var(--c1)}
.rb .num{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.6}
.chip::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.done{background:var(--ok-bg);color:var(--ok-t)}
.chip.doing{background:var(--run-bg);color:var(--run-t)}
.chip.late{background:var(--bad-bg);color:var(--bad-t)}
.chip.hold{background:var(--hold-bg);color:var(--hold-t)}
.chip.plan{background:var(--plan-bg);color:var(--plan-t)}
.chip.ext{background:#fff1ea;color:#b4441a}
.chip.ext::before{display:none}
.chip.soon{background:var(--hold-bg);color:var(--hold-t)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;white-space:nowrap}
.tag.new{background:#e8f1ff;color:#1d5fb0}
.tag.chg{background:var(--ok-bg);color:var(--ok-t)}
.tag.same{background:var(--plan-bg);color:var(--plan-t)}
.tag.none{background:var(--bad-bg);color:var(--bad-t)}
.tag.fin{background:var(--ok-bg);color:var(--ok-t)}

/* attention list */
.att{display:flex;flex-direction:column}
.att .it{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line2);cursor:pointer}
.att .it:first-child{border-top:0}
.att .it:hover .tt{color:var(--run-t)}
.att .tt{font-weight:500;font-size:13px}
.att .mt{display:block;color:var(--muted);font-size:12px}
.dd{font-size:12px;font-weight:700;text-align:right;white-space:nowrap}

/* filters */
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.fbar select,.fbar input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13px;min-width:0}
.fbar input[type=search]{flex:1;min-width:180px}
.fbar label{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;color:var(--ink2)}
.pills button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.pills button small{opacity:.7;margin-left:4px;font-weight:400}

/* weekly */
.wsum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:700px){.wsum{grid-template-columns:repeat(2,1fr)}}
.wsum div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.wsum span{display:block;font-size:12px;color:var(--ink2)}
.wsum b{font-size:22px}
.wgrp{margin-bottom:16px}
.wgh{display:flex;align-items:center;gap:8px;padding:10px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.wgh em{font-style:normal;color:var(--muted);font-weight:400;font-size:12px}
.wr{display:grid;grid-template-columns:52px minmax(200px,1.1fr) 2fr;gap:14px;padding:12px 18px;border-top:1px solid var(--line2);cursor:pointer}
.wr:first-of-type{border-top:0}
.wr:hover{background:var(--sunk)}
.wr .w1{font-weight:500;font-size:13px}
.wr .w1 .mt{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:5px;font-weight:400;color:var(--muted);font-size:12px}
.note-now{font-size:13px;white-space:pre-line}
.note-orig{font-size:12px;color:var(--muted);white-space:pre-line;margin-top:3px}
.note-prev{font-size:12px;color:var(--muted);margin-top:6px;padding-left:10px;border-left:2px solid var(--line);white-space:pre-line}
.note-prev b{font-weight:500;color:var(--ink2)}
.nh{display:flex;gap:6px;align-items:center;margin-bottom:4px}
@media(max-width:760px){.wr{grid-template-columns:44px 1fr}.wr .w2{grid-column:1/-1}}

/* weekly table (밝은 보고서형) */
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:16px 18px 14px}
.wch{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.wch h2{margin:0;font-size:17px;font-weight:700;color:#1e3a5f}
.wch h2 small{font-weight:500;color:var(--ink2);font-size:14px;margin-left:4px}
.wch .sp{flex:1}
.wch .sum{font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap}
.wch .sum .up{color:var(--ok-t)}.wch .sum .dn{color:var(--bad-t)}.wch .sum .mu{color:var(--muted);font-weight:500}
.wtw{overflow:auto;max-height:calc(100vh - 210px)}
table.wt{border-collapse:separate;border-spacing:0;font-size:13px;width:100%;min-width:980px}
.wt th{position:sticky;top:0;z-index:3;background:#f6f8fb;color:#64748b;font-weight:500;font-size:12px;text-align:left;padding:8px 12px;white-space:nowrap;border-bottom:1px solid #e2e8f0}
.wt th.r,.wt td.r{text-align:right}
.wt th.c,.wt td.c{text-align:center}
.wt th.cur{color:var(--run-t);font-weight:700}
.wt th small{font-weight:400;margin-left:4px;color:#94a3b8}
.wt td{padding:10px 12px;border-bottom:1px solid #eef1f5;vertical-align:top;background:var(--surface)}
.wt tr.task{cursor:pointer}
.wt tr.task:hover td{background:#f8fafc}
.wt .stick1{position:sticky;left:0;z-index:2}
.wt .stick2{position:sticky;left:64px;z-index:2}
.wt th.stick1,.wt th.stick2{z-index:4}
.wt td.id{width:64px;min-width:64px;white-space:nowrap;color:#3b6fb6;font-size:12.5px;font-variant-numeric:tabular-nums;padding-top:11px}
.wt td.wname{min-width:230px;max-width:300px}
.wt td.wname .nm{display:flex;gap:8px;align-items:flex-start;font-weight:700;color:var(--ink)}
.wt td.wname .nm i{width:10px;height:10px;border-radius:2px;flex:none;margin-top:5px}
.wt td.wname .sub{display:block;font-weight:400;color:#8a94a3;font-size:12px;margin:2px 0 0 18px}
.wt td.own{white-space:nowrap;color:var(--ink2)}
.wt td.own .ex{display:block;color:#c2410c;font-size:11.5px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:2px}
.st.done{color:var(--ok-t)}.st.doing{color:var(--run-t)}.st.late{color:var(--bad-t)}.st.plan{color:#64748b}.st.hold{color:var(--hold-t)}
.wt td.per{font-size:12.5px;white-space:nowrap;color:var(--ink2);font-variant-numeric:tabular-nums}
.wt td.per.late{color:var(--bad-t);font-weight:700}
.wt td.note{white-space:pre-line;min-width:250px;line-height:1.5;color:#334155}
.wt td.note.cur{background:#f7faff;color:var(--ink)}
.wt tr.task:hover td.note.cur{background:#eef4fd}
.wt td.note .o{display:block;color:#94a3b8;font-size:12px;margin-top:3px}
.wt td.note.nil{color:#cbd5e1}
.wt td.chg{white-space:nowrap;font-weight:700;font-size:12.5px}
.chg.k-chg,.chg.k-new{color:var(--ok-t)}.chg.k-same{color:#94a3b8;font-weight:500}.chg.k-none{color:var(--bad-t)}.chg.k-fin{color:var(--ok-t);font-weight:500}
.wt tr.grp td{background:var(--surface);padding:14px 12px 6px;border-bottom:1px solid #e2e8f0;font-size:13px;font-weight:700;color:#1e3a5f}
.wt tr.grp td em{font-style:normal;font-weight:500;color:#94a3b8;font-size:12px;margin-left:6px}
.wt tr.grp td .gs{float:right;font-weight:500;font-size:12px;color:#64748b}
.wt tr.grp td .gs b{font-weight:700}
.wt tfoot td{position:sticky;bottom:0;background:#f1f4f8;font-weight:700;border-top:1px solid #e2e8f0;border-bottom:0;padding:10px 12px;z-index:2}
.wnote{font-size:12px;color:#64748b;margin-top:10px}
@media(max-width:760px){.wt .stick2{position:static}.wt td.wname{min-width:180px}}

/* gantt */
.gwrap{overflow-x:auto}
.g{min-width:760px}
.grow{display:flex;align-items:stretch;border-top:1px solid var(--line2)}
.ghead{position:sticky;top:0;background:var(--surface);z-index:2;border-top:0;border-bottom:1px solid var(--line)}
.gl{width:var(--lw);flex:none;padding:6px 10px 6px 0;font-size:12.5px;display:flex;gap:6px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.gl span.t{overflow:hidden;text-overflow:ellipsis}
.gt{position:relative;width:var(--tw);flex:none;height:30px}
.wk{display:flex;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.wk div{padding:6px 0 6px 4px;border-left:1px solid var(--line2)}
.wk div.now{color:var(--run-t);font-weight:700;background:var(--run-bg)}
.gcat .gl{font-weight:700;font-size:12px;color:var(--ink2);padding-top:10px}
.gcat .gt{height:30px}
.gb{position:absolute;top:8px;height:14px;border-radius:4px;cursor:pointer}
.gb.ext{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.45) 0 3px,transparent 3px 7px)!important}
.gm{position:absolute;top:4px;width:2px;height:22px;background:var(--ink);opacity:.25}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:1}
.gwl{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed #94a3b8}

/* task table */
.tw{overflow-x:auto}
table.tt{width:100%;border-collapse:collapse;font-size:13px}
.tt th{position:sticky;top:0;background:var(--sunk);text-align:left;font-size:12px;color:var(--ink2);font-weight:500;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tt td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:top}
.tt tbody tr{cursor:pointer}
.tt tbody tr:hover td{background:var(--sunk)}
.tt .c{text-align:center}
.tt .wk1{font-weight:500}
.tt .sub{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:2px}
.pbar{display:flex;align-items:center;gap:8px;min-width:90px}
.pbar .bt{flex:1;height:8px}
.pbar span{font-size:12px;width:34px;text-align:right;font-variant-numeric:tabular-nums}
.ph2{display:flex;gap:4px}
.ph2 img{width:36px;height:36px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.lastnote{white-space:pre-line;color:var(--ink2);max-width:420px}
@media(max-width:760px){
  .tt thead{display:none}
  .tt,.tt tbody,.tt tr,.tt td{display:block;width:100%}
  .tt tr{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--surface)}
  .tt td{border:0;padding:4px 12px}
  .tt td:first-child{padding-top:10px}.tt td:last-child{padding-bottom:12px}
  .tt tr{display:grid;grid-template-columns:1fr 1fr;padding:8px 0}
  .tt td[data-label]::before{content:attr(data-label);display:block;font-size:11px;color:var(--muted)}
  .tt td.c{text-align:left}
  .tt td:nth-child(1)::before,.tt td:nth-child(2)::before{display:none!important}
  .tt td:nth-child(1){grid-column:1/-1;padding-top:6px}
  .tt td:nth-child(2){grid-column:1/-1;font-size:14px}
  .tt td:nth-child(7){grid-column:1/-1}
  .tt td:nth-child(8):has(.ph2 span){display:none}
}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;box-shadow:-8px 0 24px rgba(0,0,0,.12);display:flex;flex-direction:column}
.dh{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh h3{margin:0;font-size:17px;line-height:1.4}
.dh .x{margin-left:auto;border:0;background:var(--line2);border-radius:8px;width:32px;height:32px;font-size:18px;flex:none}
.db{padding:16px 20px 28px;overflow-y:auto}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px;margin-bottom:18px}
.facts div span{display:block;font-size:11px;color:var(--muted)}
.facts div b{font-weight:500;font-size:13px}
.sec{margin-bottom:18px}
.sec h4{margin:0 0 6px;font-size:12px;color:var(--ink2);font-weight:700;text-transform:none}
.sec p{margin:0;white-space:pre-line;font-size:13.5px}
.tl{position:relative;padding-left:18px}
.tl::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .e{position:relative;margin-bottom:14px}
.tl .e::before{content:'';position:absolute;left:-17px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--run)}
.tl .e.last::before{background:var(--run)}
.tl .d{font-size:12px;font-weight:700;color:var(--run-t)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photos figure{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk)}
.photos img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in}
.photos .np{aspect-ratio:4/3;display:grid;place-items:center;color:var(--muted);font-size:12px}
.photos figcaption{font-size:12px;padding:5px 8px;font-weight:500}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:60;display:grid;place-items:center;padding:20px}
.lb img{max-width:100%;max-height:90vh;border-radius:6px}

/* download */
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.dl button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px}
.dl button:hover{border-color:var(--run)}
.dl button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.dl button b{display:block;font-weight:500;font-size:13px}
.dl button i{display:block;font-style:normal;font-size:12px;opacity:.65}
.dl button small{font-family:var(--mono);font-size:11px;opacity:.7}
.dl button:disabled{opacity:.5;cursor:wait}
.dlmsg{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:12px;background:var(--bad-bg);color:var(--bad-t);overflow-wrap:anywhere}
.dlmsg.ok{background:var(--ok-bg);color:var(--ok-t)}.dlmsg.wait{background:var(--run-bg);color:var(--run-t)}

.loading{padding:60px 20px;text-align:center;color:var(--ink2)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:70}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--navy);color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;max-width:300px;line-height:1.45}
@media(max-width:640px){.hwrap,nav,main{padding-left:14px;padding-right:14px}.brand h1{font-size:18px}}

    let j;try{j=JSON.parse(txt)}catch(e){throw new Error('API 응답을 읽을 수 없습니다. 웹앱 배포 > 액세스 권한이 "모든 사용자"인지, 새 버전으로 배포했는지 확인하세요.')}
    if(!j.ok)throw new Error(j.error||'API error');return j;
  });
}

/* ---------- 데이터 가공 ---------- */
function enrich(d){
  const today=pd(d.today);
  d.weeks=d.weeks||[];
  d.tasks.forEach(x=>{
    const s=pd(x.start),e=pd(x.end),k=ST_KEY[x.status]||'plan';
    x.eff=k==='done'?'done':k==='hold'?'hold':(!isNaN(e)&&e<today&&!(e<s)?'late':k);
    x.act=k==='done'?1:Math.max(0,Math.min(1,x.ap||0));
    x.bad=!isNaN(s)&&!isNaN(e)&&e<s;
    x.pln=(isNaN(s)||isNaN(e)||x.bad)?0:Math.max(0,Math.min(1,(today-s+DAY)/(e-s+DAY)));
    x.left=isNaN(e)?null:Math.round((e-today)/DAY);
    x.tr=x.tr||{};x.weekly=x.weekly||[];
    x.wmap={};x.weekly.forEach(w=>x.wmap[w.w]=w);
    x.last=x.weekly.length?x.weekly[x.weekly.length-1]:null;
  });
  if(!curWeek||!d.weeks.some(w=>w.date===curWeek))curWeek=d.weeks.length?d.weeks[d.weeks.length-1].date:null;
  return d;
}
function groups(key,list){const m=new Map();(list||DATA.tasks).forEach(x=>{if(!m.has(x[key]))m.set(x[key],[]);m.get(x[key]).push(x)});return m}
function weekState(x,wd){
  const i=DATA.weeks.findIndex(w=>w.date===wd);const cur=x.wmap[wd];
  let prev=null;for(let j=i-1;j>=0;j--){if(x.wmap[DATA.weeks[j].date]){prev=x.wmap[DATA.weeks[j].date];break}}
  if(!cur)return{k:x.eff==='done'?'fin':'none',cur,prev};
  if(!prev)return{k:i>0?'new':'new',cur,prev};
  return{k:norm(cur.th)===norm(prev.th)&&norm(cur.ko)===norm(prev.ko)?'same':'chg',cur,prev};
}

function setView(v){
  view=v;try{localStorage.setItem('db_view',v)}catch(e){}
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));
  if(!DATA)return;
  document.querySelectorAll('.view').forEach(s=>s.hidden=s.id!=='v-'+v);

function fillSelect(el,allLabel,items){
  const cur=el.value;
  el.innerHTML=(allLabel?`<option value="">${esc(allLabel)}</option>`:'')+items.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('');
  if(items.some(i=>i[0]===cur))el.value=cur;
}
function teamKeys(){const g=groups('own');return [...g.keys()].sort((a,b)=>(a==='미정')-(b==='미정')||g.get(b).length-g.get(a).length)}

function renderKpis(){
  const T=DATA.tasks,n=T.length,c=k=>T.filter(x=>x.eff===k).length;
  const pl=avg(T.map(x=>x.pln)),ac=avg(T.map(x=>x.act)),gap=Math.round((ac-pl)*100);
  const gcol=gap>=0?'background:var(--ok-bg);color:var(--ok-t)':gap>-15?'background:var(--hold-bg);color:var(--hold-t)':'background:var(--bad-bg);color:var(--bad-t)';
  const tile=(k,v,col,sub)=>`<div class="kpi"><span class="k"><i class="dot" style="background:${col}"></i>${k.includes(' ')?k:t(k)}</span><span class="v">${v}${sub?`<small>${sub}</small>`:''}</span></div>`;
  $('kpis').innerHTML=`<div class="kpi hero"><span class="k">${t('progress')}</span>
     <div class="row"><span class="v">${pct(ac)}</span><span class="gap" style="${gcol}">${t('vsPlan')} ${gap>0?'+':''}${gap}%p</span></div>
     <div class="meter" data-tip="${t('actual')} ${pct(ac)} · ${t('planned')} ${pct(pl)}"><i style="width:${pct(ac)}"></i><b style="left:calc(${pct(pl)} - 1px)"></b></div>
     <div class="mleg"><span><i></i>${t('actual')} ${pct(ac)}</span><span><b></b>${t('planned')} ${pct(pl)}</span></div></div>`+
   `<div class="kpi"><span class="k">${t('total')}</span><span class="v">${n}</span></div>`+
   tile('done',c('done'),ST_COL.done,n?pct(c('done')/n):'')+tile('doing',c('doing'),ST_COL.doing)+tile('late',c('late'),ST_COL.late)+
   tile(t('plan')+' / '+t('hold'),c('plan')+c('hold'),ST_COL.plan,`${t('plan')} ${c('plan')} · ${t('hold')} ${c('hold')}`);
}

}

function reasonsOf(x){if(!x.last)return [];const s=x.last.ko+' '+x.last.th;return REASONS.filter(([,re])=>re.test(s)).map(([k])=>k)}
function renderReasons(){
  const open=DATA.tasks.filter(x=>x.eff!=='done');
  const cnt={};open.forEach(x=>{const r=reasonsOf(x);(r.length?r:[x.last?'r_other':'r_none']).forEach(k=>cnt[k]=(cnt[k]||0)+1)});
  const rows=Object.entries(cnt).sort((a,b)=>(a[0]==='r_none')-(b[0]==='r_none')||(a[0]==='r_other')-(b[0]==='r_other')||b[1]-a[1]);const max=Math.max(1,...rows.map(r=>r[1]));

function renderWeekly(){
  if(!DATA.weeks.length){$('wPills').innerHTML='';$('wSum').innerHTML='';$('wList').innerHTML=`<div class="card"><div class="empty">${t('noWeek')}</div></div>`;return}
  $('wPills').innerHTML=DATA.weeks.map(w=>{const n=DATA.tasks.filter(x=>x.wmap[w.date]).length;return `<button data-w="${w.date}" aria-pressed="${w.date===curWeek}">${md(w.date)}<small>${n}</small></button>`}).join('');
  $('wPills').querySelectorAll('button').forEach(b=>b.onclick=()=>{curWeek=b.dataset.w;renderWeekly()});
  const team=$('wTeam').value,show=$('wShow').value,orig=$('wOrig').checked;
  const base=DATA.tasks.filter(x=>!team||x.own===team);
  const st=base.map(x=>({x,...weekState(x,curWeek)}));
  const c=k=>st.filter(s=>s.k===k).length;
  $('wSum').innerHTML='';
  const list=st.filter(s=>!show||(show==='chg'?(s.k==='chg'||s.k==='new'):s.k===show));
  const ci=DATA.weeks.findIndex(w=>w.date===curWeek);
  const cols=DATA.weeks.slice(Math.max(0,ci-3),ci+1);
  const prevW=ci>0?DATA.weeks[ci-1].date:null;
  const span=6+cols.length;
  const sumH=`<span class="sum">${prevW?`<span class="mu">${md(prevW)}</span> → `:''}${md(curWeek)} · ${t('w_chg')} <span class="up">${c('chg')+c('new')}</span> / ${t('w_same')} <span class="mu">${c('same')}</span> / ${t('w_none')} <span class="dn">${c('none')}</span></span>`;
  const g=new Map();list.forEach(s=>{if(!g.has(s.x.cat))g.set(s.x.cat,[]);g.get(s.x.cat).push(s)});
  const chgTxt=s=>s.k==='fin'?t('st_done'):s.k==='chg'?'▲ '+t('w_chg'):s.k==='new'?'＋ '+t('w_new'):s.k==='none'?'● '+t('w_none'):'– '+t('w_same');
  const head=`<tr><th class="stick1">${t('c_id')}</th><th class="stick2">${t('c_work')} · ${t('s_area')}</th><th>${t('c_own')}</th><th>${t('c_st')}</th><th>${t('c_period')}</th>`+
    cols.map(w=>`<th class="${w.date===curWeek?'cur':''}">${md(w.date)}<small>${w.date===curWeek?t('baseWeek'):t('week')}</small></th>`).join('')+`<th class="c">${t('c_chg')}</th></tr>`;
  const rows=[...g.keys()].sort().map(k=>{const arr=g.get(k);const n=kk=>arr.filter(s=>kk.includes(s.k)).length;
    return `<tr class="grp"><td colspan="${span}"><i class="sw" style="display:inline-block;margin-right:8px;vertical-align:-1px;background:var(--c${catIdx(k)+1})"></i>${esc(labelOf(k,'cat'))}<em>${arr.length}${t('cnt')}</em>
      <span class="gs">${t('w_chg')} <b style="color:var(--ok-t)">${n(['chg','new'])}</b> · ${t('w_same')} <b>${n(['same'])}</b> · ${t('w_none')} <b style="color:var(--bad-t)">${n(['none'])}</b></span></td></tr>`+
    arr.map(s=>{const x=s.x;
      const cells=cols.map(w=>{const nn=x.wmap[w.date];const isCur=w.date===curWeek;const o=nn&&orig?wOrig(nn):'';
        return `<td class="note ${isCur?'cur':''} ${nn?'':'nil'}">${nn?esc(wTxt(nn))+(o?`<span class="o">${esc(o)}</span>`:''):'–'}</td>`}).join('');
      return `<tr class="task" data-open="${esc(x.id)}"><td class="id stick1">${esc(x.id)}</td>
        <td class="wname stick2"><div class="nm"><i style="background:var(--c${catIdx(x.cat)+1})"></i><span>${esc(L(x,'work'))}</span></div>${x.area?`<span class="sub">${esc(L(x,'area'))}</span>`:''}</td>
        <td class="own">${esc(L(x,'own'))}${x.io==='외부'?`<span class="ex">${t('outside')}</span>`:''}</td>
        <td><span class="st ${x.eff}"><i style="background:${ST_COL[x.eff]}"></i>${t('st_'+x.eff)}</span></td>
        <td class="per ${x.eff==='late'||x.bad?'late':''}">${md(x.start)} – ${md(x.end)}${x.bad?'<br>⚠ '+t('dateErr'):''}</td>${cells}
        <td class="c chg k-${s.k}">${chgTxt(s)}</td></tr>`}).join('')}).join('');
  const foot=`<tr><td class="stick1"></td><td class="stick2">${t('total')}</td><td colspan="3">${list.length}${t('cnt')}</td>`+
    cols.map(w=>`<td>${list.filter(s=>s.x.wmap[w.date]).length}${t('cnt')} <span style="font-weight:500;color:#64748b">${t('w_cnt')}</span></td>`).join('')+

    (list.length?`<div class="wtw"><table class="wt"><thead>${head}</thead><tbody>${rows}</tbody><tfoot>${foot}</tfoot></table></div>`:`<div class="empty">${t('noItems')}</div>`)+
    `<div class="wnote">※ ${t('wNote')}</div></div>`;

/* ---------- 간트 ---------- */
function renderGantt(){
  const team=$('gTeam').value,cat=$('gCat').value;
  const list=DATA.tasks.filter(x=>(!team||x.own===team)&&(!cat||x.cat===cat)&&!isNaN(pd(x.start))&&!isNaN(pd(x.end))).sort((a,b)=>a.cat.localeCompare(b.cat)||a.ord-b.ord);
  $('gLegend').innerHTML=ST.map(k=>`<span><i style="background:${ST_COL[k]}"></i>${t('st_'+k)}</span>`).join('')+
    `<span><i style="background:repeating-linear-gradient(135deg,#94a3b8 0 2px,transparent 2px 4px)"></i>${t('outside')}</span><span><i style="background:var(--bad);width:2px"></i>${md(DATA.today)}</span><span><i style="width:0;border-left:1px dashed #94a3b8;border-radius:0"></i>${t('wline')}</span>`;
  if(!list.length){$('gantt').innerHTML=`<div class="empty">${t('noItems')}</div>`;return}
  let s=Math.min(...list.map(x=>pd(x.start)),pd(DATA.today)),e=Math.max(...list.map(x=>pd(x.end)));
  s-=((new Date(s).getUTCDay()+6)%7)*DAY;const weeks=Math.max(4,Math.ceil((e-s+DAY)/(7*DAY)));
  const W=Math.max(760,$('gantt').clientWidth-36),lw=W<900?200:300,dw=Math.max(2,(W-lw)/(weeks*7)),wpx=dw*7,tw=weeks*wpx,today=pd(DATA.today);
  let wk='';for(let i=0;i<weeks;i++){const ws=s+i*7*DAY;const now=today>=ws&&today<ws+7*DAY;wk+=`<div class="${now?'now':''}" style="width:${wpx}px">${wpx>=34||i%2===0?md(new Date(ws).toISOString()):''}</div>`}
  const X=d=>(pd(d)-s)/DAY*dw;
  const tl=(today-s)/DAY*dw;
  const bg=`background-image:repeating-linear-gradient(90deg,var(--line2) 0 1px,transparent 1px ${wpx}px)`;
  const wl=DATA.weeks.map(w=>`<div class="gwl" style="left:${X(w.date)+dw/2}px"></div>`).join('');
  let h=`<div class="g" style="--tw:${tw}px;--lw:${lw}px"><div class="grow ghead"><div class="gl"></div><div class="wk">${wk}</div></div>`,last=null;
  list.forEach(x=>{
    if(x.cat!==last){last=x.cat;h+=`<div class="grow gcat"><div class="gl"><i class="sw" style="background:var(--c${catIdx(x.cat)+1})"></i>${esc(labelOf(x.cat,'cat'))}</div><div class="gt" style="${bg}"><div class="today" style="left:${tl}px"></div></div></div>`}
    const a0=x.bad?x.end:x.start,a1=x.bad?x.start:x.end;
    const l=X(a0),w=Math.max(dw,(pd(a1)-pd(a0)+DAY)/DAY*dw);
    const tip=(x.bad?`⚠ ${t('dateErrTip')}\n`:'')+`${x.id} ${L(x,'work')} · ${md(x.start)}–${md(x.end)} · ${t('st_'+x.eff)} · ${L(x,'own')}`+(x.last?`\n${md(x.last.w)}: ${wTxt(x.last)}`:'');
    h+=`<div class="grow"><div class="gl" data-open="${esc(x.id)}"><span class="mono" style="color:var(--muted)">${esc(x.id)}</span><span class="t">${esc(L(x,'work'))}</span>${x.bad?`<span class="chip late" style="margin-left:4px">${t('dateErr')}</span>`:''}</div>
      <div class="gt" style="${bg}">${wl}<div class="today" style="left:${tl}px"></div>
      <div class="gb ${x.io==='외부'?'ext':''}" data-open="${esc(x.id)}" data-tip="${esc(tip)}" style="left:${l}px;width:${w}px;${x.bad?'background:repeating-linear-gradient(135deg,var(--bad-bg) 0 4px,#fff 4px 8px);border:2px dashed var(--bad)':'background:'+ST_COL[x.eff]}"></div></div></div>`;
  });
  $('gantt').innerHTML=h+'</div>';
}

    <td class="mono" data-label="${t('c_period')}" style="white-space:nowrap${x.bad?';color:var(--bad-t);font-weight:700':''}">${md(x.start)} – ${md(x.end)}${x.bad?'<br>⚠ '+t('dateErr'):''}</td>
    <td class="c" data-label="${t('c_st')}">${chip(x)}</td>
    <td data-label="${t('c_prog')}"><div class="pbar"><div class="bt"><i style="width:${pct(x.act)};background:${ST_COL[x.eff==='late'?'late':x.eff==='done'?'done':'doing']}"></i><b style="left:calc(${pct(x.pln)} - 1px)"></b></div><span>${pct(x.act)}</span></div></td>
    <td data-label="${t('c_last')}">${x.last?`<div class="lastnote"><span class="mono" style="color:var(--muted)">${md(x.last.w)}</span> ${esc(wTxt(x.last))}</div>`:'<span style="color:var(--muted)">–</span>'}</td>
    <td data-label="${t('c_photo')}"><div class="ph2">${x.before?`<img src="${esc(x.before)}" alt="${t('before')}" loading="lazy" referrerpolicy="no-referrer">`:''}${x.after?`<img src="${esc(x.after)}" alt="${t('after')}" loading="lazy" referrerpolicy="no-referrer">`:''}${!x.before&&!x.after?'<span style="color:var(--muted)">–</span>':''}</div></td>
   </tr>`).join('')+'</tbody></table>';
}

/* ---------- 상세 창 ---------- */
function openTask(id){
  const x=DATA.tasks.find(y=>y.id===id);if(!x)return;
  const fact=(k,v)=>`<div><span>${t(k)}</span><b>${v}</b></div>`;
  const sec=(k,v)=>v?`<div class="sec"><h4>${t(k)}</h4><p>${esc(v)}</p></div>`:'';
  const tl=x.weekly.length?`<div class="sec"><h4>${t('s_weekly')}</h4><div class="tl">`+x.weekly.slice().reverse().map((w,i)=>{const o=wOrig(w);
    return `<div class="e ${i===0?'last':''}"><div class="d">${md(w.w)}</div><p style="margin:2px 0 0;white-space:pre-line;font-size:13.5px">${esc(wTxt(w))}</p>${o?`<div class="note-orig">${t('origLabel')}: ${esc(o)}</div>`:''}</div>`}).join('')+`</div></div>`:'';
  const ph=(u,k)=>`<figure>${u?`<img src="${esc(u)}" alt="${t(k)}" data-lb="${esc(u)}" referrerpolicy="no-referrer">`:`<div class="np">${t('noPhoto')}</div>`}<figcaption>${t(k)}</figcaption></figure>`;
  $('drawer').innerHTML=`<div class="dh"><div><span class="mono" style="color:var(--muted)">${esc(x.id)}</span><h3>${esc(L(x,'work'))}</h3>
     <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">${chip(x)}${x.io==='외부'?`<span class="chip ext">${t('outside')}</span>`:''}</div></div>
     <button class="x" id="dx" aria-label="${t('close')}">×</button></div>
   <div class="db"><div class="facts">${fact('f_cat',esc(L(x,'cat')))}${fact('f_own',esc(L(x,'own')))}${fact('f_period',md(x.start)+' – '+md(x.end))}${fact('f_done',x.done?md(x.done):'–')}
     ${fact('f_prog',pct(x.act)+' <span style="color:var(--muted);font-weight:400">/ '+t('planned')+' '+pct(x.pln)+'</span>')}${fact('f_io',x.io==='외부'?t('outside'):t('inside'))}</div>
     ${tl}${sec('s_iss',L(x,'iss'))}${sec('s_area',L(x,'area'))}${sec('s_note',L(x,'prog'))}
     <div class="sec"><h4>${t('s_photo')}</h4><div class="photos">${ph(x.before,'before')}${ph(x.after,'after')}</div></div></div>`;
  $('drawer').hidden=false;$('scrim').hidden=false;
  $('dx').onclick=closeTask;
  $('drawer').querySelectorAll('[data-lb]').forEach(i=>i.onclick=()=>{$('lb').innerHTML=`<img src="${esc(i.dataset.lb)}" alt="">`;$('lb').hidden=false});
}
function closeTask(){$('drawer').hidden=true;$('scrim').hidden=true}
$('scrim').onclick=closeTask;$('lb').onclick=()=>$('lb').hidden=true;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('lb').hidden)$('lb').hidden=true;else closeTask()}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-open]');if(el&&!e.target.closest('.drawer')){$('tip').hidden=true;openTask(el.dataset.open)}});

/* ---------- 다운로드 ---------- */
function renderDl(){
  const btn=(attrs,cls,ko,th)=>`<button type="button" class="${cls}" ${attrs} data-ko="${esc(ko)}" data-th="${esc(th)}"><span><b>${esc(lang==='th'?th||ko:ko)}</b>${th&&th!==ko?`<i>${esc(lang==='th'?ko:th)}</i>`:''}</span><small>.xlsx</small></button>`;
  $('dl').innerHTML=btn('data-all="1"','primary','전체 파일','ทั้งไฟล์')+(DATA.sheets||[]).map(s=>btn(`data-sheet="${esc(s.name)}"`,'',s.name,s.th||'')).join('');
  $('dl').querySelectorAll('button').forEach(b=>b.onclick=()=>download(b));
}
function saveB64(r){
  if(!r||!r.b64)throw new Error('empty file');
  const bin=atob(r.b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const blob=new Blob([u],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  if(navigator.msSaveOrOpenBlob){navigator.msSaveOrOpenBlob(blob,r.filename);return}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=r.filename;a.style.display='none';
  document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},8000);
}
function dlMsg(txt,cls){const m=$('dlmsg');m.textContent=txt;m.className='dlmsg '+(cls||'');m.hidden=!txt}
function download(b){
  const label=lang==='th'?(b.dataset.th||b.dataset.ko):b.dataset.ko;
  $('dl').querySelectorAll('button').forEach(x=>x.disabled=true);dlMsg(label+' — '+t('making'),'wait');
  const end=()=>$('dl').querySelectorAll('button').forEach(x=>x.disabled=false);
  api('api=xlsx&lang='+lang+(b.dataset.all?'':'&sheet='+encodeURIComponent(b.dataset.sheet)))
    .then(j=>{end();saveB64(j.file);dlMsg(label+' — '+t('saved')+' ('+j.file.filename+')','ok')})
    .catch(e=>{end();dlMsg(t('fail')+': '+((e&&e.message)||e))});
}

/* ---------- 시작 ---------- */
function renderAll(){
  applyI18n();$('asof').textContent=DATA.today;$('upd').textContent=DATA.updated;
  renderFilters();renderKpis();renderCats();renderTeams();renderAtt();renderReasons();renderWeekly();renderTasks();renderDl();
  $('loading').hidden=true;setView(view);
}
function load(){
  $('refresh').disabled=true;
  const ok=d=>{window.__last=Date.now();DATA=enrich(d);$('refresh').disabled=false;renderAll()};
  const bad=e=>{$('loading').hidden=false;$('loading').textContent=(e&&e.message)||String(e);$('refresh').disabled=false};
  if(window.SAMPLE_DATA)ok(JSON.parse(JSON.stringify(window.SAMPLE_DATA)));
  else api('api=data').then(j=>ok(j.data)).catch(bad);
}
function setLang(l){lang=l;try{localStorage.setItem('db_lang',l)}catch(e){};if(DATA)renderAll();else applyI18n()}
$('lk').onclick=()=>setLang('ko');$('lt').onclick=()=>setLang('th');$('refresh').onclick=load;
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
['wTeam','wShow','wOrig'].forEach(id=>$(id).onchange=renderWeekly);
['gTeam','gCat'].forEach(id=>$(id).onchange=renderGantt);
['fTeam','fCat','fStat'].forEach(id=>$(id).onchange=renderTasks);$('fq').oninput=renderTasks;
let _rz;addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(()=>{if(DATA&&view==='gt')renderGantt()},200)});
applyI18n();load();
setInterval(()=>{if(!document.hidden&&!$('refresh').disabled&&$('drawer').hidden)load()},5*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&DATA&&Date.now()-(window.__last||0)>60000&&$('drawer').hidden)load()});
</script>
