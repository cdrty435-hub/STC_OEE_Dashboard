<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>안전·전기 개선 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f6;--surface:#fff;--sunk:#f8f9fa;--ink:#111827;--ink2:#4b5563;--muted:#8b95a1;--line:#e5e7eb;--line2:#f0f1f3;
  --navy:#0f1d33;--navy2:#1b2d4a;
  --ok:#16a34a;--ok-t:#15803d;--ok-bg:#ecfdf3;
  --run:#2a78d6;--run-t:#1d5fb0;--run-bg:#eef5fe;
  --bad:#d03b3b;--bad-t:#b42323;--bad-bg:#fdf0f0;
  --hold:#eda100;--hold-t:#8a5d00;--hold-bg:#fff7e1;
  --plan:#c3cad3;--plan-t:#4b5563;--plan-bg:#f1f3f5;
  --ext:#eb6834;
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:10px;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font:14px/1.5 'Noto Sans KR','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
body.th{font-family:'Noto Sans Thai','Noto Sans KR',system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:-.2px}

/* header (MTTR 스타일) */
header{background:linear-gradient(180deg,#f7f8fb,#eef1f6);border-bottom:1px solid var(--line)}
.hwrap{max-width:1500px;margin:0 auto;padding:22px 28px 18px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.brand{flex:1;min-width:260px}
.brand small{display:block;color:#c2410c;font-size:11.5px;font-weight:700;letter-spacing:2.5px}
.brand h1{margin:4px 0 4px;font-size:28px;font-weight:700;letter-spacing:-.6px;color:#0f1d33}
.lead{margin:0;color:var(--ink2);font-size:13px}
.hmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;box-shadow:var(--sh)}
.stamp{font-size:12px;color:var(--ink2);display:inline-flex;align-items:center;gap:5px}
.stamp b{color:var(--ink);font-weight:500}
.live{width:7px;height:7px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 3px #dcfce7}
.seg{display:inline-flex;background:var(--line2);border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink2);padding:5px 12px;border-radius:6px;font-size:13px;font-weight:500}
.seg button[aria-pressed=true]{background:#0f1d33;color:#fff}
.hbtn{border:0;background:#c2410c;color:#fff;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.hbtn:disabled{opacity:.55;cursor:wait}
.shell{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:220px 1fr;gap:20px;padding:20px 28px 48px;align-items:start}
.side{position:sticky;top:16px;background:#eef1f6;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:2px}
.side button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:9px;font-size:14px;font-weight:500;color:var(--ink)}
.side button b{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11.5px;background:#dfe4ec;color:var(--ink2);flex:none}
.side button b.star{background:#f59e0b;color:#fff}
.side button:hover{background:#e3e8f0}
.side button[aria-selected=true]{background:#0f1d33;color:#fff;box-shadow:0 2px 6px rgba(15,29,51,.25)}
.side button[aria-selected=true] b{background:#ffffff26;color:#fff}
.side button[aria-selected=true] b.star{background:#f59e0b}
@media(max-width:900px){.shell{grid-template-columns:1fr;padding:14px}.side{position:static;flex-direction:row;overflow-x:auto}.side button{white-space:nowrap;padding:8px 10px}}
main{min-width:0}
.view[hidden]{display:none}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.15fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1000px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);min-width:0}
.ch{display:flex;align-items:baseline;gap:10px;padding:14px 18px 0;flex-wrap:wrap}
.ch h2{margin:0;font-size:15px;font-weight:700}
.ch .note{color:var(--muted);font-size:12px}
.ch .sp{flex:1}
.cb{padding:12px 18px 16px}
.empty{color:var(--muted);text-align:center;padding:28px 0;font-size:13px}

/* KPI */
.kpis{display:grid;grid-template-columns:1.6fr repeat(5,1fr);gap:12px;margin-bottom:16px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.kpi.hero{grid-column:1/-1}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.kpi .k{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1.15}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:6px}
.kpi .dot{width:8px;height:8px;border-radius:50%}
.kpi.hero .row{display:flex;align-items:baseline;gap:14px}
.kpi.hero .gap{font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px}
.meter{position:relative;height:10px;background:var(--line2);border-radius:5px;margin-top:8px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ok)}
.meter b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.mleg{display:flex;gap:14px;font-size:11px;color:var(--ink2);margin-top:6px}
.mleg span{display:inline-flex;align-items:center;gap:5px}
.mleg i{width:10px;height:6px;border-radius:2px;background:var(--ok)}
.mleg b{width:2px;height:10px;background:var(--ink)}

/* bullet bars (분야) */
.bl{display:grid;grid-template-columns:minmax(150px,1.3fr) 2fr 92px;gap:6px 14px;align-items:center}
.bl .nm{font-size:13px;display:flex;gap:8px;align-items:center;min-width:0}
.bl .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl .nm em{font-style:normal;color:var(--muted);font-size:12px;flex:none}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.bt{position:relative;height:14px;background:var(--line2);border-radius:4px}
.bt i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ok)}
.bt b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.bl .num{font-size:12px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.bl .num strong{color:var(--ink);font-size:13px}
@media(max-width:560px){.bl{grid-template-columns:1fr 70px}.bl .nm{grid-column:1/-1}}

/* stacked (팀) */
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px}
.sl{display:grid;grid-template-columns:minmax(120px,1fr) 2fr 64px;gap:8px 14px;align-items:center;margin-top:12px}
.sl .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stk{display:flex;gap:2px;height:16px}
.stk i{border-radius:3px;min-width:4px;position:relative}
.stk i:first-child{border-radius:4px 3px 3px 4px}
.sl .num{font-size:12px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}

/* reason bars */
.rb{display:grid;grid-template-columns:minmax(120px,1fr) 2fr 36px;gap:8px 12px;align-items:center}
.rb .nm{font-size:13px}
.rb .bar{height:14px;border-radius:0 4px 4px 0;background:var(--c1)}
.rb .num{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.6}
.chip::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.done{background:var(--ok-bg);color:var(--ok-t)}
.chip.doing{background:var(--run-bg);color:var(--run-t)}
.chip.late{background:var(--bad-bg);color:var(--bad-t)}
.chip.hold{background:var(--hold-bg);color:var(--hold-t)}
.chip.plan{background:var(--plan-bg);color:var(--plan-t)}
.chip.ext{background:#fff1ea;color:#b4441a}
.chip.ext::before{display:none}
.chip.soon{background:var(--hold-bg);color:var(--hold-t)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;white-space:nowrap}
.tag.new{background:#e8f1ff;color:#1d5fb0}
.tag.chg{background:var(--ok-bg);color:var(--ok-t)}
.tag.same{background:var(--plan-bg);color:var(--plan-t)}
.tag.none{background:var(--bad-bg);color:var(--bad-t)}
.tag.fin{background:var(--ok-bg);color:var(--ok-t)}

/* attention list */
.att{display:flex;flex-direction:column}
.att .it{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line2);cursor:pointer}
.att .it:first-child{border-top:0}
.att .it:hover .tt{color:var(--run-t)}
.att .tt{font-weight:500;font-size:13px}
.att .mt{display:block;color:var(--muted);font-size:12px}
.dd{font-size:12px;font-weight:700;text-align:right;white-space:nowrap}

/* filters */
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.fbar select,.fbar input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13px;min-width:0}
.fbar input[type=search]{flex:1;min-width:180px}
.fbar label{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;color:var(--ink2)}
.pills button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.pills button small{opacity:.7;margin-left:4px;font-weight:400}

/* weekly */
.wsum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:700px){.wsum{grid-template-columns:repeat(2,1fr)}}
.wsum div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.wsum span{display:block;font-size:12px;color:var(--ink2)}
.wsum b{font-size:22px}
.wgrp{margin-bottom:16px}
.wgh{display:flex;align-items:center;gap:8px;padding:10px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.wgh em{font-style:normal;color:var(--muted);font-weight:400;font-size:12px}
.wr{display:grid;grid-template-columns:52px minmax(200px,1.1fr) 2fr;gap:14px;padding:12px 18px;border-top:1px solid var(--line2);cursor:pointer}
.wr:first-of-type{border-top:0}
.wr:hover{background:var(--sunk)}
.wr .w1{font-weight:500;font-size:13px}
.wr .w1 .mt{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:5px;font-weight:400;color:var(--muted);font-size:12px}
.note-now{font-size:13px;white-space:pre-line}
.note-orig{font-size:12px;color:var(--muted);white-space:pre-line;margin-top:3px}
.note-prev{font-size:12px;color:var(--muted);margin-top:6px;padding-left:10px;border-left:2px solid var(--line);white-space:pre-line}
.note-prev b{font-weight:500;color:var(--ink2)}
.nh{display:flex;gap:6px;align-items:center;margin-bottom:4px}
@media(max-width:760px){.wr{grid-template-columns:44px 1fr}.wr .w2{grid-column:1/-1}}

/* weekly table (밝은 보고서형) */
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:16px 18px 14px}
.wch{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.wch h2{margin:0;font-size:17px;font-weight:700;color:#1e3a5f}
.wch h2 small{font-weight:500;color:var(--ink2);font-size:14px;margin-left:4px}
.wch .sp{flex:1}
.wch .sum{font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap}
.wch .sum .up{color:var(--ok-t)}.wch .sum .dn{color:var(--bad-t)}.wch .sum .mu{color:var(--muted);font-weight:500}
.wtw{overflow:visible}
@media(max-width:900px){.wtw{overflow-x:auto}}
table.wt{border-collapse:separate;border-spacing:0;font-size:13px;width:100%}
@media(max-width:900px){table.wt{min-width:900px}}
.wt th{position:sticky;top:0;z-index:3;background:#f6f8fb;color:#64748b;font-weight:500;font-size:12px;text-align:left;padding:8px 12px;white-space:nowrap;border-bottom:1px solid #e2e8f0}
.wt th.r,.wt td.r{text-align:right}
.wt th.c,.wt td.c{text-align:center}
.wt th.cur{color:var(--run-t);font-weight:700}
.wt th small{font-weight:400;margin-left:4px;color:#94a3b8}
.wt td{padding:10px 12px;border-bottom:1px solid #eef1f5;vertical-align:top;background:var(--surface)}
.wt tr.task{cursor:pointer}
.wt tr.task:hover td{background:#f8fafc}
.wt .stick1{position:sticky;left:0;z-index:2}
.wt .stick2{position:sticky;left:64px;z-index:2}
.wt th.stick1,.wt th.stick2{z-index:4}
.wt td.id{width:64px;min-width:64px;white-space:nowrap;color:#3b6fb6;font-size:12.5px;font-variant-numeric:tabular-nums;padding-top:11px}
.wt td.wname{min-width:170px;max-width:260px}
.wt td.wname .nm{display:flex;gap:8px;align-items:flex-start;font-weight:700;color:var(--ink)}
.wt td.wname .nm i{width:10px;height:10px;border-radius:2px;flex:none;margin-top:5px}
.wt td.wname .sub{display:block;font-weight:400;color:#8a94a3;font-size:12px;margin:2px 0 0 18px}
.wt td.own{white-space:nowrap;width:1%;color:var(--ink2)}
.wt td.own .ex{display:block;color:#c2410c;font-size:11.5px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:2px}
.st.done{color:var(--ok-t)}.st.doing{color:var(--run-t)}.st.late{color:var(--bad-t)}.st.plan{color:#64748b}.st.hold{color:var(--hold-t)}
.wt td.per{font-size:12.5px;white-space:nowrap;width:1%;color:var(--ink2);font-variant-numeric:tabular-nums}
.wt td.per.late{color:var(--bad-t);font-weight:700}
.wt td.note{white-space:pre-line;min-width:160px;line-height:1.5;color:#334155}
.wt td.note.cur{background:#f7faff;color:var(--ink)}
.wt tr.task:hover td.note.cur{background:#eef4fd}
.wt td.note .o{display:block;color:#94a3b8;font-size:12px;margin-top:3px}
.wt td.note.nil{color:#cbd5e1}
.wt td.chg{white-space:nowrap;width:1%;font-weight:700;font-size:12.5px}
.chg.k-chg,.chg.k-new{color:var(--ok-t)}.chg.k-same{color:#94a3b8;font-weight:500}.chg.k-none{color:var(--bad-t)}.chg.k-fin{color:var(--ok-t);font-weight:500}
.wt tr.grp td{background:var(--surface);padding:14px 12px 6px;border-bottom:1px solid #e2e8f0;font-size:13px;font-weight:700;color:#1e3a5f}
.wt tr.grp td em{font-style:normal;font-weight:500;color:#94a3b8;font-size:12px;margin-left:6px}
.wt tr.grp td .gs{float:right;font-weight:500;font-size:12px;color:#64748b}
.wt tr.grp td .gs b{font-weight:700}
.wt tfoot td{position:sticky;bottom:0;background:#f1f4f8;font-weight:700;border-top:1px solid #e2e8f0;border-bottom:0;padding:10px 12px;z-index:2}
.wnote{font-size:12px;color:#64748b;margin-top:10px}
@media(max-width:760px){.wt .stick2{position:static}.wt td.wname{min-width:180px}}

@media(max-width:1250px) and (min-width:901px){.wt th{white-space:normal}.wt td.own,.wt td.per{white-space:normal}.wt td.wname{min-width:130px}.wt td.note{min-width:120px}.wt td,.wt th{padding:8px 8px}.wt .stick2{left:56px}.wt td.id{width:56px;min-width:56px}}

/* 진행률 기준 */
details.std{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
details.std summary{cursor:pointer;padding:10px 16px;font-weight:700;font-size:13px;color:#1e3a5f;list-style:none;display:flex;gap:8px;align-items:center}
details.std summary::-webkit-details-marker{display:none}
details.std summary::before{content:'▸';color:var(--muted);transition:transform .15s}
details.std[open] summary::before{transform:rotate(90deg)}
details.std summary small{font-weight:400;color:var(--muted)}
.stdt{width:100%;border-collapse:collapse;font-size:13px}
.stdt th{white-space:nowrap;background:#f6f8fb;color:#64748b;font-weight:500;font-size:12px;text-align:left;padding:8px 14px;border-top:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0}
.stdt td{padding:9px 14px;border-bottom:1px solid #eef1f5;vertical-align:top}
.stdt td.p{font-weight:700;width:120px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stdt td.s{font-weight:700;width:120px;white-space:nowrap}
.stdt .sb{display:inline-block;width:40px;height:6px;border-radius:3px;background:var(--line2);vertical-align:middle;margin-right:8px;position:relative;overflow:hidden}
.stdt .sb i{position:absolute;left:0;top:0;bottom:0;background:var(--ok)}
.stdr{margin:0;padding:10px 16px 14px 34px;font-size:12.5px;color:var(--ink2);line-height:1.7}

/* 주간보고 (A4 가로 1장) */
.rp{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:20px 22px}
.rph{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;border-bottom:2px solid #0f1d33;padding-bottom:12px;margin-bottom:14px}
.rph .t small{display:block;color:#c2410c;font-weight:700;font-size:11px;letter-spacing:2px}
.rph .t h2{margin:2px 0 0;font-size:22px;letter-spacing:-.4px;color:#0f1d33}
.rph .t h2 span{color:var(--run-t)}
.rph .sp{flex:1}
.rper{margin-top:4px;font-size:12px;color:#92400e}.rper b{color:#0f1d33}
.rph select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;background:#fff}
.rph .pbtn{border:1px solid #0f1d33;background:#fff;color:#0f1d33;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700}
.rkpi{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
.rkpi div{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fafbfc}
.rkpi span{display:block;font-size:11.5px;color:var(--ink2)}
.rkpi b{font-size:22px;letter-spacing:-.4px}
.rkpi .gp{font-style:normal;font-size:12px;font-weight:700;padding:1px 6px;border-radius:999px;vertical-align:3px}.rkpi .gp.n{background:var(--bad-bg);color:var(--bad-t)}.rkpi .gp.p{background:var(--ok-bg);color:var(--ok-t)}
.rkpi b small{font-size:12px;font-weight:500;color:var(--muted);margin-left:4px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rc{border:1px solid var(--line);border-radius:12px;padding:12px 14px 10px;min-width:0}
.rc.full{grid-column:1/-1}

/* ---------- 데이터 가공 ---------- */
function enrich(d){
  const today=pd(d.today);
  d.weeks=d.weeks||[];
  d.tasks.forEach(x=>{
    const s=pd(x.start),e=pd(x.end),k=ST_KEY[x.status]||'plan';
    x.eff=k==='done'?'done':k==='hold'?'hold':(!isNaN(e)&&e<today&&!(e<s)?'late':k);
    x.act=k==='done'?1:Math.max(0,Math.min(1,x.ap||0));
    x.bad=!isNaN(s)&&!isNaN(e)&&e<s;
    x.pln=(isNaN(s)||isNaN(e)||x.bad)?0:Math.max(0,Math.min(1,(today-s+DAY)/(e-s+DAY)));
    x.left=isNaN(e)?null:Math.round((e-today)/DAY);
    x.tr=x.tr||{};x.weekly=x.weekly||[];
    x.wmap={};x.weekly.forEach(w=>x.wmap[w.w]=w);
    x.last=x.weekly.length?x.weekly[x.weekly.length-1]:null;
  });
  if(!curWeek||!d.weeks.some(w=>w.date===curWeek))curWeek=d.weeks.length?d.weeks[d.weeks.length-1].date:null;
  return d;
}
function groups(key,list){const m=new Map();(list||DATA.tasks).forEach(x=>{if(!m.has(x[key]))m.set(x[key],[]);m.get(x[key]).push(x)});return m}
function weekState(x,wd){
  const i=DATA.weeks.findIndex(w=>w.date===wd);const cur=x.wmap[wd];
  let prev=null;for(let j=i-1;j>=0;j--){if(x.wmap[DATA.weeks[j].date]){prev=x.wmap[DATA.weeks[j].date];break}}
  if(!cur)return{k:x.eff==='done'?'fin':'none',cur,prev};
  if(!prev)return{k:i>0?'new':'new',cur,prev};
  return{k:norm(cur.th)===norm(prev.th)&&norm(cur.ko)===norm(prev.ko)?'same':'chg',cur,prev};
}

/* ---------- 기간 ---------- */
const iso=v=>new Date(v).toISOString().slice(0,10);
function quickRange(q){
  const td=pd(DATA?DATA.today:new Date().toISOString().slice(0,10)),d=new Date(td),y=d.getUTCFullYear(),m=d.getUTCMonth();
  const mon=td-((d.getUTCDay()+6)%7)*DAY;
  switch(q){
    case 'month':return{from:iso(Date.UTC(y,m,1)),to:iso(Date.UTC(y,m+1,0))};
    case 'last':return{from:iso(Date.UTC(y,m-1,1)),to:iso(Date.UTC(y,m,0))};
    case 'p4':return{from:iso(mon-21*DAY),to:iso(mon+6*DAY)};
    case 'p8':return{from:iso(mon-49*DAY),to:iso(mon+6*DAY)};
    case 'n8':return{from:iso(mon),to:iso(mon+8*7*DAY-DAY)};
    case 'pn':return{from:iso(mon-28*DAY),to:iso(mon+8*7*DAY-DAY)};
    default:return{from:'',to:''};
  }
}
const QUICK=['all','month','last','p4','p8','n8','pn'];
function renderPeriod(){
  $('pQuick').innerHTML=QUICK.map(q=>`<button data-q="${q}" aria-pressed="${RANGE.q===q}">${t('q_'+q)}</button>`).join('');
  $('pQuick').querySelectorAll('button').forEach(b=>b.onclick=()=>{const r=quickRange(b.dataset.q);setRange(r.from,r.to,b.dataset.q)});
  $('pFrom').value=RANGE.from||'';$('pTo').value=RANGE.to||'';
  if(ALL)$('pSum').innerHTML=`${t('pTasks')} <b>${DATA.ptasks.length}</b> / ${ALL.tasks.length}${t('cnt')} · ${t('pWeeks')} <b>${DATA.weeks.length}</b>`;
}
function setRange(from,to,q){
  if(from&&to&&from>to){const x=from;from=to;to=x}
  RANGE={from:from||'',to:to||'',q:q||'custom'};try{localStorage.setItem('db_range',JSON.stringify(RANGE))}catch(e){}
  if(ALL){applyRange();renderAll()}else renderPeriod();
}
function applyRange(){
  if(RANGE.q&&RANGE.q!=='custom'&&RANGE.q!=='all'){const r=quickRange(RANGE.q);RANGE.from=r.from;RANGE.to=r.to}   // 빠른 버튼은 오늘 기준으로 다시 계산
  const f=RANGE.from?pd(RANGE.from):-Infinity,tt=RANGE.to?pd(RANGE.to):Infinity;
  DATA.tasks=ALL.tasks;
  DATA.ptasks=ALL.tasks.filter(x=>{const s=pd(x.start),e=pd(x.end);if(isNaN(s)&&isNaN(e))return true;const a=Math.min(isNaN(s)?e:s,isNaN(e)?s:e),b=Math.max(isNaN(s)?e:s,isNaN(e)?s:e);return b>=f&&a<=tt});
  DATA.weeks=ALL.weeks.filter(w=>{const v=pd(w.date);return v>=f&&v<=tt});
  if(!DATA.weeks.some(w=>w.date===curWeek))curWeek=DATA.weeks.length?DATA.weeks[DATA.weeks.length-1].date:null;
}

function isoWeek(ds){const d=new Date(pd(ds));const day=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-day+3);const y=new Date(Date.UTC(d.getUTCFullYear(),0,4));return 1+Math.round(((d-y)/DAY-3+((y.getUTCDay()+6)%7))/7)}
function wl(ds){return ds?'W'+isoWeek(ds):''}
function donut(parts,top,big,sub){
  const tot=parts.reduce((p,c)=>p+c.v,0)||1,R=60,r=40,cx=75,cy=75;let a=-Math.PI/2,h='';
  parts.filter(p=>p.v>0).forEach(p=>{const da=p.v/tot*Math.PI*2-(parts.filter(q=>q.v>0).length>1?0.03:0);
    const a2=a+Math.max(0.001,da),L=da>Math.PI?1:0,P=(rr,aa)=>(cx+rr*Math.cos(aa)).toFixed(2)+' '+(cy+rr*Math.sin(aa)).toFixed(2);
    h+=`<path d="M${P(R,a)} A${R} ${R} 0 ${L} 1 ${P(R,a2)} L${P(r,a2)} A${r} ${r} 0 ${L} 0 ${P(r,a)}Z" fill="${p.c}" data-tip="${esc(p.l)} ${p.v} (${Math.round(p.v/tot*100)}%)"/>`;
    a+=p.v/tot*Math.PI*2});
  return `<svg viewBox="0 0 150 150" role="img">${h}<text x="75" y="64" text-anchor="middle" font-size="11" fill="#64748b">${esc(top)}</text><text x="75" y="86" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1d33">${esc(big)}</text>${sub?`<text x="75" y="102" text-anchor="middle" font-size="10" fill="#94a3b8">${esc(sub)}</text>`:''}</svg>`;
}

  // 5. 다음 주 확인 포인트
  const none=st.filter(s=>s.k==='none').map(s=>s.x);
  const due=T.filter(x=>!x.bad&&(x.eff==='doing'||x.eff==='plan')&&x.left!==null&&x.left>=0&&x.left<=14);
  const hard=T.filter(x=>x.eff!=='hold'&&x.eff!=='done'&&x.last&&/불가|어려|ไม่สามารถ|ไม่น่าจะ/.test(x.last.ko+x.last.th));

  const pts=[[t('pt_none'),none],[t('pt_due'),due],[t('pt_hard'),hard],[t('pt_start'),startN],[t('pt_bad'),bad]].filter(p=>p[1].length);
  const s5=`<div class="rc full"><div class="rch"><h3>5. ${t('rp5')}</h3></div>${pts.length?`<ul class="pts">${pts.map(([k,a])=>`<li><span class="k">${k} (${a.length})</span> ${ids(a)}</li>`).join('')}</ul>`:`<div class="empty">${t('nothing')}</div>`}</div>`;

  $('report').innerHTML=`<div class="rp">${head}${kpi}<div class="rgrid">${s1}${s2}${s3}${s4}${s5}</div><div class="rfoot">※ ${t('rpNote')} · ${t('updated')} ${esc(DATA.updated)}</div></div>`;
  if($('rpWeek'))$('rpWeek').onchange=e=>{curWeek=e.target.value;renderReport();renderWeekly()};

const STEPS=[0,25,50,75,100],STS=['계획','진행','완료','보류'],STK={'계획':'plan','진행':'doing','완료':'done','보류':'hold'};

function editWeekOptions(){
  const ws=(ALL||DATA).weeks.map(w=>w.date),td=DATA.today;

  const fresh=!last||pd(td)-pd(last)>=4*DAY;           // 마지막 기록일에서 4일 이상 지났으면 새 주 기본
  const opts=ws.slice(-3).map(w=>[w,wl(w)+' · '+md(w)]);

}
function askPin(force){
  return new Promise((res,rej)=>{
    let pin='',user='';try{pin=localStorage.getItem('db_pin')||'';user=localStorage.getItem('db_user')||''}catch(e){}
    if(pin&&user&&!force)return res({pin,user});
    $('pinI').value=pin;$('userI').value=user;$('pinE').hidden=!force;$('pinE').textContent=t('pinWrong');$('pinM').hidden=false;$('pinI').focus();
    $('pinF').onsubmit=e=>{e.preventDefault();const p={pin:$('pinI').value.trim(),user:$('userI').value.trim()};
      try{localStorage.setItem('db_pin',p.pin);localStorage.setItem('db_user',p.user)}catch(er){}$('pinM').hidden=true;res(p)};
    $('pinC').onclick=()=>{$('pinM').hidden=true;rej(new Error(t('cancelled')))};
  });
}
async function postApi(payload,retry){
  const cred=await askPin(retry);
  const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({...payload,pin:cred.pin,user:cred.user}),redirect:'follow'});
  const txt=await r.text();let j;try{j=JSON.parse(txt)}catch(e){throw new Error(t('saveApiErr'))}
  if(!j.ok){if(j.error==='PIN')return postApi(payload,true);throw new Error(j.error)}
  return j.result;
}
async function postSave(items){

}

    if(!/^image\//.test(file.type))return rej(new Error(t('notImage')));
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg',q))};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error(t('notImage')))};img.src=url;
  });
}
async function uploadPhoto(el,file){
  const x=(ALL||DATA).tasks.find(y=>y.id===el.dataset.id);if(!x)return;
  const kind=el.dataset.kind,slot=Number(el.dataset.slot);
  if(photoArr(x)[kind][slot-1]&&!confirm(t('replaceQ')))return;
  el.classList.add('busy');
  try{
    const dataUrl=await resizeImage(file);
    let r;
    if(window.SAMPLE_DATA){await askPin();await new Promise(z=>setTimeout(z,400));r={url:dataUrl,date:DATA.today,user:'test'}}
    else r=await postApi({action:'photo_upload',id:x.id,kind,slot,name:file.name,mime:'image/jpeg',b64:dataUrl.split(',')[1]});
    photoArr(x)[kind][slot-1]=r;toast(t('photoSaved'));refreshPhotoViews();
  }catch(e){toast(t('fail')+': '+e.message)}finally{el.classList.remove('busy')}
}
async function deletePhoto(el){
  const x=(ALL||DATA).tasks.find(y=>y.id===el.dataset.id);if(!x||!confirm(t('delQ')))return;
  const kind=el.dataset.kind,slot=Number(el.dataset.slot);el.classList.add('busy');
  try{if(!window.SAMPLE_DATA)await postApi({action:'photo_delete',id:x.id,kind,slot});else await askPin();
    photoArr(x)[kind][slot-1]=null;toast(t('photoDeleted'));refreshPhotoViews()}

}

 th:{title:'เกณฑ์ความคืบหน้าจริง (5 ขั้น)',hint:'กดเพื่อเปิด',h:['ความคืบหน้า','ขั้น','เงื่อนไข'],
  rows:[['ยังไม่เริ่ม','มีแค่แผน ยังไม่มีการดำเนินการใดๆ'],['เตรียมการ','ตรวจหน้างานแล้ว + ขอใบเสนอราคา / ขอวัสดุ / ติดต่อผู้รับเหมา อย่างใดอย่างหนึ่ง'],['เริ่มดำเนินการ','อนุมัติใบเสนอราคาหรือของเข้าแล้ว + เริ่มทำงานจริง'],['ใกล้เสร็จ','งานส่วนใหญ่เสร็จแล้ว เหลือทดสอบ / ตรวจรับ / บางเครื่อง'],['เสร็จสมบูรณ์','งานเสร็จ + ลงรูปหลังปรับปรุง + เปลี่ยนสถานะเป็น 「เสร็จแล้ว」']],
  rules:['ห้ามใส่ค่าระหว่างกลาง (เช่น 30%, 60%) ให้เลือก 1 ใน 5 ขั้นเท่านั้น','เมื่อเลื่อนขั้นต้องเขียนหลักฐานในบันทึกรายสัปดาห์ (25% ขอใบเสนอราคา · 50% อนุมัติ/ของเข้า · 100% รูปหลังปรับปรุง)','งานที่ทำหลายเครื่อง ให้เลือกขั้นตามสัดส่วนเครื่องที่เสร็จ (เช่น เสร็จ 6 จาก 10 เครื่อง → 50%)','ถ้าทำไม่ได้/ติดปัญหา ไม่ต้องเพิ่มความคืบหน้า ให้เปลี่ยนสถานะเป็น 「ระงับ」','ทุกครั้งที่เขียนบันทึกรายสัปดาห์ ให้อัปเดตความคืบหน้าจริงด้วย']}};

function renderDl(){
  const btn=(attrs,cls,ko,th)=>`<button type="button" class="${cls}" ${attrs} data-ko="${esc(ko)}" data-th="${esc(th)}"><span><b>${esc(lang==='th'?th||ko:ko)}</b>${th&&th!==ko?`<i>${esc(lang==='th'?ko:th)}</i>`:''}</span><small>.xlsx</small></button>`;
  $('dl').innerHTML=btn('data-all="1"','primary','전체 파일','ทั้งไฟล์')+(DATA.sheets||[]).map(s=>btn(`data-sheet="${esc(s.name)}"`,'',s.name,s.th||'')).join('');
  $('dl').querySelectorAll('button').forEach(b=>b.onclick=()=>download(b));
}
function saveB64(r){
  if(!r||!r.b64)throw new Error('empty file');
  const bin=atob(r.b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const blob=new Blob([u],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  if(navigator.msSaveOrOpenBlob){navigator.msSaveOrOpenBlob(blob,r.filename);return}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=r.filename;a.style.display='none';
  document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},8000);
}
function dlMsg(txt,cls){const m=$('dlmsg');m.textContent=txt;m.className='dlmsg '+(cls||'');m.hidden=!txt}
function download(b){
  const label=lang==='th'?(b.dataset.th||b.dataset.ko):b.dataset.ko;
  $('dl').querySelectorAll('button').forEach(x=>x.disabled=true);dlMsg(label+' — '+t('making'),'wait');
  const end=()=>$('dl').querySelectorAll('button').forEach(x=>x.disabled=false);
  api('api=xlsx&lang='+lang+(b.dataset.all?'':'&sheet='+encodeURIComponent(b.dataset.sheet)))
    .then(j=>{end();saveB64(j.file);dlMsg(label+' — '+t('saved')+' ('+j.file.filename+')','ok')})
    .catch(e=>{end();dlMsg(t('fail')+': '+((e&&e.message)||e))});
}
