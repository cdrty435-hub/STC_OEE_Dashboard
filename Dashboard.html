<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<title>안전·전기 개선 대시보드</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#eef1f4; --surface:#fff; --sunk:#f6f8fa; --ink:#17202a; --muted:#5b6775; --line:#d6dce3; --line2:#e8ecf0;
  --accent:#f2b705; --on-accent:#1b1500;
  --ok:#15803d; --ok-bg:#dcf3e3; --run:#1d4ed8; --run-bg:#dde7fb; --bad:#c81e1e; --bad-bg:#fbe1e1; --idle:#5b6775; --idle-bg:#e8ecf0;
  --plan:#93b4e8; --ext:#ea580c; --ext-bg:#ffedd5;
  --c1:#c2410c; --c2:#2563eb; --c3:#7c3aed; --c4:#0f766e; --c5:#be185d; --c6:#4d7c0f;
  --f:"IBM Plex Sans KR","Noto Sans Thai",system-ui,"Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10151b; --surface:#19212a; --sunk:#141b22; --ink:#e6ebf0; --muted:#93a0ad; --line:#2c3743; --line2:#222c36;
  --ok:#4ade80; --ok-bg:#163524; --run:#7aa5ff; --run-bg:#1b2b4a; --bad:#ff7373; --bad-bg:#3d1a1d; --idle:#93a0ad; --idle-bg:#242e38;
  --plan:#4b6a9e; --ext:#fb8a3c; --ext-bg:#3a2414;
  --c1:#fb7a3c; --c2:#6b9cff; --c3:#a98bff; --c4:#2fc4b2; --c5:#f06aa8; --c6:#9ccc4a; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5}
body.th{font-family:"Noto Sans Thai","IBM Plex Sans KR",system-ui,sans-serif}
.wrap{max-width:1360px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) 48px;display:flex;flex-direction:column;gap:16px}
.hazard{height:8px;border-radius:2px;background:repeating-linear-gradient(-45deg,var(--accent) 0 12px,var(--ink) 12px 24px)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:24px;line-height:1.25;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:12px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.seg{display:flex;background:var(--line2);padding:3px;border-radius:8px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:6px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:6px;font-weight:500;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn:disabled{opacity:.55;cursor:wait}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .v small{font-size:12px;color:var(--muted);margin-left:4px;font-weight:500}
.kpi.ok .v{color:var(--ok)} .kpi.run .v{color:var(--run)} .kpi.bad .v{color:var(--bad)} .kpi.idle .v{color:var(--idle)}
.pvsa{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.pvsa .row{display:grid;grid-template-columns:44px 1fr 40px;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
.track{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 small{font-size:11px;color:var(--muted);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:12px;height:8px;border-radius:2px;display:inline-block}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 92px;gap:10px;align-items:center}
.bar .name{font-size:12px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.bar .name .sw{width:8px;height:8px;border-radius:2px;flex:none}
.dual{display:flex;flex-direction:column;gap:3px}
.dual .track{height:7px}
.bar .num{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.stack{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--line2)}
.stack i{display:block;height:100%}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--sunk)}
.item .id{font-family:var(--mono);font-size:11px;color:var(--muted)}
.item b{font-weight:500;font-size:13px;display:block;min-width:0}
.item span.meta{font-size:11px;color:var(--muted)}
.chip{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.chip.plan{background:var(--idle-bg);color:var(--idle)} .chip.doing{background:var(--run-bg);color:var(--run)}
.chip.done{background:var(--ok-bg);color:var(--ok)} .chip.late{background:var(--bad-bg);color:var(--bad)}
.chip.hold{border:1px dashed var(--idle);color:var(--idle)} .chip.ext{background:var(--ext-bg);color:var(--ext)}
.chip.soon{background:#fff3c4;color:#7a4e00}
.empty{color:var(--muted);font-size:13px;padding:16px;text-align:center}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=search]{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
/* gantt */
.gwrap{overflow:hidden;border:1px solid var(--line);border-radius:6px}
.g{width:max-content;min-width:100%}
.grow{display:grid;grid-template-columns:var(--lw,240px) var(--tw)}
.gl{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line);padding:4px 10px;font-size:12px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.ghead{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line)}
.ghead .gl{z-index:4;font-weight:600;color:var(--muted);font-size:11px}
.wk{display:flex}
.wk div{flex:none;border-left:1px solid var(--line2);font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;padding:4px 0}
.wk div.now{background:var(--accent);color:var(--on-accent);font-weight:600}
.gcat .gl,.gcat .gt{background:var(--sunk);font-weight:700}
.gcat{border-top:1px solid var(--line)}
.gt{position:relative;height:30px;border-top:1px solid var(--line2)}
.gb{position:absolute;top:8px;height:14px;border-radius:3px}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:1}
/* tasks */
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.tabs button b{font-family:var(--mono);font-size:11px;background:var(--line2);color:var(--ink);padding:0 6px;border-radius:999px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tabs button[aria-selected="true"] b{background:var(--accent);color:var(--on-accent)}
.tsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tsum div{background:var(--sunk);padding:8px 10px;display:flex;flex-direction:column}
.tsum span{font-size:11px;color:var(--muted);font-weight:600}
.tsum b{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums}
.twrap{border:1px solid var(--line);border-radius:6px;overflow:hidden}
table.tt{border-collapse:collapse;font-size:12px;width:100%;table-layout:fixed}
.tt th{background:#17202a;color:#fff;font-weight:700;padding:7px 4px;text-align:center;font-size:11px;line-height:1.3;word-break:keep-all}
.tt th.b{background:#b45309}.tt th.a{background:#15803d}
.tt td{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);padding:6px 5px;vertical-align:middle;background:var(--surface);overflow-wrap:anywhere;word-break:keep-all}
.tt td.c,.tt th.c{text-align:center}
.tt td.mono{font-family:var(--mono);font-size:10.5px;font-variant-numeric:tabular-nums}
.tt .s2{font-weight:600}
.tt td.pb{background:color-mix(in srgb,#b45309 7%,var(--surface))}.tt td.pa{background:color-mix(in srgb,#15803d 7%,var(--surface))}
.thumb{display:block;width:100%;aspect-ratio:4/3;border-radius:4px;overflow:hidden;border:0;padding:0;background:var(--sunk);cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tt td.cat{font-size:11px;font-weight:700}
@media (max-width:900px){
  table.tt,.tt tbody{display:block}.tt thead{display:none}
  .tt tr{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;padding:10px;border-bottom:6px solid var(--bg)}
  .tt td{display:flex;flex-direction:column;gap:2px;border:0;padding:2px 0;background:transparent!important;text-align:left!important}
  .tt td::before{content:attr(data-label);font-size:10px;font-weight:700;color:var(--muted)}
  .tt td.s1,.tt td.s2,.tt td.iss,.tt td.prog,.tt td.cat,.tt td.area{grid-column:1/-1}
  .tt td.s2{font-size:14px}.tt td:empty{display:none}
}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.task{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.task .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.task .ttl{font-weight:600;font-size:14px}
.task .iss{font-size:12px;color:var(--muted)}
.task .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ph{aspect-ratio:4/3;border-radius:5px;overflow:hidden;background:var(--sunk);border:1px solid var(--line2);position:relative;display:grid;place-items:center;font-size:11px;color:var(--muted);padding:0;width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .lab{position:absolute;left:4px;top:4px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;color:#fff}
.ph .lab.b{background:#b45309} .ph .lab.a{background:#15803d}
.prog{font-size:12px;border-left:3px solid var(--line);padding-left:8px;color:var(--ink)}
.dlmsg{font-size:13px;padding:10px 12px;border-radius:6px;background:var(--bad-bg);color:var(--bad);overflow-wrap:anywhere}
.dlmsg.ok{background:var(--ok-bg);color:var(--ok)}
.dlmsg.wait{background:var(--run-bg);color:var(--run)}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.dl button{text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:center}
.dl button small{color:var(--muted);font-size:11px}
.note{font-size:12px;color:var(--muted)}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;font-size:13px;z-index:60}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:grid;place-items:center;z-index:70;padding:16px}
.lb img{max-width:100%;max-height:90vh;border-radius:4px}
@media (max-width:640px){ h1{font-size:20px} .bar{grid-template-columns:1fr;gap:4px} .bar .num{text-align:left}}
</style>
</head>

<div class="loading" id="loading">데이터를 불러오는 중… / กำลังโหลดข้อมูล…</div>
<div class="wrap">
  <div class="hazard"></div>
  <header>
    <div>
      <h1 data-i="title"></h1>
      <p class="sub"><span data-i="updated"></span> <span id="upd"></span></p>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="language">
        <button type="button" id="lk" aria-pressed="true">한국어</button>
        <button type="button" id="lt" aria-pressed="false">ไทย</button>
      </div>
      <button type="button" class="btn" id="refresh" data-i="refresh"></button>
    </div>
  </header>

  <section class="kpis" id="kpis"></section>

  <div class="grid2">
    <section class="card">
      <h2><span data-i="byCat"></span><small data-i="pvaNote"></small></h2>
      <div class="legend"><span><i style="background:var(--plan)"></i><span data-i="planned"></span></span><span><i style="background:var(--ok)"></i><span data-i="actual"></span></span></div>
      <div class="bars" id="cats"></div>
    </section>
    <section class="card">
      <h2><span data-i="byTeam"></span><small data-i="teamNote"></small></h2>
      <div class="legend" id="stackLegend"></div>
      <div class="bars" id="teams"></div>
      <h2 style="margin-top:6px"><span data-i="byIO"></span></h2>
      <div class="bars" id="io"></div>
    </section>
  </div>

  <section class="card">
    <h2><span data-i="attention"></span><small data-i="attNote"></small></h2>
    <div class="list" id="att"></div>
  </section>

  <section class="card">
    <h2><span data-i="gantt"></span></h2>
    <div class="filters">
      <select id="gTeam" aria-label="team"></select>
      <select id="gCat" aria-label="category"></select>
    </div>
    <div class="legend" id="gLegend"></div>
    <div class="gwrap" id="gantt"></div>
  </section>

  <section class="card">
    <h2><span data-i="teamList"></span><small id="tCount"></small></h2>
    <div class="tabs" id="teamTabs" role="tablist"></div>
    <div class="tsum" id="tSum"></div>
    <div class="filters">
      <select id="fCat" aria-label="category"></select>
      <select id="fStat" aria-label="status"></select>
      <input type="search" id="fq" data-ip="search">
    </div>
    <div class="twrap" id="tasks"></div>
  </section>

  <section class="card">
    <h2><span data-i="download"></span></h2>
    <p class="note" data-i="dlNote"></p>
    <div class="dlmsg" id="dlmsg" hidden></div>
    <div class="dl" id="dl"></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>
<div class="lb" id="lb" hidden></div>

<script>
// Apps Script 웹앱 주소 (새 배포로 주소가 바뀌면 여기만 고치면 됨)

const IN_GAS=(typeof google!=='undefined'&&google.script&&google.script.run);
function api(q){
  return fetch(API_URL+'?'+q+'&_='+Date.now(),{redirect:'follow',cache:'no-store'}).then(r=>r.text()).then(txt=>{
    let j;try{j=JSON.parse(txt)}catch(e){throw new Error('API 응답을 읽을 수 없습니다. 웹앱 배포의 액세스 권한을 "모든 사용자"로 설정했는지 확인하세요.')}
    if(!j.ok)throw new Error(j.error||'API error');return j;
  });
}

const ST_KEY={'계획':'plan','진행':'doing','완료':'done','보류':'hold'};

const pd=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?Date.UTC(+m[1],m[2]-1,+m[3]):NaN};

function tx(task,field){ if(lang==='th'&&task.th&&task.th[field]) return task.th[field]; return task[field]; }

function catName(k){ if(lang!=='th')return k; const tk=(DATA.tasks.find(x=>x.cat===k)||{}).th; return (tk&&tk.cat)||k; }
function catIdx(c){const n=parseInt(c,10);return isNaN(n)?0:(n-1)%6}
function toast(m){const e=$('toast');e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}

function enrich(d){
  const today=pd(d.today);
  d.tasks.forEach(x=>{
    const s=pd(x.start),e=pd(x.end);
    const k=ST_KEY[x.status]||'plan';
    x.eff=k==='done'?'done':k==='hold'?'hold':(!isNaN(e)&&e<today?'late':k);
    x.act=k==='done'?1:Math.max(0,Math.min(1,x.ap||0));
    x.pln=(isNaN(s)||isNaN(e))?0:Math.max(0,Math.min(1,(today-s+DAY)/(e-s+DAY)));
    x.left=isNaN(e)?null:Math.round((e-today)/DAY);
  });
  return d;
}

function renderGantt(){
  const team=$('gTeam').value,cat=$('gCat').value;
  const list=DATA.tasks.filter(x=>(!team||x.own===team)&&(!cat||x.cat===cat)&&!isNaN(pd(x.start))&&!isNaN(pd(x.end)));
  $('gLegend').innerHTML=STACK.map(([k,c])=>`<span><i style="background:${c}"></i>${t('st_'+k)}</span>`).join('')+`<span><i style="background:var(--accent);width:3px"></i>${t('today')}</span>`;
  if(!list.length){$('gantt').innerHTML=`<div class="empty">${t('noItems')}</div>`;return}
  let s=Math.min(...list.map(x=>pd(x.start))),e=Math.max(...list.map(x=>pd(x.end)));
  const dow=(new Date(s).getUTCDay()+6)%7;s-=dow*DAY;const weeks=Math.max(4,Math.ceil((e-s+DAY)/(7*DAY)));
  const W=$('gantt').clientWidth||1000,lw=W<640?130:240,dw=Math.max(1.5,(W-lw-2)/(weeks*7)),wpx=dw*7,tw=weeks*wpx,today=pd(DATA.today);
  let wk='';for(let i=0;i<weeks;i++){const ws=s+i*7*DAY;const now=today>=ws&&today<ws+7*DAY;wk+=`<div class="${now?'now':''}" style="width:${wpx}px;overflow:hidden">${wpx>=30||i%2===0?md(new Date(ws).toISOString()):''}</div>`}
  const tl=(today-s)/DAY*dw;const showT=today>=s&&today<=s+weeks*7*DAY;
  const col={done:'var(--ok)',doing:'var(--run)',late:'var(--bad)',plan:'var(--plan)',hold:'var(--idle)'};
  let h=`<div class="g" style="--tw:${tw}px;--lw:${lw}px"><div class="grow ghead"><div class="gl">${t('task')}</div><div class="wk">${wk}</div></div>`;
  let last=null;
  list.forEach(x=>{
    if(x.cat!==last){last=x.cat;h+=`<div class="grow gcat"><div class="gl"><i style="width:8px;height:8px;border-radius:2px;background:var(${CAT_COLOR[catIdx(x.cat)]});flex:none"></i>${esc(catName(x.cat))}</div><div class="gt" style="height:26px;background-image:repeating-linear-gradient(90deg,var(--line2) 0 1px,transparent 1px ${wpx}px)">${showT?`<div class="today" style="left:${tl}px"></div>`:''}</div></div>`}
    const l=(pd(x.start)-s)/DAY*dw,w=Math.max(dw,(pd(x.end)-pd(x.start)+DAY)/DAY*dw);
    h+=`<div class="grow"><div class="gl" title="${esc(tx(x,'work'))}"><span class="id" style="font-family:var(--mono);font-size:10px;color:var(--muted)">${esc(x.id)}</span>${esc(tx(x,'work'))}</div>
      <div class="gt" style="background-image:repeating-linear-gradient(90deg,var(--line2) 0 1px,transparent 1px ${wpx}px)">${showT?`<div class="today" style="left:${tl}px"></div>`:''}
      <div class="gb" style="left:${l}px;width:${w}px;background:${col[x.eff]};${x.io==='외부'?'box-shadow:inset 0 -3px 0 var(--ext)':''}" title="${esc(tx(x,'work'))} · ${md(x.start)}–${md(x.end)} · ${t('st_'+x.eff)} · ${teamName(x.own)}"></div></div></div>`;
  });
  $('gantt').innerHTML=h+'</div>';
}

function saveB64(r){
  if(!r||!r.b64)throw new Error('empty file');
  const bin=atob(r.b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const blob=new Blob([u],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  if(window.navigator&&navigator.msSaveOrOpenBlob){navigator.msSaveOrOpenBlob(blob,r.filename);return}
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=r.filename;a.rel='noopener';a.style.display='none';
  document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},8000);
}

  dlMsg(label+' — '+t('making'),'wait');
  const done=r=>{$('dl').querySelectorAll('button').forEach(x=>x.disabled=false);
    try{saveB64(r);dlMsg(label+' — '+t('saved')+' ('+r.filename+')','ok')}catch(e){dlMsg(t('fail')+': '+e.message)}};
  const fail=e=>{$('dl').querySelectorAll('button').forEach(x=>x.disabled=false);dlMsg(t('fail')+': '+((e&&e.message)||e))};
  if(!IN_GAS){
    api('api=xlsx'+(b.dataset.all?'':'&sheet='+encodeURIComponent(b.dataset.sheet))).then(j=>done(j.file)).catch(fail);
    return;
  }
  const run=google.script.run.withSuccessHandler(done).withFailureHandler(fail);
  b.dataset.all?run.exportAllXlsx():run.exportSheetXlsx(b.dataset.sheet);
}
function renderAll(keep){
  applyI18n();$('upd').textContent=DATA.updated;
  renderKpis();renderCats();renderTeams();renderAtt();renderFilters(keep);renderGantt();renderTabs();renderTasks();renderDl();
}
function load(){
  $('refresh').disabled=true;
  const ok=d=>{window.__lastLoad=Date.now();DATA=enrich(d);$('loading').hidden=true;$('refresh').disabled=false;renderAll(true)};
  const bad=e=>{$('loading').textContent=(e&&e.message)||String(e);$('refresh').disabled=false};
  if(window.SAMPLE_DATA)ok(window.SAMPLE_DATA);
  else if(IN_GAS)google.script.run.withSuccessHandler(ok).withFailureHandler(bad).getDashboardData();
  else api('api=data').then(j=>ok(j.data)).catch(bad);
}
function setLang(l){lang=l;try{localStorage.setItem('db_lang',l)}catch(e){};if(DATA)renderAll(true);else applyI18n()}
$('lk').onclick=()=>setLang('ko');$('lt').onclick=()=>setLang('th');$('refresh').onclick=load;
['gTeam','gCat'].forEach(id=>$(id).onchange=renderGantt);
['fCat','fStat'].forEach(id=>$(id).onchange=renderTasks);$('fq').oninput=renderTasks;
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('lb').hidden=true});
let _rz;window.addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(()=>{if(DATA)renderGantt()},200)});
applyI18n();load();
// 5분마다 자동 새로고침 (화면이 보이는 동안만)
setInterval(()=>{if(!document.hidden&&!$('refresh').disabled)load()},5*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&DATA&&Date.now()-(window.__lastLoad||0)>60000)load()});
</script>
