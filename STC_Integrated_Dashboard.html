function ensureFrame(t){
  const panel=document.getElementById('panel-'+t.id);
  if(panel.querySelector('iframe')) return;
  const f=document.createElement('iframe');
  /* 캐시 무효화 — iframe 안 페이지는 Ctrl+F5 로도 새로 받지 않는 경우가 많다.
     통합 대시보드를 열 때마다 주소 끝에 버전 표식을 붙여 항상 최신 파일을 받게 한다. */
  f.title=T('tab.'+t.id); f.loading='lazy';
  f.src = t.src + (t.src.indexOf('?') >= 0 ? '&' : '?') + 'v=' + PORTAL_BUILD;
  if(t.noWeek) f.dataset.noweek='1';
  f.onload=()=>{ const m=panel.querySelector('.frame-msg'); if(m) m.remove();
                 syncWeekToFrame(f); syncLangToFrame(f); attachFrameTr(f); };
  f.onerror=()=>{ panel.innerHTML='<div class="frame-msg">'+T('st.frameErr',{name:T('tab.'+t.id),src:t.src})+'</div>'; };
  panel.appendChild(f);
}

/* 같은 도메인(cdrty435-hub.github.io)이라 셸에서 각 페이지의 주차 선택을 맞춰줄 수 있다.
   페이지마다 구조가 달라 '되면 맞추고, 안 되면 조용히 넘어가는' 최선노력 방식이다. */
function syncWeekToFrame(frame, tries){
  if(!document.getElementById('syncChk').checked) return;
  if(frame.dataset.noweek) return;
  tries = tries||0;
  const week=document.getElementById('weekSel').value;
  let doc=null;
  try{ doc = frame.contentDocument; }catch(e){ return; }
  if(!doc) return;
  const sel = doc.getElementById('weekSelect') || doc.querySelector('select[id*="eek"]');
  if(sel && [...sel.options].some(o=>o.value===week)){
    if(sel.value!==week){ sel.value=week; sel.dispatchEvent(new Event('change',{bubbles:true})); }
    return;
  }
  if(tries<12) setTimeout(()=>syncWeekToFrame(frame,tries+1), 500);
}
function syncWeekToAllFrames(){ document.querySelectorAll('.panel iframe').forEach(f=>syncWeekToFrame(f)); }

/* ---------- 언어 전파 ----------
   · 품질 6σ  : 전역 setLang('ko'|'th'|'en') 을 그대로 호출한다.
   · MTTR/MTBF: 한국어/태국어 2개뿐이라 #wkLang 버튼을 누른다(영어는 한국어로 둔다).
   · 나머지 페이지(주간 OEE·금형·Loss·기간별·변환기)는 원본이 한국어 전용이라 대상이 아니다.
   또한 자식들이 쓰는 localStorage 키를 미리 써 두므로, 아직 열지 않은 탭도
   나중에 열릴 때 바로 해당 언어로 뜬다(같은 도메인 = 같은 localStorage). */
function writeChildLangPrefs(){
  try{ localStorage.setItem('stc_oee_lang', LANG); }catch(e){}            // 품질 6σ
  try{ localStorage.setItem('stc_wk_lang', LANG==='th'?'th':'ko'); }catch(e){} // MTTR/MTBF
}
function syncLangToFrame(frame, tries){
  tries = tries||0;
  let win=null, doc=null;
  try{ win=frame.contentWindow; doc=frame.contentDocument; }catch(e){ return; }
  if(!doc) return;
  let done=false;
  try{ if(typeof win.setLang === 'function'){ win.setLang(LANG); done=true; } }catch(e){}
  if(!done){
    try{
      const want = (LANG==='th') ? 'th' : 'ko';   /* 영어는 이 페이지 자체 기능이 없어 한국어로 두고 셸 사전이 번역 */
      const btn = doc.querySelector('#wkLang button[data-lang="'+want+'"]');
      if(btn){ btn.click(); done=true; }
    }catch(e){}
  }
  if(!done && tries<10) setTimeout(()=>syncLangToFrame(frame,tries+1), 500);
}
function syncLangToAllFrames(){ document.querySelectorAll('.panel iframe').forEach(f=>syncLangToFrame(f)); trAllFrames(); }
/* =========================================================================
   6-2. 탭 화면 번역 (English / ไทย)
        각 탭 페이지는 한국어 전용이므로, 셸이 같은 도메인 iframe 안의 글자를
        사전(STC_i18n_dict.js → window.STC_I18N : 한국어 → [en, th])으로 바꿔 보여준다.
        · 원문은 노드별로 기억해 두었다가 한국어로 돌아오면 그대로 복원
        · 페이지가 다시 그려지면(MutationObserver) 새 글자만 다시 번역
        · Chart.js 범례·축·라벨도 번역 · 입력칸(textarea) 내용은 건드리지 않는다
        · 자체 언어 기능이 있는 페이지(품질 6σ: window.setLang)는 그 기능을 쓴다
   ========================================================================= */
const TR_RUN = /[가-힣]+(?:[ ][가-힣]+)*/g;
const TR_PART = /^(.+?)(으로|에서|까지|부터|처럼|보다|이며|이고|은|는|이|가|을|를|의|에|로|과|와|도|만|별|용)$/;
function trRun(run, li){
  const D = window.STC_I18N || {};
  if(D[run]) return D[run][li];
  const one = w => { if(D[w]) return D[w][li]; const m = w.match(TR_PART); return (m && D[m[1]]) ? D[m[1]][li] : null; };
  const ws = run.split(' ');
  if(ws.length === 1){ const r = one(run); return r==null ? run : r; }
  let hit = 0; const out = ws.map(w=>{ const r = one(w); if(r!=null){ hit++; return r; } return w; });
  return hit ? out.join(' ') : run;
}
function trText(s, li){
  if(!/[가-힣]/.test(s)) return s;
  const out = s.replace(TR_RUN, (run, off, all)=>{
    const before = all[off-1] || '', after = all[off+run.length] || '';
    if(before === '_'){                                     /* 시트 탭 이름(A_가동률 등)의 첫 단어는 그대로 */
      const i = run.indexOf(' '); if(i < 0) return run;
      return run.slice(0,i) + ' ' + trText(run.slice(i+1), li);
    }
    if(after === '_') return run;
    let r = trRun(run, li);
    if(r === run) return r;
    if(li === 0){                                   // 영어는 숫자·영문과 붙지 않게 띄운다 (3대 → 3 units)
      if(/[0-9A-Za-z)%]/.test(before) && /^[A-Za-z(]/.test(r)) r = ' ' + r;
      if(/[0-9A-Za-z(]/.test(after) && /[A-Za-z)]$/.test(r)) r = r + ' ';
    }
    return r;
  });
  return out.replace(/ {2,}/g,' ');
}
const TR_ORIG = new WeakMap(), TR_LAST = new WeakMap();
const TR_ATTRS = ['placeholder','title','aria-label','value'];
function trNodeText(n, li){
  const cur = n.nodeValue;
  let orig = TR_ORIG.get(n);
  if(orig === undefined || cur !== TR_LAST.get(n)){ if(orig === undefined && !/[가-힣]/.test(cur)) return; orig = cur; TR_ORIG.set(n, orig); }
  const out = li < 0 ? orig : trText(orig, li);
  if(out !== cur) n.nodeValue = out;
  TR_LAST.set(n, out);
}
function trSkip(el){
  if(!el || el.nodeType !== 1) return true;
  const t = el.nodeName;
  if(t==='SCRIPT' || t==='STYLE' || t==='TEXTAREA' || t==='NOSCRIPT' || el.isContentEditable) return true;
  return !!(el.closest && el.closest('[data-no-tr],#langSwitch,.wk-lang'));
}
function translateTree(root, li){
  if(!root) return;
  const doc = root.ownerDocument || root;
  const w = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n; while((n = w.nextNode())){ if(!trSkip(n.parentNode)) trNodeText(n, li); }
  (root.querySelectorAll ? root.querySelectorAll('[placeholder],[title],[aria-label],input[type=button],input[type=submit]') : []).forEach(el=>{
    if(trSkip(el) && el.nodeName!=='TEXTAREA') return;
    TR_ATTRS.forEach(a=>{
      if(a==='value' && !(el.nodeName==='INPUT' && /^(button|submit)$/i.test(el.type))) return;
      const v = el.getAttribute(a); if(v==null) return;
      const k = 'data-tr-ko-'+a;
      let orig = el.getAttribute(k);
      if(orig==null || v !== el.getAttribute('data-tr-last-'+a)){ if(orig==null && !/[가-힣]/.test(v)) return; orig = v; el.setAttribute(k, orig); }
      const out = li < 0 ? orig : trText(orig, li);
      if(out !== v) el.setAttribute(a, out);
      el.setAttribute('data-tr-last-'+a, out);
    });
  });
}
function translateCharts(win, li){
  try{
    const C = win.Chart; if(!C || !C.instances) return;
    Object.values(C.instances).forEach(ch=>{
      if(!ch || !ch.data) return;
      const o = ch._stcOrig || (ch._stcOrig = {
        labels: (ch.data.labels||[]).slice(),
        ds: (ch.data.datasets||[]).map(d=>d.label),
        axes: Object.fromEntries(Object.entries((ch.options&&ch.options.scales)||{}).map(([k,s])=>[k, s&&s.title?s.title.text:null])),
        title: ch.options&&ch.options.plugins&&ch.options.plugins.title ? ch.options.plugins.title.text : null
      });
      const f = v => typeof v === 'string' ? (li<0 ? v : trText(v, li)) : Array.isArray(v) ? v.map(f) : v;
      let changed = false;
      const set = (obj, key, v) => { const nv = f(v); if(JSON.stringify(obj[key]) !== JSON.stringify(nv)){ obj[key] = nv; changed = true; } };
      if(o.labels.length === (ch.data.labels||[]).length) o.labels.forEach((v,i)=>set(ch.data.labels, i, v));
      (ch.data.datasets||[]).forEach((d,i)=>{ if(o.ds[i]!==undefined) set(d, 'label', o.ds[i]); });
      Object.entries(o.axes).forEach(([k,v])=>{ const s = ch.options.scales[k]; if(v && s && s.title) set(s.title, 'text', v); });
      if(o.title && ch.options.plugins.title) set(ch.options.plugins.title, 'text', o.title);
      if(changed) try{ ch.update('none'); }catch(e){}
    });
  }catch(e){}
}
function trLi(){ return LANG==='en' ? 0 : LANG==='th' ? 1 : -1; }
/* iframe 한 장에 번역 연결 */
function attachFrameTr(frame){
  let win, doc; try{ win = frame.contentWindow; doc = frame.contentDocument; }catch(e){ return; }
  if(!doc || !doc.body) return;
  if(typeof win.setLang === 'function') return;          // 자체 번역 페이지(품질 6σ)는 제외
  const run = () => { const li = trLi(); if(doc._stcTrLi === -1 && li === -1) return; doc._stcTrLi = li; translateTree(doc.body, li); translateCharts(win, li); try{ doc.title && (doc.documentElement.lang = LANG); }catch(e){} };
  if(!doc._stcTrObs){
    let t = null;
    doc._stcTrObs = new win.MutationObserver(()=>{ if(t) return; t = win.setTimeout(()=>{ t = null; if(trLi() >= 0 || doc._stcTrLi >= 0) run(); }, 80); });
    doc._stcTrObs.observe(doc.body, { childList:true, subtree:true, characterData:true });
    doc._stcTrRun = run;
  }
  run();
}
function trAllFrames(){ document.querySelectorAll('.panel iframe').forEach(f=>attachFrameTr(f)); }
/* 셸 자체 패널(종합·FAC2)에 남은 한국어 (데이터 이름 등) */
function trShellPanels(){ const li = trLi(); ['panel-overview','panel-f2ov'].forEach(id=>{ const el = document.getElementById(id); if(el) translateTree(el, li); }); }


/* =========================================================================
   7. 언어 적용
   ========================================================================= */
function applyStaticI18n(){
  document.documentElement.lang = LANG;
  document.title = T('app.title');
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll('#langSwitch button').forEach(b=>
    b.setAttribute('aria-pressed', b.dataset.lang===LANG ? 'true':'false'));
  document.querySelectorAll('[data-frameload]').forEach(el=>{
    el.textContent = T('st.frameLoading',{name:T('tab.'+el.dataset.frameload)});
  });
}
function setLang(lang){
  if(LANGS.indexOf(lang)<0) return;
  LANG = lang;
  try{ localStorage.setItem(LANG_KEY, LANG); }catch(e){}
  writeChildLangPrefs();
  applyStaticI18n();
  renderOverview();
  f2Localize(); renderF2();
  refreshStatus();
  syncLangToAllFrames();
  trShellPanels();
}

/* =========================================================================
   8. 로드
   ========================================================================= */
let LAST = null;   // 마지막 로드 결과(언어 전환 시 상태줄을 다시 그리기 위해)

function setStatus(html){ document.getElementById('hdStatus').innerHTML=html; }
function refreshStatus(){
  if(!LAST) { setStatus(T('st.loading')); return; }
  if(LAST.error){ setStatus('<b>'+T('st.failed')+'</b>'); return; }
  /* 시각도 선택 언어의 로캘로 '그때그때' 포맷한다(문자열을 캐시하면 언어 전환 시 굳는다). */
  const tm = LAST.at.toLocaleTimeString(LOCALE[LANG],{hour:'2-digit',minute:'2-digit'});
  setStatus(`<b>${T('st.weeks',{n:LAST.weeks})}</b> · ${T('st.rows',{a:fmt(LAST.a),p:fmt(LAST.p),q:fmt(LAST.q)})}<br>${T('st.asof',{t:tm})}`);
}

async function fetchCSV(gid){
  const res = await fetch(sheetCsvUrl(gid), {cache:'no-store'});
  if(!res.ok) throw new Error(`시트(gid=${gid}) 응답 오류 ${res.status}`);
  return parseCSV(await res.text());
}

function populateWeeks(){
  const weeks=[...new Set(RAW.a.map(r=>r['주차']).filter(Boolean))]
    .sort((a,b)=>{ const na=parseInt(String(a).replace(/\D/g,''),10), nb=parseInt(String(b).replace(/\D/g,''),10);
                   return (isNaN(na)||isNaN(nb)) ? String(a).localeCompare(String(b)) : na-nb; });
  const sel=document.getElementById('weekSel');
  const keep=sel.value;
  sel.innerHTML = weeks.map(w=>`<option value="${w}">${w}</option>`).join('');
  if(weeks.indexOf(keep)>=0) sel.value=keep;
  else if(weeks.length) sel.value = weeks[weeks.length-1];
  return weeks;
}

async function loadAll(){
  const btn=document.getElementById('btnRefresh');
  btn.disabled=true; LAST=null; refreshStatus();
  loadF2();                                   /* FAC2 는 따로 읽는다 — 없어도 FAC1 은 그대로 뜬다 */
  try{
    const [a,p,q] = await Promise.all([fetchCSV(GID_A), fetchCSV(GID_P), fetchCSV(GID_Q)]);
    RAW={a,p,q};
    const weeks=populateWeeks();
    renderOverview();
    LAST={weeks:weeks.length,a:a.length,p:p.length,q:q.length,at:new Date()};
    refreshStatus();
  }catch(e){
    console.error(e);
    LAST={error:true}; refreshStatus();
    document.getElementById('panel-overview').innerHTML =
      `<div class="ov"><div class="err">${T('err.sheet',{msg:e.message})}</div></div>`;
  }finally{ btn.disabled=false; }
}

/* init */
buildTabs();
/* 셸 패널(종합·FAC2 현황)이 다시 그려질 때 남은 한국어를 번역 — 한국어 화면에서는 아무것도 안 함 */
['panel-overview','panel-f2ov'].forEach(id=>{ const el = document.getElementById(id); if(!el) return; let t = null;
  new MutationObserver(()=>{ if(t || trLi() < 0) return; t = setTimeout(()=>{ t = null; translateTree(el, trLi()); }, 60); })
    .observe(el, { childList:true, subtree:true, characterData:true }); });
writeChildLangPrefs();
applyStaticI18n();
try{
  const saved=localStorage.getItem('stc_portal_tab');
  if(saved && TABS.some(t=>t.id===saved)) selectTab(saved);
}catch(e){}
document.getElementById('weekSel').addEventListener('change', ()=>{ renderOverview(); renderF2(); syncWeekToAllFrames(); });
document.getElementById('scopeSel').addEventListener('change', renderOverview);
document.getElementById('btnRefresh').addEventListener('click', loadAll);
document.getElementById('syncChk').addEventListener('change', e=>{ if(e.target.checked) syncWeekToAllFrames(); });
document.querySelectorAll('#langSwitch button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
loadAll();
</script>
<script>
/* =========================================================================
   중점관리 품번 (종합 탭) — FAC1 다이캐스팅(Q_Model상세) + FAC2 MCT·OQC(F2 탭)를 품번 하나로 묶어 본다.
   · 기본 등록: CT Support (FAC2 CF623L3LAA03 ↔ FAC1 모델 SUPPORT), CT Cover (CF624L3LAA02 ↔ COVER)
   · '품번 추가'로 언제든 늘리고 뺄 수 있다 (목록·메모는 이 브라우저에 저장)
   ========================================================================= */
const FOCUS_KEY = 'stc_focus_items', FOCUS_RNG_KEY = 'stc_focus_rng';
const FOCUS_DEFAULT = [
  { id:'ct-support', name:'CT Support', f2:'CF623L3LAA03', f1:'SUPPORT', f1pn:'CR623L3LAA', since:'2026-09-30' },
  { id:'ct-cover',   name:'CT Cover',   f2:'CF624L3LAA02', f1:'COVER',   f1pn:'CR624L3LAA', since:'2026-09-30' }
];
const FOCUS_MODEL_GID = '635880711';                               /* OEE_RawData_APQ › Q_Model상세 */
const FOCUS_DEF1 = ['미성형','깨짐','찍힘','자동불량','표면오염','기포','핀파손','부풀음','박리','수축','스크래치','소착','언밸런스',
  '품질확인','버','변형','제품끼임','밀핀짧음','밀핀긺','게이트파임','홀틀어짐','게이트파손','중량미달','스펙미달','비스켓두께미달','기타'];
const FOCUS = { q:[], qLoaded:false, qErr:null, qLoading:false };
const fcEsc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  let d = 'M'+P[0][0].toFixed(1)+' '+P[0][1].toFixed(1);
  for(let i=0;i<n-1;i++){ const h = dx[i]/3;
    d += ` C${(P[i][0]+h).toFixed(1)} ${(P[i][1]+m[i]*h).toFixed(1)} ${(P[i+1][0]-h).toFixed(1)} ${(P[i+1][1]-m[i+1]*h).toFixed(1)} ${P[i+1][0].toFixed(1)} ${P[i+1][1].toFixed(1)}`; }

    <tr><td class="k sub">└ 다캐 (소재) %</td>${rows.map(x=>cell(fcPct(x.mct.dc,x.mct.t))).join('')}${cell(fcPct(T.dc,T.t2)).replace('<td class="n','<td class="n tot')}</tr>
    <tr><td class="k sub">└ 가공 (FAC2) %</td>${rows.map(x=>cell(fcPct(x.mct.mc,x.mct.t))).join('')}${cell(fcPct(T.mc,T.t2)).replace('<td class="n','<td class="n tot')}</tr>
    <tr><td class="k">OQC 불량률 %</td>${rows.map(x=>cell(fcPct(x.oqc.n,x.oqc.t))).join('')}${cell(fcPct(T.no,T.to)).replace('<td class="n','<td class="n tot')}</tr>
  </tbody></table></div>`;
  /* 불량 유형 TOP · 설비 */
  const def1 = {}, mc1 = {};
  wrows.forEach(x=>{ Object.entries(x.f1.def).forEach(([k,v])=>def1[k]=(def1[k]||0)+v); Object.entries(x.f1.mc).forEach(([k,v])=>mc1[k]=(mc1[k]||0)+(v.t-v.g)); });
  const mc2 = focusF2Mc(it, weeks);
  h += `<div class="fc-tops">`
    + focusTopList('FAC1 다캐 불량 유형 TOP5', def1, T.t1, '#2a78d6')
    + focusTopList('FAC2 다캐(소재) 불량 TOP5', focusF2Top(it, weeks, '다캐불량'), T.t2, '#1baf7a')
    + focusTopList('FAC2 가공 불량 TOP5', focusF2Top(it, weeks, '가공불량'), T.t2, '#eb6834')
    + `<div class="fc-top"><div class="h" style="border-color:#94a3b8">생산 설비</div><div class="mcs">`
    + `<div><b>FAC1</b> ${Object.keys(mc1).map(fcEsc).join(' · ')||'–'}</div>`
    + `<div><b>FAC2 NG</b> ${focusTop(mc2,6).map(([k,v])=>`${fcEsc(k)} ${v.toLocaleString()}`).join(' · ')||'–'}</div></div></div>`
    + `</div>`;
  let memo = ''; try{ memo = localStorage.getItem('stc_focus_memo_'+it.id) || ''; }catch(e){}
  h += `<div class="fc-memo"><div class="h">관리 메모 · 대책 · 진행</div><textarea data-fcmemo="${fcEsc(it.id)}" placeholder="원인 분석, 대책, 담당, 목표일, 진행 상황을 적어 두세요 (이 브라우저에 저장)">${fcEsc(memo)}</textarea></div>`;
  return h + `</div>`;
}
function renderFocus(){
  const host = document.getElementById('panel-focus'); if(!host) return;
  if(!FOCUS.qLoaded && !FOCUS.qLoading && !FOCUS.qErr) focusLoadQ();
  const items = focusItems(), rng = focusRng();
  const allD = [...F2.pd.map(r=>fcDate(r['일자'])), ...FOCUS.q.map(r=>r._d)].filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)).sort();
  const dMin = allD[0] || '', dMax = allD[allD.length-1] || '';
  const f2Parts = {}; F2.pd.forEach(r=>{ const k = String(r['Part no.']||'').trim(); if(k && !f2Parts[k]) f2Parts[k] = r['Part name']||k; });
  const f1Models = [...new Set(FOCUS.q.map(r=>String(r['Model']||'').trim()).filter(Boolean))].sort();
  const f1PM = {}; FOCUS.q.forEach(r=>{ const k = String(r['Part no.']||'').trim(); if(k && !f1PM[k]) f1PM[k] = String(r['Model']||'').trim(); });
  const f1Parts = Object.entries(f1PM).sort((a,b)=>a[1].localeCompare(b[1]));
  const st = [ F2.loaded ? `FAC2 ${F2.pd.length.toLocaleString()}행` : (F2.err ? `FAC2 불러오기 실패: ${fcEsc(F2.err)}` : 'FAC2 불러오는 중…'),
               FOCUS.qLoaded ? `FAC1 Q_Model상세 ${FOCUS.q.length.toLocaleString()}행` : (FOCUS.qErr ? `FAC1 불러오기 실패: ${fcEsc(FOCUS.qErr)}` : 'FAC1 불러오는 중…') ].join(' · ');
  let h = `<div class="fc-wrap"><div class="fc-top-bar">
      <div><h2>중점관리 품번</h2><div class="sub">FAC1 다이캐스팅 → FAC2 MCT 가공 → OQC 출하까지 한 품번을 이어서 봅니다 · ${st}</div></div>
      <div class="ctl"><span class="grp">보기 ${[['day','일간'],['week','주간'],['month','월간']].map(([v,l])=>`<button class="${rng.unit===v?'on':''}" data-fcunit="${v}">${l}</button>`).join('')}</span>
        <span class="grp">기간 ${[['8','8주'],['12','12주'],['26','26주'],['all','전체']].map(([v,l])=>`<button class="${rng.q===v?'on':''}" data-fcrng="${v}">${l}</button>`).join('')}</span>
        <span class="grp dt"><input type="date" id="fcFrom" value="${fcEsc(rng.from)}" min="${dMin}" max="${dMax}"><span>~</span><input type="date" id="fcTo" value="${fcEsc(rng.to)}" min="${dMin}" max="${dMax}"><button class="${rng.q==='custom'?'on':''}" id="fcApply">기간 적용</button></span>
        <button class="rf" onclick="FOCUS.qLoaded=false;FOCUS.qErr=null;focusLoadQ();loadF2();">🔄 새로고침</button></div></div>
    <div class="fc-reg"><span class="lb">등록 ${items.length}개</span>${items.map(it=>`<a href="#fc-${fcEsc(it.id)}" class="chip">${fcEsc(it.name)}</a>`).join('')}
      <details class="add"><summary>＋ 중점관리 품번 추가</summary><div class="form">
        <label>이름 <input id="fcName" placeholder="예: CN8 Support"></label>
        <label>FAC2 품번 <select id="fcF2"><option value="">선택</option>${Object.entries(f2Parts).sort((a,b)=>String(a[1]).localeCompare(b[1])).map(([k,v])=>`<option value="${fcEsc(k)}">${fcEsc(v)} (${fcEsc(k)})</option>`).join('')}</select></label>
        <label>FAC1 모델 <select id="fcF1"><option value="">(없음)</option>${f1Models.map(m=>`<option>${fcEsc(m)}</option>`).join('')}</select></label>
        <label>FAC1 품번 <select id="fcF1p"><option value="">(없음)</option>${f1Parts.map(([k,m])=>`<option value="${fcEsc(k)}">${fcEsc(k)} · ${fcEsc(m)}</option>`).join('')}</select></label>
        <button id="fcAdd">추가</button><span class="hint">FAC1은 모델 이름 또는 품번으로 찾습니다 (둘 중 하나만 맞아도 집계) · Q_Model상세 품번 기록은 9/9부터</span></div></details></div>`;
  if(!F2.loaded && !FOCUS.qLoaded) h += `<div class="fc-card nil">데이터를 불러오는 중입니다…</div>`;
  else if(!items.length) h += `<div class="fc-card nil">등록된 중점관리 품번이 없습니다 — 위 '품번 추가'로 등록하세요.</div>`;
  else h += items.map(it=>focusItemHtml(it, rng)).join('');
  h += `<div class="fc-foot">※ FAC1 다캐 불량률 = 불량 유형(미성형~기타) 합계 ÷ 생산 · 총 불량률 = (생산 − 양품) ÷ 생산 (웜샷 포함) · FAC2 %NG = NG ÷ Total (다캐 = 소재 불량, 가공 = FAC2 가공 불량) · 목표 %NG ≤ ${f2Target()}% (빨강 = 초과) · 주차는 FAC1·FAC2 모두 수~화 기준 · 등록 목록·메모는 이 브라우저에 저장됩니다</div></div>`;
  const y = host.scrollTop; host.innerHTML = h; host.scrollTop = y;
  host.querySelectorAll('[data-fcrng]').forEach(b=>b.onclick=()=>focusRngSet({ q:b.dataset.fcrng }));
  host.querySelectorAll('[data-fcunit]').forEach(b=>b.onclick=()=>focusRngSet({ unit:b.dataset.fcunit }));
  const ap = host.querySelector('#fcApply');
  if(ap) ap.onclick = ()=>{ let a = host.querySelector('#fcFrom').value, z = host.querySelector('#fcTo').value;
    if(!a && !z){ alert('시작일이나 종료일을 넣어 주세요'); return; } if(a && z && a > z){ const t = a; a = z; z = t; }
    focusRngSet({ q:'custom', from:a, to:z }); };
  host.querySelectorAll('[data-fcdel]').forEach(b=>b.onclick=()=>{ const it = items.find(x=>x.id===b.dataset.fcdel);
    if(it && confirm(`'${it.name}' 을(를) 중점관리에서 해제할까요? (데이터는 지워지지 않습니다)`)){ focusSave(items.filter(x=>x!==it)); renderFocus(); } });
  host.querySelectorAll('textarea[data-fcmemo]').forEach(t=>t.oninput=()=>{ try{ localStorage.setItem('stc_focus_memo_'+t.dataset.fcmemo, t.value); }catch(e){} });
  const add = host.querySelector('#fcAdd');
  if(add) add.onclick = ()=>{
    const f2 = host.querySelector('#fcF2').value, f1pn = host.querySelector('#fcF1p').value;
    const f1 = host.querySelector('#fcF1').value || (f1pn ? (f1PM[f1pn]||'') : '');
    const name = host.querySelector('#fcName').value.trim() || (f2 ? (f2Parts[f2]||f2) : f1);
    if(!f2 && !f1 && !f1pn){ alert('FAC2 품번이나 FAC1 모델·품번 중 하나는 골라 주세요'); return; }
    if(items.some(x=>x.f2===f2 && x.f1===f1)){ alert('이미 등록된 품번입니다'); return; }
    items.push({ id:'fc'+Date.now().toString(36), name, f2, f1, f1pn, since:new Date().toISOString().slice(0,10) });
    focusSave(items); renderFocus();
  };
}
</script>
</body>
</html>
