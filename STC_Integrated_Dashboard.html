<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STC 설비관리 통합 대시보드</title>
<style>
/* =========================================================================
   STC 설비관리 통합 대시보드 (셸)  ·  한국어 / English / ไทย
   - 기존 대시보드 파일은 전혀 수정하지 않는다. 각 탭은 원본 HTML을 그대로
     iframe 으로 불러오며(최초 열 때만 로드), Chart.js 3.9.1(주간 OEE)과
     4.5.0(MTTR/MTBF·금형)이 서로 다른 문서에 있으므로 버전 충돌이 없다.
   - '종합' 탭만 이 파일이 직접 시트를 읽어 계산한다. 산식은 각 원본
     대시보드의 코드에서 그대로 옮겨왔다(하단 주석 참조).
   - 태국어/영어 용어는 품질 6σ·MTTR 대시보드가 이미 쓰는 표현에 맞췄다
     (가동률=อัตราเดินเครื่อง · 설비=เครื่องจักร · 금형=แม่พิมพ์ · 주차=สัปดาห์ 등).
   - 라이트 전용: 품는 대상 페이지들이 라이트 전용이라 셸만 다크로 두면
     탭 전환 시 배색이 어긋난다.
   ========================================================================= */
:root{
  --brand-1:#1e3c72; --brand-2:#2a5298;
  --surface-1:#ffffff; --plane:#f2f4f7;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
  --grid:#e1e0d9; --hairline:rgba(11,11,11,.10);
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --seq-100:#cde2fb; --seq-450:#2a78d6;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic","Noto Sans Thai",sans-serif;
  background:var(--plane); color:var(--ink-1); display:flex; flex-direction:column;
}
html[lang="th"] body{font-family:"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;}

header{
  background:linear-gradient(135deg,var(--brand-1) 0%,var(--brand-2) 100%);
  color:#fff; padding:14px 20px 12px; box-shadow:0 2px 8px rgba(0,0,0,.12); flex:0 0 auto;
}
.hd-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
h1{font-size:19px;font-weight:700;letter-spacing:-.01em;}
.hd-sub{font-size:12px;opacity:.82;}
.hd-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;}
.ctl{display:flex;align-items:center;gap:6px;}
.ctl label{font-size:11.5px;opacity:.85;font-weight:600;letter-spacing:.02em;}
.ctl select{
  padding:5px 9px;border:1px solid rgba(255,255,255,.35);border-radius:5px;
  background:rgba(255,255,255,.14);color:#fff;font-size:12.5px;font-weight:600;
  font-family:inherit;cursor:pointer;min-width:92px;
}
.ctl select option{color:#111;background:#fff;}
.btn-refresh{
  padding:5px 13px;border:1px solid rgba(255,255,255,.35);border-radius:5px;
  background:rgba(255,255,255,.14);color:#fff;font-size:12.5px;font-weight:700;
  font-family:inherit;cursor:pointer;
}
.btn-refresh:hover{background:rgba(255,255,255,.26);}
.btn-refresh:disabled{opacity:.5;cursor:not-allowed;}
/* 언어 선택 */
#langSwitch{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:5px;overflow:hidden;}
#langSwitch button{
  appearance:none;border:none;background:rgba(255,255,255,.08);color:#fff;
  font-family:inherit;font-size:12px;font-weight:700;padding:5px 11px;cursor:pointer;
  border-right:1px solid rgba(255,255,255,.22);
}
#langSwitch button:last-child{border-right:none;}
#langSwitch button:hover{background:rgba(255,255,255,.22);}
#langSwitch button[aria-pressed="true"]{background:#fff;color:var(--brand-1);}
.hd-status{font-size:11.5px;opacity:.82;margin-left:auto;text-align:right;line-height:1.5;}
.hd-status b{opacity:1;font-weight:700;}

nav.tabs{
  background:var(--surface-1); border-bottom:1px solid var(--hairline);
  display:flex; overflow-x:auto; flex:0 0 auto; padding:0 12px; scrollbar-width:thin;
}
nav.tabs button{
  appearance:none;border:none;background:none;font-family:inherit;
  padding:11px 15px 9px;font-size:13px;font-weight:600;color:var(--ink-2);
  cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;
}
nav.tabs button:hover{color:var(--brand-2);background:#f7f9fc;}
nav.tabs button[aria-selected="true"]{color:var(--brand-2);border-bottom-color:var(--brand-2);}
nav.tabs .tab-sep{width:1px;background:var(--grid);margin:9px 9px;flex:0 0 auto;}
nav.tabs button.tool{font-weight:500;}

nav.groups{background:#16305e;display:flex;gap:2px;padding:0 12px;overflow-x:auto;flex:0 0 auto;}
nav.groups button{appearance:none;border:none;background:none;color:rgba(255,255,255,.7);font-family:inherit;
  font-size:13.5px;font-weight:700;padding:9px 16px 8px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
nav.groups button:hover{color:#fff;background:rgba(255,255,255,.06);}
nav.groups button[aria-selected="true"]{color:#fff;border-bottom-color:#ffd166;}
nav.groups .gno{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;margin-right:6px;
  font-size:11px;text-align:center;background:rgba(255,255,255,.18);}
nav.groups button[aria-selected="true"] .gno{background:#ffd166;color:#16305e;}
nav.tabs .hid{display:none !important;}
main{flex:1 1 auto;position:relative;overflow:hidden;}
.panel{position:absolute;inset:0;display:none;}
.panel[data-active="true"]{display:block;}
.panel.frame iframe{width:100%;height:100%;border:none;display:block;background:var(--plane);}
.frame-msg{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:10px;color:var(--ink-muted);font-size:13px;background:var(--plane);
}
.spinner{width:26px;height:26px;border:3px solid var(--grid);border-top-color:var(--seq-450);
  border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

#panel-overview{overflow-y:auto;padding:18px 20px 30px;}
#panel-f2ov{overflow:hidden;}
.f2-wrap{display:flex;height:100%;}
.f2-side{flex:0 0 190px;background:var(--surface-1);border-right:1px solid var(--hairline);padding:14px 10px;overflow-y:auto;}
.f2-side .f2-sec{font-size:11px;font-weight:700;color:var(--ink-muted);margin:14px 8px 6px;letter-spacing:.04em;}
.f2-side .f2-sec:first-child{margin-top:2px;}
.f2-side button{display:flex;align-items:center;gap:8px;width:100%;appearance:none;border:none;background:none;font-family:inherit;
  font-size:13px;font-weight:700;color:var(--ink-1);padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left;margin-bottom:3px;}
.f2-side button:hover{background:#eef3fb;}
.f2-side button.on{background:var(--brand-1);color:#fff;box-shadow:0 2px 6px rgba(30,60,114,.3);}
.f2-side .ic{width:20px;text-align:center;}
.f2-main{flex:1 1 auto;overflow-y:auto;padding:18px 20px 30px;}
@media (max-width:760px){.f2-wrap{flex-direction:column;}.f2-side{flex:0 0 auto;display:flex;gap:4px;overflow-x:auto;padding:6px;border-right:none;border-bottom:1px solid var(--hairline);}
  .f2-side .f2-sec{display:none;}.f2-side button{width:auto;white-space:nowrap;margin:0;}}
.f2-rbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface-1);border:1px solid var(--hairline);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;font-weight:600;}
.f2-rbar select{margin-left:6px;padding:5px 8px;border:1px solid #ccd;border-radius:5px;font-family:inherit;font-size:12.5px;}
.f2-rbar .btn-f2{margin-left:auto;}
.f2-date{padding:5px 8px;border:1px solid #ccd;border-radius:5px;font-family:inherit;font-size:12.5px;margin-left:6px;}
.f2-quick{display:inline-flex;gap:4px;flex-wrap:wrap;}
.f2-quick button{appearance:none;border:1px solid #cbd5e1;background:#fff;border-radius:14px;padding:4px 10px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;}
.f2-quick button:hover{background:#eef3fb;}
.f2-cmp{color:var(--ink-2);font-weight:500;}
.f2-rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:3px solid var(--brand-1);padding-bottom:8px;margin-bottom:6px;}
.f2-rhead h2{font-size:19px;color:var(--brand-1);}
.f2-rhead div{text-align:right;font-size:12px;color:var(--ink-2);line-height:1.5;}
table.f2-kpi td.wk{color:#b91c1c;font-weight:700;font-size:12px;}
.f2-proc{margin-bottom:10px;}
.f2-plbl{font-size:12px;font-weight:800;color:var(--brand-1);margin:4px 2px 6px;}
table.f2-pt th.grp{text-align:center;background:#eef3fb;border-bottom:1px solid var(--grid);}
table.f2-pt tr.tot td{font-weight:800;background:#f7f9fc;border-top:1.5px solid var(--ink-muted);}
table.f2-pt td.t5{text-align:left;white-space:normal;font-size:11.5px;line-height:1.6;min-width:220px;}
.f2-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.f2-chips button{appearance:none;border:1px solid #cbd5e1;background:#fff;border-radius:16px;padding:5px 12px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;}
.f2-chips button small{font-weight:500;color:var(--ink-muted);margin-left:3px;}
.f2-chips button.on{background:var(--brand-1);border-color:var(--brand-1);color:#fff;}
.f2-chips button.on small{color:#dbe4f5;}
.f2-t5g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
@media (max-width:1300px){.f2-t5g{grid-template-columns:repeat(2,minmax(0,1fr));}}
.f2-t5h{font-size:12px;font-weight:800;color:var(--ink-2);margin-bottom:6px;}
.f2-rk{flex:0 0 16px;font-weight:800;color:var(--ink-muted);font-size:11px;}
.f2-t5 .f2-bl{flex:0 0 40%;}
.f2-wk th.w{background:#fce4e4;text-align:center;} .f2-wk th.dt{background:#fff6b0;text-align:left;}
.f2-wk td.w{text-align:center;font-weight:800;color:#b91c1c;background:#fff7f7;white-space:nowrap;}
.f2-wk td.w small{font-weight:600;color:#7f1d1d;}
.f2-wk td.w2{color:#e26b0a;} .f2-wk td.w3{color:#333;}
.f2-wk td.dt{text-align:left;white-space:normal;font-size:11.5px;line-height:1.55;min-width:240px;}
.f2-wk td.c{text-align:center;} .f2-wk td.pv{color:#1d4ed8;} .f2-wk td.name,.f2-wk th:nth-child(2){text-align:left;}
.f2-k3 td{vertical-align:middle;} .f2-k3 td.name small{display:block;font-size:10.5px;font-weight:500;color:var(--ink-muted);margin-top:2px;white-space:normal;}
.f2-kv{font-size:14px;line-height:1.3;} .f2-ks{font-size:11px;color:var(--ink-2);line-height:1.45;white-space:nowrap;}
.f2-wk .kw-li{padding-left:1.2em;text-indent:-1.2em;} .f2-why{color:var(--ink-muted);}
.f2-is td{vertical-align:top;} .f2-is td.mc{font-weight:900;font-size:15px;color:#b71c1c;text-align:center;white-space:nowrap;}
.f2-is td.mc small{display:block;font-size:10px;font-weight:700;color:#c62828;margin-top:3px;white-space:normal;}
.f2-is textarea.f2-note{min-height:62px;font-size:12px;}
.f2-dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px;}
@media (max-width:1100px){.f2-dgrid{grid-template-columns:1fr;}}
.f2-donut .f2-dt{font-size:12.5px;font-weight:800;color:var(--ink-2);margin-bottom:6px;}
.f2-dbody{display:flex;align-items:center;gap:14px;}
.f2-dbody svg{flex:0 0 150px;}
.f2-dleg{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:7px;}
.f2-dl{display:grid;grid-template-columns:12px 1fr auto 52px;column-gap:8px;align-items:baseline;font-size:12.5px;}
.f2-dl i{width:11px;height:11px;border-radius:3px;align-self:center;}
.f2-dl .n{font-weight:700;color:var(--ink-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.f2-dl .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;}
.f2-dl .p{color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right;}
.f2-dl .s{grid-column:2 / 5;font-size:11px;color:var(--ink-muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
textarea.f2-note{width:100%;min-height:70px;border:1px dashed #c9d2dc;border-radius:6px;padding:8px;font-family:inherit;font-size:12.5px;background:#fffef5;resize:vertical;}
@media print{
  header,nav.groups,nav.tabs,.f2-side,.f2-noprint{display:none !important;}
  html,body{height:auto;overflow:visible;background:#fff;}
  main,.panel,.f2-wrap,.f2-main{position:static !important;overflow:visible !important;height:auto !important;display:block;}
  .panel[data-active="false"]{display:none !important;}
  .card{box-shadow:none;break-inside:avoid;}
  textarea.f2-note{border:none;background:none;}
}
.f2-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;}
@media (max-width:1500px){.f2-grid{grid-template-columns:1fr;}}
.f2-bar{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;}
.f2-bl{flex:0 0 42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.f2-bt{flex:1 1 auto;width:auto !important;}
.f2-bv{flex:0 0 auto;min-width:74px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;}
.f2-bv small{font-weight:500;color:var(--ink-muted);}
.btn-f2{appearance:none;border:none;border-radius:5px;background:var(--brand-2);color:#fff;font-family:inherit;font-size:12px;font-weight:700;padding:7px 12px;cursor:pointer;}
.btn-f2.alt{background:#198754;}
.ov{max-width:1280px;margin:0 auto;}
.card{background:var(--surface-1);border:1px solid var(--hairline);border-radius:10px;
  padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.sec-title{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.04em;
  text-transform:uppercase;margin:22px 0 9px;}
.sec-title:first-child{margin-top:0;}

.hero-row{display:grid;grid-template-columns:minmax(230px,300px) 1fr;gap:14px;}
@media (max-width:820px){.hero-row{grid-template-columns:1fr;}}
.hero{display:flex;flex-direction:column;justify-content:center;gap:2px;}
.hero .lbl{font-size:12px;color:var(--ink-2);font-weight:600;}
.hero .val{font-size:56px;font-weight:650;line-height:1.02;letter-spacing:-.025em;}
.hero .val .u{font-size:24px;font-weight:600;margin-left:2px;color:var(--ink-2);}
.hero .eq{font-size:11.5px;color:var(--ink-muted);margin-top:6px;font-variant-numeric:tabular-nums;}
.hero .badge{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;margin-top:8px;
  font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid;}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media (max-width:640px){.meters{grid-template-columns:1fr;}}
.meter .mlbl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;gap:8px;}
.meter .mname{font-size:12.5px;font-weight:600;color:var(--ink-2);}
.meter .mval{font-size:26px;font-weight:650;letter-spacing:-.02em;white-space:nowrap;}
.meter .mval .u{font-size:13px;color:var(--ink-2);margin-left:1px;font-weight:600;}
.track{height:9px;border-radius:99px;background:var(--seq-100);overflow:hidden;}
.fill{height:100%;border-radius:0 4px 4px 0;transition:width .35s ease;}
.meter .mnote{font-size:11px;color:var(--ink-muted);margin-top:6px;}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;}
.tile .tlbl{font-size:11.5px;color:var(--ink-2);font-weight:600;margin-bottom:5px;}
.tile .tval{font-size:25px;font-weight:650;letter-spacing:-.02em;line-height:1.15;}
.tile .tval .u{font-size:12px;color:var(--ink-2);margin-left:2px;font-weight:600;}
.tile .tsub{font-size:11px;color:var(--ink-muted);margin-top:4px;line-height:1.45;}

table.eq{width:100%;border-collapse:collapse;font-size:12.5px;}
table.eq th,table.eq td{padding:7px 9px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap;}
table.eq th{font-size:11px;color:var(--ink-2);font-weight:700;text-align:right;
  border-bottom:1.5px solid var(--ink-muted);letter-spacing:.02em;
  position:sticky;top:0;background:var(--surface-1);z-index:1;}
table.eq th:first-child,table.eq td:first-child{text-align:left;}
table.eq td{font-variant-numeric:tabular-nums;}
table.eq tbody tr:hover{background:#f7f9fc;}
table.eq td.name{font-weight:700;}
.barcell{display:flex;align-items:center;gap:8px;justify-content:flex-end;}
.bartrack{display:block;width:86px;height:10px;background:var(--seq-100);border-radius:2px;overflow:hidden;flex:0 0 auto;}
.barfill{display:block;height:100%;border-radius:0 4px 4px 0;}
.pill{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle;}
.tblwrap{overflow-x:auto;}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin-top:10px;}
.legend span{display:flex;align-items:center;gap:5px;}
.foot{font-size:11px;color:var(--ink-muted);line-height:1.85;margin-top:18px;}
.foot b{color:var(--ink-2);}
.err{background:#fdecea;border:1px solid #f5c6c2;color:#a7302a;border-radius:8px;
  padding:13px 15px;font-size:13px;line-height:1.7;}
.empty{color:var(--ink-muted);font-size:13px;padding:22px 0;text-align:center;}
</style>
</head>
<body>

<header>
  <div class="hd-top">
    <h1 data-i18n="app.title">STC 설비관리 통합 대시보드</h1>
    <span class="hd-sub" data-i18n="app.sub">다이캐스팅 DC1~DC23 · OEE · 품질 6σ · MTTR/MTBF · 금형</span>
    <div class="hd-status" id="hdStatus"></div>
  </div>
  <div class="hd-controls">
    <div class="ctl"><label for="weekSel" data-i18n="ctl.week">주차</label><select id="weekSel"></select></div>
    <div class="ctl"><label for="scopeSel" data-i18n="ctl.scope">범위</label>
      <select id="scopeSel">
        <option value="regular" data-i18n="ctl.regular">정규</option>
        <option value="all" data-i18n="ctl.all">전체(특근 포함)</option>
      </select>
    </div>
    <button class="btn-refresh" id="btnRefresh" data-i18n="ctl.refresh">새로고침</button>
    <div class="ctl"><label for="syncChk" style="cursor:pointer;">
      <input type="checkbox" id="syncChk" checked style="vertical-align:-1px;margin-right:4px;"><span data-i18n="ctl.sync">각 탭에 주차 적용</span>
    </label></div>
    <div id="langSwitch" role="group" aria-label="Language">
      <button type="button" data-lang="ko">한국어</button>
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="th">ไทย</button>
    </div>
  </div>
</header>

<nav class="groups" id="grpBar" role="tablist"></nav>
<nav class="tabs" id="tabBar" role="tablist"></nav>
<main id="main"></main>

<script>
/* =========================================================================
   0. 탭 정의 — 파일명만 바꾸면 되고, 필요 없는 탭은 이 배열에서 지우면 된다.
      src 규칙
        · 'xxx.html'       → 이 파일과 같은 폴더(STC_OEE_Dashboard 저장소)
        · '/STC_MOLD/...'  → 같은 github.io 도메인의 다른 저장소(사이트 루트 기준 경로).

function T(key, vars){

     truthy 검사로 폴백하면 한국어가 새어 나오므로 키 존재 여부로 판단한다. */
  const tbl = I18N[LANG] || {};
  let s = Object.prototype.hasOwnProperty.call(tbl,key) ? tbl[key]
        : (Object.prototype.hasOwnProperty.call(I18N.ko,key) ? I18N.ko[key] : key);
  if(vars) for(const k in vars) s = s.split('{'+k+'}').join(vars[k]);
  return s;
}

/* =========================================================================
   3. CSV 파싱 / 숫자 — 주간 OEE 대시보드와 동일 구현
   ========================================================================= */
function parseCSV(text){
  const rows=[]; let row=[],field='',inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; } else field+=c; }
    else{
      if(c==='"') inQ=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\r'){}
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  const header=rows[0]||[];
  return rows.slice(1)
    .filter(r=>!(r.length===1&&r[0]===''))
    .map(r=>{ const o={}; header.forEach((h,i)=>o[h]=r[i]); return o; });
}
const num = v => { const n=parseFloat(v); return isNaN(n)?0:n; };
const eqOf = r => String(r['설비명']||'').trim();
const hasCol = (rows,name) => rows.length>0 && Object.prototype.hasOwnProperty.call(rows[0],name);

function shiftMinutesOf(r){
  for(const k of ['쉬프트시간_분','쉬프트시간(분)','쉬프트시간 (분)','쉬프트시간']){
    const v=r[k];
    if(v!==undefined&&v!==null&&String(v).trim()!=='') return num(v);
  }
  return num(r['계획시간_분']);
}

/* 시그마 — 품질 6σ 대시보드의 invNorm(Acklam) + 1.5σ shift 그대로 */
function invNorm(p){
  if(p<=0) return -Infinity; if(p>=1) return Infinity;
  const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00];
  const b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01];
  const c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00];
  const d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
  const plow=0.02425, phigh=1-plow; let q,r;
  if(p<plow){ q=Math.sqrt(-2*Math.log(p));
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if(p<=phigh){ q=p-0.5; r=q*q;
    return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1); }
  q=Math.sqrt(-2*Math.log(1-p));
  return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
}
const sigmaFromPPM = ppm => ppm==null ? null : invNorm(Math.max(1e-9,Math.min(1-1e-9,1-ppm/1e6)))+1.5;

/* 표시 헬퍼 — 숫자 표기는 선택 언어의 로캘을 따른다 */
const fmt  = (v,d=0) => v==null||!isFinite(v) ? '–'
  : v.toLocaleString(LOCALE[LANG],{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtK = v => v==null||!isFinite(v) ? '–'
  : (v>=1e6 ? (v/1e6).toFixed(1)+'M' : v>=10000 ? Math.round(v/1000)+'K' : fmt(v));
function statusOf(v,th){
  if(v==null||!isFinite(v)) return {c:'var(--ink-muted)',label:'–',icon:'–'};
  if(v>=th.good) return {c:'var(--good)',    label:T('g.good'),     icon:'●'};
  if(v>=th.warn) return {c:'var(--warning)', label:T('g.warn'),     icon:'▲'};
  if(v>=th.bad)  return {c:'var(--serious)', label:T('g.serious'),  icon:'▲'};
  return              {c:'var(--critical)', label:T('g.critical'), icon:'■'};
}

/* =========================================================================
   4. 집계 — 주간 OEE 대시보드의 computeA/computeP/computeQ 와 동일 정의
      A = Σ가동시간 ÷ Σ쉬프트시간 · P = 성능(P)열 단순평균 · Q = ΣGood ÷ ΣTotal
      OEE = A × P × Q ÷ 10,000
   ========================================================================= */
let RAW = { a:[], p:[], q:[] };
const inScope = (r,scope) => scope!=='regular' || r['구분']==='정규';
const keepEq  = r => { const e=eqOf(r); return e && !EXCLUDE_EQ.has(e); };

function aggregate(week, scope){
  const fa = RAW.a.filter(r=>r['주차']===week && inScope(r,scope) && keepEq(r));
  const fp = RAW.p.filter(r=>r['주차']===week && inScope(r,scope) && keepEq(r));
  const fq = RAW.q.filter(r=>r['주차']===week && inScope(r,scope) && keepEq(r));

  let plan=0, run=0, loss=0, nof=0, nofRows=0, udt=0;
  const udtCols = UDT_DEFAULT.filter(c=>hasCol(RAW.a,c));
  for(const r of fa){
    plan += shiftMinutesOf(r); run += num(r['가동시간_분']); loss += num(r['Losstime_분']);
    const nv = r['NOF'];
    if(nv!==undefined && String(nv).trim()!==''){ nof += num(nv); nofRows++; }
    for(const c of udtCols) udt += num(r[c]);
  }
  const A = plan>0 ? run/plan*100 : null;

  let psum=0, pcnt=0;
  for(const r of fp){
    const raw=r['성능(P)'];
    if(raw===undefined||raw===null||String(raw).trim()==='') continue;
    const v=num(raw); if(!v) continue;
    psum+=v; pcnt++;
  }
  const P = pcnt>0 ? psum/pcnt : null;

  let good=0,total=0,bad=0,warm=0,qcnt=0;
  const hasWarmSplit = hasCol(RAW.q,'Warm(STD)') && hasCol(RAW.q,'Warm(Excess)');
  for(const r of fq){
    const t=num(r['Qty_Total']); if(t<=0) continue;
    qcnt++;
    total+=t; good+=num(r['Qty_Good']); bad+=num(r['불량수량']);
    warm += hasWarmSplit ? (num(r['Warm(STD)'])+num(r['Warm(Excess)'])) : num(r['웜샷']);
  }
  const Q = total>0 ? good/total*100 : null;
  const ppm = total>0 ? bad/total*1e6 : null;
  const OEE = (A!=null&&P!=null&&Q!=null) ? A*P*Q/10000 : null;
  const MTBF = nof>0 ? (run/60)/nof : null;
  const MTTR = nof>0 ? (udt/60)/nof : null;
  const dates = [...new Set(fa.map(r=>r['일자']).filter(Boolean))].sort();

  return { A,P,Q,OEE, plan,run,loss, nof,nofRows,udt,udtCols,
           good,total,bad,warm,ppm, sigma:sigmaFromPPM(ppm),
           MTBF,MTTR, dates, rowsP:pcnt, rowsQ:qcnt, hasWarmSplit,
           byEq: byEquipment(fa,fq) };
}

function byEquipment(fa,fq){
  const m = {};
  const get = e => (m[e] = m[e] || {eq:e,plan:0,run:0,loss:0,nof:0,total:0,good:0,bad:0});
  for(const r of fa){
    const o=get(eqOf(r));
    o.plan+=shiftMinutesOf(r); o.run+=num(r['가동시간_분']); o.loss+=num(r['Losstime_분']);
    const nv=r['NOF']; if(nv!==undefined&&String(nv).trim()!=='') o.nof+=num(nv);
  }
  for(const r of fq){
    const t=num(r['Qty_Total']); if(t<=0) continue;
    const o=get(eqOf(r)); o.total+=t; o.good+=num(r['Qty_Good']); o.bad+=num(r['불량수량']);
  }
  return Object.values(m).map(o=>({
    ...o, A: o.plan>0 ? o.run/o.plan*100 : null, Q: o.total>0 ? o.good/o.total*100 : null
  })).filter(o=>o.plan>0||o.total>0);
}

function f2McSum(pred){

    const o = m[k] || (m[k] = { mc:k, days:new Set(), parts:new Set(), ops:new Set(), t:0, f:0, n:0, dc:0, mcN:0, mat:0, cap:0, capKeys:new Set() });
    o.days.add(r['일자']); if(r['Part name']||r['Part no.']) o.parts.add(r['Part name']||r['Part no.']); if(r['OP']) o.ops.add(r['OP']);
    o.t+=f2n(r['생산수량']); o.f+=f2n(r['양품']); o.n+=f2n(r['불량수량']); o.dc+=f2n(r['다캐불량']); o.mcN+=f2n(r['가공불량']); o.mat+=f2n(r["Mat'l NG"]);
    const ck = r['일자']+'|'+r['Part no.'];
    if(!o.capKeys.has(ck)){ o.capKeys.add(ck); o.cap+=f2n(r['UPD_95']); }
  });
  return Object.values(m).sort((a,b)=>(parseInt(a.mc.replace(/\D/g,''),10)||0)-(parseInt(b.mc.replace(/\D/g,''),10)||0));

/* ---- MCT 가공 : 지표 요약 (Worst 3) + 문제점·조치 — FAC1 지표 요약과 같은 틀 ---- */
function f2McTopDef(pred, mc, n, grp){

const F2_MKPI = [
  /* [라벨키, 합계값, 설비값, 소수, 단위, 좋은방향(+1 높을수록 좋음), 워스트 정렬] */

];
function f2McTot(L){

  a.rate=a.t?a.n/a.t*100:null; a.fgr=a.t?a.f/a.t*100:null; a.rDc=a.t?a.dc/a.t*100:null; a.rMc=a.t?a.mcN/a.t*100:null; a.ach=a.cap?a.t/a.cap*100:null;

/* 워스트 대상 설비 판정용 (값이 의미 있는 설비만) */
/* 비율 지표 순위는 생산 f2MinQty()개 이상 설비만 — 소량 생산의 한두 개 불량으로 %가 튀는 것을 막는다 */
const F2_RATIO_KPI = ['f2.k.fg','f2.k.rate','f2.k.rMc','f2.k.rDc','f2.k.ach'];
const f2MinQty = () => { try{ const v=parseInt(localStorage.getItem('stc_f2_minqty'),10); return isFinite(v)&&v>=0 ? v : 50; }catch(e){ return 50; } };
function f2SetMinQty(v){ const n=parseInt(v,10); try{ localStorage.setItem('stc_f2_minqty', String(isFinite(n)&&n>=0?n:50)); }catch(e){} setTimeout(renderF2,0); }
function f2WorstList(L, k){
  const [,,get,,,,sort] = k;
  let c = L.filter(o=>o.t>0 && get(o)!=null);
  if(F2_RATIO_KPI.includes(k[0])) c = c.filter(o=>o.t>=f2MinQty());
  if(k[0]==='f2.k.ng'||k[0]==='f2.k.rate') c = c.filter(o=>o.n>0);
  if(k[0]==='f2.k.rMc') c = c.filter(o=>o.mcN>0);
  if(k[0]==='f2.k.rDc') c = c.filter(o=>o.dc>0);
  if(k[0]==='f2.k.mat') c = c.filter(o=>o.mat>0);
  return c.slice().sort(sort).slice(0,3);
}
/* ---- 도넛 : 전설비 불량(NG) 중 Worst 3 비중 — Worst 1·2·3 만 색, 나머지는 회색 '기타' ----
   색은 dataviz 검증기 통과(대비 3:1 · CVD ΔE ≥ 15) · 조각 사이 2px 흰 간격 · 범례에 이름·수량·% 함께(색만으로 구분하지 않음) */
const F2_WCOL = ['#b91c1c','#e0701f','#3a66b8'], F2_WOTHER = '#d5dbe3';
function f2DonutSvg(items, total, center, sub){
  const R = 62, r = 40, cx = 75, cy = 75; let a0 = -Math.PI/2, paths = '';
  const pt = (rad, a) => [cx + rad*Math.cos(a), cy + rad*Math.sin(a)];
  items.filter(x=>x.v>0).forEach(x=>{
    const frac = total ? x.v/total : 0; if(frac<=0) return;
    const a1 = a0 + frac*2*Math.PI - (frac>=0.9999?0.0001:0), big = (a1-a0) > Math.PI ? 1 : 0;
    const [x0,y0]=pt(R,a0),[x1,y1]=pt(R,a1),[x2,y2]=pt(r,a1),[x3,y3]=pt(r,a0);
    paths += `<path d="M${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 ${big} 1 ${x1.toFixed(2)},${y1.toFixed(2)} L${x2.toFixed(2)},${y2.toFixed(2)} A${r},${r} 0 ${big} 0 ${x3.toFixed(2)},${y3.toFixed(2)} Z"
      fill="${x.c}" stroke="#fff" stroke-width="2"><title>${esc2(x.label)} · ${fmt(x.v)} (${(frac*100).toFixed(1)}%)</title></path>`;
    a0 = a1 + (frac>=0.9999?0.0001:0);
  });
  return `<svg viewBox="0 0 150 150" width="150" height="150" role="img" aria-label="${esc2(center)}">${paths}
    <text x="75" y="72" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">${esc2(center)}</text>
    <text x="75" y="90" text-anchor="middle" font-size="10.5" fill="#52514e">${esc2(sub)}</text></svg>`;
}
function f2DonutCard(title, items, total, unitSub){
  const legend = items.map(x=>`<div class="f2-dl"><i style="background:${x.c}"></i><span class="n">${esc2(x.label)}</span>
      <span class="v">${fmt(x.v)}</span><span class="p">${total?(x.v/total*100).toFixed(1):'0.0'}%</span>${x.sub?`<span class="s">${x.sub}</span>`:''}</div>`).join('');
  return `<div class="card f2-donut"><div class="f2-dt">${title}</div><div class="f2-dbody">${f2DonutSvg(items, total, fmt(total), unitSub)}<div class="f2-dleg">${legend}</div></div></div>`;
}
function f2WorstDonuts(pred){
  const L = f2McStats(pred), tot = L.reduce((a,o)=>a+o.n,0);
  if(!tot) return '';
  /* ① 설비별 : NG 수량 많은 순 Worst 3 */
  const byMc = L.filter(o=>o.n>0).sort((a,b)=>b.n-a.n);
  const mcItems = byMc.slice(0,3).map((o,i)=>({ label:`Worst ${i+1} · ${o.mc}`, v:o.n, c:F2_WCOL[i],
      sub:`%NG ${o.rate==null?'–':o.rate.toFixed(2)+'%'} · ${esc2([...o.parts].join(', '))}` }));
  const restMc = byMc.slice(3); if(restMc.length) mcItems.push({ label:`${T('f2.d.other')} ${restMc.length}${T('f2.d.units')}`, v:restMc.reduce((a,o)=>a+o.n,0), c:F2_WOTHER, sub:esc2(restMc.map(o=>o.mc).join(', ')) });
  /* ② 불량유형별 : 전설비 MCT NG 코드 합계 Worst 3 */
  const m = {};
  F2.det.forEach(r=>{ if(r['공정']!=='MCT' || r['구분']!=='NG' || !pred(r)) return; const k=r['불량유형']; const o=m[k]||(m[k]={t:k,g:r['계통'],v:0}); o.v+=f2n(r['수량']); });
  const types = Object.values(m).sort((a,b)=>b.v-a.v), tsum = types.reduce((a,x)=>a+x.v,0);
  const tyItems = types.slice(0,3).map((x,i)=>({ label:`Worst ${i+1} · ${x.t}`, v:x.v, c:F2_WCOL[i], sub:`${T(x.g==='다캐불량'?'f2.d.dc':x.g==='가공불량'?'f2.d.mc':'f2.d.etc')} · ${f2TypeMcs(pred, x.t)}` }));
  const restTy = types.slice(3); if(restTy.length) tyItems.push({ label:`${T('f2.d.other')} ${restTy.length}${T('f2.d.kinds')}`, v:restTy.reduce((a,x)=>a+x.v,0), c:F2_WOTHER, sub:'' });
  return `<div class="f2-dgrid">${f2DonutCard(T('f2.d.byMc'), mcItems, tot, T('f2.d.ngAll'))}${tsum?f2DonutCard(T('f2.d.byType'), tyItems, tsum, T('f2.d.ngAll')):''}</div>`;
}
/* 그 불량유형이 많이 나온 설비 (상위 2) */
function f2TypeMcs(pred, t){
  const m = {}; F2.det.forEach(r=>{ if(r['공정']==='MCT' && r['구분']==='NG' && r['불량유형']===t && pred(r)) m[r['설비명']] = (m[r['설비명']]||0) + f2n(r['수량']); });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k,v])=>`${esc2(k)} ${fmt(v)}`).join(' · ');
}
/* MCT 핵심 지표 3개 — 불량률은 한 줄로 묶고(가공·다캐는 그 안의 내역), 생산은 UPD 달성률과 함께 본다
   ① 생산 실적 : Total · FG · UPD 달성률      Worst = 달성률 낮은 순 (생산 기준 이상 설비)
   ② 불량률 %NG : NG ÷ Total = 가공 + 다캐 (+협력사·고객)   Worst = %NG 높은 순 (생산 기준 이상 설비)
   ③ Mat'l NG  : 가공 전 소재 불량 수량 · 투입 대비 %      Worst = 수량 많은 순 */
function f2McWorstTable(pred, prevPred, prevLbl){
  if(!F2.mq.length) return `<div class="card empty" style="padding:14px">${T('f2.noMq')}</div>`;
  const L = f2McStats(pred), P = prevPred ? f2McStats(prevPred) : [];
  if(!L.length) return `<div class="card empty" style="padding:14px">${T('st.noData')}</div>`;
  const A = f2McTot(L), B = P.length ? f2McTot(P) : null, mq = f2MinQty();
  const matR = a => (a.t+a.mat) ? a.mat/(a.t+a.mat)*100 : null;
  const pct = (v,dp) => v==null ? '–' : v.toFixed(dp)+'%';
  const dd = (c,p,dp,u,dir) => { if(c==null||p==null) return '–'; const d=c-p; if(Math.abs(d)<Math.pow(10,-dp)/2) return '±0';
    const good = dir>0 ? d>0 : d<0; return `<b style="color:${good?'var(--good)':'var(--critical)'}">${d>0?'+':'−'}${fmt(Math.abs(d),dp)}${u}</b>`; };
  const big = (a, lines) => `<div class="f2-kv">${a}</div>${lines.map(x=>`<div class="f2-ks">${x}</div>`).join('')}`;
  const split = a => `${T('f2.k.mcS')} ${pct(a.rMc,2)} · ${T('f2.k.dcS')} ${pct(a.rDc,2)}${(a.n-a.mcN-a.dc)>0?` · ${T('f2.k.etcS')} ${fmt(a.n-a.mcN-a.dc)}`:''}`;
  const top2 = (mc, grp) => f2McTopDef(pred, mc, 2, grp).map(x=>`${esc2(x.t)} ${fmt(x.v)}`).join(' · ');
  const ok = o => o.t >= mq;
  const W1 = L.filter(o=>ok(o) && o.ach!=null).sort((a,b)=>a.ach-b.ach).slice(0,3);
  const W2 = L.filter(o=>ok(o) && o.n>0).sort((a,b)=>b.rate-a.rate).slice(0,3);
  const W3 = L.filter(o=>o.mat>0).sort((a,b)=>b.mat-a.mat).slice(0,3);
  const wcell = (W, val) => [0,1,2].map(j=>`<td class="w w${j+1}">${W[j]?`${esc2(W[j].mc)}<br><small>${val(W[j])}</small>`:'–'}</td>`).join('');
  const det = (W, txt) => W.map((o,j)=>`<div class="kw-li"><b>${j+1}.</b> ${txt(o)}</div>`).join('') || '–';
  const st = f2St(A.rate), stp = B ? f2St(B.rate) : null;
  const rows = [
    `<tr><td class="c">1</td><td class="name">${T('f2.k2.prod')}<small>${T('f2.k2.prodS')}</small></td>
      <td class="pv">${B?big(fmt(B.t),[`FG ${fmt(B.f)}`,`${T('f2.ach')} ${pct(B.ach,1)}`]):'–'}</td>
      <td>${big(`<b>${fmt(A.t)}</b>`,[`FG ${fmt(A.f)}`,`${T('f2.ach')} <b>${pct(A.ach,1)}</b>`])}</td>
      <td>${big(dd(A.t,B&&B.t,0,'',+1),['',dd(A.ach,B&&B.ach,1,'%p',+1)])}</td>
      ${wcell(W1, o=>pct(o.ach,1))}
      <td class="dt">${det(W1, o=>`${esc2(o.mc)} ${T('f2.ach')} ${pct(o.ach,1)} <span class="f2-why">(Total ${fmt(o.t)} · ${T('f2.dayN')} ${o.days.size} · ${esc2([...o.parts].join(', '))})</span>`)}</td></tr>`,
    `<tr><td class="c">2</td><td class="name">${T('f2.k2.rate')}<small>${T('f2.k2.rateS')}</small></td>
      <td class="pv">${B?big(pct(B.rate,2),[`NG ${fmt(B.n)}`, split(B)]):'–'}</td>
      <td>${big(`<b style="color:${st.c}">${pct(A.rate,2)}</b> <small>${st.l}</small>`,[`NG ${fmt(A.n)}`, split(A)])}</td>
      <td>${big(dd(A.rate,B&&B.rate,2,'%p',-1),[dd(A.n,B&&B.n,0,'',-1), `${T('f2.k.mcS')} ${dd(A.rMc,B&&B.rMc,2,'%p',-1)} · ${T('f2.k.dcS')} ${dd(A.rDc,B&&B.rDc,2,'%p',-1)}`])}</td>
      ${wcell(W2, o=>pct(o.rate,2))}
      <td class="dt">${det(W2, o=>{ const m=top2(o.mc,'가공불량'), d=top2(o.mc,'다캐불량');
        return `${esc2(o.mc)} <b>${pct(o.rate,2)}</b> = ${T('f2.k.mcS')} ${pct(o.rMc,2)} + ${T('f2.k.dcS')} ${pct(o.rDc,2)}<br><span class="f2-why">${m?`${T('f2.k.mcS')}: ${m}`:''}${m&&d?' / ':''}${d?`${T('f2.k.dcS')}: ${d}`:''}</span>`; })}</td></tr>`,
    `<tr><td class="c">3</td><td class="name">${T('f2.k2.mat')}<small>${T('f2.k2.matS')}</small></td>
      <td class="pv">${B?big(fmt(B.mat),[pct(matR(B),2)]):'–'}</td>
      <td>${big(`<b>${fmt(A.mat)}</b>`,[pct(matR(A),2)])}</td>
      <td>${big(dd(A.mat,B&&B.mat,0,'',-1),[dd(matR(A),B&&matR(B),2,'%p',-1)])}</td>
      ${wcell(W3, o=>fmt(o.mat))}
      <td class="dt">${det(W3, o=>`${esc2(o.mc)} ${fmt(o.mat)} <span class="f2-why">(${pct(matR(o),2)} · ${esc2([...o.parts].join(', '))})</span>`)}</td></tr>`
  ].join('');
  const ex = L.filter(o=>o.t>0 && o.t<mq);
  return f2WorstDonuts(pred) + `<div class="card"><div class="tblwrap"><table class="eq f2-wk f2-k3">
    <thead><tr><th>NO</th><th>${T('f2.r.kpi')}</th><th>${esc2(prevLbl||T('f2.r.prev'))}</th><th>${T('f2.r.cur')}</th><th>${T('f2.r.delta')}</th>
      <th class="w">Worst 1</th><th class="w">Worst 2</th><th class="w">Worst 3</th><th class="dt">${T('f2.k.detail')}</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div class="legend" style="margin-top:6px;align-items:center">
      <span class="f2-noprint">${T('f2.k.minq')} <input type="number" min="0" step="10" value="${mq}" onchange="f2SetMinQty(this.value)" style="width:64px;padding:2px 5px;border:1px solid #ccd;border-radius:4px;font:inherit"> ${T('f2.k.pcs')}</span>
      ${ex.length ? `<span style="color:#b45309">${T('f2.k.excl',{n:mq})}: ${ex.map(o=>`${esc2(o.mc)} (${fmt(o.t)})`).join(', ')}</span>` : ''}
      <span>${T('f2.k2.note',{t:f2Target()})}</span></div></div>`;
}
/* 문제점·조치 — 불량률(%NG) 워스트와 UPD 달성률 워스트에 나온 설비를 한 번씩만 */

    f2WorstList(L, k).forEach((o,j)=>{ (tags[o.mc] = tags[o.mc] || []).push(T(k[0]+'S')+'①②③'[j]); }); });

/* 품번 선택 칩 */

/* ---- FAC2 탭 — 왼쪽 메뉴: 현황 / 일일·주간·월간 품질보고 ---- */

  { id:'daily', icon:'📅', sec:'f2.sec.rep' },
  { id:'week',  icon:'📄', sec:'f2.sec.rep' },
  { id:'month', icon:'🗂️', sec:'f2.sec.rep' }

let F2_VIEW = (()=>{ try{ return localStorage.getItem('stc_f2_view') || 'dash'; }catch(e){ return 'dash'; } })();
const F2_SEL = { daily:'', week:'', month:'', part:'' };
function f2SetView(v){ F2_VIEW = v; try{ localStorage.setItem('stc_f2_view', v); }catch(e){} renderF2(); }

const f2AddDays = (s,n) => { const d = new Date(s+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const f2DayDiff = (a,b) => Math.round((new Date(b+'T00:00:00Z') - new Date(a+'T00:00:00Z'))/86400000);
function f2Range(){ try{ return JSON.parse(localStorage.getItem('stc_f2_drange')||'null') || {}; }catch(e){ return {}; } }
function f2SetRange(from, to){
  const r = f2Range(); const ds = f2Dates(), last = ds[ds.length-1];
  if(from) r.from = from; if(to) r.to = to;
  if(!r.from) r.from = r.to || last; if(!r.to) r.to = r.from || last;
  try{ localStorage.setItem('stc_f2_drange', JSON.stringify(r)); }catch(e){}
  setTimeout(renderF2,0);   /* change 이벤트 안에서 바로 다시 그리면 blur 와 겹쳐 오류가 난다 */
}
/* 빠른 선택: 최근일 · 최근 3일 · 최근 7일 · 이번 주(시트 주차) · 이번 달 — 모두 데이터 마지막 날 기준 */
function f2Quick(q){
  const ds = f2Dates(); if(!ds.length) return; const last = ds[ds.length-1];
  let from = last;
  if(q==='d3') from = f2AddDays(last,-2);
  else if(q==='d7') from = f2AddDays(last,-6);
  else if(q==='wk'){ const w = (F2.pd.find(r=>r['일자']===last)||{})['주차']; const inW = ds.filter(d=>F2.pd.some(r=>r['일자']===d && r['주차']===w)); from = inW[0] || last; }
  else if(q==='mo') from = last.slice(0,8)+'01';
  try{ localStorage.setItem('stc_f2_drange', JSON.stringify({from, to:last})); }catch(e){}
  renderF2();
}

function renderF2(){
  const host = document.getElementById('panel-f2ov'); if(!host) return;
  const week = document.getElementById('weekSel').value;
  const y = host.querySelector('.f2-main') ? host.querySelector('.f2-main').scrollTop : 0;
  let secPrev = '';
  const side = `<aside class="f2-side">` + F2_VIEWS.map(v=>{
      const h = v.sec!==secPrev ? `<div class="f2-sec">${T(v.sec)}</div>` : ''; secPrev = v.sec;
      return h + `<button class="${v.id===F2_VIEW?'on':''}" onclick="f2SetView('${v.id}')"><span class="ic">${v.icon}</span>${T('f2.v.'+v.id)}</button>`;
    }).join('') + `</aside>`;
  const st = f2Status();
  let body;
  if(st) body = `<div class="sec-title">${T('grp.fac2')} · ${week||''}</div>${st}`;
  else if(F2_VIEW==='dash') body = f2Dash(week);
  else body = f2Report(F2_VIEW, week);
  host.innerHTML = `<div class="f2-wrap">${side}<div class="f2-main"><div class="ov">${body}</div></div></div>`;
  const main = host.querySelector('.f2-main'); if(main) main.scrollTop = y;
  host.querySelectorAll('textarea[data-f2note]').forEach(el=>{
    const grow = ()=>{ el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; }; grow();
    el.addEventListener('input', ()=>{ grow(); try{ localStorage.setItem('stc_f2_note_'+el.dataset.f2note, el.value); }catch(e){} });
  });
}

/* ---- 현황 (선택 주차 · KPI MCT 화면과 같은 구성) ---- */
function f2Dash(week){
  const weeks = f2Weeks(), i = weeks.indexOf(week), pw = i>0 ? weeks[i-1] : null;
  const pred = r=>r['주차']===week, s = f2Sum(pred), p = pw ? f2Sum(r=>r['주차']===pw) : null;
  if(!s.days.length) return `<div class="sec-title">${T('grp.fac2')} · ${week}</div><div class="card empty">${T('f2.noWeek',{w:week})}<br>${T('f2.have',{a:weeks[0]||'-',b:weeks[weeks.length-1]||'-'})}</div>`;
  const ow = [...new Set(F2.pd.filter(pred).map(r=>r['원본주차']).filter(Boolean))].join(', ');
  const chips = f2PartChips(s), pt = chips.cur;
  const trW = weeks.slice(Math.max(0,(i<0?weeks.length:i+1)-12), i<0?weeks.length:i+1);
  const top1 = pt ? f2TopN(pred, 'MCT', pt.no, null, 1)[0] : null;
  const part = pt ? { no:pt.no, name:pt.name, topName: top1 ? top1.t : null } : null;
  const trend = trW.map(w=>{ const pr = r=>r['주차']===w; const o = { k:w, s:f2Sum(pr) };
    if(part && part.topName) o.topCnt = F2.det.filter(r=>pr(r) && r['공정']==='MCT' && r['구분']==='NG' && r['Part no.']===part.no && r['불량유형']===part.topName).reduce((a,r)=>a+f2n(r['수량']),0);
    return o; });
  return `
    <div class="sec-title">${T('grp.fac2')} · ${week}${ow?` (${T('f2.orig')} ${esc2(ow)})`:''} · ${s.days[0]} ~ ${s.days[s.days.length-1]} · ${T('u.days',{n:s.days.length})}</div>
    ${f2KpiRow('MCT', s.MCT, p && p.MCT)}
    ${f2KpiRow('OQC', s.OQC, p && p.OQC)}
    <div class="sec-title">${T('f2.mwk')}</div>${f2McWorstTable(pred, pw?(r=>r['주차']===pw):null, pw)}
    <div class="sec-title">${T('f2.parts')}</div>${f2PartTable(s)}
    <div class="sec-title">${T('f2.mcs')}</div>${f2McTable(pred)}
    <div class="sec-title">${T('f2.top5')}</div>${chips.html}${pt?f2Top5Lists(pred, pt):''}
    <div class="sec-title">${T('f2.trend12')}${part&&part.topName?` · ${esc2(part.name)} ${T('f2.top1')} “${esc2(part.topName)}”`:''}</div>
    ${f2TrendTable(trend, T('ctl.week'), week, part)}
    <div class="foot">${T('f2.f1')}<br>${T('f2.f2')}<br>${T('f2.f3',{t:f2Target()})}</div>`;
}

/* ---- 일일 / 주간 / 월간 품질보고 ---- */
function f2Report(kind, topWeek){
  const dates = f2Dates(), weeks = f2Weeks(), months = [...new Set(dates.map(d=>d.slice(0,7)))].sort();
  let opts, cur, pred, prevKey, prevPred, label, trend = [], trendLbl = '';
  const mon = r => String(r['일자']).slice(0,7);
  let dFrom = '', dTo = '';
  if(kind==='daily'){
    /* 기간 선택 (시작일~종료일) — 비교 = 바로 앞의 같은 일수 (하루만 고르면 직전 작업일) */
    const first = dates[0], last = dates[dates.length-1];
    const rg = f2Range(); dFrom = rg.from || last; dTo = rg.to || last;
    if(dFrom < first) dFrom = first; if(dTo > last) dTo = last; if(dFrom > dTo){ const x = dFrom; dFrom = dTo; dTo = x; }
    const n = f2DayDiff(dFrom, dTo) + 1;
    cur = n===1 ? dFrom : `${dFrom}~${dTo}`; opts = [];
    pred = r=>r['일자']>=dFrom && r['일자']<=dTo;
    if(n===1){ const i = dates.indexOf(dFrom); prevKey = i>0 ? dates[i-1] : null; prevPred = r=>r['일자']===prevKey; }
    else { const pf = f2AddDays(dFrom,-n), pt = f2AddDays(dFrom,-1); prevKey = `${pf} ~ ${pt}`; prevPred = r=>r['일자']>=pf && r['일자']<=pt; }
    const inR = dates.filter(d=>d>=dFrom && d<=dTo);
    label = n===1 ? dFrom : `${dFrom} ~ ${dTo} · ${T('u.days',{n})} (${T('f2.workDays',{n:inR.length})})`;
    if(inR.length > 1){ trendLbl = T('f2.byDay'); trend = inR.map(d=>({k:d, s:f2Sum(r=>r['일자']===d)})); }
    else { const i = dates.indexOf(dTo); trendLbl = T('f2.last7'); trend = dates.slice(Math.max(0,i-6), i+1).map(d=>({k:d, s:f2Sum(r=>r['일자']===d)})); }
  } else if(kind==='week'){
    cur = F2_SEL.week && weeks.includes(F2_SEL.week) ? F2_SEL.week : (weeks.includes(topWeek) ? topWeek : weeks[weeks.length-1]);
    opts = weeks.slice().reverse(); pred = r=>r['주차']===cur;
    const i = weeks.indexOf(cur); prevKey = i>0 ? weeks[i-1] : null; prevPred = r=>r['주차']===prevKey;
    const ds = dates.filter(d=>F2.pd.some(r=>r['일자']===d && r['주차']===cur));
    const ow = [...new Set(F2.pd.filter(pred).map(r=>r['원본주차']).filter(Boolean))].join(', ');
    label = `${cur}${ow?` (${T('f2.orig')} ${ow})`:''} · ${ds[0]||''} ~ ${ds[ds.length-1]||''}`;
    trendLbl = T('f2.byDay'); trend = ds.map(d=>({k:d, s:f2Sum(r=>r['일자']===d)}));
  } else {
    cur = F2_SEL.month && months.includes(F2_SEL.month) ? F2_SEL.month : months[months.length-1];
    opts = months.slice().reverse(); pred = r=>mon(r)===cur;
    const i = months.indexOf(cur); prevKey = i>0 ? months[i-1] : null; prevPred = r=>mon(r)===prevKey; label = cur;
    const ws = weeks.filter(w=>F2.pd.some(r=>r['주차']===w && mon(r)===cur));
    trendLbl = T('f2.byWeek'); trend = ws.map(w=>({k:w, s:f2Sum(r=>r['주차']===w && mon(r)===cur)}));
  }
  const selKey = kind==='daily'?'daily':kind==='week'?'week':'month';
  const s = f2Sum(pred), p = prevKey ? f2Sum(prevPred) : null;
  const noteKey = kind+'_'+cur;
  let note = ''; try{ note = localStorage.getItem('stc_f2_note_'+noteKey) || ''; }catch(e){}
  const periodCtl = kind==='daily'
    ? `<label>${T('f2.r.period')} <input type="date" class="f2-date" value="${dFrom}" min="${dates[0]}" max="${dates[dates.length-1]}" onchange="f2SetRange(this.value, null)"></label>
       <span>~</span><input type="date" class="f2-date" value="${dTo}" min="${dates[0]}" max="${dates[dates.length-1]}" onchange="f2SetRange(null, this.value)">
       <span class="f2-quick">${['d1','d3','d7','wk','mo'].map(q=>`<button onclick="f2Quick('${q}')">${T('f2.q.'+q)}</button>`).join('')}</span>`
    : `<label>${T('f2.r.period')} <select onchange="f2SetSel('${selKey}', this.value)">${opts.map(o=>`<option${o===cur?' selected':''}>${o}</option>`).join('')}</select></label>`;
  const bar = `<div class="f2-rbar f2-noprint">
      ${periodCtl}
      <span class="f2-cmp">${T('f2.r.vs')} <b>${prevKey||'–'}</b> · ${T('f2.target')} ${f2Target()}%</span>
      <button class="btn-f2" onclick="window.print()">${T('f2.r.print')}</button></div>`;
  if(!s.days.length) return bar + `<div class="card empty">${T('st.noData')}</div>`;
  const dl = (c,pv,dp,u,goodDown) => { if(c==null||pv==null) return '–'; const d=c-pv; if(Math.abs(d)<Math.pow(10,-dp)/2) return '±0';
    const good = goodDown ? d<0 : d>0; return `<b style="color:${good?'var(--good)':'var(--critical)'}">${d>0?'+':'−'}${fmt(Math.abs(d),dp)}${u}</b>`; };
  const kv = (a,k) => !a ? null : k==='r' ? f2Rate(a) : a[k];
  const KP = [["Total Q'ty",'t',0,'',false],["FG Q'ty",'f',0,'',false],["NG Q'ty",'n',0,'',true],['% NG','r',2,'%p',true],["Mat'l NG",'m',0,'',true]];
  const cellV = (a,k,dp) => { const v = kv(a,k); if(v==null) return '–'; if(k==='r'){ const st=f2St(v); return `<span style="color:${st.c};font-weight:700">${v.toFixed(2)}%</span> <small>${st.l}</small>`; } return fmt(v,0); };
  const rows = KP.map(([lab,k,dp,u,gd])=>`<tr><td class="name">${lab}</td>` + F2_PROCS.map(pc=>{
      if(k==='m' && pc==='OQC') return `<td colspan="3" style="text-align:center;color:var(--ink-muted)">—</td>`;
      const a = s[pc], b = p ? p[pc] : null;
      return `<td>${b?cellV(b,k,dp):'–'}</td><td><b>${cellV(a,k,dp)}</b></td><td>${dl(kv(a,k), b?kv(b,k):null, dp, u, gd)}</td>`; }).join('') + `</tr>`).join('');
  /* 품번별 TOP5 (텍스트) */
  const t5 = (proc, pt, grp) => { const L = f2TopN(pred, proc, pt.no, grp, 5); return L.length ? L.map(x=>`${esc2(x.t)} <b>${fmt(x.v)}</b>`).join(' · ') : '–'; };
  const t5rows = [];
  s.partList.forEach(pt=>F2_PROCS.forEach(pc=>{ if(pt[pc].n>0) t5rows.push(`<tr><td class="name">${esc2(pt.name)}</td><td>${T('f2.p.'+pc)}</td><td>${fmt(pt[pc].n)}</td>
      <td style="color:${f2St(f2Rate(pt[pc])).c};font-weight:700">${f2pc(pt[pc])}</td><td class="t5">${t5(pc,pt,'다캐불량')}</td><td class="t5">${t5(pc,pt,'가공불량')}</td></tr>`); }));
  return bar + `
    <div class="f2-rhead"><h2>${T('f2.r.title.'+kind)}</h2>
      <div>${esc2(label)} · ${T('f2.r.vs')} ${esc2(prevKey||'–')}<br><small>${T('f2.r.made',{d:new Date().toISOString().slice(0,10)})}</small></div></div>
    <div class="sec-title">1. ${T('f2.mwk')}</div>${f2McWorstTable(pred, prevKey?prevPred:null, prevKey)}
    <div class="sec-title">2. ${T('f2.issues')}</div>${f2McIssues(pred, noteKey)}
    <div class="sec-title">3. ${T('f2.procSum')} <span style="text-transform:none;font-weight:600">(${T('f2.target')} %NG ≤ ${f2Target()}%)</span></div>
    <div class="card"><div class="tblwrap"><table class="eq f2-pt">
      <thead><tr><th rowspan="2">${T('f2.r.kpi')}</th><th colspan="3" class="grp">${T('f2.p.MCT')}</th><th colspan="3" class="grp">${T('f2.p.OQC')}</th></tr>
        <tr><th>${T('f2.r.prev')}</th><th>${T('f2.r.cur')}</th><th>${T('f2.r.delta')}</th><th>${T('f2.r.prev')}</th><th>${T('f2.r.cur')}</th><th>${T('f2.r.delta')}</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>
    <div class="sec-title">4. ${T('f2.parts')}</div>${f2PartTable(s)}
    <div class="sec-title">5. ${T('f2.mcs')}</div>${f2McTable(pred)}
    <div class="sec-title">6. ${T('f2.top5r')}</div>
    <div class="card"><div class="tblwrap"><table class="eq f2-pt f2-t5t">
      <thead><tr><th>PART NAME</th><th>${T('f2.proc')}</th><th>NG</th><th>% NG</th><th>${T('f2.g.다캐불량')} TOP5</th><th>${T('f2.g.가공불량')} TOP5</th></tr></thead>
      <tbody>${t5rows.join('') || `<tr><td colspan="6" class="empty">${T('st.noData')}</td></tr>`}</tbody></table></div></div>
    ${trend.length ? `<div class="sec-title">7. ${trendLbl}</div>${f2TrendTable(trend, kind==='month'?T('ctl.week'):T('f2.date'), kind==='daily'?cur:null, null)}` : ''}
    <div class="sec-title">${trend.length?8:7}. ${T('f2.r.note')}</div>
    <div class="card"><textarea class="f2-note" data-f2note="${esc2(noteKey)}" placeholder="${T('f2.r.noteph')}">${esc2(note)}</textarea></div>
    <div class="foot">${T('f2.f2')}<br>${T('f2.f3',{t:f2Target()})}</div>`;
}

/* =========================================================================
   6. 탭 (원본 페이지는 최초 열 때만 iframe 으로 로드)
   ========================================================================= */
let activeTab = 'overview';

function buildTabs(){
  const gb=document.getElementById('grpBar'), bar=document.getElementById('tabBar'), main=document.getElementById('main');
  GROUPS.forEach((g,i)=>{
    const b=document.createElement('button'); b.setAttribute('role','tab'); b.dataset.grp=g;
    b.innerHTML=`<span class="gno">${i+1}</span><span data-i18n="grp.${g}">${T('grp.'+g)}</span>`;
    b.onclick=()=>selectGroup(g); gb.appendChild(b);
  });
  for(const t of TABS){
    if(t.sep){ const s=document.createElement('div'); s.className='tab-sep'; s.dataset.g=t.g; bar.appendChild(s); continue; }
    const b=document.createElement('button');
    b.setAttribute('role','tab'); b.dataset.tab=t.id; b.dataset.g=t.g; b.dataset.i18n='tab.'+t.id;
    b.textContent=T('tab.'+t.id);
    b.setAttribute('aria-selected', t.id===activeTab ? 'true':'false');
    if(t.tool) b.classList.add('tool');
    b.onclick=()=>selectTab(t.id);
    bar.appendChild(b);

    const p=document.createElement('section');
    p.className='panel'+(t.src?' frame':''); p.id='panel-'+t.id;
    p.dataset.active = t.id===activeTab ? 'true':'false';
    if(t.src) p.innerHTML=`<div class="frame-msg"><div class="spinner"></div><div data-frameload="${t.id}">${T('st.frameLoading',{name:T('tab.'+t.id)})}</div></div>`;
    main.appendChild(p);
  }
  showGroup(groupOf(activeTab));
}
const groupOf = id => { const t=TABS.find(x=>x.id===id); return t ? t.g : 'all'; };
function showGroup(g){
  document.querySelectorAll('#grpBar button').forEach(b=>b.setAttribute('aria-selected', b.dataset.grp===g ? 'true':'false'));
  document.querySelectorAll('#tabBar > *').forEach(el=>el.classList.toggle('hid', el.dataset.g!==g));
}
/* 묶음을 누르면 그 묶음에서 마지막으로 보던 탭(없으면 첫 탭)을 연다 */
function selectGroup(g){
  let last=null; try{ last=(JSON.parse(localStorage.getItem('stc_portal_gtab')||'{}'))[g]; }catch(e){}
  const t = TABS.find(x=>x.id===last && x.g===g) || TABS.find(x=>x.g===g && !x.sep);
  if(t) selectTab(t.id);
}

function selectTab(id){
  activeTab=id;
  const g = groupOf(id); showGroup(g);
  document.querySelectorAll('#tabBar button').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===id ? 'true':'false'));
  document.querySelectorAll('.panel').forEach(p=>p.dataset.active = p.id==='panel-'+id ? 'true':'false');
  try{ localStorage.setItem('stc_portal_tab', id);
       const m=JSON.parse(localStorage.getItem('stc_portal_gtab')||'{}'); m[g]=id; localStorage.setItem('stc_portal_gtab', JSON.stringify(m)); }catch(e){}
  const t=TABS.find(x=>x.id===id);
  if(t && t.src) ensureFrame(t);
  if(id==='f2ov') renderF2();
}

function ensureFrame(t){
  const panel=document.getElementById('panel-'+t.id);
  if(panel.querySelector('iframe')) return;
  const f=document.createElement('iframe');
  /* 캐시 무효화 — iframe 안 페이지는 Ctrl+F5 로도 새로 받지 않는 경우가 많다.
     통합 대시보드를 열 때마다 주소 끝에 버전 표식을 붙여 항상 최신 파일을 받게 한다. */
  f.title=T('tab.'+t.id); f.loading='lazy';
  f.src = t.src + (t.src.indexOf('?') >= 0 ? '&' : '?') + 'v=' + PORTAL_BUILD;
  if(t.noWeek) f.dataset.noweek='1';
  f.onload=()=>{ const m=panel.querySelector('.frame-msg'); if(m) m.remove();
                 syncWeekToFrame(f); syncLangToFrame(f); };
  f.onerror=()=>{ panel.innerHTML='<div class="frame-msg">'+T('st.frameErr',{name:T('tab.'+t.id),src:t.src})+'</div>'; };
  panel.appendChild(f);
}

/* 같은 도메인(cdrty435-hub.github.io)이라 셸에서 각 페이지의 주차 선택을 맞춰줄 수 있다.
   페이지마다 구조가 달라 '되면 맞추고, 안 되면 조용히 넘어가는' 최선노력 방식이다. */
function syncWeekToFrame(frame, tries){
  if(!document.getElementById('syncChk').checked) return;
  if(frame.dataset.noweek) return;
  tries = tries||0;
  const week=document.getElementById('weekSel').value;
  let doc=null;
  try{ doc = frame.contentDocument; }catch(e){ return; }
  if(!doc) return;
  const sel = doc.getElementById('weekSelect') || doc.querySelector('select[id*="eek"]');
  if(sel && [...sel.options].some(o=>o.value===week)){
    if(sel.value!==week){ sel.value=week; sel.dispatchEvent(new Event('change',{bubbles:true})); }
    return;
  }
  if(tries<12) setTimeout(()=>syncWeekToFrame(frame,tries+1), 500);
}
function syncWeekToAllFrames(){ document.querySelectorAll('.panel iframe').forEach(f=>syncWeekToFrame(f)); }

/* ---------- 언어 전파 ----------
   · 품질 6σ  : 전역 setLang('ko'|'th'|'en') 을 그대로 호출한다.
   · MTTR/MTBF: 한국어/태국어 2개뿐이라 #wkLang 버튼을 누른다(영어는 한국어로 둔다).
   · 나머지 페이지(주간 OEE·금형·Loss·기간별·변환기)는 원본이 한국어 전용이라 대상이 아니다.
   또한 자식들이 쓰는 localStorage 키를 미리 써 두므로, 아직 열지 않은 탭도
   나중에 열릴 때 바로 해당 언어로 뜬다(같은 도메인 = 같은 localStorage). */
function writeChildLangPrefs(){
  try{ localStorage.setItem('stc_oee_lang', LANG); }catch(e){}            // 품질 6σ
  try{ localStorage.setItem('stc_wk_lang', LANG==='th'?'th':'ko'); }catch(e){} // MTTR/MTBF
}
function syncLangToFrame(frame, tries){
  tries = tries||0;
  let win=null, doc=null;
  try{ win=frame.contentWindow; doc=frame.contentDocument; }catch(e){ return; }
  if(!doc) return;
  let done=false;
  try{ if(typeof win.setLang === 'function'){ win.setLang(LANG); done=true; } }catch(e){}
  if(!done){
    try{
      const want = (LANG==='th') ? 'th' : 'ko';
      const btn = doc.querySelector('#wkLang button[data-lang="'+want+'"]');
      if(btn){ btn.click(); done=true; }
    }catch(e){}
  }
  if(!done && tries<10) setTimeout(()=>syncLangToFrame(frame,tries+1), 500);
}
function syncLangToAllFrames(){ document.querySelectorAll('.panel iframe').forEach(f=>syncLangToFrame(f)); }

/* =========================================================================
   7. 언어 적용
   ========================================================================= */
function applyStaticI18n(){
  document.documentElement.lang = LANG;
  document.title = T('app.title');
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll('#langSwitch button').forEach(b=>
    b.setAttribute('aria-pressed', b.dataset.lang===LANG ? 'true':'false'));
  document.querySelectorAll('[data-frameload]').forEach(el=>{
    el.textContent = T('st.frameLoading',{name:T('tab.'+el.dataset.frameload)});
  });
}
function setLang(lang){
  if(LANGS.indexOf(lang)<0) return;
  LANG = lang;
  try{ localStorage.setItem(LANG_KEY, LANG); }catch(e){}
  writeChildLangPrefs();
  applyStaticI18n();
  renderOverview();
  renderF2();
  refreshStatus();
  syncLangToAllFrames();
}

/* =========================================================================
   8. 로드
   ========================================================================= */
let LAST = null;   // 마지막 로드 결과(언어 전환 시 상태줄을 다시 그리기 위해)

function setStatus(html){ document.getElementById('hdStatus').innerHTML=html; }
function refreshStatus(){
  if(!LAST) { setStatus(T('st.loading')); return; }
  if(LAST.error){ setStatus('<b>'+T('st.failed')+'</b>'); return; }
  /* 시각도 선택 언어의 로캘로 '그때그때' 포맷한다(문자열을 캐시하면 언어 전환 시 굳는다). */
  const tm = LAST.at.toLocaleTimeString(LOCALE[LANG],{hour:'2-digit',minute:'2-digit'});
  setStatus(`<b>${T('st.weeks',{n:LAST.weeks})}</b> · ${T('st.rows',{a:fmt(LAST.a),p:fmt(LAST.p),q:fmt(LAST.q)})}<br>${T('st.asof',{t:tm})}`);
}

async function fetchCSV(gid){
  const res = await fetch(sheetCsvUrl(gid), {cache:'no-store'});
  if(!res.ok) throw new Error(`시트(gid=${gid}) 응답 오류 ${res.status}`);
  return parseCSV(await res.text());
}

function populateWeeks(){
  const weeks=[...new Set(RAW.a.map(r=>r['주차']).filter(Boolean))]
    .sort((a,b)=>{ const na=parseInt(String(a).replace(/\D/g,''),10), nb=parseInt(String(b).replace(/\D/g,''),10);
                   return (isNaN(na)||isNaN(nb)) ? String(a).localeCompare(String(b)) : na-nb; });
  const sel=document.getElementById('weekSel');
  const keep=sel.value;
  sel.innerHTML = weeks.map(w=>`<option value="${w}">${w}</option>`).join('');
  if(weeks.indexOf(keep)>=0) sel.value=keep;
  else if(weeks.length) sel.value = weeks[weeks.length-1];
  return weeks;
}

async function loadAll(){
  const btn=document.getElementById('btnRefresh');
  btn.disabled=true; LAST=null; refreshStatus();
  loadF2();                                   /* FAC2 는 따로 읽는다 — 없어도 FAC1 은 그대로 뜬다 */
  try{
    const [a,p,q] = await Promise.all([fetchCSV(GID_A), fetchCSV(GID_P), fetchCSV(GID_Q)]);
    RAW={a,p,q};
    const weeks=populateWeeks();
    renderOverview();
    LAST={weeks:weeks.length,a:a.length,p:p.length,q:q.length,at:new Date()};
    refreshStatus();
  }catch(e){
    console.error(e);
    LAST={error:true}; refreshStatus();
    document.getElementById('panel-overview').innerHTML =
      `<div class="ov"><div class="err">${T('err.sheet',{msg:e.message})}</div></div>`;
  }finally{ btn.disabled=false; }
}

/* init */
buildTabs();
writeChildLangPrefs();
applyStaticI18n();
try{
  const saved=localStorage.getItem('stc_portal_tab');
  if(saved && TABS.some(t=>t.id===saved)) selectTab(saved);
}catch(e){}
document.getElementById('weekSel').addEventListener('change', ()=>{ renderOverview(); renderF2(); syncWeekToAllFrames(); });
document.getElementById('scopeSel').addEventListener('change', renderOverview);
document.getElementById('btnRefresh').addEventListener('click', loadAll);
document.getElementById('syncChk').addEventListener('change', e=>{ if(e.target.checked) syncWeekToAllFrames(); });
document.querySelectorAll('#langSwitch button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
loadAll();
</script>
