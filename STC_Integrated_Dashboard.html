*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{

header{

/* 언어 선택 */
#langSwitch{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:5px;overflow:hidden;}

  appearance:none;border:none;background:rgba(255,255,255,.08);color:#fff;

  display:flex; overflow-x:auto; flex:0 0 auto; padding:0 12px; scrollbar-width:thin;
}

  appearance:none;border:none;background:none;font-family:inherit;
  padding:11px 15px 9px;font-size:13px;font-weight:600;color:var(--ink-2);

}

main{flex:1 1 auto;position:relative;overflow:hidden;}
.panel{position:absolute;inset:0;display:none;}
.panel[data-active="true"]{display:block;}
.panel.frame iframe{width:100%;height:100%;border:none;display:block;background:var(--plane);}

function T(key, vars){
  /* 빈 문자열도 정상적인 번역이다(예: 영어에서 '건'에 해당하는 단위는 없음).
     truthy 검사로 폴백하면 한국어가 새어 나오므로 키 존재 여부로 판단한다. */
  const tbl = I18N[LANG] || {};
  let s = Object.prototype.hasOwnProperty.call(tbl,key) ? tbl[key]
        : (Object.prototype.hasOwnProperty.call(I18N.ko,key) ? I18N.ko[key] : key);
  if(vars) for(const k in vars) s = s.split('{'+k+'}').join(vars[k]);
  return s;
}

/* MTTR/MTBF 기본 판정기준 — MTTR 대시보드의 UDT_DEFAULT(12종) 그대로. */
const UDT_DEFAULT = ['설비수리','취출기수리','스프레이수리','래들수리',

/* =========================================================================
   3. CSV 파싱 / 숫자 — 주간 OEE 대시보드와 동일 구현
   ========================================================================= */
function parseCSV(text){
  const rows=[]; let row=[],field='',inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; } else field+=c; }
    else{
      if(c==='"') inQ=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\r'){}
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  const header=rows[0]||[];
  return rows.slice(1)
    .filter(r=>!(r.length===1&&r[0]===''))
    .map(r=>{ const o={}; header.forEach((h,i)=>o[h]=r[i]); return o; });
}
const num = v => { const n=parseFloat(v); return isNaN(n)?0:n; };
const eqOf = r => String(r['설비명']||'').trim();
const hasCol = (rows,name) => rows.length>0 && Object.prototype.hasOwnProperty.call(rows[0],name);

function shiftMinutesOf(r){
  for(const k of ['쉬프트시간_분','쉬프트시간(분)','쉬프트시간 (분)','쉬프트시간']){
    const v=r[k];
    if(v!==undefined&&v!==null&&String(v).trim()!=='') return num(v);
  }
  return num(r['계획시간_분']);
}

/* 시그마 — 품질 6σ 대시보드의 invNorm(Acklam) + 1.5σ shift 그대로 */
function invNorm(p){
  if(p<=0) return -Infinity; if(p>=1) return Infinity;
  const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00];
  const b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01];
  const c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00];
  const d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
  const plow=0.02425, phigh=1-plow; let q,r;
  if(p<plow){ q=Math.sqrt(-2*Math.log(p));
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if(p<=phigh){ q=p-0.5; r=q*q;
    return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1); }
  q=Math.sqrt(-2*Math.log(1-p));
  return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
}
const sigmaFromPPM = ppm => ppm==null ? null : invNorm(Math.max(1e-9,Math.min(1-1e-9,1-ppm/1e6)))+1.5;

/* 표시 헬퍼 — 숫자 표기는 선택 언어의 로캘을 따른다 */
const fmt  = (v,d=0) => v==null||!isFinite(v) ? '–'
  : v.toLocaleString(LOCALE[LANG],{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtK = v => v==null||!isFinite(v) ? '–'
  : (v>=1e6 ? (v/1e6).toFixed(1)+'M' : v>=10000 ? Math.round(v/1000)+'K' : fmt(v));
function statusOf(v,th){
  if(v==null||!isFinite(v)) return {c:'var(--ink-muted)',label:'–',icon:'–'};
  if(v>=th.good) return {c:'var(--good)',    label:T('g.good'),     icon:'●'};
  if(v>=th.warn) return {c:'var(--warning)', label:T('g.warn'),     icon:'▲'};
  if(v>=th.bad)  return {c:'var(--serious)', label:T('g.serious'),  icon:'▲'};
  return              {c:'var(--critical)', label:T('g.critical'), icon:'■'};
}

/* =========================================================================
   4. 집계 — 주간 OEE 대시보드의 computeA/computeP/computeQ 와 동일 정의
      A = Σ가동시간 ÷ Σ쉬프트시간 · P = 성능(P)열 단순평균 · Q = ΣGood ÷ ΣTotal
      OEE = A × P × Q ÷ 10,000
   ========================================================================= */
let RAW = { a:[], p:[], q:[] };
const inScope = (r,scope) => scope!=='regular' || r['구분']==='정규';
const keepEq  = r => { const e=eqOf(r); return e && !EXCLUDE_EQ.has(e); };

function aggregate(week, scope){
  const fa = RAW.a.filter(r=>r['주차']===week && inScope(r,scope) && keepEq(r));
  const fp = RAW.p.filter(r=>r['주차']===week && inScope(r,scope) && keepEq(r));
  const fq = RAW.q.filter(r=>r['주차']===week && inScope(r,scope) && keepEq(r));

  let plan=0, run=0, loss=0, nof=0, nofRows=0, udt=0;
  const udtCols = UDT_DEFAULT.filter(c=>hasCol(RAW.a,c));
  for(const r of fa){
    plan += shiftMinutesOf(r); run += num(r['가동시간_분']); loss += num(r['Losstime_분']);
    const nv = r['NOF'];
    if(nv!==undefined && String(nv).trim()!==''){ nof += num(nv); nofRows++; }
    for(const c of udtCols) udt += num(r[c]);
  }
  const A = plan>0 ? run/plan*100 : null;

  let psum=0, pcnt=0;
  for(const r of fp){
    const raw=r['성능(P)'];
    if(raw===undefined||raw===null||String(raw).trim()==='') continue;
    const v=num(raw); if(!v) continue;
    psum+=v; pcnt++;
  }
  const P = pcnt>0 ? psum/pcnt : null;

  let good=0,total=0,bad=0,warm=0,qcnt=0;
  const hasWarmSplit = hasCol(RAW.q,'Warm(STD)') && hasCol(RAW.q,'Warm(Excess)');
  for(const r of fq){
    const t=num(r['Qty_Total']); if(t<=0) continue;
    qcnt++;
    total+=t; good+=num(r['Qty_Good']); bad+=num(r['불량수량']);
    warm += hasWarmSplit ? (num(r['Warm(STD)'])+num(r['Warm(Excess)'])) : num(r['웜샷']);
  }
  const Q = total>0 ? good/total*100 : null;
  const ppm = total>0 ? bad/total*1e6 : null;
  const OEE = (A!=null&&P!=null&&Q!=null) ? A*P*Q/10000 : null;
  const MTBF = nof>0 ? (run/60)/nof : null;
  const MTTR = nof>0 ? (udt/60)/nof : null;
  const dates = [...new Set(fa.map(r=>r['일자']).filter(Boolean))].sort();

  return { A,P,Q,OEE, plan,run,loss, nof,nofRows,udt,udtCols,
           good,total,bad,warm,ppm, sigma:sigmaFromPPM(ppm),
           MTBF,MTTR, dates, rowsP:pcnt, rowsQ:qcnt, hasWarmSplit,
           byEq: byEquipment(fa,fq) };
}

function byEquipment(fa,fq){
  const m = {};
  const get = e => (m[e] = m[e] || {eq:e,plan:0,run:0,loss:0,nof:0,total:0,good:0,bad:0});
  for(const r of fa){
    const o=get(eqOf(r));
    o.plan+=shiftMinutesOf(r); o.run+=num(r['가동시간_분']); o.loss+=num(r['Losstime_분']);
    const nv=r['NOF']; if(nv!==undefined&&String(nv).trim()!=='') o.nof+=num(nv);
  }
  for(const r of fq){
    const t=num(r['Qty_Total']); if(t<=0) continue;
    const o=get(eqOf(r)); o.total+=t; o.good+=num(r['Qty_Good']); o.bad+=num(r['불량수량']);
  }
  return Object.values(m).map(o=>({

/* 설비별 가공 실적 (MCT) — F2_MCT_Q 원본 행 기준

   원본 actual yield(실제수율)를 설비·기간으로 합친 값과 같다. */
function f2McSum(pred){
  const m = {};
  F2.mq.forEach(r=>{ if(!pred(r)) return;
    const k = r['설비명'] || '-';
    const o = m[k] || (m[k] = { mc:k, days:new Set(), parts:new Set(), ops:new Set(), t:0, f:0, n:0, dc:0, mcN:0, mat:0, cap:0, capKeys:new Set() });
    o.days.add(r['일자']); if(r['Part name']||r['Part no.']) o.parts.add(f2PartLbl(r)); if(r['OP']) o.ops.add(r['OP']);
    o.t+=f2n(r['생산수량']); o.f+=f2n(r['양품']); o.n+=f2n(r['불량수량']); o.dc+=f2n(r['다캐불량']); o.mcN+=f2n(r['가공불량']); o.mat+=f2n(r["Mat'l NG"]);
    const ck = r['일자']+'|'+r['Part no.'];
    if(!o.capKeys.has(ck)){ o.capKeys.add(ck); o.cap+=f2n(r['UPD_95']); }

  return Object.values(m).sort((a,b)=>(parseInt(a.mc.replace(/\D/g,''),10)||0)-(parseInt(b.mc.replace(/\D/g,''),10)||0));
}

/* ---- MCT 가공 : 지표 요약 (Worst 3) + 문제점·조치 — FAC1 지표 요약과 같은 틀 ---- */
function f2McTopDef(pred, mc, n, grp){
  const m = {};
  F2.det.forEach(r=>{ if(r['공정']!=='MCT' || r['구분']!=='NG' || r['설비명']!==mc || (grp && r['계통']!==grp) || !pred(r)) return;
    const k = r['불량유형']; const o = m[k] || (m[k] = { t:k, g:r['계통'], v:0 }); o.v += f2n(r['수량']); });

function f2McStats(pred){

const F2_MKPI = [

function f2McTot(L){

  a.rate=a.t?a.n/a.t*100:null; a.fgr=a.t?a.f/a.t*100:null; a.rDc=a.t?a.dc/a.t*100:null; a.rMc=a.t?a.mcN/a.t*100:null; a.ach=a.cap?a.t/a.cap*100:null;

/* 워스트 대상 설비 판정용 (값이 의미 있는 설비만) */
/* 비율 지표 순위는 생산 f2MinQty()개 이상 설비만 — 소량 생산의 한두 개 불량으로 %가 튀는 것을 막는다 */
const F2_RATIO_KPI = ['f2.k.fg','f2.k.rate','f2.k.rMc','f2.k.rDc','f2.k.ach'];
const f2MinQty = () => { try{ const v=parseInt(localStorage.getItem('stc_f2_minqty'),10); return isFinite(v)&&v>=0 ? v : 50; }catch(e){ return 50; } };
function f2SetMinQty(v){ const n=parseInt(v,10); try{ localStorage.setItem('stc_f2_minqty', String(isFinite(n)&&n>=0?n:50)); }catch(e){} setTimeout(renderF2,0); }
function f2WorstList(L, k){
  const [,,get,,,,sort] = k;
  let c = L.filter(o=>o.t>0 && get(o)!=null);
  if(F2_RATIO_KPI.includes(k[0])) c = c.filter(o=>o.t>=f2MinQty());
  if(k[0]==='f2.k.ng'||k[0]==='f2.k.rate') c = c.filter(o=>o.n>0);
  if(k[0]==='f2.k.rMc') c = c.filter(o=>o.mcN>0);
  if(k[0]==='f2.k.rDc') c = c.filter(o=>o.dc>0);
  if(k[0]==='f2.k.mat') c = c.filter(o=>o.mat>0);
  return c.slice().sort(sort).slice(0,3);
}
/* ---- 도넛 : 전설비 불량(NG) 중 Worst 3 비중 — Worst 1·2·3 만 색, 나머지는 회색 '기타' ----
   색은 dataviz 검증기 통과(대비 3:1 · CVD ΔE ≥ 15) · 조각 사이 2px 흰 간격 · 범례에 이름·수량·% 함께(색만으로 구분하지 않음) */
const F2_WCOL = ['#b91c1c','#e0701f','#3a66b8'], F2_WOTHER = '#d5dbe3';
function f2DonutSvg(items, total, center, sub){
  const R = 62, r = 40, cx = 75, cy = 75; let a0 = -Math.PI/2, paths = '';
  const pt = (rad, a) => [cx + rad*Math.cos(a), cy + rad*Math.sin(a)];
  items.filter(x=>x.v>0).forEach(x=>{
    const frac = total ? x.v/total : 0; if(frac<=0) return;
    const a1 = a0 + frac*2*Math.PI - (frac>=0.9999?0.0001:0), big = (a1-a0) > Math.PI ? 1 : 0;
    const [x0,y0]=pt(R,a0),[x1,y1]=pt(R,a1),[x2,y2]=pt(r,a1),[x3,y3]=pt(r,a0);
    paths += `<path d="M${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 ${big} 1 ${x1.toFixed(2)},${y1.toFixed(2)} L${x2.toFixed(2)},${y2.toFixed(2)} A${r},${r} 0 ${big} 0 ${x3.toFixed(2)},${y3.toFixed(2)} Z"
      fill="${x.c}" stroke="#fff" stroke-width="2"><title>${esc2(x.label)} · ${fmt(x.v)} (${(frac*100).toFixed(1)}%)</title></path>`;
    a0 = a1 + (frac>=0.9999?0.0001:0);
  });
  return `<svg viewBox="0 0 150 150" width="150" height="150" role="img" aria-label="${esc2(center)}">${paths}
    <text x="75" y="72" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">${esc2(center)}</text>
    <text x="75" y="90" text-anchor="middle" font-size="10.5" fill="#52514e">${esc2(sub)}</text></svg>`;
}
function f2DonutCard(title, items, total, unitSub){

      <span class="v">${fmt(x.v)}</span><span class="p">${total?(x.v/total*100).toFixed(1):'0.0'}%</span>${x.sub?`<span class="s">${x.sub}</span>`:''}</div>`).join('');
  return `<div class="card f2-donut"><div class="f2-dt">${title}</div><div class="f2-dbody">${f2DonutSvg(items, total, fmt(total), unitSub)}<div class="f2-dleg">${legend}</div></div></div>`;
}
function f2WorstDonuts(pred){
  const L = f2McStats(pred), tot = L.reduce((a,o)=>a+o.n,0);

  const mcItems = byMc.slice(0,3).map((o,i)=>({ label:`Worst ${i+1} · ${o.mc}`, v:o.n, c:F2_WCOL[i],
      sub:`%NG ${o.rate==null?'–':o.rate.toFixed(2)+'%'} · ${esc2([...o.parts].join(', '))}` }));
  const restMc = byMc.slice(3); if(restMc.length) mcItems.push({ label:`${T('f2.d.other')} ${restMc.length}${T('f2.d.units')}`, v:restMc.reduce((a,o)=>a+o.n,0), c:F2_WOTHER, sub:esc2(restMc.map(o=>o.mc).join(', ')) });
  /* ② 불량유형별 : 전설비 MCT NG 코드 합계 Worst 3 */
  const m = {};
  F2.det.forEach(r=>{ if(r['공정']!=='MCT' || r['구분']!=='NG' || !pred(r)) return; const k=r['불량유형']; const o=m[k]||(m[k]={t:k,g:r['계통'],v:0}); o.v+=f2n(r['수량']); });
  const types = Object.values(m).sort((a,b)=>b.v-a.v), tsum = types.reduce((a,x)=>a+x.v,0);
  const tyItems = types.slice(0,3).map((x,i)=>({ label:`Worst ${i+1} · ${x.t}`, v:x.v, c:F2_WCOL[i], sub:`${T(x.g==='다캐불량'?'f2.d.dc':x.g==='가공불량'?'f2.d.mc':'f2.d.etc')} · ${f2TypeMcs(pred, x.t)}` }));
  const restTy = types.slice(3); if(restTy.length) tyItems.push({ label:`${T('f2.d.other')} ${restTy.length}${T('f2.d.kinds')}`, v:restTy.reduce((a,x)=>a+x.v,0), c:F2_WOTHER, sub:'' });
  return `<div class="f2-dgrid">${f2DonutCard(T('f2.d.byMc'), mcItems, tot, T('f2.d.ngAll'))}${tsum?f2DonutCard(T('f2.d.byType'), tyItems, tsum, T('f2.d.ngAll')):''}</div>`;

/* 그 불량유형이 많이 나온 설비 (상위 2) */
function f2TypeMcs(pred, t){
  const m = {}; F2.det.forEach(r=>{ if(r['공정']==='MCT' && r['구분']==='NG' && r['불량유형']===t && pred(r)) m[r['설비명']] = (m[r['설비명']]||0) + f2n(r['수량']); });

}
/* MCT 핵심 지표 3개 — 불량률은 한 줄로 묶고(가공·다캐는 그 안의 내역), 생산은 UPD 달성률과 함께 본다
   ① 생산 실적 : Total · FG · UPD 달성률      Worst = 달성률 낮은 순 (생산 기준 이상 설비)
   ② 불량률 %NG : NG ÷ Total = 가공 + 다캐 (+협력사·고객)   Worst = %NG 높은 순 (생산 기준 이상 설비)
   ③ Mat'l NG  : 가공 전 소재 불량 수량 · 투입 대비 %      Worst = 수량 많은 순 */
function f2McWorstTable(pred, prevPred, prevLbl, curLbl){
  if(!F2.mq.length) return `<div class="card empty" style="padding:14px">${T('f2.noMq')}</div>`;
  const L = f2McStats(pred), P = prevPred ? f2McStats(prevPred) : [];
  if(!L.length) return `<div class="card empty" style="padding:14px">${T('st.noData')}</div>`;
  const A = f2McTot(L), B = P.length ? f2McTot(P) : null, mq = f2MinQty();
  const matR = a => (a.t+a.mat) ? a.mat/(a.t+a.mat)*100 : null;
  const pct = (v,dp) => v==null ? '–' : v.toFixed(dp)+'%';
  const dd = (c,p,dp,u,dir) => { if(c==null||p==null) return '–'; const d=c-p; if(Math.abs(d)<Math.pow(10,-dp)/2) return '±0';
    const good = dir>0 ? d>0 : d<0; return `<b style="color:${good?'var(--good)':'var(--critical)'}">${d>0?'+':'−'}${fmt(Math.abs(d),dp)}${u}</b>`; };
  const big = (a, lines) => `<div class="f2-kv">${a}</div>${lines.map(x=>`<div class="f2-ks">${x}</div>`).join('')}`;
  const split = a => `${T('f2.k.mcS')} ${pct(a.rMc,2)} · ${T('f2.k.dcS')} ${pct(a.rDc,2)}${(a.n-a.mcN-a.dc)>0?` · ${T('f2.k.etcS')} ${fmt(a.n-a.mcN-a.dc)}`:''}`;
  const top2 = (mc, grp) => f2McTopDef(pred, mc, 2, grp).map(x=>`${esc2(x.t)} ${fmt(x.v)}`).join(' · ');
  const ok = o => o.t >= mq;
  const W1 = L.filter(o=>ok(o) && o.ach!=null).sort((a,b)=>a.ach-b.ach).slice(0,3);
  const W2 = L.filter(o=>ok(o) && o.n>0).sort((a,b)=>b.rate-a.rate).slice(0,3);
  const W3 = L.filter(o=>o.mat>0).sort((a,b)=>b.mat-a.mat).slice(0,3);
  const wcell = (W, val) => [0,1,2].map(j=>`<td class="w w${j+1}">${W[j]?`${esc2(W[j].mc)}<br><small>${val(W[j])}</small>`:'–'}</td>`).join('');
  const det = (W, txt) => W.map((o,j)=>`<div class="kw-li"><b>${j+1}.</b> ${txt(o)}</div>`).join('') || '–';
  const st = f2St(A.rate), stp = B ? f2St(B.rate) : null;
  const rows = [
    `<tr><td class="c">1</td><td class="name">${T('f2.k2.prod')}<small>${T('f2.k2.prodS')}</small></td>
      <td class="pv">${B?big(fmt(B.t),[`FG ${fmt(B.f)}`,`${T('f2.ach')} ${pct(B.ach,1)}`]):'–'}</td>
      <td>${big(`<b>${fmt(A.t)}</b>`,[`FG ${fmt(A.f)}`,`${T('f2.ach')} <b>${pct(A.ach,1)}</b>`])}</td>
      <td>${big(dd(A.t,B&&B.t,0,'',+1),['',dd(A.ach,B&&B.ach,1,'%p',+1)])}</td>
      ${wcell(W1, o=>pct(o.ach,1))}
      <td class="dt">${det(W1, o=>`${esc2(o.mc)} ${T('f2.ach')} ${pct(o.ach,1)} <span class="f2-why">(Total ${fmt(o.t)} · ${T('f2.dayN')} ${o.days.size} · ${esc2([...o.parts].join(', '))})</span>`)}</td></tr>`,
    `<tr><td class="c">2</td><td class="name">${T('f2.k2.rate')}<small>${T('f2.k2.rateS')}</small></td>
      <td class="pv">${B?big(pct(B.rate,2),[`NG ${fmt(B.n)}`, split(B)]):'–'}</td>
      <td>${big(`<b style="color:${st.c}">${pct(A.rate,2)}</b> <small>${st.l}</small>`,[`NG ${fmt(A.n)}`, split(A)])}</td>
      <td>${big(dd(A.rate,B&&B.rate,2,'%p',-1),[dd(A.n,B&&B.n,0,'',-1), `${T('f2.k.mcS')} ${dd(A.rMc,B&&B.rMc,2,'%p',-1)} · ${T('f2.k.dcS')} ${dd(A.rDc,B&&B.rDc,2,'%p',-1)}`])}</td>
      ${wcell(W2, o=>pct(o.rate,2))}
      <td class="dt">${det(W2, o=>{ const m=top2(o.mc,'가공불량'), d=top2(o.mc,'다캐불량');
        return `${esc2(o.mc)} <b>${pct(o.rate,2)}</b> = ${T('f2.k.mcS')} ${pct(o.rMc,2)} + ${T('f2.k.dcS')} ${pct(o.rDc,2)}<br><span class="f2-why">${m?`${T('f2.k.mcS')}: ${m}`:''}${m&&d?' / ':''}${d?`${T('f2.k.dcS')}: ${d}`:''}</span>`; })}</td></tr>`,
    `<tr><td class="c">3</td><td class="name">${T('f2.k2.mat')}<small>${T('f2.k2.matS')}</small></td>
      <td class="pv">${B?big(fmt(B.mat),[pct(matR(B),2)]):'–'}</td>
      <td>${big(`<b>${fmt(A.mat)}</b>`,[pct(matR(A),2)])}</td>
      <td>${big(dd(A.mat,B&&B.mat,0,'',-1),[dd(matR(A),B&&matR(B),2,'%p',-1)])}</td>
      ${wcell(W3, o=>fmt(o.mat))}
      <td class="dt">${det(W3, o=>`${esc2(o.mc)} ${fmt(o.mat)} <span class="f2-why">(${pct(matR(o),2)} · ${esc2([...o.parts].join(', '))})</span>`)}</td></tr>`
  ].join('');
  const ex = L.filter(o=>o.t>0 && o.t<mq);
  return `<div class="card" style="margin-bottom:12px"><div class="tblwrap"><table class="eq f2-wk f2-k3">
    <thead><tr><th>NO</th><th>${T('f2.r.kpi')}</th><th>${esc2(prevLbl||T('f2.r.prev'))}</th><th>${esc2(curLbl||T('f2.r.cur'))}</th><th>${T('f2.r.delta')}</th>
      <th class="w">Worst 1</th><th class="w">Worst 2</th><th class="w">Worst 3</th><th class="dt">${T('f2.k.detail')}</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div class="legend" style="margin-top:6px;align-items:center">
      <span class="f2-noprint">${T('f2.k.minq')} <input type="number" min="0" step="10" value="${mq}" onchange="f2SetMinQty(this.value)" style="width:64px;padding:2px 5px;border:1px solid #ccd;border-radius:4px;font:inherit"> ${T('f2.k.pcs')}</span>
      ${ex.length ? `<span style="color:#b45309">${T('f2.k.excl',{n:mq})}: ${ex.map(o=>`${esc2(o.mc)} (${fmt(o.t)})`).join(', ')}</span>` : ''}
      <span>${T('f2.k2.note',{t:f2Target()})}</span></div></div>` + f2WorstDonuts(pred);
}
/* 문제점·조치 — 불량률(%NG) 워스트와 UPD 달성률 워스트에 나온 설비를 한 번씩만 */
function f2McIssues(pred, noteKey){
  if(!F2.mq.length) return '';
  const L = f2McStats(pred); if(!L.length) return '';
  const tags = {};
  F2_MKPI.forEach(k=>{ if(!['f2.k.rate','f2.k.ach'].includes(k[0])) return;
    f2WorstList(L, k).forEach((o,j)=>{ (tags[o.mc] = tags[o.mc] || []).push(T(k[0]+'S')+'①②③'[j]); }); });
  const mcs = L.filter(o=>tags[o.mc]);
  if(!mcs.length) return `<div class="card empty" style="padding:14px">${T('f2.noWorst')}</div>`;
  let notes = {}; const nk = m => `${noteKey}_${m}`;
  return `<div class="card"><div class="tblwrap"><table class="eq f2-wk f2-is">
    <thead><tr><th>${T('t.eq')}</th><th>${T('f2.is.perf')}</th><th>${T('f2.is.def')}</th><th class="dt">${T('f2.is.prob')}</th><th class="dt">${T('f2.is.act')}</th></tr></thead>
    <tbody>${mcs.map(o=>{ const top = f2McTopDef(pred, o.mc, 3);
      let p='', a=''; try{ p = localStorage.getItem('stc_f2_note_'+nk(o.mc)+'_p')||''; a = localStorage.getItem('stc_f2_note_'+nk(o.mc)+'_a')||''; }catch(e){}
      return `<tr><td class="mc">${esc2(o.mc)}<small>${esc2(tags[o.mc].join(' · '))}</small></td>
        <td style="text-align:left;font-size:11.5px;line-height:1.55">${esc2([...o.parts].join(', '))}<br>Total ${fmt(o.t)} · NG ${fmt(o.n)} (<b style="color:${f2St(o.rate).c}">${o.rate==null?'–':o.rate.toFixed(2)+'%'}</b>)<br>${T('f2.ach')} ${o.ach==null?'–':o.ach.toFixed(1)+'%'} · ${T('f2.dayN')} ${o.days.size}</td>
        <td style="text-align:left;font-size:11.5px;line-height:1.55">${top.length?top.map((x,j)=>`${'①②③'[j]} <i class="pill" style="background:${F2_GCOLOR[x.g]||'#999'}"></i>${esc2(x.t)} ${fmt(x.v)} (${o.n?(x.v/o.n*100).toFixed(0):0}%)`).join('<br>'):'–'}</td>
        <td><textarea class="f2-note" data-f2note="${esc2(nk(o.mc))}_p" placeholder="${T('f2.is.probPh')}">${esc2(p)}</textarea></td>
        <td><textarea class="f2-note" data-f2note="${esc2(nk(o.mc))}_a" placeholder="${T('f2.is.actPh')}">${esc2(a)}</textarea></td></tr>`; }).join('')}</tbody>
  </table></div><div class="legend" style="margin-top:6px"><span>${T('f2.is.note')}</span></div></div>`;
}
/* =========================================================================
   FAC2 Measure — 설비·품번별 불량 구성 (FAC1 Measure 화면과 같은 틀)
   ① 설비별 %NG 누적막대 : 막대 높이 = %NG, 안은 가공(FAC2)·다캐(소재)·기타 NG 수량, 아래 회색 = 누적 NG 비중
   ② 설비별 생산 품번·수량 : 설비·품번을 가로로 깔고 Total·FG·NG·Mat'l 을 행으로
   ③ Worst 3 설비 불량 구성 : 불량유형 100% 도넛 + 원인 계통 막대
   ========================================================================= */
const F2_GC = { '가공불량':'#7c3aed', '다캐불량':'#c2410c', '기타':'#9aa0a6' };   /* FAC2 보라 · FAC1 주황 (추이 그래프와 같은 색) */
/* 설비 목록 = 생산 기록(F2_MCT_Q)에 한 번이라도 나온 MCT — OQC 는 수출 전 출하 검사라 설비 기준에 쓰지 않는다.
   선택 기간에 쉰 설비는 '가동 없음' 칸으로 남고, 새 설비가 기록되면 자동으로 늘어난다. */
const F2_MC_ALL = ['MC02','MC03','MC04','MC05','MC06','MC07','MC08','MC11','MC12','MC13','MC14','MC15','MC16','MC17','MC18'];   /* FAC2 보유 MCT 전체 (원본 설비 목록) — 기록이 없어도 칸을 둔다 */
const f2McNo = m => parseInt(String(m).replace(/\D/g,''),10) || 0;
function f2AllMcs(){ const s = new Set(F2_MC_ALL); F2.mq.forEach(r=>{ if(r['설비명'] && f2n(r['생산수량'])>0) s.add(r['설비명']); }); return [...s].sort((a,b)=>f2McNo(a)-f2McNo(b)); }
/* src 를 주면 다른 원천(F2_생산실적 = 전 설비)으로 같은 화면을 그린다 — { stats(), all(), parts(mc), top(mc) } */
function f2Measure(pred, src){
  if(!src && !F2.mq.length) return `<div class="card empty" style="padding:14px">${T('f2.noMq')}</div>`;
  const SRC = src || { stats:()=>f2McStats(pred), all:f2AllMcs, top:mc=>f2McTopDef(pred, mc, 99),
    parts:mc=>{ const pm = {};
      F2.mq.forEach(r=>{ if(r['설비명']!==mc || !pred(r)) return; const k = r['Part name']||r['Part no.'];
        const x = pm[k] || (pm[k] = {t:0,f:0,n:0,m:0,f1:0,f2:0}); x.t+=f2n(r['생산수량']); x.f+=f2n(r['양품']); x.n+=f2n(r['불량수량']); x.m+=f2n(r["Mat'l NG"]); x.f1+=f2n(r['다캐불량']); x.f2+=f2n(r['가공불량']); });
      return Object.entries(pm).map(([k,x])=>({ part:k, ...x })); } };
  const L = SRC.stats().filter(o=>o.t>0);
  if(!L.length) return `<div class="card empty" style="padding:14px">${T('st.noData')}</div>`;
  const mq = f2MinQty(), totNg = L.reduce((a,o)=>a+o.n,0);
  const idle = SRC.all().filter(m=>!L.some(o=>o.mc===m));            /* 기간 중 가동 없는 설비 */
  const sorted = L.slice().sort((a,b)=>(b.rate||0)-(a.rate||0)).concat(idle.map(m=>({ mc:m, idle:true, t:0, n:0, dc:0, mcN:0, rate:null })));
  const worst = sorted.filter(o=>o.t>=mq && o.n>0).slice(0,3).map(o=>o.mc);
  /* ① 누적막대 (SVG) */
  const W = Math.max(1200, sorted.length*84), H = 280, top = 34, bot = 44, ph = H-top-bot, bw = Math.min(64, W/sorted.length*0.62);
  const maxR = Math.max(1, ...sorted.map(o=>o.rate||0));
  let cum = 0, svg = '';
  sorted.forEach((o,i)=>{
    const cx = (i+0.5)*W/sorted.length, x = cx-bw/2, rate = o.rate||0, hTot = rate/maxR*ph, base = top+ph;
    if(o.idle){ svg += `<rect x="${x}" y="${base-3}" width="${bw}" height="3" fill="#e3e7ec"/><text x="${cx}" y="${base-10}" text-anchor="middle" font-size="11" fill="#9aa0a6">${T('f2.m.idle')}</text>
      <text x="${cx}" y="${base+17}" text-anchor="middle" font-size="12" font-weight="700" fill="#9aa0a6">${esc2(o.mc)}</text>`; return; }
    const etc = Math.max(0, o.n-o.mcN-o.dc);
    const segs = [['가공불량',o.mcN],['다캐불량',o.dc],['기타',etc]].filter(s=>s[1]>0);
    let y = base;
    segs.forEach(([g,v],j)=>{ const h = o.n ? hTot*v/o.n : 0; y -= h;
      const r = j===segs.length-1 ? 4 : 0;
      svg += `<path d="M${x},${y+h} V${y+r} Q${x},${y} ${x+r},${y} H${x+bw-r} Q${x+bw},${y} ${x+bw},${y+r} V${y+h} Z" fill="${F2_GC[g]}" stroke="#fff" stroke-width="1.5"><title>${esc2(o.mc)} · ${T('f2.m.'+g)} ${fmt(v)} (${(v/o.t*100).toFixed(2)}%)</title></path>`;
      if(h >= 16) svg += `<text x="${cx}" y="${y+h/2+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${fmt(v)}</text>`; });
    const wi = worst.indexOf(o.mc);
    if(wi>=0) svg += `<rect x="${x-4}" y="${base-hTot-4}" width="${bw+8}" height="${hTot+8}" rx="5" fill="none" stroke="#c62828" stroke-width="2"/>`;
    svg += `<text x="${cx}" y="${base-hTot-10}" text-anchor="middle" font-size="11.5" font-weight="800" fill="${wi>=0?'#c62828':'#222'}">${rate.toFixed(2)}%</text>`;
    cum += o.n;
    svg += `<text x="${cx}" y="${base+17}" text-anchor="middle" font-size="12" font-weight="800" fill="${wi>=0?'#c62828':'#1e3c72'}">${wi>=0?`${wi+1} `:''}${esc2(o.mc)}</text>
            <text x="${cx}" y="${base+32}" text-anchor="middle" font-size="10.5" fill="#898781">${o.t<mq?`(${fmt(o.t)}${T('f2.m.ea')}) `:''}${totNg?Math.round(cum/totNg*100):0}%</text>`;
  });
  svg += `<line x1="0" x2="${W}" y1="${top+ph}" y2="${top+ph}" stroke="#c9ccd1"/>`;
  const legend = ['다캐불량','가공불량'].concat(L.some(o=>o.n-o.mcN-o.dc>0)?['기타']:[]).map(g=>`<span><i class="pill" style="background:${F2_GC[g]}"></i>${T('f2.m.'+g)}</span>`).join('');
  const c1 = `<div class="card"><div class="f2-mt">① ${T('f2.m.t1')} <small>${T('f2.m.t1s',{n:mq})}</small><span class="legend" style="margin:0 0 0 auto">${legend}</span></div>
    <div class="tblwrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:720px;display:block" role="img" aria-label="${T('f2.m.t1')}">${svg}</svg></div></div>`;
  /* ② 설비 × 품번 가로표 */
  const cols = [];
  SRC.all().forEach(m=>{ const o = L.find(x=>x.mc===m);
    if(!o){ cols.push({ mc:m, part:'', idle:true, t:0, f:0, n:0, m:0 }); return; }
    SRC.parts(o.mc).forEach(x=>cols.push({ mc:o.mc, ...x }));
  });
  const mcSpan = {}; cols.forEach(c=>mcSpan[c.mc]=(mcSpan[c.mc]||0)+1);
  const R2 = [['PROD EA','t'],['OK EA','f'],['NG EA','n']].concat(cols.some(c=>c.f1!==undefined) ? [['<span class="gt-fac fac1" style="margin:0 4px 0 0">FAC1</span>NG','f1'],['<span class="gt-fac fac2" style="margin:0 4px 0 0">FAC2</span>NG','f2']] : []).concat([["Mat'l NG",'m']]);
  const mx = k => Math.max(...cols.map(c=>c[k]||0));
  const tot = k => cols.reduce((a,c)=>a+(c[k]||0),0);
  const c2 = `<div class="card"><div class="f2-mt">② ${T('f2.m.t2')} <small>${T('f2.m.t2s')}</small></div><div class="tblwrap"><table class="f2-ms">
    <thead><tr><th class="h">MCT</th>${Object.keys(mcSpan).map(m=>`<th class="h" colspan="${mcSpan[m]}">${esc2(m)}</th>`).join('')}<th class="h tt" rowspan="2">TOTAL</th></tr>
      <tr><th class="h">PART NAME</th>${cols.map(c=>`<th class="v${c.idle?' idle':''}"><span>${c.idle?T('f2.m.idle'):esc2(c.part)}</span></th>`).join('')}</tr></thead>
    <tbody>${R2.map(([lab,k])=>{ const m = mx(k); return `<tr class="${k}"><td class="l">${lab}</td>${cols.map(c=>c.idle?'<td class="idle">–</td>':`<td${c[k]===m&&m>0?' class="mx"':''}>${fmt(c[k]||0)}</td>`).join('')}<td class="tt">${fmt(tot(k))}</td></tr>`; }).join('')}
      <tr class="r"><td class="l">% NG</td>${cols.map(c=>c.idle?'<td class="idle">–</td>':`<td style="color:${f2St(c.t?c.n/c.t*100:null).c};font-weight:700">${c.t?(c.n/c.t*100).toFixed(2)+'%':'–'}</td>`).join('')}<td class="tt">${tot('t')?(tot('n')/tot('t')*100).toFixed(2)+'%':'–'}</td></tr></tbody>
  </table></div><div class="f2-mn">${T('f2.m.t2n')}</div></div>`;
  /* ③ Worst 3 설비 불량 구성 */
  const c3 = worst.length ? `<div class="f2-mt" style="margin-top:4px">③ ${T('f2.m.t3')} <small>${T('f2.m.t3s')}</small></div><div class="f2-m3">${worst.map((mc,i)=>{
      const o = L.find(x=>x.mc===mc), defs = SRC.top(mc), sum = defs.reduce((a,x)=>a+x.v,0);
      const items = defs.slice(0,3).map(x=>({ label:x.t, v:x.v, c:F2_GC[x.g]||F2_GC['기타'], g:x.g }));
      const rest = defs.slice(3); if(rest.length) items.push({ label:`${T('f2.d.other')} ${rest.length}${T('f2.d.kinds')}`, v:rest.reduce((a,x)=>a+x.v,0), c:F2_WOTHER });
      const leg = items.map((x,j)=>`<div class="f2-m3l${j<3?' top':''}">${j<3?`<b class="rk">${j+1}</b>`:'<b class="rk o"></b>'}${x.g==='다캐불량'?'<u class="gt-fac fac1">FAC1</u>':x.g==='가공불량'?'<u class="gt-fac fac2">FAC2</u>':`<i style="background:${x.c}"></i>`}<span>${esc2(x.label)}</span><em>${fmt(x.v)} (${sum?Math.round(x.v/sum*100):0}%)</em></div>`).join('');
      const g = { '가공불량':o.mcN, '다캐불량':o.dc, '기타':Math.max(0,o.n-o.mcN-o.dc) };
      const bar = Object.entries(g).filter(e=>e[1]>0).map(([k,v])=>`<span style="width:${o.n?v/o.n*100:0}%;background:${F2_GC[k]}" title="${T('f2.m.'+k)} ${fmt(v)}"></span>`).join('');
      const tags = Object.entries(g).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]).map(([k,v],j)=>`<span class="${j?'':'lead'}"><i style="background:${F2_GC[k]}"></i>${T('f2.m.'+k)} ${o.n?Math.round(v/o.n*100):0}% (${fmt(v)})</span>`).join('');
      return `<div class="card f2-m3c"><div class="f2-m3h"><b>${esc2(mc)}</b><small>NG ${fmt(o.n)}${T('f2.m.ea')} · %NG ${o.rate.toFixed(2)}% · ${esc2([...o.parts].join(', '))}</small></div>
        <div class="f2-dbody">${f2DonutSvg(items, sum, fmt(sum), 'NG EA')}<div class="f2-dleg" style="gap:4px">${leg}</div></div>
        <div class="f2-m3b"><div class="f2-m3bt">${T('f2.m.cause')}</div><div class="f2-m3bar">${bar}</div><div class="f2-m3tag">${tags}</div></div></div>`; }).join('')}</div>` : '';
  return c1 + c2 + c3;
}
/* 품번 선택 칩 */
function f2PartChips(s){
  const withNg = s.partList.filter(pt=>pt.MCT.n+pt.OQC.n>0).sort((a,b)=>(b.MCT.n+b.OQC.n)-(a.MCT.n+a.OQC.n));
  const list = withNg.length ? withNg : s.partList;
  const cur = list.find(pt=>pt.no===F2_SEL.part) || list[0];
  return { cur, html: `<div class="f2-chips">${list.map(pt=>`<button class="${pt===cur?'on':''}" onclick="f2SetSel('part','${esc2(pt.no)}')">${esc2(pt.name)} <small>NG ${fmt(pt.MCT.n+pt.OQC.n)}</small></button>`).join('')}</div>` };
}
/* 기간 표 (추이) */
function f2TrendTable(list, label, curKey, part){
  return `<div class="card"><div class="tblwrap"><table class="eq f2-pt">
    <thead><tr><th rowspan="2">${label}</th><th colspan="4" class="grp">${T('f2.p.MCT')}</th><th colspan="3" class="grp">${T('f2.p.OQC')}</th>${part?`<th colspan="2" class="grp">${esc2(part.name)}</th>`:''}</tr>
      <tr><th>Total</th><th>NG</th><th>% NG</th><th>Mat'l</th><th>Total</th><th>NG</th><th>% NG</th>${part?`<th>MCT %NG</th><th>${esc2(part.topName||'-')}</th>`:''}</tr></thead>
    <tbody>${list.map(x=>{ const pp = part ? (x.s.parts[part.no]||{MCT:f2mk()}) : null;
      return `<tr${x.k===curKey?' style="background:#eef4fd"':''}><td class="name">${esc2(x.k)}</td>
      <td>${fmt(x.s.MCT.t)}</td><td>${fmt(x.s.MCT.n)}</td><td style="color:${f2St(f2Rate(x.s.MCT)).c};font-weight:700">${f2pc(x.s.MCT)}</td><td>${fmt(x.s.MCT.m)}</td>
      <td>${x.s.OQC.t?fmt(x.s.OQC.t):'–'}</td><td>${x.s.OQC.t?fmt(x.s.OQC.n):'–'}</td><td style="color:${f2St(f2Rate(x.s.OQC)).c};font-weight:700">${x.s.OQC.t?f2pc(x.s.OQC):'–'}</td>
      ${part?`<td>${pp.MCT.t?f2pc(pp.MCT):'–'}</td><td><b>${fmt(x.topCnt||0)}</b></td>`:''}</tr>`; }).join('')}</tbody>

/* 종합 탭에 끼워 넣는 FAC2 요약 블록 */
function f2OverviewBlock(week){
  const head = `<div class="sec-title">${T('grp.fac2')} · ${week}</div>`;
  const st = f2Status(); if(st) return head + st;
  const s = f2Sum(r=>r['주차']===week);
  if(!s.days.length) return head + `<div class="card empty" style="padding:14px">${T('f2.noWeek',{w:week})}</div>`;
  const rM = f2Rate(s.MCT), rO = f2Rate(s.OQC), sM = f2St(rM), sO = f2St(rO);
  const worst = s.partList.filter(pt=>pt.MCT.n>0).sort((a,b)=>f2Rate(b.MCT)-f2Rate(a.MCT))[0];
  return head + `<div class="tiles">
    ${f2tile(`${T('f2.p.MCT')} % NG`, rM==null?'–':rM.toFixed(2), '%', `${sM.l} · NG ${fmt(s.MCT.n)} / ${fmt(s.MCT.t)}`, sM.c)}
    ${f2tile(`${T('f2.p.OQC')} % NG`, rO==null?'–':rO.toFixed(2), '%', s.OQC.t?`${sO.l} · NG ${fmt(s.OQC.n)} / ${fmt(s.OQC.t)}`:T('f2.noOqc'), sO.c)}
    ${f2tile("Mat'l NG", fmt(s.MCT.m), '', T('f2.matSub'))}
    ${f2tile(T('f2.worstPart'), worst?esc2(worst.name):'–', '', worst?`MCT ${f2pc(worst.MCT)} · NG ${fmt(worst.MCT.n)}`:'', worst?f2St(f2Rate(worst.MCT)).c:null)}
  </div>
  <div style="text-align:right;margin-top:6px"><a href="#" onclick="selectTab('f2ov');return false;" style="font-size:12px;color:var(--brand-2);font-weight:700">${T('f2.more')} →</a></div>`;
}

async function f2CodeFetch(){

        else if(c==='"') q = true; else if(c===','){ row.push(f); f=''; } else if(c==='\r'){} else if(c==='\n'){ row.push(f); A.push(row); row=[]; f=''; } else f += c; }

function f2pMeasureSrc(S, pred){

    .filter(x=>x.v>0).map(x=>({ ...x, g: f2FacOf(x.raw || x.t).fac==='FAC1' ? '다캐불량' : '가공불량' })).sort((a,b)=>b.v-a.v);   /* F2_불량코드 D열: FAC1 = 다캐 · FAC2 = 가공 */
  const sum = (L, g) => L.filter(x=>x.g===g).reduce((a,x)=>a+x.v,0);
  return {
    stats:()=>S.mcList.map(mc=>{ const A = S.mc[mc], d = defs(A);
      return { mc, t:A.t, f:A.f, n:A.n, dc:sum(d,'다캐불량'), mcN:sum(d,'가공불량'), mat:A.mb+A.ma, parts:new Set([...A.pns].map(pn=>f2pShort(pn, S.names[pn]))), rate:A.t?A.n/A.t*100:null }; }),
    all:()=>[...new Set([...F2_MC_ALL, ...S.mcList])].sort((a,b)=>f2McNo(a)-f2McNo(b)),
    top:mc=>defs(S.mc[mc]),
    parts:mc=>{ const m = {};
      const FC = f2pFacCols();
      F2.pm.forEach(r=>{ if(r.mc!==mc || !pred(r)) return; const k = `${f2pShort(r.pn, S.names[r.pn])} OP${r.op}`;
        const x = m[k] || (m[k] = { t:0, f:0, n:0, m:0, f1:0, f2:0 }); x.t+=r.t; x.f+=r.f; x.n+=r.n; x.m+=r.mb+r.ma; x.f1+=f2pSelN(r, FC, 'FAC1'); x.f2+=f2pSelN(r, FC, 'FAC2'); });
      return Object.entries(m).map(([k,x])=>({ part:k, ...x })); } };

/* 설비 KPI 요약 — 일일 품질보고 「1. 설비 KPI」 와 같은 틀 (전기간 · 이번 · 증감 · Worst 1~3 · 세부) */

const f2pTopLoss = (A, n) => F2P.loss.map((k,i)=>({ t:f2pLossName(k), v:A.ls[i]/60 })).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,n);
function f2pWorst(S){
  const mq = f2MinQty(), L = S.mcList.map(mc=>Object.assign({ mc }, S.mc[mc])), ok = o => o.t >= mq;
  return {
    p: L.filter(o=>ok(o) && f2pAv(o)!=null).sort((a,b)=>f2pAv(a)-f2pAv(b)).slice(0,3),
    r: L.filter(o=>ok(o) && o.n>0).sort((a,b)=>f2pNG(b)-f2pNG(a)).slice(0,3),
    m: L.filter(o=>o.mb+o.ma>0).sort((a,b)=>(b.mb+b.ma)-(a.mb+a.ma)).slice(0,3),
    o: L.filter(o=>ok(o) && f2pOEE(o)!=null).sort((a,b)=>f2pOEE(a)-f2pOEE(b)).slice(0,3),

/* 효과 — 완료일 앞 7일 vs 뒤 7일 (같은 설비 · 같은 유형) */
function actEffect(it){
  if(it.status!=='완료' || !it.done) return null;
  const P = ACT.src[it.src]; if(!P) return null;
  const b0 = gtAdd(it.done, -7), a1 = gtAdd(it.done, 7);
  let D; try{ D = P(b0, a1); }catch(e){ return null; } if(!D) return null;
  const j = it.typeKey ? D.types.findIndex(y=>y.k===it.typeKey) : -1;
  const B = { t:0, v:0 }, A = { t:0, v:0, days:new Set() };
  D.rows.forEach(r=>{ if(r.mc!==it.mc) return; const v = j>=0 ? (r.ty[j]||0) : r.n;
    if(r.d>=b0 && r.d<it.done){ B.t += r.t; B.v += v; }
    else if(r.d>it.done && r.d<=a1){ A.t += r.t; A.v += v; A.days.add(r.d); } });
  const rb = B.t ? B.v/B.t*100 : null, ra = A.t ? A.v/A.t*100 : null;
  let v = 'wait';
  if(ra!=null && A.days.size>=3 && rb!=null) v = ra <= rb*0.7 ? 'good' : ra >= rb*1.1 && ra-rb >= 0.05 ? 'bad' : 'same';
  return { rb, ra, v, n:A.days.size };
}

      <div><span>${X.ck.guess}</span><b style="color:${A.guess?'#b45309':'var(--good)'}">${A.guess?`${fmt(A.guess)} (${fmt(A.guessQ)} EA)`:X.ck.none}</b></div>
      <div><span>${X.ck.opfix}</span><b>${F2P.opFix?fmt(F2P.opFix):X.ck.none}</b></div></div>`;

  let trend, tLbl, isDay = kind!=='month';

    <div class="sec-title">2. ${X.s3}</div>${f2pMcTable(S, P)}
    <div class="sec-title">3. ${T('f2.m.sec')}</div>${f2Measure(pred, f2pMeasureSrc(S, pred))}
    <div class="sec-title">3-1. ${X.grpT}</div>${f2pGroupTrend(pred, dFrom, dTo)}
    <div class="sec-title">3-2. ${actT('sec')}</div>${actWorstHtml('f2p','FAC2','f2p')}
    <div class="sec-title">3-3. ${X.dayMc}</div>${f2pMcDayTable(pred)}
    <div class="sec-title">4. ${X.s4}</div>${f2pDefects(S)}
    <div class="sec-title">5. ${X.s5}</div>${f2pLosses(S)}
    <div class="sec-title">6. ${X.s6}</div>${f2pParts(S)}
    <div class="sec-title">7. ${tLbl}</div>${f2pTrendTable(trend, isDay?T('f2.date'):T('ctl.week'), isDay)}
    <div class="sec-title">8. ${X.s7}</div>${f2pDayMatrix(pred, S, dFrom, dTo)}
    <div class="sec-title">9. ${X.s8}</div>${chk}
    <div class="sec-title">10. ${X.s9}</div>
    <div class="card"><textarea class="f2-note" data-f2note="${esc2(noteKey)}" placeholder="${X.noteph}">${esc2(note)}</textarea></div>
    <div class="foot">${X.foot}</div>`;
}

function f2Qty(topWeek){

                    foot:'※ {y}년 1~12월을 해당 월 1일~말일 기준으로 집계했습니다. 데이터가 없는 달은 "-" 로 표시합니다. 노란 행 = 상단 주차({w}) 가 속한 달. 불량률 = 불량 ÷ 총생산량. 「전 설비 · 전 OP」 는 같은 제품이 OP10 · OP20 처럼 여러 공정을 거치면 공정마다 따로 세므로 완성품 수량보다 큽니다.',

                    foot:'※ รวมรายเดือน ม.ค.–ธ.ค. {y} · "-" = ไม่มีข้อมูล · %NG = NG ÷ Total · "ทุก OP" นับแต่ละ OP แยกกัน',
                    per2:'ช่วงที่เลือก = สัปดาห์ {w} ({a} ~ {b})' } }[L];
  const src = f2qGet('src','mct'), mode = f2qGet('mode','year');
  const hidden = f2qGet('hide','').split(',').filter(Boolean);
  const R = f2qRows(src);
  const years = [...new Set(R.map(r=>r.d.slice(0,4)))].sort();
  const wr = f2qWeekRange(topWeek);
  let year = f2qGet('year',''); if(!years.includes(year)) year = wr && years.includes(wr.from.slice(0,4)) ? wr.from.slice(0,4) : years[years.length-1];
  const clip = mode==='period' && wr;
  const M = Array.from({length:12}, (_,i)=>({ m:i+1, key:`${year}-${f2p2(i+1)}`, t:0, f:0, n:0, rows:0 }));
  R.forEach(r=>{ if(r.d.slice(0,4)!==year) return; if(clip && (r.d<wr.from || r.d>wr.to)) return;
    const o = M[+r.d.slice(5,7)-1]; o.t+=r.t; o.f+=r.f; o.n+=r.n; o.rows++; });
  const S = M.reduce((a,o)=>{ a.t+=o.t; a.f+=o.f; a.n+=o.n; return a; }, {t:0,f:0,n:0});
  const hlKey = wr ? wr.to.slice(0,7) : '';
  const rate = o => o.t ? o.n/o.t*100 : null;
  const mLbl = i => L==='ko' ? `${i}월` : ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][i-1];
  /* 머리 */
  const head = `<div class="f2q-head"><h3>📦 ${TX.t}</h3>
    <div class="f2q-ctl f2-noprint">
      <label>${TX.src} <select onchange="f2qSet('src', this.value)">${Object.keys(F2Q_SRC).map(k=>`<option value="${k}"${k===src?' selected':''}>${F2Q_SRC[k][L]}</option>`).join('')}</select></label>
      <select onchange="f2qSet('year', this.value)">${years.map(y=>`<option value="${y}"${y===year?' selected':''}>${TX.yr.replace('{y}',y)}</option>`).join('')}</select>
      <span class="f2q-mode"><button class="${mode!=='period'?'on':''}" onclick="f2qSet('mode','year')">${TX.year}</button><button class="${mode==='period'?'on':''}" onclick="f2qSet('mode','period')">${TX.per}</button></span>
    </div></div>`;
  if(!R.length) return `<div class="card f2q">${head}<div class="empty" style="padding:20px">${TX.none}</div></div>`;
  const title = clip ? `PRODUCTION QUANTITY (${wr.from} ~ ${wr.to})` : `PRODUCTION QUANTITY (${TX.yr.replace('{y}',year)})`;
  const pick = `<div class="f2q-pick f2-noprint">${F2Q_SER.map(s=>`<label><input type="checkbox"${hidden.includes(s.k)?'':' checked'} onchange="f2qToggle('${s.k}', this.checked)"><span class="sw${s.line?' ln':''}" style="background:${s.c}"></span>${s[L]}${s.line?` <em>(${L==='ko'?'선 · 우측 축':'line · right axis'})</em>`:''}</label>`).join('')}</div>`;
  /* 표 */
  const tb = `<table class="f2q-t"><thead><tr><th>${L==='ko'?'월':'Month'}</th><th>${F2Q_SER[0][L]}</th><th>${F2Q_SER[1][L]}</th><th>${F2Q_SER[2][L]}</th><th>${F2Q_SER[3][L]}</th></tr></thead>
    <tbody>${M.map(o=>{ if(!o.rows) return `<tr class="empty"><td>${mLbl(o.m)}</td><td>-</td><td>-</td><td>-</td><td>-</td></tr>`;
      const r = rate(o); return `<tr${!clip && o.key===hlKey?' class="hl"':''}><td>${mLbl(o.m)}</td><td>${fmt(o.t)}</td><td>${fmt(o.f)}</td><td class="bad">${fmt(o.n)}</td><td class="bad">${r==null?'–':r.toFixed(2)+'%'}</td></tr>`; }).join('')}</tbody>
    <tfoot><tr><td>${TX.tot}</td><td>${fmt(S.t)}</td><td>${fmt(S.f)}</td><td class="bad">${fmt(S.n)}</td><td class="bad">${S.t?(S.n/S.t*100).toFixed(2)+'%':'–'}</td></tr></tfoot></table>`;
  /* 차트 (SVG) */
  const W = 900, H = 400, Lx = 70, Rx = 60, T = 44, B = 34, PH = H-T-B, PW = W-Lx-Rx, cw = PW/12;
  const on = k => !hidden.includes(k);
  const bars = F2Q_SER.filter(s=>!s.line && on(s.k));
  const vmax = Math.max(1, ...M.flatMap(o=>bars.map(s=>o[s.k])));
  const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(v))), x = v/p; return (x<=1?1:x<=1.5?1.5:x<=2?2:x<=2.5?2.5:x<=3?3:x<=5?5:10)*p; };
  const ymax = nice(vmax*1.12), rmax = (()=>{ const v = Math.max(1, ...M.map(o=>rate(o)||0))*1.25, st = [0.2,0.5,1,2,2.5,5,10].find(x=>v/5<=x) || 20; return st*5; })();
  const Y = v => T + PH*(1 - v/ymax), YR = v => T + PH*(1 - v/rmax);
  const kf = v => v>=1e6 ? (v/1e6).toFixed(2)+'M' : v>=1e3 ? Math.round(v/1e3)+'K' : String(Math.round(v));

    g += `<line x1="${Lx}" x2="${W-Rx}" y1="${y}" y2="${y}" stroke="#eef0f3"/><text x="${Lx-8}" y="${+y+4}" text-anchor="end" font-size="11" fill="#6b7280">${Math.round(v).toLocaleString()}</text>`;
    if(on('r')) g += `<text x="${W-Rx+8}" y="${(+YR(rmax*i/5)+4).toFixed(1)}" font-size="11" fill="#E65100">${+(rmax*i/5).toFixed(1)}%</text>`; }
  const bw = Math.min(26, cw*0.8/Math.max(1,bars.length));
  M.forEach((o,i)=>{ const cx = Lx + cw*(i+0.5);
    if(!clip && o.key===hlKey && o.rows) g += `<rect x="${(cx-cw/2).toFixed(1)}" y="${T}" width="${cw.toFixed(1)}" height="${PH}" fill="#FFF6DA"/>`;

    if(!o.rows) return;
    bars.forEach((s,j)=>{ const v = o[s.k], x = cx - bars.length*bw/2 + j*bw, y = Y(v), h = T+PH-y;
      g += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="2" fill="${s.c}"><title>${mLbl(o.m)} ${s[L]} ${fmt(v)}</title></rect>`;
      const tx = x + (bw-2)/2 + 4;

  if(on('r')){ const pts = M.map((o,i)=>o.rows && o.t ? [Lx + cw*(i+0.5), YR(rate(o)), rate(o)] : null).filter(Boolean);

  g += `<line x1="${Lx}" x2="${W-Rx}" y1="${T+PH}" y2="${T+PH}" stroke="#c9ccd1"/>`;
  const lg = F2Q_SER.filter(s=>on(s.k)).map(s=>`<span><i class="${s.line?'ln':''}" style="background:${s.c}"></i>${s[L]}</span>`).join('');
  const chart = `<div class="f2q-c"><div class="f2q-lg">${lg}${on('r')?`<span class="r">${F2Q_SER[3][L]} — ${L==='ko'?'우측 축':'right axis'}</span>`:''}</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${title}">${g}</svg></div>`;
  return `<div class="card f2q">${head}<div class="f2q-title">${title}<small>${F2Q_SRC[src][L]}</small></div>${pick}
    <div class="f2q-body">${tb}${chart}</div>
    <div class="foot" style="margin-top:8px">${TX.foot.replace(/\{y\}/g,year).replace('{w}',esc2(topWeek||'–'))}${clip?`<br>${TX.per2.replace('{w}',esc2(topWeek)).replace('{a}',wr.from).replace('{b}',wr.to)}`:''}</div></div>`;
}
function f2qToggle(k, v){ const h = new Set(f2qGet('hide','').split(',').filter(Boolean)); if(v) h.delete(k); else h.add(k); f2qSet('hide', [...h].join(',')); }

/* ---- FAC2 탭 — 왼쪽 메뉴: 현황 / 일일·주간·월간 품질보고 ---- */

const F2_SEL = { daily:'', week:'', month:'', part:'' };
function f2SetView(v){ F2_VIEW = v; try{ localStorage.setItem('stc_f2_view', v); }catch(e){} renderF2(); }
function f2SetSel(k, v){ F2_SEL[k] = v; renderF2(); }
const f2AddDays = (s,n) => { const d = new Date(s+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const f2DayDiff = (a,b) => Math.round((new Date(b+'T00:00:00Z') - new Date(a+'T00:00:00Z'))/86400000);
const f2RangeKey = () => F2_PQ ? 'stc_f2_pqc_range' : 'stc_f2_drange';
function f2Range(){ try{ return JSON.parse(localStorage.getItem(f2RangeKey())||'null') || {}; }catch(e){ return {}; } }
function f2SetRange(from, to){
  if(F2_VIEW==='pqc' && !F2_PQ) return pqWith(()=>f2SetRange(from, to));
  const r = f2Range(); const ds = f2Dates(), last = ds[ds.length-1];
  if(from) r.from = from; if(to) r.to = to;
  if(!r.from) r.from = r.to || last; if(!r.to) r.to = r.from || last;
  try{ localStorage.setItem(f2RangeKey(), JSON.stringify(r)); }catch(e){}
  setTimeout(renderF2,0);   /* change 이벤트 안에서 바로 다시 그리면 blur 와 겹쳐 오류가 난다 */

/* 빠른 선택: 최근일 · 최근 3일 · 최근 7일 · 이번 주(시트 주차) · 이번 달 — 모두 데이터 마지막 날 기준 */
function f2Quick(q){
  if(F2_VIEW==='pqc' && !F2_PQ) return pqWith(()=>f2Quick(q));
  const ds = f2Dates(); if(!ds.length) return; const last = ds[ds.length-1];
  let from = last;
  if(q==='d3') from = f2AddDays(last,-2);
  else if(q==='d7') from = f2AddDays(last,-6);
  else if(q==='wk'){ const w = (F2.pd.find(r=>r['일자']===last)||{})['주차']; const inW = ds.filter(d=>F2.pd.some(r=>r['일자']===d && r['주차']===w)); from = inW[0] || last; }
  else if(q==='mo') from = last.slice(0,8)+'01';
  try{ localStorage.setItem(f2RangeKey(), JSON.stringify({from, to:last})); }catch(e){}
  setTimeout(renderF2,0);
}

/* 상단 동기화 바 — FAC1 품질 6σ 의 「구글시트 새로고침」과 같은 역할
   · 버튼: F2_품번일별 · F2_불량상세 · F2_MCT_Q 를 구글시트에서 다시 읽는다(캐시 무시)

/* ===== 공정 흐름도 — 스텝을 왼쪽 → 오른쪽으로, 칸 사이 화살표 · 아래 공정 설명 · 문제 공정 클릭 = 적색 강조

function f2LinkView(){

  const share = T2.n ? Math.round(T2.f1/T2.n*100) : 0;
  return `<div class="f2-rbar f2-noprint"><label>기간 <input type="date" class="f2-date" value="${from}" max="${last}" onchange="lkSet(this.value,null)"></label><span>~</span><input type="date" class="f2-date" value="${to}" max="${last}" onchange="lkSet(null,this.value)"> ${q}

function renderF2(){

  let secPrev = '';

      const h = v.sec!==secPrev ? `<div class="f2-sec">${T(v.sec)}</div>` : ''; secPrev = v.sec;
      return h + `<button class="${v.id===F2_VIEW?'on':''}" onclick="f2SetView('${v.id}')"><span class="ic">${v.icon}</span>${T('f2.v.'+v.id)}</button>`;
    }).join('') + `</aside>`;
  const st = f2Status();
  let body;

  if(F2_VIEW==='act') body = actBoardHtml('FAC2');
  else if(F2_VIEW==='link') body = (F2.loading && !F2.pm.length) ? `<div class="empty">${T('f2.loading')}</div>` : f2LinkView();
  else if(F2_VIEW==='qty') body = (F2.loading && !F2.pd.length && !F2.pm.length) ? `<div class="empty">${T('f2.loading')}</div>` : f2Qty(week);
  else if(F2_VIEW==='pqc') body = pqReport(week);
  else if(F2_VIEW==='layout') body = f2LayoutView(week);
  else if(F2_VIEW[0]==='p') body = f2pStatus() || f2pReport(F2_VIEW.slice(1), week);
  else if(st) body = `<div class="sec-title">${T('grp.fac2')} · ${week||''}</div>${st}`;
  else if(F2_VIEW==='dash') body = f2Dash(week);
  else body = f2Report(F2_VIEW, week);
  host.innerHTML = `<div class="f2-wrap">${side}<div class="f2-main"><div class="ov">${f2SyncBar()}${body}</div></div></div>`;

  });

function f2ProcKpiTable(s, p, proc, prevLbl, curLbl){

  const cv = (x,k) => { const v = kv(x,k); if(v==null || (k!=='r' && !x.t && !v)) return '–'; if(k==='r'){ const st=f2St(v); return `<span style="color:${st.c};font-weight:700">${v.toFixed(2)}%</span> <small>${st.l}</small>`; } return fmt(v,0); };

/* 품번 칩 + TOP5 (한 공정) */
function f2PartChipsP(s, proc){
  const list = s.partList.filter(pt=>pt[proc].t>0).sort((a,b)=>b[proc].n-a[proc].n);
  const key = 'part'+proc, cur = list.find(pt=>pt.no===F2_SEL[key]) || list[0];
  return { cur, html: list.length ? `<div class="f2-chips">${list.map(pt=>`<button class="${pt===cur?'on':''}" onclick="f2SetSel('${key}','${esc2(pt.no)}')">${esc2(pt.name)} <small>NG ${fmt(pt[proc].n)}</small></button>`).join('')}</div>` : '' };
}
function f2Top5Boxes(pred, pt, proc){
  const box = grp => { const a = pt[proc], L = f2TopN(pred, proc, pt.no, grp, 5), mx = Math.max(1, ...L.map(x=>x.v));
    return `<div class="card f2-t5"><div class="f2-t5h">${T('f2.g.'+grp)}</div>
      ${L.length ? L.map((x,i)=>`<div class="f2-bar"><span class="f2-rk">${i+1}</span><span class="f2-bl">${esc2(x.t)}</span>
        <span class="bartrack f2-bt"><span class="barfill" style="width:${x.v/mx*100}%;background:${F2_GCOLOR[grp]}"></span></span>
        <span class="f2-bv">${fmt(x.v)} <small>${a.n?(x.v/a.n*100).toFixed(0)+'%':''}</small></span></div>`).join('') : `<div class="empty" style="padding:10px 0">${T('f2.none5')}</div>`}</div>`; };
  return `<div class="f2-t5g" style="grid-template-columns:repeat(2,minmax(0,1fr))">${box('다캐불량')}${box('가공불량')}</div>`;
}
/* 12주 추이 (한 공정 + 선택 품번 1위 불량) */
function f2Trend12(weeks, i, week, proc, pt){
  const trW = weeks.slice(Math.max(0,(i<0?weeks.length:i+1)-12), i<0?weeks.length:i+1);
  const top1 = pt ? f2TopN(r=>r['주차']===week, proc, pt.no, null, 1)[0] : null;
  const part = pt ? { no:pt.no, name:pt.name, topName: top1 ? top1.t : null } : null;
  const list = trW.map(w=>{ const pr = r=>r['주차']===w; const o = { k:w, s:f2Sum(pr) };
    if(part && part.topName) o.topCnt = F2.det.filter(r=>pr(r) && r['공정']===proc && r['구분']==='NG' && r['Part no.']===part.no && r['불량유형']===part.topName).reduce((a,r)=>a+f2n(r['수량']),0);
    return o; });
  return `<div class="sec-title">${T('f2.p.'+proc)} · ${T('f2.trend12')}${part&&part.topName?` · ${esc2(part.name)} ${T('f2.top1')} “${esc2(part.topName)}”`:''}</div>${f2TrendTableP(list, T('ctl.week'), week, proc, part && part.topName ? part : null)}`;
}

function f2Dash(week){
  const weeks = f2Weeks(), i = weeks.indexOf(week), pw = i>0 ? weeks[i-1] : null;
  const pred = r=>r['주차']===week, s = f2Sum(pred), p = pw ? f2Sum(r=>r['주차']===pw) : null;
  if(!s.days.length) return `<div class="sec-title">${T('grp.fac2')} · ${week}</div><div class="card empty">${T('f2.noWeek',{w:week})}<br>${T('f2.have',{a:weeks[0]||'-',b:weeks[weeks.length-1]||'-'})}</div>`;
  const ow = [...new Set(F2.pd.filter(pred).map(r=>r['원본주차']).filter(Boolean))].join(', ');
  const cM = f2PartChipsP(s,'MCT'), cO = f2PartChipsP(s,'OQC');
  return `
    <div class="sec-title">${T('grp.fac2')} · ${week}${ow?` (${T('f2.orig')} ${esc2(ow)})`:''} · ${s.days[0]} ~ ${s.days[s.days.length-1]} · ${T('u.days',{n:s.days.length})}</div>
    ${f2SecHead('MCT')}
    ${f2KpiRow('MCT', s.MCT, p && p.MCT)}
    <div class="sec-title">${T('f2.mwk')}</div>${f2McWorstTable(pred, pw?(r=>r['주차']===pw):null, pw, week)}
    <div class="sec-title">${T('f2.p.MCT')} · ${T('f2.parts')}</div>${f2PartTableP(s,'MCT')}
    <div class="sec-title">${T('f2.m.sec')}</div>${f2Measure(pred)}
    <div class="sec-title">${T('f2.mcs')}</div>${f2McTable(pred)}
    <div class="sec-title">${T('f2.p.MCT')} · ${T('f2.top5r')}</div>${cM.html}${cM.cur?f2Top5Boxes(pred, cM.cur, 'MCT'):`<div class="card empty">${T('f2.none5')}</div>`}
    ${f2Trend12(weeks, i, week, 'MCT', cM.cur)}
    ${f2SecHead('OQC')}
    ${f2KpiRow('OQC', s.OQC, p && p.OQC)}
    <div class="sec-title">${T('f2.p.OQC')} · ${T('f2.parts')}</div>${f2PartTableP(s,'OQC')}
    <div class="sec-title">${T('f2.p.OQC')} · ${T('f2.top5r')}</div>${cO.html}${cO.cur?f2Top5Boxes(pred, cO.cur, 'OQC'):`<div class="card empty">${T('f2.none5')}</div>`}
    ${f2Trend12(weeks, i, week, 'OQC', cO.cur)}
    <div class="foot">${T('f2.f1')}<br>${T('f2.f2')}<br>${T('f2.f3',{t:f2Target()})}</div>`;
}

/* ---- 일일 / 주간 / 월간 품질보고 ---- */
/* ---------- 일일 불량률 추이 (보고서 맨 앞) — SVG 선 차트 · 목표선 · 보고 기간 음영 · 마우스 툴팁 ---------- */
window.__qt = window.__qt || {};
function qtSmooth(P){   /* 단조 3차 곡선 (Fritsch–Carlson) — 값보다 튀어나가지 않는 부드러운 선 */
  const n = P.length; if(!n) return ''; if(n < 3) return P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const dx = [], sl = [], m = [];
  for(let i=0;i<n-1;i++){ dx[i] = P[i+1][0]-P[i][0]; sl[i] = (P[i+1][1]-P[i][1]) / (dx[i]||1); }
  m[0] = sl[0]; m[n-1] = sl[n-2];
  for(let i=1;i<n-1;i++) m[i] = (sl[i-1]*sl[i] <= 0) ? 0 : 3*(dx[i-1]+dx[i]) / ((2*dx[i]+dx[i-1])/sl[i-1] + (dx[i]+2*dx[i-1])/sl[i]);
  let d = 'M'+P[0][0].toFixed(1)+' '+P[0][1].toFixed(1);
  for(let i=0;i<n-1;i++){ const h = dx[i]/3;
    d += ` C${(P[i][0]+h).toFixed(1)} ${(P[i][1]+m[i]*h).toFixed(1)} ${(P[i+1][0]-h).toFixed(1)} ${(P[i+1][1]-m[i+1]*h).toFixed(1)} ${P[i+1][0].toFixed(1)} ${P[i+1][1].toFixed(1)}`; }
  return d;
}
function qtTrendHtml(o){
  /* o = { id, title, sub, dates:[YYYY-MM-DD], series:[{name,color,vals:[n|null],main}], target, tLabel, hiFrom, hiTo } */
  /* 🔍 확대 — 노란 음영(보고 기간) 날짜만 남겨 다시 그린다 (설정은 그래프마다 이 브라우저에 저장) */
  const hiIdx0 = (o.hiFrom && o.hiTo) ? o.dates.map((d,i)=>d>=o.hiFrom && d<=o.hiTo ? i : -1).filter(i=>i>=0) : [];
  const zoomOn = qtZoomGet(o.id) && hiIdx0.length > 0;
  if (zoomOn){ const o0 = o, ix = hiIdx0;
    o = { ...o0, dates:ix.map(i=>o0.dates[i]), series:o0.series.map(s=>({ ...s, vals:ix.map(i=>s.vals[i]) })),
          bars:o0.bars ? { ...o0.bars, vals:ix.map(i=>o0.bars.vals[i]) } : o0.bars,
          extra:o0.extra ? (j=>o0.extra(ix[j])) : o0.extra, maxLbl:undefined }; }
  const tools = `<span class="qt-tools">${hiIdx0.length || zoomOn
      ? `<button type="button" class="${zoomOn?'on':''}" onclick="qtZoom('${o.id}')" title="노란 음영(보고 기간)만 · 세로축을 값에 맞춰 크게 보기">${zoomOn?'↩ 전체 보기':'🔍 보고기간 확대'}</button>` : ''}
    <button type="button" onclick="qtShot('${o.id}')" title="그래프를 PNG 이미지로 저장 · 클립보드 복사">📷 스크린샷</button></span>`;
  /* 개선 조치 표시 — 메모 첫 줄(조치 제목) + 사진 썸네일을 날짜 위에, 그 날짜에 세로 점선 (조치 전·후 비교)
     겹치면 아래 줄로 (최대 3줄), 그래도 겹치면 세로선·건수만 */
  const TW = 84, TH = 50, CAP = 15, TG = 5;
  const Lx = 46, Rx = o.rx || 92, nn = o.dates.length, xw0 = (1000-Lx-Rx) / Math.max(1, nn-1);
  const X0 = i => nn===1 ? (Lx+(1000-Lx-Rx)/2) : Lx + i*xw0;
  const thumbs = []; let rowsUsed = 0;
  if (o.noteScope){ const lastX = [-1e9, -1e9, -1e9];
    o.dates.forEach((d,i)=>{ const L = noteFor(d, o.noteTag); if(!L.length) return;
      const ph = L.flatMap(x=>x.photos||[]);
      const cap = (L.find(x=>x.text) || {}).text || '';
      const x = Math.max(Lx + TW/2 - 20, Math.min(1000 - Rx + 30, X0(i)));
      const r = [0,1,2].find(k => x - TW/2 >= lastX[k] + TG);
      const t = { ids: L.map(x=>x.id), i, d, r: r==null ? -1 : r, src: ph[0] ? ph[0].src : '', n: ph.length, m: L.length, cap: cap.split('\n')[0].trim() };
      if (t.r >= 0){ lastX[t.r] = x + TW/2; rowsUsed = Math.max(rowsUsed, t.r+1); t.cx = x; }
      thumbs.push(t); }); }
  const SLOT = TH + CAP + TG;
  const SH = rowsUsed ? rowsUsed*SLOT + 6 : 0;
  const BH = o.bars ? 64 : 0;   /* 생산수량 막대 띠 (선 차트 아래, 같은 날짜축) */
  const W = 1000, H = (zoomOn ? 360 : 250) + SH + BH, L = Lx, R = Rx, T = (o.noteScope ? 24 : 16) + SH, B = 34, PB = H - B - BH;
  const n = o.dates.length;
  const all = o.series.flatMap(s=>s.vals).filter(v=>v!=null);
  if (!n || !all.length) return '';
  let ymax = Math.max(o.target || 0, ...all) * 1.15; ymax = ymax <= 0 ? 1 : ymax;
  let ymin = 0, stp = [0.5,1,2,2.5,5,10,20,25,50].find(s=>ymax/s <= 6) || 100; ymax = Math.ceil(ymax/stp)*stp;
  if (zoomOn){   /* 확대: 세로축을 값 범위(목표선 포함)에 맞춘다 — 0 부터 시작하지 않음 */
    const hiV = Math.max(...all, o.target || -Infinity), loV = Math.min(...all, o.target || Infinity), span = Math.max(hiV - loV, 0.5);
    stp = [0.1,0.2,0.25,0.5,1,2,2.5,5,10,20,25,50].find(s=>span*1.3/s <= 7) || 100;
    ymin = Math.max(0, Math.floor((loV - span*0.15)/stp)*stp); ymax = Math.ceil((hiV + span*0.15)/stp)*stp;
    if (ymax <= ymin) ymax = ymin + stp; }
  const xw = (W-L-R) / Math.max(1, n-1);
  const X = i => n===1 ? (L+(W-L-R)/2) : L + i*xw, Y = v => T + (PB-T)*(1 - (v-ymin)/(ymax-ymin));
  let g = '';
  /* 보고 기간 음영 */
  const hi = o.dates.map((d,i)=>d>=o.hiFrom && d<=o.hiTo ? i : -1).filter(i=>i>=0);
  if (hi.length){ const x0 = X(hi[0]) - (n>1?xw/2:20), x1 = X(hi[hi.length-1]) + (n>1?xw/2:20);
    g += `<rect x="${Math.max(L,x0).toFixed(1)}" y="${T}" width="${(Math.min(W-R,x1)-Math.max(L,x0)).toFixed(1)}" height="${PB-T}" fill="#fde68a" opacity=".35"/>`; }
  /* 격자 · y축 */
  for (let v=ymin; v<=ymax+1e-9; v+=stp){ const y = Y(v).toFixed(1);
    g += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#e5e7eb" stroke-width="1"/>`
       + `<text x="${L-6}" y="${(+y+4)}" text-anchor="end" font-size="11" fill="#6b7280">${+v.toFixed(2)}%</text>`; }
  /* 생산수량 막대 */
  if (o.bars){ const bv = o.bars.vals, bmax = Math.max(1, ...bv.filter(v=>v!=null)), by0 = PB + 12, bh = H - B - by0 - 4;
    const bw = Math.max(3, Math.min(22, xw*0.6)), kf = v => v>=10000 ? Math.round(v/1000)+'k' : v>=1000 ? (v/1000).toFixed(1)+'k' : String(v);
    g += `<line x1="${L}" x2="${W-R}" y1="${H-B-4}" y2="${H-B-4}" stroke="#cbd5e1" stroke-width="1"/>`
       + `<text x="${L-16}" y="${(by0+bh/2+4).toFixed(1)}" text-anchor="end" font-size="10" font-weight="700" fill="#64748b">${o.bars.name}</text>`;
    bv.forEach((v,i)=>{ if(!v) return; const h = (bh-12) * v / bmax, x = X(i), y = H - B - 4 - h;
      const inP = o.dates[i]>=o.hiFrom && o.dates[i]<=o.hiTo;
      g += `<rect x="${(x-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${inP?'#64748b':'#cbd5e1'}"/>`;
      if (xw >= 22 || inP || v===bmax) g += `<text x="${x.toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="${inP?800:600}" fill="${inP?'#111827':'#64748b'}">${kf(v)}</text>`; }); }
  /* x축 라벨 (겹치지 않게 솎아냄) */
  const every = Math.ceil(n / 15);
  o.dates.forEach((d,i)=>{ if (i % every && i !== n-1) return; const w = new Date(d+'T00:00:00Z').getUTCDay();
    g += `<text x="${X(i).toFixed(1)}" y="${H-B+16}" text-anchor="middle" font-size="10.5" fill="${w===0?'#dc2626':'#6b7280'}">${d.slice(5).replace('-','/')}</text>`; });
  /* 목표선 */
  if (o.target){ const y = Y(o.target).toFixed(1);
    g += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>`
; }
  /* 선 · 점 */
  const ends = [];
  o.series.forEach(s=>{
    /* 부드러운 곡선 (값을 넘지 않는 단조 3차) · 생산 없는 날은 건너뛰고 앞뒤 점을 이음 */
    const d = qtSmooth(s.vals.map((v,i)=>v==null ? null : [X(i), Y(v)]).filter(Boolean));
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.main?2.5:2}" stroke-linejoin="round" stroke-linecap="round"${s.dash?' stroke-dasharray="7 4"':''}${s.main?'':' opacity=".9"'}/>`;
    s.vals.forEach((v,i)=>{ if (v==null) return; const h = o.dates[i]>=o.hiFrom && o.dates[i]<=o.hiTo;
      g += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${h?4.5:3}" fill="${s.color}" stroke="#fff" stroke-width="1.5"/>`;
      if (h && s.main && !(o.maxLbl && hi.length > o.maxLbl)) g += `<text x="${X(i).toFixed(1)}" y="${(Y(v)-9).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">${v.toFixed(2)}</text>`; });
    let li = s.vals.length-1; while (li>=0 && s.vals[li]==null) li--;
    if (li>=0) ends.push({ y:Y(s.vals[li]), s, v:s.vals[li] });
  });
  /* 오른쪽 끝 직접 라벨 (겹치면 아래로 밀기) */
  if (o.target) ends.push({ y:Y(o.target), tg:true });
  ends.sort((a,b)=>a.y-b.y); let last = -99;
  ends.forEach(e=>{ const y = Math.max(e.y+4, last+13); last = y;
    g += e.tg ? `<text x="${W-R+6}" y="${y.toFixed(1)}" font-size="11" font-weight="700" fill="#b91c1c">${o.tLabel||'목표'} ${o.target}%</text>`
              : `<text x="${W-R+6}" y="${y.toFixed(1)}" font-size="11" font-weight="700" fill="#374151"><tspan fill="${e.s.color}">●</tspan>${e.s.tag?` <tspan fill="${e.s.color}" font-weight="800">${e.s.tag}</tspan>`:''} ${e.v.toFixed(2)}%${e.s.suf?` <tspan fill="${e.s.sufColor||e.s.color}" font-weight="900">${e.s.suf}</tspan>`:''}</text>`; });
  g += `<line id="${o.id}-x" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="#94a3b8" stroke-width="1" visibility="hidden"/>`;
  /* 메모 있는 날짜 표시 (📝 개수) */
  if (false) o.dates.forEach((d,i)=>{ const c = 0; if(!c) return;
    g += `<g pointer-events="none"><rect x="${(X(i)-9).toFixed(1)}" y="${T-14}" width="18" height="14" rx="4" fill="#f59e0b"/><text x="${X(i).toFixed(1)}" y="${T-3.5}" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">${c}</text></g>`; });
  g += `<rect x="${L-10}" y="${T}" width="${W-L-R+20}" height="${H-T}" fill="transparent"${o.noteScope?` style="cursor:pointer" onclick="qtClick(event,'${o.id}')"`:''} onmousemove="qtHover(event,'${o.id}')" onmouseleave="qtHover(null,'${o.id}')"/>`;
  const capTxt = v => { const a = [...String(v||'')]; return esc2(a.length > 8 ? a.slice(0,7).join('') + '…' : a.join('')); };
  /* 조치 날짜 세로선 (플롯 뒤쪽에 옅게) */
  let vl = '';
  thumbs.forEach(t=>{ const x = X(t.i).toFixed(1); vl += `<line x1="${x}" x2="${x}" y1="${T}" y2="${H-B}" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" opacity=".8" pointer-events="none"/>`; });
  g = vl + g;
  thumbs.forEach(t=>{
    const px = X(t.i);
    if (t.r < 0){   /* 자리 없음 → 플롯 위 건수 배지 */
      g += `<g style="cursor:pointer" onclick="noteOpen('${t.d}','${esc2(o.noteTag||'')}')"><title>${t.d} · ${esc2(t.cap)}</title><rect x="${(px-9).toFixed(1)}" y="${T-14}" width="18" height="14" rx="4" fill="#f59e0b"/><text x="${px.toFixed(1)}" y="${T-3.5}" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">${t.m}</text></g>`;
      return; }
    const x = t.cx, y = 6 + t.r*SLOT, cid = `${o.id}-c${t.i}`, x0 = (x-TW/2).toFixed(1);
    const md = `${t.d.slice(5).replace('-','/')}`;
    g += `<g style="cursor:pointer" onclick="noteOpen('${t.d}','${esc2(o.noteTag||'')}')"><title>${t.d} 조치 · ${esc2(t.cap)} (메모 ${t.m}건 · 사진 ${t.n}장)</title>`
       + `<polyline points="${x.toFixed(1)},${y+TH+CAP} ${x.toFixed(1)},${T-4} ${px.toFixed(1)},${T}" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2 2"/>`;
    if (t.src){
      g += `<clipPath id="${cid}"><rect x="${x0}" y="${y}" width="${TW}" height="${TH}" rx="5"/></clipPath>`
         + `<rect x="${(x-TW/2-1.5).toFixed(1)}" y="${y-1.5}" width="${TW+3}" height="${TH+CAP+3}" rx="6" fill="#f59e0b"/>`
         + `<image href="${esc2(t.src)}" x="${x0}" y="${y}" width="${TW}" height="${TH}" preserveAspectRatio="xMidYMid slice" clip-path="url(#${cid})"/>`
         + `<rect x="${x0}" y="${y}" width="36" height="13" rx="3" fill="rgba(17,24,39,.72)"/><text x="${(x-TW/2+18).toFixed(1)}" y="${y+10}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">${md}</text>`
         + (t.n>1 ? `<rect x="${(x+TW/2-21).toFixed(1)}" y="${y+TH-15}" width="20" height="14" rx="4" fill="rgba(17,24,39,.75)"/><text x="${(x+TW/2-11).toFixed(1)}" y="${y+TH-4.5}" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">+${t.n-1}</text>` : '');
    } else {
      g += `<rect x="${(x-TW/2-1.5).toFixed(1)}" y="${y+TH-18}" width="${TW+3}" height="${CAP+21}" rx="6" fill="#f59e0b"/>`
         + `<text x="${x.toFixed(1)}" y="${y+TH-5}" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">📝 ${md}</text>`;
    }
    g += `<text x="${x.toFixed(1)}" y="${y+TH+CAP-3.5}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">${capTxt(t.cap) || '조치'}</text></g>`;

  catch(e){ URL.revokeObjectURL(url); qtToast('스크린샷을 만들지 못했습니다'); return; }

  c.fillStyle = '#6b7280'; c.font = `500 12px ${font}`; c.fillText(sub, PAD + 12, PAD + 28);

    try{ if (navigator.clipboard && window.ClipboardItem){ await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); copied = true; } }catch(e){}

}

  window.__qtRe = window.__qtRe || {}; window.__qtRe.qtFac2 = () => renderF2();
  const R = qtRangePick('qtFac2', f2Dates(), dTo);

  const rows = R.dates.map(d => ({ d, a:f2Sum(r => r['일자'] === d && (!part || r['Part no.'] === part.no)).MCT, all:f2Sum(r => r['일자'] === d).MCT.t }))

  const pc = (x, k) => x.a.t ? +(x.a[k] / x.a.t * 100).toFixed(3) : null;

    dates:rows.map(x => x.d),

             { name:X.mc, color:'#eb6834', vals:rows.map(x => pc(x,'mc')) },

    ctl, noteScope:'FAC2', noteTag: part ? part.name : '', target:f2Target(), tLabel:X.tg, hiLabel:X.hi, hiFrom:dFrom, hiTo:dTo,
    bars:{ name:X.p, vals:rows.map(x => x.a.t || null) },

function f2Report(kind, topWeek){
  const dates = f2Dates(), weeks = f2Weeks(), months = [...new Set(dates.map(d=>d.slice(0,7)))].sort();
  let opts, cur, pred, prevKey, prevPred, label, trend = [], trendLbl = '';

    const first = dates[0], last = dates[dates.length-1];
    const rg = f2Range(); dFrom = rg.from || last; dTo = rg.to || last;
    if(dFrom < first) dFrom = first; if(dTo > last) dTo = last; if(dFrom > dTo){ const x = dFrom; dFrom = dTo; dTo = x; }
    const n = f2DayDiff(dFrom, dTo) + 1;

    else { const pf = f2AddDays(dFrom,-n), pt = f2AddDays(dFrom,-1); prevKey = `${pf} ~ ${pt}`; prevPred = r=>r['일자']>=pf && r['일자']<=pt; }

    label = n===1 ? dFrom : `${dFrom} ~ ${dTo} · ${T('u.days',{n})} (${T('f2.workDays',{n:inR.length})})`;
    if(inR.length > 1){ trendLbl = T('f2.byDay'); trend = inR.map(d=>({k:d, s:f2Sum(r=>r['일자']===d)})); }
    else { const i = dates.indexOf(dTo); trendLbl = T('f2.last7'); trend = dates.slice(Math.max(0,i-6), i+1).map(d=>({k:d, s:f2Sum(r=>r['일자']===d)})); }

    const i = weeks.indexOf(cur); prevKey = i>0 ? weeks[i-1] : null; prevPred = r=>r['주차']===prevKey;
    const ds = dates.filter(d=>F2.pd.some(r=>r['일자']===d && r['주차']===cur));

      <div>${esc2(label)} · ${T('f2.r.vs')} ${esc2(prevKey||'–')}<br><small>${T('f2.r.made',{d:new Date().toISOString().slice(0,10)})}</small></div></div>

/* PQC 행을 일일 품질보고가 읽는 모양(F2.pd · F2.det · F2.mq)으로 바꿔 「일일 품질보고」 함수를 그대로 쓴다.
   · 공정 이름은 보고서 함수가 MCT 로 찾으므로 'MCT' 로 넣고, 화면 글자만 PQC 로 바꾼다(PQ_OVR).
   · PQC 에는 UPD 와 Mat'l NG 가 없다 → 달성률 '–', Mat'l 0 */
let F2_PQ = false;
function pqShape(){
  const raw = F2.pqRaw || [];
  const code = k => { const m = String(k).match(/^\s*(\d{1,2})\s+(.+)$/); return m && +m[1]>=1 && +m[1]<=50 ? { c:+m[1], o:m[2].trim() } : null; };
  const cols = raw.length ? Object.keys(raw[0]).map(k=>({ k, x:code(k) })).filter(e=>e.x) : [];
  const pd = [], det = [], mq = [];
  raw.forEach(r=>{
    const d = String(r['일자']).slice(0,10), base = { '일자':d, '주차':r['주차'], '원본주차':r['원본주차'], '공장':'FAC2', 'Part name':r['Part name'], 'Part no.':String(r['Part no.']).trim() };
    pd.push({ ...base, '공정':'MCT', "Total Q'ty":r["Total Q'ty"], "FG Q'ty":r["FG Q'ty"], "NG Q'ty":r["NG Q'ty"], '다캐불량':r['다캐불량'], '가공불량':r['가공불량'], "Mat'l NG":0, '설비':r['설비명'] });
    mq.push({ ...r, '일자':d, 'OP':'', '생산수량':r["Total Q'ty"], '양품':r["FG Q'ty"], '불량수량':r["NG Q'ty"], "Mat'l NG":0, 'UPD_95':'' });
    cols.forEach(({k,x})=>{ const v = f2n(r[k]); if(!v) return;
      det.push({ ...base, '공정':'MCT', '설비명':r['설비명'], '구분':'NG', '코드':x.c, _orig:x.o, '불량유형':f2DefName(x.c, x.o), '계통':PQ_GRP_OF(x.c), '수량':v }); });
  });
  return { pd, det, mq };
}

/* PQC 데이터 · 글자를 잠깐 바꿔 끼우고 fn 을 실행한 뒤 원래대로 돌린다 */
function pqWith(fn){
  if(F2_PQ) return fn();
  const keep = { pd:F2.pd, det:F2.det, mq:F2.mq }, sh = pqShape();
  const dict = I18N[LANG] || I18N.ko, ovr = PQ_OVR[LANG] || PQ_OVR.ko, old = {};
  Object.keys(ovr).forEach(k=>{ old[k] = Object.prototype.hasOwnProperty.call(dict,k) ? dict[k] : undefined; dict[k] = ovr[k]; });
  F2.pd = sh.pd; F2.det = sh.det; F2.mq = sh.mq; F2_PQ = true;
  try{ return fn(); }
  finally{ F2.pd = keep.pd; F2.det = keep.det; F2.mq = keep.mq; F2_PQ = false;
    Object.keys(old).forEach(k=>{ if(old[k]===undefined) delete dict[k]; else dict[k] = old[k]; }); }
}
/* PQC 일일 관리현황 = 「일일 품질보고」와 같은 구성 (표지 · 추이 그래프 · 메모 · 1~6 · 특이사항) */
function pqReport(week){
  if(F2.loading && !(F2.pqRaw||[]).length) return `<div class="empty">${T('f2.loading')}</div>`;

  return pqWith(()=>f2Report('daily', week));
}

let activeTab = 'overview';

function buildTabs(){
  const gb=document.getElementById('grpBar'), bar=document.getElementById('tabBar'), main=document.getElementById('main');
  GROUPS.forEach((g,i)=>{
    const b=document.createElement('button'); b.setAttribute('role','tab'); b.dataset.grp=g;
    b.innerHTML=`<span class="gno">${i+1}</span><span data-i18n="grp.${g}">${T('grp.'+g)}</span>`;
    b.onclick=()=>selectGroup(g); gb.appendChild(b);
  });
  for(const t of TABS){
    if(t.sep){ const s=document.createElement('div'); s.className='tab-sep'; s.dataset.g=t.g; bar.appendChild(s); continue; }
    const b=document.createElement('button');
    b.setAttribute('role','tab'); b.dataset.tab=t.id; b.dataset.g=t.g; b.dataset.i18n='tab.'+t.id;
    b.textContent=T('tab.'+t.id);
    b.setAttribute('aria-selected', t.id===activeTab ? 'true':'false');
    if(t.tool) b.classList.add('tool');
    b.onclick=()=>selectTab(t.id);
    bar.appendChild(b);

    const p=document.createElement('section');
    p.className='panel'+(t.src?' frame':''); p.id='panel-'+t.id;
    p.dataset.active = t.id===activeTab ? 'true':'false';
    if(t.src) p.innerHTML=`<div class="frame-msg"><div class="spinner"></div><div data-frameload="${t.id}">${T('st.frameLoading',{name:T('tab.'+t.id)})}</div></div>`;
    main.appendChild(p);
  }
  showGroup(groupOf(activeTab));
}
const groupOf = id => { const t=TABS.find(x=>x.id===id); return t ? t.g : 'all'; };
function showGroup(g){
  document.querySelectorAll('#grpBar button').forEach(b=>b.setAttribute('aria-selected', b.dataset.grp===g ? 'true':'false'));
  document.querySelectorAll('#tabBar > *').forEach(el=>el.classList.toggle('hid', el.dataset.g!==g));
}

function mbPaste(){
  const c = mbClip(); if(!c) return;
  const L = mbList();
  if(L.some(x=>x.page===c.page && x.unit===c.unit) && !confirm(mbT('dup'))) return;

  mbSave(L); renderMyBoard();
  setTimeout(()=>{ const el = document.querySelector('#panel-myboard .mb-card:last-child'); if(el) el.scrollIntoView({ behavior:'smooth', block:'start' }); }, 50);
}
function mbMove(id, d){ const L = mbList(), i = L.findIndex(x=>x.id===id), j = i + d; if(i<0 || j<0 || j>=L.length) return; [L[i], L[j]] = [L[j], L[i]]; mbSave(L); renderMyBoard(); }
function mbDel(id){ if(!confirm(mbT('delQ'))) return; mbSave(mbList().filter(x=>x.id!==id)); renderMyBoard(); }
function mbReload(id){ const f = document.querySelector(`#panel-myboard .mb-card[data-mb="${id}"] iframe`); if(f){ const it = mbList().find(x=>x.id===id); if(it) f.src = mbSrc(it).replace(/v=[^&]*$/, 'v=' + Date.now().toString(36)); } }
/* 항목 페이지가 알려 주는 높이로 칸을 맞춘다 */
window.addEventListener('message', e=>{
  const d = e.data; if(!d || !d.stcEmbed || !d.k) return;

/* 다른 화면에서 복사하면 머리줄(붙여넣기 버튼)을 바로 바꾼다 */

setInterval(()=>{ if(activeTab==='myboard'){ const c = mbClip(), h = document.getElementById('panel-myboard'); if(h && h._mbSig && !h._mbSig.includes('|' + (c ? c.ts : '') + '|')) renderMyBoard(); } }, 1500);
