<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STC 설비관리 통합 대시보드</title>
<style>
/* =========================================================================
   STC 설비관리 통합 대시보드 (셸)
   - 기존 대시보드 파일은 전혀 수정하지 않는다. 각 탭은 원본 HTML을 그대로
     iframe 으로 불러오며(최초 열 때만 로드), Chart.js 3.9.1(주간 OEE)과
     4.5.0(MTTR/MTBF)이 서로 다른 문서에 있으므로 버전 충돌이 발생하지 않는다.
   - '종합' 탭만 이 파일이 직접 시트를 읽어 계산한다. 산식은 각 원본
     대시보드의 코드에서 그대로 옮겨왔다(하단 footnote에 근거 명시).
   - 라이트 전용: 품는 대상 페이지들이 라이트 전용이라 셸만 다크로 두면
     탭 전환 시 배색이 어긋난다.
   ========================================================================= */
:root{
  /* 기존 STC 대시보드 계열 브랜드 */
  --brand-1:#1e3c72; --brand-2:#2a5298;
  /* chrome & ink */
  --surface-1:#ffffff; --plane:#f2f4f7;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
  --grid:#e1e0d9; --hairline:rgba(11,11,11,.10);
  /* status (고정 — 시리즈 색으로 재사용하지 않음) */
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  /* sequential blue (magnitude) */
  --seq-250:#86b6ef; --seq-450:#2a78d6; --seq-600:#184f95; --seq-100:#cde2fb;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
  background:var(--plane); color:var(--ink-1);
  display:flex; flex-direction:column;
}

/* ---------- header ---------- */
header{
  background:linear-gradient(135deg,var(--brand-1) 0%,var(--brand-2) 100%);
  color:#fff; padding:14px 20px 12px; box-shadow:0 2px 8px rgba(0,0,0,.12); flex:0 0 auto;
}
.hd-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
h1{font-size:19px;font-weight:700;letter-spacing:-.01em;}
.hd-sub{font-size:12px;opacity:.82;}
.hd-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;}
.ctl{display:flex;align-items:center;gap:6px;}
.ctl label{font-size:11.5px;opacity:.85;font-weight:600;letter-spacing:.02em;}
.ctl select{
  padding:5px 9px;border:1px solid rgba(255,255,255,.35);border-radius:5px;
  background:rgba(255,255,255,.14);color:#fff;font-size:12.5px;font-weight:600;
  font-family:inherit;cursor:pointer;min-width:92px;
}
.ctl select option{color:#111;background:#fff;}
.btn-refresh{
  padding:5px 13px;border:1px solid rgba(255,255,255,.35);border-radius:5px;
  background:rgba(255,255,255,.14);color:#fff;font-size:12.5px;font-weight:700;
  font-family:inherit;cursor:pointer;
}
.btn-refresh:hover{background:rgba(255,255,255,.26);}
.btn-refresh:disabled{opacity:.5;cursor:not-allowed;}
.hd-status{font-size:11.5px;opacity:.82;margin-left:auto;text-align:right;line-height:1.5;}
.hd-status b{opacity:1;font-weight:700;}

/* ---------- tabs ---------- */
nav.tabs{
  background:var(--surface-1); border-bottom:1px solid var(--hairline);
  display:flex; gap:0; overflow-x:auto; flex:0 0 auto; padding:0 12px;
  scrollbar-width:thin;
}
nav.tabs button{
  appearance:none;border:none;background:none;font-family:inherit;
  padding:11px 15px 9px;font-size:13px;font-weight:600;color:var(--ink-2);
  cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;
}
nav.tabs button:hover{color:var(--brand-2);background:#f7f9fc;}
nav.tabs button[aria-selected="true"]{color:var(--brand-2);border-bottom-color:var(--brand-2);}
nav.tabs .tab-sep{width:1px;background:var(--grid);margin:9px 9px;flex:0 0 auto;}
nav.tabs .tool button{font-weight:500;}

/* ---------- panels ---------- */
main{flex:1 1 auto;position:relative;overflow:hidden;}
.panel{position:absolute;inset:0;display:none;}
.panel[data-active="true"]{display:block;}
.panel.frame iframe{width:100%;height:100%;border:none;display:block;background:var(--plane);}
.frame-msg{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:10px;color:var(--ink-muted);font-size:13px;background:var(--plane);
}
.spinner{
  width:26px;height:26px;border:3px solid var(--grid);border-top-color:var(--seq-450);
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- overview ---------- */
#panel-overview{overflow-y:auto;padding:18px 20px 30px;}
.ov{max-width:1280px;margin:0 auto;}
.card{
  background:var(--surface-1);border:1px solid var(--hairline);border-radius:10px;
  padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.05);
}
.sec-title{
  font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.04em;
  text-transform:uppercase;margin:22px 0 9px;
}
.sec-title:first-child{margin-top:0;}

/* hero + meters */
.hero-row{display:grid;grid-template-columns:minmax(230px,300px) 1fr;gap:14px;}
@media (max-width:820px){.hero-row{grid-template-columns:1fr;}}
.hero{display:flex;flex-direction:column;justify-content:center;gap:2px;}
.hero .lbl{font-size:12px;color:var(--ink-2);font-weight:600;}
.hero .val{font-size:56px;font-weight:650;line-height:1.02;letter-spacing:-.025em;}
.hero .val .u{font-size:24px;font-weight:600;margin-left:2px;color:var(--ink-2);}
.hero .eq{font-size:11.5px;color:var(--ink-muted);margin-top:6px;font-variant-numeric:tabular-nums;}
.hero .badge{
  display:inline-flex;align-items:center;gap:5px;align-self:flex-start;margin-top:8px;
  font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid;
}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media (max-width:640px){.meters{grid-template-columns:1fr;}}
.meter .mlbl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;}
.meter .mname{font-size:12.5px;font-weight:600;color:var(--ink-2);}
.meter .mval{font-size:26px;font-weight:650;letter-spacing:-.02em;}
.meter .mval .u{font-size:13px;color:var(--ink-2);margin-left:1px;font-weight:600;}
.track{height:9px;border-radius:99px;background:var(--seq-100);overflow:hidden;}
.fill{height:100%;border-radius:0 4px 4px 0;transition:width .35s ease;}
.meter .mnote{font-size:11px;color:var(--ink-muted);margin-top:6px;}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:12px;}
.tile .tlbl{font-size:11.5px;color:var(--ink-2);font-weight:600;margin-bottom:5px;}
.tile .tval{font-size:25px;font-weight:650;letter-spacing:-.02em;line-height:1.15;}
.tile .tval .u{font-size:12px;color:var(--ink-2);margin-left:2px;font-weight:600;}
.tile .tsub{font-size:11px;color:var(--ink-muted);margin-top:4px;line-height:1.45;}

/* table */
table.eq{width:100%;border-collapse:collapse;font-size:12.5px;}
table.eq th,table.eq td{padding:7px 9px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap;}
table.eq th{
  font-size:11px;color:var(--ink-2);font-weight:700;text-align:right;
  border-bottom:1.5px solid var(--ink-muted);letter-spacing:.02em;
  position:sticky;top:0;background:var(--surface-1);z-index:1;
}
table.eq th:first-child,table.eq td:first-child{text-align:left;}
table.eq td{font-variant-numeric:tabular-nums;}
table.eq tbody tr:hover{background:#f7f9fc;}
table.eq td.name{font-weight:700;}
.barcell{display:flex;align-items:center;gap:8px;justify-content:flex-end;}
.bartrack{display:block;width:86px;height:10px;background:var(--seq-100);border-radius:2px;overflow:hidden;flex:0 0 auto;}
.barfill{display:block;height:100%;border-radius:0 4px 4px 0;}
.pill{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle;}
.tblwrap{overflow-x:auto;}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin-top:10px;}
.legend span{display:flex;align-items:center;gap:5px;}

.foot{font-size:11px;color:var(--ink-muted);line-height:1.85;margin-top:18px;}
.foot b{color:var(--ink-2);}
.err{
  background:#fdecea;border:1px solid #f5c6c2;color:#a7302a;border-radius:8px;
  padding:13px 15px;font-size:13px;line-height:1.7;
}
.empty{color:var(--ink-muted);font-size:13px;padding:22px 0;text-align:center;}
</style>
</head>
<body>

<header>
  <div class="hd-top">
    <h1>STC 설비관리 통합 대시보드</h1>
    <span class="hd-sub">다이캐스팅 DC1~DC23 · OEE · 품질 6σ · MTTR/MTBF</span>
    <div class="hd-status" id="hdStatus">불러오는 중…</div>
  </div>
  <div class="hd-controls">
    <div class="ctl"><label for="weekSel">주차</label><select id="weekSel"><option>…</option></select></div>
    <div class="ctl"><label for="scopeSel">범위</label>
      <select id="scopeSel"><option value="regular">정규</option><option value="all">전체(특근 포함)</option></select>
    </div>
    <button class="btn-refresh" id="btnRefresh">새로고침</button>
    <div class="ctl"><label for="syncChk" style="cursor:pointer;">
      <input type="checkbox" id="syncChk" checked style="vertical-align:-1px;margin-right:4px;">각 탭에 주차 적용
    </label></div>
  </div>
</header>

<nav class="tabs" id="tabBar" role="tablist"></nav>

<main id="main"></main>

<script>
/* =========================================================================
   0. 탭 정의 — 원본 파일명만 바꾸면 되고, 필요 없는 탭은 이 배열에서 지우면 된다.
   ========================================================================= */
const TABS = [
  { id:'overview', label:'종합',        src:null },
  { id:'weekly',   label:'주간 OEE',    src:'STC_OEE_Dashboard_Weekly.html' },
  { id:'quality',  label:'품질 6σ',     src:'STC_OEE_Quality_SixSigma.html' },
  { id:'mttr',     label:'MTTR / MTBF', src:'DC_MTTR_MTBF_Dashboard_GoogleSheets.html' },
  { sep:true },
  { id:'loss',     label:'설비/Loss 분석', src:'STC_OEE_LossAnalysis.html',  tool:true },
  { id:'period',   label:'기간별 종합',    src:'STC_OEE_PeriodSummary.html', tool:true },
  { id:'conv',     label:'데이터 변환기',  src:'STC_OEE_DataConverter.html', tool:true }
];

/* =========================================================================
   1. 시트 원천 — 주간 OEE 대시보드(STC_OEE_Dashboard_Weekly.html)와 동일 키/GID
   ========================================================================= */
const SHEET_PUB_KEY = '2PACX-1vQ6U8gG0Mr3oJ-5XOOzr7Eh_oZGc-BGHFG0n1__eor4Zc8aJaMuf01NXCAHJECH6U8aUvtnQGLKD5-_';
const GID_A = '345197688', GID_P = '287133604', GID_Q = '116850424';
const sheetCsvUrl = gid => `https://docs.google.com/spreadsheets/d/e/${SHEET_PUB_KEY}/pub?gid=${gid}&single=true&output=csv`;

/* 보유 설비가 아닌 번호는 집계에서 제외한다. */
const EXCLUDE_EQ = new Set(['DC14']);

/* MTTR/MTBF 기본 판정기준 — DC_MTTR_MTBF_Dashboard_GoogleSheets.html 의 UDT_DEFAULT(12종) 그대로.
   그 탭에서 기준을 바꿨다면 탭 값이 기준이며, 종합 탭은 아래 기본기준으로만 보여준다. */
const UDT_DEFAULT = ['설비수리','취출기수리','스프레이수리','래들수리',
  '컨베이어수리','히터수리','펌프이상','진공설비',
  '노즐막힘','플런저오일막힘','설비냉각수','금형수리'];

/* 판정 임계값 — 여기만 고치면 색/등급이 전부 따라온다. */
const TH = {
  OEE:{good:85,warn:70,bad:60}, A:{good:90,warn:80,bad:70},
  P:{good:95,warn:85,bad:75},   Q:{good:99,warn:95,bad:90}
};

/* =========================================================================
   2. CSV 파싱 / 숫자 — 주간 OEE 대시보드와 동일 구현
   ========================================================================= */
function parseCSV(text){
  const rows=[]; let row=[],field='',inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; } else field+=c; }
    else{
      if(c==='"') inQ=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\r'){}
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  const header=rows[0]||[];
  return rows.slice(1)
    .filter(r=>!(r.length===1&&r[0]===''))
    .map(r=>{ const o={}; header.forEach((h,i)=>o[h]=r[i]); return o; });
}
const num = v => { const n=parseFloat(v); return isNaN(n)?0:n; };
const eqOf = r => String(r['설비명']||'').trim();
const hasCol = (rows,name) => rows.length>0 && Object.prototype.hasOwnProperty.call(rows[0],name);

/* 쉬프트시간 표기 흔들림 흡수 — 주간 OEE 대시보드의 shiftMinutesOf 와 동일 */
function shiftMinutesOf(r){
  for(const k of ['쉬프트시간_분','쉬프트시간(분)','쉬프트시간 (분)','쉬프트시간']){
    const v=r[k];
    if(v!==undefined&&v!==null&&String(v).trim()!=='') return num(v);
  }
  return num(r['계획시간_분']);
}

/* 시그마 — 품질 6σ 대시보드의 invNorm(Acklam) + 1.5σ shift 그대로 */
function invNorm(p){
  if(p<=0) return -Infinity; if(p>=1) return Infinity;
  const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00];
  const b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01];
  const c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00];
  const d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
  const plow=0.02425, phigh=1-plow; let q,r;
  if(p<plow){ q=Math.sqrt(-2*Math.log(p));
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if(p<=phigh){ q=p-0.5; r=q*q;
    return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1); }
  q=Math.sqrt(-2*Math.log(1-p));
  return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
}
const sigmaFromPPM = ppm => ppm==null ? null : invNorm(Math.max(1e-9,Math.min(1-1e-9,1-ppm/1e6)))+1.5;

/* 표시 헬퍼 */
const fmt  = (v,d=0) => v==null||!isFinite(v) ? '–' : v.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtK = v => v==null||!isFinite(v) ? '–' : (v>=1e6 ? (v/1e6).toFixed(1)+'M' : v>=10000 ? Math.round(v/1000)+'K' : v.toLocaleString('ko-KR'));
function statusOf(v,th){
  if(v==null||!isFinite(v)) return {c:'var(--ink-muted)',label:'–',icon:'–'};
  if(v>=th.good) return {c:'var(--good)',    label:'양호', icon:'●'};
  if(v>=th.warn) return {c:'var(--warning)', label:'주의', icon:'▲'};
  if(v>=th.bad)  return {c:'var(--serious)', label:'경고', icon:'▲'};
  return              {c:'var(--critical)', label:'심각', icon:'■'};
}

/* =========================================================================
   3. 집계 — 주간 OEE 대시보드의 computeA/computeP/computeQ 와 동일 정의
      A = Σ가동시간 ÷ Σ쉬프트시간 · P = 성능(P)열 단순평균 · Q = ΣGood ÷ ΣTotal
      OEE = A × P × Q ÷ 10,000
   ========================================================================= */
let RAW = { a:[], p:[], q:[] };

const inScope = (r,scope) => scope!=='regular' || r['구분']==='정규';
const keepEq  = r => { const e=eqOf(r); return e && !EXCLUDE_EQ.has(e); };

function aggregate(week, scope){
  const fa = RAW.a.filter(r=>r['주차']===week && inScope(r,scope) && keepEq(r));
  const fp = RAW.p.filter(r=>r['주차']===week && inScope(r,scope) && keepEq(r));
  const fq = RAW.q.filter(r=>r['주차']===week && inScope(r,scope) && keepEq(r));

  // A
  let plan=0, run=0, loss=0, nof=0, nofRows=0, udt=0;
  const udtCols = UDT_DEFAULT.filter(c=>hasCol(RAW.a,c));
  for(const r of fa){
    plan += shiftMinutesOf(r); run += num(r['가동시간_분']); loss += num(r['Losstime_분']);
    const nv = r['NOF'];
    if(nv!==undefined && String(nv).trim()!==''){ nof += num(nv); nofRows++; }
    for(const c of udtCols) udt += num(r[c]);
  }
  const A = plan>0 ? run/plan*100 : null;

  // P
  let psum=0, pcnt=0;
  for(const r of fp){
    const raw=r['성능(P)'];
    if(raw===undefined||raw===null||String(raw).trim()==='') continue;
    const v=num(raw); if(!v) continue;
    psum+=v; pcnt++;
  }
  const P = pcnt>0 ? psum/pcnt : null;

  // Q
  let good=0,total=0,bad=0,warm=0,qcnt=0;
  const hasWarmSplit = hasCol(RAW.q,'Warm(STD)') && hasCol(RAW.q,'Warm(Excess)');
  for(const r of fq){
    const t=num(r['Qty_Total']); if(t<=0) continue;
    qcnt++;
    total+=t; good+=num(r['Qty_Good']); bad+=num(r['불량수량']);
    warm += hasWarmSplit ? (num(r['Warm(STD)'])+num(r['Warm(Excess)'])) : num(r['웜샷']);
  }
  const Q = total>0 ? good/total*100 : null;
  const ppm = total>0 ? bad/total*1e6 : null;

  const OEE = (A!=null&&P!=null&&Q!=null) ? A*P*Q/10000 : null;
  const MTBF = nof>0 ? (run/60)/nof : null;        // 실가동시간(h) ÷ NOF
  const MTTR = nof>0 ? (udt/60)/nof : null;        // 계획외 고장정지시간(h) ÷ NOF

  const dates = [...new Set(fa.map(r=>r['일자']).filter(Boolean))].sort();

  return { A,P,Q,OEE, plan,run,loss, nof,nofRows,udt,udtCols,
           good,total,bad,warm,ppm, sigma:sigmaFromPPM(ppm),
           MTBF,MTTR, dates, rowsA:fa.length, rowsP:pcnt, rowsQ:qcnt, hasWarmSplit,
           byEq: byEquipment(fa,fq) };
}

function byEquipment(fa,fq){
  const m = {};
  const get = e => (m[e] = m[e] || {eq:e,plan:0,run:0,loss:0,nof:0,total:0,good:0,bad:0});
  for(const r of fa){
    const o=get(eqOf(r));
    o.plan+=shiftMinutesOf(r); o.run+=num(r['가동시간_분']); o.loss+=num(r['Losstime_분']);
    const nv=r['NOF']; if(nv!==undefined&&String(nv).trim()!=='') o.nof+=num(nv);
  }
  for(const r of fq){
    const t=num(r['Qty_Total']); if(t<=0) continue;
    const o=get(eqOf(r)); o.total+=t; o.good+=num(r['Qty_Good']); o.bad+=num(r['불량수량']);
  }
  return Object.values(m).map(o=>({
    ...o,
    A: o.plan>0 ? o.run/o.plan*100 : null,
    Q: o.total>0 ? o.good/o.total*100 : null
  })).filter(o=>o.plan>0||o.total>0);
}

/* =========================================================================
   4. 종합 탭 렌더
   ========================================================================= */
function renderOverview(){
  const host = document.getElementById('panel-overview');
  const week = document.getElementById('weekSel').value;
  const scope = document.getElementById('scopeSel').value;
  if(!RAW.a.length){ host.innerHTML = '<div class="ov"><div class="empty">데이터가 없습니다.</div></div>'; return; }

  const d = aggregate(week, scope);
  const sO=statusOf(d.OEE,TH.OEE), sA=statusOf(d.A,TH.A), sP=statusOf(d.P,TH.P), sQ=statusOf(d.Q,TH.Q);
  const period = d.dates.length ? `${d.dates[0]} ~ ${d.dates[d.dates.length-1]} · ${d.dates.length}일` : '–';

  const meter = (name,val,st,note) => `
    <div class="card meter">
      <div class="mlbl"><span class="mname">${name}</span>
        <span class="mval" style="color:${st.c}">${val==null?'–':val.toFixed(1)}<span class="u">%</span></span></div>
      <div class="track"><div class="fill" style="width:${val==null?0:Math.max(0,Math.min(100,val))}%;background:${st.c}"></div></div>
      <div class="mnote">${st.icon} ${st.label} · ${note}</div>
    </div>`;

  const tile = (lbl,val,unit,sub,color) => `
    <div class="card tile"><div class="tlbl">${lbl}</div>
      <div class="tval"${color?` style="color:${color}"`:''}>${val}${unit?`<span class="u">${unit}</span>`:''}</div>
      ${sub?`<div class="tsub">${sub}</div>`:''}</div>`;

  // 문제 순 정렬: 가동률 낮은 순 → 품질 낮은 순
  const rows = d.byEq.slice().sort((x,y)=>{
    const ax=x.A==null?999:x.A, ay=y.A==null?999:y.A;
    if(ax!==ay) return ax-ay;
    return (x.Q==null?999:x.Q)-(y.Q==null?999:y.Q);
  });
  const worst = rows.filter(r=>{
    const a=statusOf(r.A,TH.A).label, q=statusOf(r.Q,TH.Q).label;
    return a==='심각'||a==='경고'||q==='심각'||q==='경고';
  }).slice(0,5);

  host.innerHTML = `
  <div class="ov">
    <div class="sec-title">${week} · ${scope==='regular'?'정규':'전체(특근 포함)'} · ${period}</div>

    <div class="hero-row">
      <div class="card hero">
        <div class="lbl">종합 설비효율 OEE</div>
        <div class="val" style="color:${sO.c}">${d.OEE==null?'–':d.OEE.toFixed(1)}<span class="u">%</span></div>
        <div class="eq">${d.A==null?'–':d.A.toFixed(1)} × ${d.P==null?'–':d.P.toFixed(1)} × ${d.Q==null?'–':d.Q.toFixed(1)} ÷ 10,000</div>
        <span class="badge" style="color:${sO.c};border-color:${sO.c};background:${sO.c}12">${sO.icon} ${sO.label}</span>
      </div>
      <div class="meters">
        ${meter('가동률 (A)', d.A, sA, `가동 ${fmt(d.run)}분 ÷ 쉬프트 ${fmt(d.plan)}분`)}
        ${meter('성능 (P)',   d.P, sP, `유효 ${fmt(d.rowsP)}행 평균`)}
        ${meter('품질 (Q)',   d.Q, sQ, `양품 ${fmtK(d.good)} ÷ 투입 ${fmtK(d.total)}`)}
      </div>
    </div>

    <div class="sec-title">생산 · 품질</div>
    <div class="tiles">
      ${tile('총 생산수량', fmt(d.total), '', `${fmt(d.rowsQ)}행 집계`)}
      ${tile('총 불량수량', fmt(d.bad), '', `투입 대비 ${d.total>0?(d.bad/d.total*100).toFixed(2):'–'}%`)}
      ${tile('웜샷', fmt(d.warm), '', d.hasWarmSplit?'Warm(STD)+Warm(Excess)':'웜샷 열')}
      ${tile('불량 PPM', d.ppm==null?'–':fmt(d.ppm), '', '불량수량 ÷ 투입수량 × 10⁶')}
      ${tile('시그마 레벨', d.sigma==null?'–':d.sigma.toFixed(2), 'σ', '1.5σ shift 적용',
              d.sigma==null?null:(d.sigma>=4?'var(--good)':d.sigma>=3?'var(--warning)':'var(--critical)'))}
    </div>

    <div class="sec-title">설비 신뢰성 · 로스</div>
    <div class="tiles">
      ${tile('고장횟수 NOF', fmt(d.nof), '건', `기록 ${fmt(d.nofRows)}행`)}
      ${tile('MTBF', d.MTBF==null?'–':d.MTBF.toFixed(1), 'h', '실가동시간 ÷ NOF')}
      ${tile('MTTR', d.MTTR==null?'–':d.MTTR.toFixed(2), 'h', '계획외 고장정지 ÷ NOF')}
      ${tile('계획외 고장정지', fmt(d.udt), '분', `UDT ${d.udtCols.length}종 기준`)}
      ${tile('총 Losstime', fmt(d.loss), '분', '계획정지 포함 전체 로스')}
    </div>

    ${worst.length ? `
    <div class="sec-title">먼저 볼 설비</div>
    <div class="card" style="padding:13px 16px;font-size:12.5px;line-height:1.95;">
      ${worst.map(r=>{
        const sa=statusOf(r.A,TH.A), sq=statusOf(r.Q,TH.Q);
        const bits=[];
        if(sa.label==='심각'||sa.label==='경고') bits.push(`가동률 <b style="color:${sa.c}">${r.A.toFixed(1)}%</b>`);
        if(sq.label==='심각'||sq.label==='경고') bits.push(`품질 <b style="color:${sq.c}">${r.Q.toFixed(1)}%</b>`);
        if(r.loss>0) bits.push(`Losstime ${fmt(r.loss)}분`);
        if(r.nof>0)  bits.push(`고장 ${fmt(r.nof)}건`);
        return `<div><span class="pill" style="background:${(sa.label==='심각'||sq.label==='심각')?'var(--critical)':'var(--serious)'}"></span><b>${r.eq}</b> — ${bits.join(' · ')}</div>`;
      }).join('')}
    </div>` : ''}

    <div class="sec-title">설비별 현황 (문제 순)</div>
    <div class="card">
      <div class="tblwrap">
        <table class="eq">
          <thead><tr>
            <th>설비</th><th>가동률(A)</th><th>품질(Q)</th>
            <th>생산수량</th><th>불량수량</th><th>Losstime(분)</th><th>NOF</th>
          </tr></thead>
          <tbody>
          ${rows.map(r=>{
            const sa=statusOf(r.A,TH.A), sq=statusOf(r.Q,TH.Q);
            return `<tr>
              <td class="name">${r.eq}</td>
              <td><div class="barcell">
                    <span style="color:${sa.c};font-weight:700">${r.A==null?'–':r.A.toFixed(1)+'%'}</span>
                    <span class="bartrack"><span class="barfill" style="width:${r.A==null?0:Math.max(0,Math.min(100,r.A))}%;background:${sa.c}"></span></span>
                  </div></td>
              <td style="color:${sq.c};font-weight:700">${r.Q==null?'–':r.Q.toFixed(1)+'%'}</td>
              <td>${r.total?fmt(r.total):'–'}</td>
              <td>${r.total?fmt(r.bad):'–'}</td>
              <td>${fmt(r.loss)}</td>
              <td>${r.nof?fmt(r.nof):'–'}</td>
            </tr>`;
          }).join('')}
          </tbody>
        </table>
      </div>
      <div class="legend">
        <span><i class="pill" style="background:var(--good)"></i>양호</span>
        <span><i class="pill" style="background:var(--warning)"></i>주의</span>
        <span><i class="pill" style="background:var(--serious)"></i>경고</span>
        <span><i class="pill" style="background:var(--critical)"></i>심각</span>
        <span style="color:var(--ink-muted)">가동률 ${TH.A.good}/${TH.A.warn}/${TH.A.bad}% · 품질 ${TH.Q.good}/${TH.Q.warn}/${TH.Q.bad}% 기준</span>
      </div>
    </div>

    <div class="foot">
      ※ 산식은 각 원본 대시보드와 동일합니다 — <b>A</b> = Σ가동시간 ÷ Σ쉬프트시간 · <b>P</b> = 성능(P)열 단순평균 · <b>Q</b> = Σ양품 ÷ Σ투입수량 · <b>OEE</b> = A×P×Q÷10,000 (주간 OEE 대시보드 기준).<br>
      ※ <b>시그마 레벨</b> = Φ⁻¹(1 − PPM/10⁶) + 1.5 (품질 6σ 대시보드와 동일한 Acklam 역정규 근사).<br>
      ※ <b>MTBF/MTTR</b> 은 MTTR/MTBF 대시보드의 <b>기본 판정기준(UDT ${UDT_DEFAULT.length}종)</b>과 시트 NOF 열로 계산한 값입니다. 그 탭에서 판정기준·최소정지시간을 바꾸셨다면 <b>탭의 값이 기준</b>이며 여기 숫자와 다를 수 있습니다.<br>
      ※ <b>${[...EXCLUDE_EQ].join(', ')}</b> 은 보유 설비가 아니므로 집계에서 제외했습니다.<br>
      ※ 이 화면은 이상 징후를 빨리 찾기 위한 요약입니다. 원인 분석은 위 탭에서 이어서 보세요.
    </div>
  </div>`;
}

/* =========================================================================
   5. 탭 (원본 페이지는 최초 열 때만 iframe 으로 로드)
   ========================================================================= */
let activeTab = 'overview';

function buildTabs(){
  const bar=document.getElementById('tabBar'), main=document.getElementById('main');
  for(const t of TABS){
    if(t.sep){ const s=document.createElement('div'); s.className='tab-sep'; bar.appendChild(s); continue; }
    const b=document.createElement('button');
    b.textContent=t.label; b.setAttribute('role','tab'); b.dataset.tab=t.id;
    b.setAttribute('aria-selected', t.id===activeTab ? 'true':'false');
    if(t.tool) b.classList.add('tool');
    b.onclick=()=>selectTab(t.id);
    bar.appendChild(b);

    const p=document.createElement('section');
    p.className='panel'+(t.src?' frame':''); p.id='panel-'+t.id;
    p.dataset.active = t.id===activeTab ? 'true':'false';
    if(t.src) p.innerHTML='<div class="frame-msg"><div class="spinner"></div><div>'+t.label+' 불러오는 중…</div></div>';
    main.appendChild(p);
  }
}

function selectTab(id){
  activeTab=id;
  document.querySelectorAll('#tabBar button').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===id ? 'true':'false'));
  document.querySelectorAll('.panel').forEach(p=>p.dataset.active = p.id==='panel-'+id ? 'true':'false');
  try{ localStorage.setItem('stc_portal_tab', id); }catch(e){}
  const t=TABS.find(x=>x.id===id);
  if(t && t.src) ensureFrame(t);
}

function ensureFrame(t){
  const panel=document.getElementById('panel-'+t.id);
  if(panel.querySelector('iframe')) return;          // 이미 로드됨
  const f=document.createElement('iframe');
  f.title=t.label; f.loading='lazy'; f.src=t.src;
  f.onload=()=>{ const m=panel.querySelector('.frame-msg'); if(m) m.remove(); syncWeekToFrame(f); };
  f.onerror=()=>{ panel.innerHTML='<div class="frame-msg">'+t.label+' 페이지를 불러오지 못했습니다 — 같은 폴더에 '+t.src+' 가 있는지 확인해주세요.</div>'; };
  panel.appendChild(f);
}

/* 같은 저장소(동일 origin)라 셸에서 각 페이지의 주차 선택을 맞춰줄 수 있다.
   페이지마다 구조가 달라 '되면 맞추고, 안 되면 조용히 넘어가는' 최선노력 방식이다. */
function syncWeekToFrame(frame, tries){
  if(!document.getElementById('syncChk').checked) return;
  tries = tries||0;
  const week=document.getElementById('weekSel').value;
  let doc=null;
  try{ doc = frame.contentDocument; }catch(e){ return; }   // 교차출처면 포기
  if(!doc){ return; }
  const sel = doc.getElementById('weekSelect') || doc.querySelector('select[id*="eek"]');
  const ok = sel && [...sel.options].some(o=>o.value===week);
  if(ok){
    if(sel.value!==week){ sel.value=week; sel.dispatchEvent(new Event('change',{bubbles:true})); }
    return;
  }
  if(tries<12) setTimeout(()=>syncWeekToFrame(frame,tries+1), 500);  // 자식이 아직 로딩 중일 수 있다
}
function syncWeekToAllFrames(){
  document.querySelectorAll('.panel iframe').forEach(f=>syncWeekToFrame(f));
}

/* =========================================================================
   6. 로드
   ========================================================================= */
function setStatus(html){ document.getElementById('hdStatus').innerHTML=html; }

async function fetchCSV(gid){
  const res = await fetch(sheetCsvUrl(gid), {cache:'no-store'});
  if(!res.ok) throw new Error(`시트(gid=${gid}) 응답 오류 ${res.status}`);
  return parseCSV(await res.text());
}

function populateWeeks(){
  const weeks=[...new Set(RAW.a.map(r=>r['주차']).filter(Boolean))]
    .sort((a,b)=>{ const na=parseInt(String(a).replace(/\D/g,''),10), nb=parseInt(String(b).replace(/\D/g,''),10);
                   return (isNaN(na)||isNaN(nb)) ? String(a).localeCompare(String(b)) : na-nb; });
  const sel=document.getElementById('weekSel');
  sel.innerHTML = weeks.map(w=>`<option value="${w}">${w}</option>`).join('');
  if(weeks.length) sel.value = weeks[weeks.length-1];
  return weeks;
}

async function loadAll(){
  const btn=document.getElementById('btnRefresh');
  btn.disabled=true; setStatus('시트를 불러오는 중…');
  try{
    const [a,p,q] = await Promise.all([fetchCSV(GID_A), fetchCSV(GID_P), fetchCSV(GID_Q)]);
    RAW={a,p,q};
    const weeks=populateWeeks();
    renderOverview();
    const now=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
    setStatus(`<b>${weeks.length}개 주차</b> · A ${a.length.toLocaleString()}행 / P ${p.length.toLocaleString()}행 / Q ${q.length.toLocaleString()}행<br>${now} 기준`);
  }catch(e){
    console.error(e);
    setStatus('<b>불러오기 실패</b>');
    document.getElementById('panel-overview').innerHTML =
      `<div class="ov"><div class="err"><b>시트를 불러오지 못했습니다.</b><br>${e.message}<br><br>
       구글시트가 <b>웹에 게시</b>된 상태인지 확인해주세요. 각 탭의 원본 대시보드는 이 오류와 무관하게 그대로 열립니다.</div></div>`;
  }finally{ btn.disabled=false; }
}

/* init */
buildTabs();
try{
  const saved=localStorage.getItem('stc_portal_tab');
  if(saved && TABS.some(t=>t.id===saved)) selectTab(saved);
}catch(e){}
document.getElementById('weekSel').addEventListener('change', ()=>{ renderOverview(); syncWeekToAllFrames(); });
document.getElementById('scopeSel').addEventListener('change', renderOverview);
document.getElementById('btnRefresh').addEventListener('click', loadAll);
document.getElementById('syncChk').addEventListener('change', e=>{ if(e.target.checked) syncWeekToAllFrames(); });
loadAll();
</script>
