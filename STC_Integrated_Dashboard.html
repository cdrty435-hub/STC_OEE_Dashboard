<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STC 설비관리 통합 대시보드</title>
<style>
/* =========================================================================
   STC 설비관리 통합 대시보드 (셸)  ·  한국어 / English / ไทย
   - 기존 대시보드 파일은 전혀 수정하지 않는다. 각 탭은 원본 HTML을 그대로
     iframe 으로 불러오며(최초 열 때만 로드), Chart.js 3.9.1(주간 OEE)과
     4.5.0(MTTR/MTBF·금형)이 서로 다른 문서에 있으므로 버전 충돌이 없다.
   - '종합' 탭만 이 파일이 직접 시트를 읽어 계산한다. 산식은 각 원본
     대시보드의 코드에서 그대로 옮겨왔다(하단 주석 참조).
   - 태국어/영어 용어는 품질 6σ·MTTR 대시보드가 이미 쓰는 표현에 맞췄다
     (가동률=อัตราเดินเครื่อง · 설비=เครื่องจักร · 금형=แม่พิมพ์ · 주차=สัปดาห์ 등).
   - 라이트 전용: 품는 대상 페이지들이 라이트 전용이라 셸만 다크로 두면
     탭 전환 시 배색이 어긋난다.
   ========================================================================= */
:root{
  --brand-1:#1e3c72; --brand-2:#2a5298;
  --surface-1:#ffffff; --plane:#f2f4f7;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
  --grid:#e1e0d9; --hairline:rgba(11,11,11,.10);
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --seq-100:#cde2fb; --seq-450:#2a78d6;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic","Noto Sans Thai",sans-serif;
  background:var(--plane); color:var(--ink-1); display:flex; flex-direction:column;
}
html[lang="th"] body{font-family:"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;}

header{
  background:linear-gradient(135deg,var(--brand-1) 0%,var(--brand-2) 100%);
  color:#fff; padding:14px 20px 12px; box-shadow:0 2px 8px rgba(0,0,0,.12); flex:0 0 auto;
}
.hd-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
h1{font-size:19px;font-weight:700;letter-spacing:-.01em;}
.hd-sub{font-size:12px;opacity:.82;}
.hd-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;}
.ctl{display:flex;align-items:center;gap:6px;}
.ctl label{font-size:11.5px;opacity:.85;font-weight:600;letter-spacing:.02em;}
.ctl select{
  padding:5px 9px;border:1px solid rgba(255,255,255,.35);border-radius:5px;
  background:rgba(255,255,255,.14);color:#fff;font-size:12.5px;font-weight:600;
  font-family:inherit;cursor:pointer;min-width:92px;
}
.ctl select option{color:#111;background:#fff;}
.btn-refresh{
  padding:5px 13px;border:1px solid rgba(255,255,255,.35);border-radius:5px;
  background:rgba(255,255,255,.14);color:#fff;font-size:12.5px;font-weight:700;
  font-family:inherit;cursor:pointer;
}
.btn-refresh:hover{background:rgba(255,255,255,.26);}
.btn-refresh:disabled{opacity:.5;cursor:not-allowed;}
/* 언어 선택 */
#langSwitch{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:5px;overflow:hidden;}
#langSwitch button{
  appearance:none;border:none;background:rgba(255,255,255,.08);color:#fff;
  font-family:inherit;font-size:12px;font-weight:700;padding:5px 11px;cursor:pointer;
  border-right:1px solid rgba(255,255,255,.22);
}
#langSwitch button:last-child{border-right:none;}
#langSwitch button:hover{background:rgba(255,255,255,.22);}
#langSwitch button[aria-pressed="true"]{background:#fff;color:var(--brand-1);}
.hd-status{font-size:11.5px;opacity:.82;margin-left:auto;text-align:right;line-height:1.5;}
.hd-status b{opacity:1;font-weight:700;}

nav.tabs{
  background:var(--surface-1); border-bottom:1px solid var(--hairline);
  display:flex; overflow-x:auto; flex:0 0 auto; padding:0 12px; scrollbar-width:thin;
}
nav.tabs button{
  appearance:none;border:none;background:none;font-family:inherit;
  padding:11px 15px 9px;font-size:13px;font-weight:600;color:var(--ink-2);
  cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;
}
nav.tabs button:hover{color:var(--brand-2);background:#f7f9fc;}
nav.tabs button[aria-selected="true"]{color:var(--brand-2);border-bottom-color:var(--brand-2);}
nav.tabs .tab-sep{width:1px;background:var(--grid);margin:9px 9px;flex:0 0 auto;}
nav.tabs button.tool{font-weight:500;}

nav.groups{background:#16305e;display:flex;gap:2px;padding:0 12px;overflow-x:auto;flex:0 0 auto;}
nav.groups button{appearance:none;border:none;background:none;color:rgba(255,255,255,.7);font-family:inherit;
  font-size:13.5px;font-weight:700;padding:9px 16px 8px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
nav.groups button:hover{color:#fff;background:rgba(255,255,255,.06);}
nav.groups button[aria-selected="true"]{color:#fff;border-bottom-color:#ffd166;}
nav.groups .gno{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;margin-right:6px;
  font-size:11px;text-align:center;background:rgba(255,255,255,.18);}
nav.groups button[aria-selected="true"] .gno{background:#ffd166;color:#16305e;}
nav.tabs .hid{display:none !important;}
main{flex:1 1 auto;position:relative;overflow:hidden;}
.panel{position:absolute;inset:0;display:none;}
.panel[data-active="true"]{display:block;}
.panel.frame iframe{width:100%;height:100%;border:none;display:block;background:var(--plane);}
.frame-msg{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:10px;color:var(--ink-muted);font-size:13px;background:var(--plane);
}
.spinner{width:26px;height:26px;border:3px solid var(--grid);border-top-color:var(--seq-450);
  border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

#panel-overview,#panel-f2ov{overflow-y:auto;padding:18px 20px 30px;}
.f2-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;}
@media (max-width:980px){.f2-grid{grid-template-columns:1fr;}}
.f2-bar{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;}
.f2-bl{flex:0 0 42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.f2-bt{flex:1 1 auto;width:auto !important;}
.f2-bv{flex:0 0 auto;min-width:74px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;}
.f2-bv small{font-weight:500;color:var(--ink-muted);}
.btn-f2{appearance:none;border:none;border-radius:5px;background:var(--brand-2);color:#fff;font-family:inherit;font-size:12px;font-weight:700;padding:7px 12px;cursor:pointer;}
.btn-f2.alt{background:#198754;}
.ov{max-width:1280px;margin:0 auto;}
.card{background:var(--surface-1);border:1px solid var(--hairline);border-radius:10px;
  padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.sec-title{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.04em;
  text-transform:uppercase;margin:22px 0 9px;}
.sec-title:first-child{margin-top:0;}

.hero-row{display:grid;grid-template-columns:minmax(230px,300px) 1fr;gap:14px;}
@media (max-width:820px){.hero-row{grid-template-columns:1fr;}}
.hero{display:flex;flex-direction:column;justify-content:center;gap:2px;}
.hero .lbl{font-size:12px;color:var(--ink-2);font-weight:600;}
.hero .val{font-size:56px;font-weight:650;line-height:1.02;letter-spacing:-.025em;}
.hero .val .u{font-size:24px;font-weight:600;margin-left:2px;color:var(--ink-2);}
.hero .eq{font-size:11.5px;color:var(--ink-muted);margin-top:6px;font-variant-numeric:tabular-nums;}
.hero .badge{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;margin-top:8px;
  font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid;}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media (max-width:640px){.meters{grid-template-columns:1fr;}}
.meter .mlbl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;gap:8px;}
.meter .mname{font-size:12.5px;font-weight:600;color:var(--ink-2);}
.meter .mval{font-size:26px;font-weight:650;letter-spacing:-.02em;white-space:nowrap;}
.meter .mval .u{font-size:13px;color:var(--ink-2);margin-left:1px;font-weight:600;}
.track{height:9px;border-radius:99px;background:var(--seq-100);overflow:hidden;}
.fill{height:100%;border-radius:0 4px 4px 0;transition:width .35s ease;}
.meter .mnote{font-size:11px;color:var(--ink-muted);margin-top:6px;}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;}
.tile .tlbl{font-size:11.5px;color:var(--ink-2);font-weight:600;margin-bottom:5px;}
.tile .tval{font-size:25px;font-weight:650;letter-spacing:-.02em;line-height:1.15;}
.tile .tval .u{font-size:12px;color:var(--ink-2);margin-left:2px;font-weight:600;}
.tile .tsub{font-size:11px;color:var(--ink-muted);margin-top:4px;line-height:1.45;}

table.eq{width:100%;border-collapse:collapse;font-size:12.5px;}
table.eq th,table.eq td{padding:7px 9px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap;}
table.eq th{font-size:11px;color:var(--ink-2);font-weight:700;text-align:right;
  border-bottom:1.5px solid var(--ink-muted);letter-spacing:.02em;
  position:sticky;top:0;background:var(--surface-1);z-index:1;}
table.eq th:first-child,table.eq td:first-child{text-align:left;}
table.eq td{font-variant-numeric:tabular-nums;}
table.eq tbody tr:hover{background:#f7f9fc;}
table.eq td.name{font-weight:700;}
.barcell{display:flex;align-items:center;gap:8px;justify-content:flex-end;}
.bartrack{display:block;width:86px;height:10px;background:var(--seq-100);border-radius:2px;overflow:hidden;flex:0 0 auto;}
.barfill{display:block;height:100%;border-radius:0 4px 4px 0;}
.pill{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle;}
.tblwrap{overflow-x:auto;}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin-top:10px;}
.legend span{display:flex;align-items:center;gap:5px;}
.foot{font-size:11px;color:var(--ink-muted);line-height:1.85;margin-top:18px;}
.foot b{color:var(--ink-2);}
.err{background:#fdecea;border:1px solid #f5c6c2;color:#a7302a;border-radius:8px;
  padding:13px 15px;font-size:13px;line-height:1.7;}
.empty{color:var(--ink-muted);font-size:13px;padding:22px 0;text-align:center;}
</style>
</head>
<body>

<header>
  <div class="hd-top">
    <h1 data-i18n="app.title">STC 설비관리 통합 대시보드</h1>
    <span class="hd-sub" data-i18n="app.sub">다이캐스팅 DC1~DC23 · OEE · 품질 6σ · MTTR/MTBF · 금형</span>
    <div class="hd-status" id="hdStatus"></div>
  </div>
  <div class="hd-controls">
    <div class="ctl"><label for="weekSel" data-i18n="ctl.week">주차</label><select id="weekSel"></select></div>
    <div class="ctl"><label for="scopeSel" data-i18n="ctl.scope">범위</label>
      <select id="scopeSel">
        <option value="regular" data-i18n="ctl.regular">정규</option>
        <option value="all" data-i18n="ctl.all">전체(특근 포함)</option>
      </select>
    </div>
    <button class="btn-refresh" id="btnRefresh" data-i18n="ctl.refresh">새로고침</button>
    <div class="ctl"><label for="syncChk" style="cursor:pointer;">
      <input type="checkbox" id="syncChk" checked style="vertical-align:-1px;margin-right:4px;"><span data-i18n="ctl.sync">각 탭에 주차 적용</span>
    </label></div>
    <div id="langSwitch" role="group" aria-label="Language">
      <button type="button" data-lang="ko">한국어</button>
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="th">ไทย</button>
    </div>
  </div>
</header>

<nav class="groups" id="grpBar" role="tablist"></nav>
<nav class="tabs" id="tabBar" role="tablist"></nav>
<main id="main"></main>

<script>
/* =========================================================================
   0. 탭 정의 — 파일명만 바꾸면 되고, 필요 없는 탭은 이 배열에서 지우면 된다.
      src 규칙
        · 'xxx.html'       → 이 파일과 같은 폴더(STC_OEE_Dashboard 저장소)
        · '/STC_MOLD/...'  → 같은 github.io 도메인의 다른 저장소(사이트 루트 기준 경로).
                             사용자 페이지(cdrty435-hub.github.io)라 도메인이 같아 동일
                             출처가 유지된다. 커스텀 도메인으로 옮기면 이 경로만 고치면 된다.
      noWeek:true → 그 페이지엔 주차 선택이 없으므로 주차 동기화를 시도하지 않는다.
   ========================================================================= */
const PORTAL_BUILD = Date.now().toString(36);   /* 열 때마다 바뀌는 캐시 무효화 표식 */
const GROUPS = ['all','fac1','fac2'];      /* 1. 종합(FAC1·FAC2)  2. FAC1 다이캐스팅  3. FAC2 MCT */
const TABS = [
  { id:'overview', g:'all',  src:null },
  { id:'weekly',   g:'fac1', src:'STC_OEE_Dashboard_Weekly.html' },
  { id:'quality',  g:'fac1', src:'STC_OEE_Quality_SixSigma.html' },
  { id:'mttr',     g:'fac1', src:'DC_MTTR_MTBF_Dashboard_GoogleSheets.html' },
  { id:'mold',     g:'fac1', src:'/STC_MOLD/mold.html', noWeek:true },
  { id:'moldsig',  g:'fac1', src:'STC_Mold_SixSigma_Dashboard.html', noWeek:true },
  { sep:true,      g:'fac1' },
  { id:'loss',     g:'fac1', src:'STC_OEE_LossAnalysis.html',  tool:true },
  { id:'lossdash', g:'fac1', src:'STC_Loss_Dashboard.html',    tool:true },
  { id:'monthly',  g:'fac1', src:'STC_OEE_Monthly_DC_Dashboard.html', tool:true, noWeek:true },
  { id:'kpi',      g:'fac1', src:'STC_KPI_Dashboard_Live.html', tool:true },
  { id:'period',   g:'fac1', src:'STC_OEE_PeriodSummary.html', tool:true },
  { sep:true,      g:'fac1' },
  { id:'conv',     g:'fac1', src:'STC_OEE_DataConverter.html', tool:true },
  { id:'f2ov',     g:'fac2', src:null },
  { id:'conv2',    g:'fac2', src:'STC_FAC2_DataConverter.html', tool:true, noWeek:true }
];

/* =========================================================================
   1. 다국어 사전
      태국어/영어 용어는 기존 대시보드 표현을 그대로 따랐다.
        품질 6σ  : 총 불량수량=จำนวนของเสียรวม · 불량 PPM=PPM ของเสีย · 주차=สัปดาห์
        MTTR/MTBF: 가동률=อัตราเดินเครื่อง · 설비=เครื่องจักร · 로스시간=เวลาสูญเสีย
                   고장=เสีย · 금형=แม่พิมพ์ · MTTR=MTTR (เวลาซ่อมเฉลี่ย)
   ========================================================================= */
const LANGS = ['ko','en','th'];
const LANG_KEY = 'stc_portal_lang';
const LOCALE = { ko:'ko-KR', en:'en-US', th:'th-TH' };

const I18N = {
ko:{
 'app.title':'STC 설비관리 통합 대시보드',
 'app.sub':'FAC1 다이캐스팅 DC1~DC23 · FAC2 MCT · OEE · 품질 6σ · MTTR/MTBF · 금형',
 'ctl.week':'주차','ctl.scope':'범위','ctl.regular':'정규','ctl.all':'전체(특근 포함)',
 'ctl.refresh':'새로고침','ctl.sync':'각 탭에 주차 적용',
 'tab.overview':'종합','tab.weekly':'주간 OEE','tab.quality':'품질 6σ','tab.mttr':'MTTR / MTBF',
 'tab.mold':'금형 수리이력','tab.loss':'설비/Loss 분석','tab.period':'기간별 종합','tab.conv':'FAC1 변환기','tab.conv2':'FAC2 변환기',
 'grp.all':'종합 (FAC1·FAC2)','grp.fac1':'FAC1 다이캐스팅','grp.fac2':'FAC2 MCT',
 'tab.moldsig':'금형 6σ','tab.lossdash':'로스 대시보드','tab.monthly':'월별 가동률','tab.kpi':'설비 KPI','tab.f2ov':'FAC2 현황',
 'f2.loading':'FAC2 데이터를 불러오는 중…','f2.none':'구글시트에서 FAC2 탭(F2_MCT_일별)을 찾지 못했습니다.',
 'f2.how':'① 「FAC2 변환기」로 CSV를 만들어 ② 구글시트에 탭 이름 <b>F2_MCT_일별 · F2_불량상세</b> 그대로 추가하고 ③ 시트 게시가 「전체 문서」인지 확인하세요. 자동으로 못 찾으면 각 탭 주소의 <b>gid=숫자</b>를 아래에 넣으세요.',
 'f2.retry':'저장 후 다시 불러오기','f2.noWeek':'{w} 주차 FAC2 데이터가 없습니다.','f2.have':'FAC2 데이터 범위: {a} ~ {b}',
 'f2.prod':'생산','f2.good':'양품','f2.rate':'불량률','f2.ngOf':'불량 {n}개 (Mat\'l·선별 제외)','f2.rMc':'가공불량률 (FAC2)','f2.rMcSub':'MCT 가공 원인 {n}개',
 'f2.rDc':'다캐불량률 (FAC1 유래)','f2.rDcSub':'소재 원인 {n}개 — 가공 후 발견','f2.yld':'실제수율 평균','f2.yldSub':'Σ생산 ÷ UPD(95%) · 설비·일 평균',
 'f2.mat':'Mat\'l NG','f2.matSub':'가공 전 소재 불량','f2.fg':'선별','f2.prev':'전주',
 'f2.days':'{n}일 · {a} ~ {b}','f2.more':'FAC2 현황 자세히','f2.orig':'원본',
 'f2.byMc':'설비별 (불량률 높은 순)','f2.dayN':'일수','f2.rMcS':'가공','f2.rDcS':'다캐','f2.yldS':'실제수율',
 'f2.top':'불량유형 TOP 8 (MCT)','f2.noDet':'F2_불량상세 탭이 없어 유형별 집계를 못 합니다.','f2.trend':'주차별 추이 (최근 8주)',
 'f2.g.가공불량':'가공(FAC2)','f2.g.다캐불량':'다캐(FAC1)','f2.g.협력사':'협력사','f2.g.고객':'고객',

function T(key, vars){
  /* 빈 문자열도 정상적인 번역이다(예: 영어에서 '건'에 해당하는 단위는 없음).
     truthy 검사로 폴백하면 한국어가 새어 나오므로 키 존재 여부로 판단한다. */
  const tbl = I18N[LANG] || {};
  let s = Object.prototype.hasOwnProperty.call(tbl,key) ? tbl[key]
        : (Object.prototype.hasOwnProperty.call(I18N.ko,key) ? I18N.ko[key] : key);
  if(vars) for(const k in vars) s = s.split('{'+k+'}').join(vars[k]);
  return s;
}

/* 보유 설비가 아닌 번호는 집계에서 제외한다. */
const EXCLUDE_EQ = new Set(['DC14']);

/* MTTR/MTBF 기본 판정기준 — MTTR 대시보드의 UDT_DEFAULT(12종) 그대로. */
const UDT_DEFAULT = ['설비수리','취출기수리','스프레이수리','래들수리',
  '컨베이어수리','히터수리','펌프이상','진공설비',
  '노즐막힘','플런저오일막힘','설비냉각수','금형수리'];

/* 판정 임계값 — 여기만 고치면 색/등급이 전부 따라온다. */
const TH = {
  OEE:{good:85,warn:70,bad:60}, A:{good:90,warn:80,bad:70},
  P:{good:95,warn:85,bad:75},   Q:{good:99,warn:95,bad:90}
};

/* =========================================================================
   3. CSV 파싱 / 숫자 — 주간 OEE 대시보드와 동일 구현
   ========================================================================= */
function parseCSV(text){
  const rows=[]; let row=[],field='',inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; } else field+=c; }
    else{
      if(c==='"') inQ=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\r'){}
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  const header=rows[0]||[];
  return rows.slice(1)
    .filter(r=>!(r.length===1&&r[0]===''))
    .map(r=>{ const o={}; header.forEach((h,i)=>o[h]=r[i]); return o; });
}
const num = v => { const n=parseFloat(v); return isNaN(n)?0:n; };
const eqOf = r => String(r['설비명']||'').trim();
const hasCol = (rows,name) => rows.length>0 && Object.prototype.hasOwnProperty.call(rows[0],name);

function shiftMinutesOf(r){
  for(const k of ['쉬프트시간_분','쉬프트시간(분)','쉬프트시간 (분)','쉬프트시간']){
    const v=r[k];
    if(v!==undefined&&v!==null&&String(v).trim()!=='') return num(v);
  }
  return num(r['계획시간_분']);
}

/* 시그마 — 품질 6σ 대시보드의 invNorm(Acklam) + 1.5σ shift 그대로 */
function invNorm(p){
  if(p<=0) return -Infinity; if(p>=1) return Infinity;
  const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00];
  const b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01];
  const c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00];
  const d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
  const plow=0.02425, phigh=1-plow; let q,r;
  if(p<plow){ q=Math.sqrt(-2*Math.log(p));
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if(p<=phigh){ q=p-0.5; r=q*q;
    return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1); }
  q=Math.sqrt(-2*Math.log(1-p));
  return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
}
const sigmaFromPPM = ppm => ppm==null ? null : invNorm(Math.max(1e-9,Math.min(1-1e-9,1-ppm/1e6)))+1.5;

/* 표시 헬퍼 — 숫자 표기는 선택 언어의 로캘을 따른다 */
const fmt  = (v,d=0) => v==null||!isFinite(v) ? '–'
  : v.toLocaleString(LOCALE[LANG],{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtK = v => v==null||!isFinite(v) ? '–'
  : (v>=1e6 ? (v/1e6).toFixed(1)+'M' : v>=10000 ? Math.round(v/1000)+'K' : fmt(v));
function statusOf(v,th){
  if(v==null||!isFinite(v)) return {c:'var(--ink-muted)',label:'–',icon:'–'};
  if(v>=th.good) return {c:'var(--good)',    label:T('g.good'),     icon:'●'};
  if(v>=th.warn) return {c:'var(--warning)', label:T('g.warn'),     icon:'▲'};
  if(v>=th.bad)  return {c:'var(--serious)', label:T('g.serious'),  icon:'▲'};
  return              {c:'var(--critical)', label:T('g.critical'), icon:'■'};
}

/* =========================================================================
   4. 집계 — 주간 OEE 대시보드의 computeA/computeP/computeQ 와 동일 정의
      A = Σ가동시간 ÷ Σ쉬프트시간 · P = 성능(P)열 단순평균 · Q = ΣGood ÷ ΣTotal
      OEE = A × P × Q ÷ 10,000
   ========================================================================= */
let RAW = { a:[], p:[], q:[] };
const inScope = (r,scope) => scope!=='regular' || r['구분']==='정규';
const keepEq  = r => { const e=eqOf(r); return e && !EXCLUDE_EQ.has(e); };

function aggregate(week, scope){
  const fa = RAW.a.filter(r=>r['주차']===week && inScope(r,scope) && keepEq(r));
  const fp = RAW.p.filter(r=>r['주차']===week && inScope(r,scope) && keepEq(r));
  const fq = RAW.q.filter(r=>r['주차']===week && inScope(r,scope) && keepEq(r));

  let plan=0, run=0, loss=0, nof=0, nofRows=0, udt=0;
  const udtCols = UDT_DEFAULT.filter(c=>hasCol(RAW.a,c));
  for(const r of fa){
    plan += shiftMinutesOf(r); run += num(r['가동시간_분']); loss += num(r['Losstime_분']);
    const nv = r['NOF'];
    if(nv!==undefined && String(nv).trim()!==''){ nof += num(nv); nofRows++; }
    for(const c of udtCols) udt += num(r[c]);
  }
  const A = plan>0 ? run/plan*100 : null;

  let psum=0, pcnt=0;
  for(const r of fp){
    const raw=r['성능(P)'];
    if(raw===undefined||raw===null||String(raw).trim()==='') continue;
    const v=num(raw); if(!v) continue;
    psum+=v; pcnt++;
  }
  const P = pcnt>0 ? psum/pcnt : null;

  let good=0,total=0,bad=0,warm=0,qcnt=0;
  const hasWarmSplit = hasCol(RAW.q,'Warm(STD)') && hasCol(RAW.q,'Warm(Excess)');
  for(const r of fq){
    const t=num(r['Qty_Total']); if(t<=0) continue;
    qcnt++;
    total+=t; good+=num(r['Qty_Good']); bad+=num(r['불량수량']);
    warm += hasWarmSplit ? (num(r['Warm(STD)'])+num(r['Warm(Excess)'])) : num(r['웜샷']);
  }
  const Q = total>0 ? good/total*100 : null;
  const ppm = total>0 ? bad/total*1e6 : null;
  const OEE = (A!=null&&P!=null&&Q!=null) ? A*P*Q/10000 : null;
  const MTBF = nof>0 ? (run/60)/nof : null;
  const MTTR = nof>0 ? (udt/60)/nof : null;
  const dates = [...new Set(fa.map(r=>r['일자']).filter(Boolean))].sort();

  return { A,P,Q,OEE, plan,run,loss, nof,nofRows,udt,udtCols,
           good,total,bad,warm,ppm, sigma:sigmaFromPPM(ppm),
           MTBF,MTTR, dates, rowsP:pcnt, rowsQ:qcnt, hasWarmSplit,
           byEq: byEquipment(fa,fq) };
}

function byEquipment(fa,fq){
  const m = {};
  const get = e => (m[e] = m[e] || {eq:e,plan:0,run:0,loss:0,nof:0,total:0,good:0,bad:0});
  for(const r of fa){
    const o=get(eqOf(r));
    o.plan+=shiftMinutesOf(r); o.run+=num(r['가동시간_분']); o.loss+=num(r['Losstime_분']);
    const nv=r['NOF']; if(nv!==undefined&&String(nv).trim()!=='') o.nof+=num(nv);
  }
  for(const r of fq){
    const t=num(r['Qty_Total']); if(t<=0) continue;
    const o=get(eqOf(r)); o.total+=t; o.good+=num(r['Qty_Good']); o.bad+=num(r['불량수량']);
  }
  return Object.values(m).map(o=>({
    ...o, A: o.plan>0 ? o.run/o.plan*100 : null, Q: o.total>0 ? o.good/o.total*100 : null
  })).filter(o=>o.plan>0||o.total>0);
}

/* =========================================================================
   5-2. FAC2 MCT — 구글시트 F2_* 탭 (FAC2 변환기로 만든 탭)을 읽어 요약
        · 주차는 FAC1 시트와 같은 수~화 기준(W39 = 9/16~9/22)이라 상단 주차 선택을 그대로 쓴다.
        · 읽는 경로(순서대로): ① 저장한 gid → ② 게시 CSV(sheet=탭이름) → ③ gviz(sheet=탭이름)
          돌아온 표에 필요한 머리글이 없으면(다른 탭이 온 경우) 다음 경로로 넘어간다.
   ========================================================================= */
const F2_SHEET_ID = '1m-b3Ur5VhewDhM0cbv39q8cuMm9Y0asyH1NyV0coDD4';
const F2_TAB = { day:'F2_MCT_일별', det:'F2_불량상세' };
const F2_NEED = { day:['일자','주차','설비명','생산수량','불량수량'], det:['주차','구분','불량유형','수량'] };
let F2 = { day:[], det:[], loaded:false, err:null, loading:false };
const f2n = v => { const s=String(v==null?'':v).replace(/,/g,'').trim(); if(!s) return 0;
  const p=s.endsWith('%'); const n=parseFloat(p?s.slice(0,-1):s); return isNaN(n)?0:(p?n/100:n); };
const f2gid = k => { try{ return localStorage.getItem('stc_f2_gid_'+k)||''; }catch(e){ return ''; } };
function f2Urls(k){
  const name = encodeURIComponent(F2_TAB[k]), u=[], g=f2gid(k);
  if(g) u.push(sheetCsvUrl(g));
  u.push(`https://docs.google.com/spreadsheets/d/e/${SHEET_PUB_KEY}/pub?output=csv&sheet=${name}`);
  u.push(`https://docs.google.com/spreadsheets/d/${F2_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${name}`);
  return u;
}
async function f2Fetch(k){
  let last = null;
  for(const u of f2Urls(k)){
    try{
      const res = await fetch(u,{cache:'no-store'}); if(!res.ok) throw new Error('HTTP '+res.status);
      const rows = parseCSV(await res.text());
      if(rows.length && F2_NEED[k].every(h=>hasCol(rows,h))) return rows;
      last = new Error(`「${F2_TAB[k]}」 머리글이 아님`);
    }catch(e){ last = e; }
  }
  throw last || new Error(F2_TAB[k]+' 없음');
}
async function loadF2(){
  F2.loading = true; F2.err = null; renderF2(); 
  try{
    F2.day = await f2Fetch('day');
    try{ F2.det = await f2Fetch('det'); }catch(e){ F2.det = []; }
    F2.loaded = true;
  }catch(e){ F2.loaded = false; F2.err = e.message || String(e); }
  F2.loading = false;
  renderF2(); if(RAW.a.length) renderOverview();
}
const wkNum = w => parseInt(String(w||'').replace(/\D/g,''),10) || 0;
function f2Weeks(){ return [...new Set(F2.day.map(r=>r['주차']).filter(Boolean))].sort((a,b)=>wkNum(a)-wkNum(b)); }
function f2Agg(week){
  const R = F2.day.filter(r=>r['주차']===week && f2n(r['생산수량'])>0);
  const s = { rows:R.length, prod:0, good:0, ng:0, dc:0, mc:0, sup:0, cus:0, mat:0, fg:0, ysum:0, yn:0, days:new Set(), byMc:{} };
  R.forEach(r=>{
    const v = k => f2n(r[k]);
    s.prod+=v('생산수량'); s.good+=v('양품'); s.ng+=v('불량수량'); s.dc+=v('다캐불량'); s.mc+=v('가공불량');
    s.sup+=v('협력사불량'); s.cus+=v('고객불량'); s.mat+=v("Mat'l NG"); s.fg+=v('FG QC Sorting');
    if(String(r['실제수율']||'').trim()!==''){ s.ysum+=v('실제수율'); s.yn++; }
    s.days.add(r['일자']);
    const m = r['설비명']; const o = s.byMc[m] || (s.byMc[m] = { mc:m, days:0, prod:0, ng:0, dc:0, mct:0, mat:0, ysum:0, yn:0, parts:new Set() });
    o.days++; o.prod+=v('생산수량'); o.ng+=v('불량수량'); o.dc+=v('다캐불량'); o.mct+=v('가공불량'); o.mat+=v("Mat'l NG");
    if(String(r['실제수율']||'').trim()!==''){ o.ysum+=v('실제수율'); o.yn++; }
    String(r['Part no.']||'').split('/').forEach(p=>p&&o.parts.add(p));
  });
  s.rate = s.prod ? s.ng/s.prod*100 : null; s.rMc = s.prod ? s.mc/s.prod*100 : null; s.rDc = s.prod ? s.dc/s.prod*100 : null;
  s.yld = s.yn ? s.ysum/s.yn*100 : null;
  s.dates = [...s.days].sort();
  return s;
}
function f2Top(week, n){
  const m = {};
  F2.det.filter(r=>r['주차']===week && r['구분']==='MCT').forEach(r=>{
    const k = r['불량유형']+'|'+r['계통']; m[k] = (m[k]||0) + f2n(r['수량']); });
  return Object.entries(m).map(([k,v])=>{ const [t,g]=k.split('|'); return {t,g,v}; }).sort((a,b)=>b.v-a.v).slice(0,n);
}
const F2_GCOLOR = { '가공불량':'#2a78d6', '다캐불량':'#c0392b', '협력사':'#8e44ad', '고객':'#7f7f7f', '미분류':'#9aa0a6' };
const dPct = (c,p,goodDown) => { if(c==null||p==null) return ''; const d=c-p; if(Math.abs(d)<0.005) return ` · ${T('f2.prev')} ±0`;
  const good = goodDown ? d<0 : d>0; return ` · ${T('f2.prev')} <b style="color:${good?'var(--good)':'var(--critical)'}">${d>0?'+':'−'}${Math.abs(d).toFixed(2)}%p</b>`; };

function esc2(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

      ${tile(T('f2.rate'), s.rate==null?'–':s.rate.toFixed(2), '%', T('f2.ngOf',{n:fmt(s.ng)}) + dPct(s.rate, p&&p.rate, true), rc(s.rate))}
      ${tile(T('f2.rMc'), s.rMc==null?'–':s.rMc.toFixed(2), '%', T('f2.rMcSub',{n:fmt(s.mc)}) + dPct(s.rMc, p&&p.rMc, true))}
      ${tile(T('f2.rDc'), s.rDc==null?'–':s.rDc.toFixed(2), '%', T('f2.rDcSub',{n:fmt(s.dc)}) + dPct(s.rDc, p&&p.rDc, true))}
      ${tile(T('f2.mat'), fmt(s.mat), '', T('f2.matSub') + (s.fg?` · ${T('f2.fg')} ${fmt(s.fg)}`:''))}
      ${tile(T('f2.yld'), s.yld==null?'–':s.yld.toFixed(1), '%', T('f2.yldSub') + dPct(s.yld, p&&p.yld, false))}

let activeTab = 'overview';

function buildTabs(){
  const gb=document.getElementById('grpBar'), bar=document.getElementById('tabBar'), main=document.getElementById('main');
  GROUPS.forEach((g,i)=>{
    const b=document.createElement('button'); b.setAttribute('role','tab'); b.dataset.grp=g;
    b.innerHTML=`<span class="gno">${i+1}</span><span data-i18n="grp.${g}">${T('grp.'+g)}</span>`;
    b.onclick=()=>selectGroup(g); gb.appendChild(b);
  });
  for(const t of TABS){
    if(t.sep){ const s=document.createElement('div'); s.className='tab-sep'; s.dataset.g=t.g; bar.appendChild(s); continue; }
    const b=document.createElement('button');
    b.setAttribute('role','tab'); b.dataset.tab=t.id; b.dataset.g=t.g; b.dataset.i18n='tab.'+t.id;
    b.textContent=T('tab.'+t.id);
    b.setAttribute('aria-selected', t.id===activeTab ? 'true':'false');
    if(t.tool) b.classList.add('tool');
    b.onclick=()=>selectTab(t.id);
    bar.appendChild(b);

    const p=document.createElement('section');
    p.className='panel'+(t.src?' frame':''); p.id='panel-'+t.id;
    p.dataset.active = t.id===activeTab ? 'true':'false';
    if(t.src) p.innerHTML=`<div class="frame-msg"><div class="spinner"></div><div data-frameload="${t.id}">${T('st.frameLoading',{name:T('tab.'+t.id)})}</div></div>`;
    main.appendChild(p);
  }
  showGroup(groupOf(activeTab));
}
const groupOf = id => { const t=TABS.find(x=>x.id===id); return t ? t.g : 'all'; };
function showGroup(g){
  document.querySelectorAll('#grpBar button').forEach(b=>b.setAttribute('aria-selected', b.dataset.grp===g ? 'true':'false'));
  document.querySelectorAll('#tabBar > *').forEach(el=>el.classList.toggle('hid', el.dataset.g!==g));
}
/* 묶음을 누르면 그 묶음에서 마지막으로 보던 탭(없으면 첫 탭)을 연다 */
function selectGroup(g){
  let last=null; try{ last=(JSON.parse(localStorage.getItem('stc_portal_gtab')||'{}'))[g]; }catch(e){}
  const t = TABS.find(x=>x.id===last && x.g===g) || TABS.find(x=>x.g===g && !x.sep);
  if(t) selectTab(t.id);
}

function selectTab(id){
  activeTab=id;
  const g = groupOf(id); showGroup(g);
  document.querySelectorAll('#tabBar button').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===id ? 'true':'false'));
  document.querySelectorAll('.panel').forEach(p=>p.dataset.active = p.id==='panel-'+id ? 'true':'false');
  try{ localStorage.setItem('stc_portal_tab', id);
       const m=JSON.parse(localStorage.getItem('stc_portal_gtab')||'{}'); m[g]=id; localStorage.setItem('stc_portal_gtab', JSON.stringify(m)); }catch(e){}
  const t=TABS.find(x=>x.id===id);
  if(t && t.src) ensureFrame(t);
  if(id==='f2ov') renderF2();
}

function ensureFrame(t){
  const panel=document.getElementById('panel-'+t.id);
  if(panel.querySelector('iframe')) return;
  const f=document.createElement('iframe');
  /* 캐시 무효화 — iframe 안 페이지는 Ctrl+F5 로도 새로 받지 않는 경우가 많다.
     통합 대시보드를 열 때마다 주소 끝에 버전 표식을 붙여 항상 최신 파일을 받게 한다. */
  f.title=T('tab.'+t.id); f.loading='lazy';
  f.src = t.src + (t.src.indexOf('?') >= 0 ? '&' : '?') + 'v=' + PORTAL_BUILD;
  if(t.noWeek) f.dataset.noweek='1';
  f.onload=()=>{ const m=panel.querySelector('.frame-msg'); if(m) m.remove();
                 syncWeekToFrame(f); syncLangToFrame(f); };
  f.onerror=()=>{ panel.innerHTML='<div class="frame-msg">'+T('st.frameErr',{name:T('tab.'+t.id),src:t.src})+'</div>'; };
  panel.appendChild(f);
}

/* 같은 도메인(cdrty435-hub.github.io)이라 셸에서 각 페이지의 주차 선택을 맞춰줄 수 있다.
   페이지마다 구조가 달라 '되면 맞추고, 안 되면 조용히 넘어가는' 최선노력 방식이다. */
function syncWeekToFrame(frame, tries){
  if(!document.getElementById('syncChk').checked) return;
  if(frame.dataset.noweek) return;
  tries = tries||0;
  const week=document.getElementById('weekSel').value;
  let doc=null;
  try{ doc = frame.contentDocument; }catch(e){ return; }
  if(!doc) return;
  const sel = doc.getElementById('weekSelect') || doc.querySelector('select[id*="eek"]');
  if(sel && [...sel.options].some(o=>o.value===week)){
    if(sel.value!==week){ sel.value=week; sel.dispatchEvent(new Event('change',{bubbles:true})); }
    return;
  }
  if(tries<12) setTimeout(()=>syncWeekToFrame(frame,tries+1), 500);
}
function syncWeekToAllFrames(){ document.querySelectorAll('.panel iframe').forEach(f=>syncWeekToFrame(f)); }

/* ---------- 언어 전파 ----------
   · 품질 6σ  : 전역 setLang('ko'|'th'|'en') 을 그대로 호출한다.
   · MTTR/MTBF: 한국어/태국어 2개뿐이라 #wkLang 버튼을 누른다(영어는 한국어로 둔다).
   · 나머지 페이지(주간 OEE·금형·Loss·기간별·변환기)는 원본이 한국어 전용이라 대상이 아니다.
   또한 자식들이 쓰는 localStorage 키를 미리 써 두므로, 아직 열지 않은 탭도
   나중에 열릴 때 바로 해당 언어로 뜬다(같은 도메인 = 같은 localStorage). */
function writeChildLangPrefs(){
  try{ localStorage.setItem('stc_oee_lang', LANG); }catch(e){}            // 품질 6σ
  try{ localStorage.setItem('stc_wk_lang', LANG==='th'?'th':'ko'); }catch(e){} // MTTR/MTBF
}
function syncLangToFrame(frame, tries){
  tries = tries||0;
  let win=null, doc=null;
  try{ win=frame.contentWindow; doc=frame.contentDocument; }catch(e){ return; }
  if(!doc) return;
  let done=false;
  try{ if(typeof win.setLang === 'function'){ win.setLang(LANG); done=true; } }catch(e){}
  if(!done){
    try{
      const want = (LANG==='th') ? 'th' : 'ko';
      const btn = doc.querySelector('#wkLang button[data-lang="'+want+'"]');
      if(btn){ btn.click(); done=true; }
    }catch(e){}
  }
  if(!done && tries<10) setTimeout(()=>syncLangToFrame(frame,tries+1), 500);
}
function syncLangToAllFrames(){ document.querySelectorAll('.panel iframe').forEach(f=>syncLangToFrame(f)); }

/* =========================================================================
   7. 언어 적용
   ========================================================================= */
function applyStaticI18n(){
  document.documentElement.lang = LANG;
  document.title = T('app.title');
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll('#langSwitch button').forEach(b=>
    b.setAttribute('aria-pressed', b.dataset.lang===LANG ? 'true':'false'));
  document.querySelectorAll('[data-frameload]').forEach(el=>{
    el.textContent = T('st.frameLoading',{name:T('tab.'+el.dataset.frameload)});
  });
}
function setLang(lang){
  if(LANGS.indexOf(lang)<0) return;
  LANG = lang;
  try{ localStorage.setItem(LANG_KEY, LANG); }catch(e){}
  writeChildLangPrefs();
  applyStaticI18n();
  renderOverview();
  renderF2();
  refreshStatus();
  syncLangToAllFrames();
}

let LAST = null;   // 마지막 로드 결과(언어 전환 시 상태줄을 다시 그리기 위해)

function setStatus(html){ document.getElementById('hdStatus').innerHTML=html; }
function refreshStatus(){
  if(!LAST) { setStatus(T('st.loading')); return; }
  if(LAST.error){ setStatus('<b>'+T('st.failed')+'</b>'); return; }
  /* 시각도 선택 언어의 로캘로 '그때그때' 포맷한다(문자열을 캐시하면 언어 전환 시 굳는다). */
  const tm = LAST.at.toLocaleTimeString(LOCALE[LANG],{hour:'2-digit',minute:'2-digit'});
  setStatus(`<b>${T('st.weeks',{n:LAST.weeks})}</b> · ${T('st.rows',{a:fmt(LAST.a),p:fmt(LAST.p),q:fmt(LAST.q)})}<br>${T('st.asof',{t:tm})}`);
}

async function fetchCSV(gid){
  const res = await fetch(sheetCsvUrl(gid), {cache:'no-store'});
  if(!res.ok) throw new Error(`시트(gid=${gid}) 응답 오류 ${res.status}`);
  return parseCSV(await res.text());
}

function populateWeeks(){
  const weeks=[...new Set(RAW.a.map(r=>r['주차']).filter(Boolean))]
    .sort((a,b)=>{ const na=parseInt(String(a).replace(/\D/g,''),10), nb=parseInt(String(b).replace(/\D/g,''),10);
                   return (isNaN(na)||isNaN(nb)) ? String(a).localeCompare(String(b)) : na-nb; });
  const sel=document.getElementById('weekSel');
  const keep=sel.value;
  sel.innerHTML = weeks.map(w=>`<option value="${w}">${w}</option>`).join('');
  if(weeks.indexOf(keep)>=0) sel.value=keep;
  else if(weeks.length) sel.value = weeks[weeks.length-1];
  return weeks;
}

async function loadAll(){
  const btn=document.getElementById('btnRefresh');
  btn.disabled=true; LAST=null; refreshStatus();
  loadF2();                                   /* FAC2 는 따로 읽는다 — 없어도 FAC1 은 그대로 뜬다 */
  try{
    const [a,p,q] = await Promise.all([fetchCSV(GID_A), fetchCSV(GID_P), fetchCSV(GID_Q)]);
    RAW={a,p,q};
    const weeks=populateWeeks();
    renderOverview();
    LAST={weeks:weeks.length,a:a.length,p:p.length,q:q.length,at:new Date()};
    refreshStatus();
  }catch(e){
    console.error(e);
    LAST={error:true}; refreshStatus();
    document.getElementById('panel-overview').innerHTML =
      `<div class="ov"><div class="err">${T('err.sheet',{msg:e.message})}</div></div>`;
  }finally{ btn.disabled=false; }
}

/* init */
buildTabs();
writeChildLangPrefs();
applyStaticI18n();
try{
  const saved=localStorage.getItem('stc_portal_tab');
  if(saved && TABS.some(t=>t.id===saved)) selectTab(saved);
}catch(e){}
document.getElementById('weekSel').addEventListener('change', ()=>{ renderOverview(); renderF2(); syncWeekToAllFrames(); });
document.getElementById('scopeSel').addEventListener('change', renderOverview);
document.getElementById('btnRefresh').addEventListener('click', loadAll);
document.getElementById('syncChk').addEventListener('change', e=>{ if(e.target.checked) syncWeekToAllFrames(); });
document.querySelectorAll('#langSwitch button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
loadAll();
</script>
