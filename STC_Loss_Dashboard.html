<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  --bg:#F2F4F6;--card:#FFFFFF;--line:#DFE4E9;--line2:#EDF0F3;
  --ink:#14181C;--sub:#4A545E;--mute:#79838D;
  --loss:#C0281F;--gain:#1B6E58;
  --c1:#C0281F;--c2:#C7860B;--c3:#2E5F8A;--c4:#98A0A8;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;font-size:14px;
  -webkit-font-smoothing:antialiased}
.n{font-variant-numeric:tabular-nums;font-family:var(--mono)}
.wrap{max-width:1560px;margin:0 auto;padding:0 20px 60px}

/* ---- top bar ---- */
.top{background:var(--ink);color:#EDF1F4;position:sticky;top:0;z-index:30}
.topin{max-width:1560px;margin:0 auto;padding:12px 20px;display:flex;gap:14px;
  align-items:flex-end;flex-wrap:wrap}
.brand{margin-right:auto}
.brand .k{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#8A949E}
.brand .t{font-size:16px;font-weight:600;margin-top:2px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#7A848E}
.top select,.top input{background:#242B33;color:#EDF1F4;border:1px solid #3A434D;border-radius:3px;
  padding:7px 10px;font-family:var(--mono);font-size:12.5px}
.seg{display:flex;border:1px solid #3A434D;border-radius:3px;overflow:hidden}
.seg button{background:transparent;border:0;color:#98A2AC;font-family:var(--mono);font-size:12.5px;
  padding:8px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#C0281F;color:#fff;font-weight:600}
.top button:focus-visible,.top select:focus-visible,.top input:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ---- kpi ---- */
.kpis{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:12px;margin:18px 0}
@media(max-width:1200px){.kpis{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
.kpi.hero{background:var(--ink);color:#fff;border-color:var(--ink)}
.kpi .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.kpi.hero .k{color:#98A2AC}
.kpi .v{font-family:var(--mono);font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.05;
  margin-top:8px;font-variant-numeric:tabular-nums}
.kpi.hero .v{font-size:44px;color:#FF7A5C}
.kpi .v small{font-size:.4em;font-weight:500;color:var(--mute);margin-left:5px}
.kpi.hero .v small{color:#98A2AC}
.kpi .d{font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:7px}
.kpi.hero .d{color:#B4BDC5;font-size:12px}

/* ---- panels ---- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px 18px 14px}
.ph{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.ph h2{font-size:14px;font-weight:600;margin:0}
.ph .s{font-family:var(--mono);font-size:11px;color:var(--mute)}
.ph .r{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mute)}
.row{display:grid;gap:12px;margin-bottom:12px}
.r-2{grid-template-columns:1fr 1fr}
.r-31{grid-template-columns:2fr 1fr}
.r-13{grid-template-columns:1fr 2fr}
@media(max-width:1100px){.r-2,.r-31,.r-13{grid-template-columns:1fr}}

svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--sub);margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;display:block}
.note{font-family:var(--mono);font-size:10.5px;color:var(--mute);line-height:1.7;margin-top:8px}

/* cat cards */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:900px){.cats{grid-template-columns:1fr 1fr}}
.cat{border:1px solid var(--line);border-radius:4px;padding:12px 13px;position:relative;overflow:hidden}
.cat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.cat .t{font-size:12.5px;font-weight:600}
.cat .v{font-family:var(--mono);font-size:20px;font-weight:700;margin:6px 0 1px;font-variant-numeric:tabular-nums}
.cat .m{font-family:var(--mono);font-size:10.5px;color:var(--mute)}
.bar0{height:5px;background:var(--line2);margin-top:9px}
.bar0 i{display:block;height:100%}

/* rank bars */
.rank{display:flex;flex-direction:column;gap:7px}
.rrow{display:grid;grid-template-columns:52px 1fr 150px;gap:10px;align-items:center;cursor:default}
.rn{font-family:var(--mono);font-size:12px;color:var(--sub)}
.rb{height:18px;display:flex;background:var(--line2)}
.rb i{display:block;height:100%}
.rv{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.rv span{color:var(--mute);font-size:10.5px;margin-left:6px}

/* picto */
.picto{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.mch{width:24px;height:32px;position:relative;border:1px solid var(--line);background:#F6F8F9}
.mch i{position:absolute;left:0;right:0;bottom:0;background:var(--loss)}

table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums}
th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);
  font-weight:500;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;position:sticky;top:0;background:var(--card)}
th:hover{color:var(--ink)} th.s::after{content:'▾';margin-left:5px;color:var(--loss)} th.s.asc::after{content:'▴'}
td.l,th.l{text-align:left} td.m{font-family:var(--mono)}
tbody tr:hover{background:#F7F9FA}
tfoot td{border-top:1px solid var(--ink);border-bottom:0;font-weight:700;font-family:var(--mono)}
.tw{max-height:420px;overflow:auto}
.sw{display:inline-block;width:9px;height:9px;margin-right:6px}
.zero{color:#B4BDC5}
footer{font-family:var(--mono);font-size:10.5px;color:var(--mute);line-height:1.9;
  border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
footer b{color:var(--sub);font-weight:500}
</style>
</head>

const src=(k,m)=>isM()?DATA.M[k][m]:DATA.W[k][m];
const runOf=(k,m)=>(isM()?DATA.RM:DATA.RW)[k][m]||0;

const kCatM=(k,c)=>DATA.mcs.reduce((s,m)=>s+src(k,m)[c],0);
const kCatT=(k,c)=>DATA.mcs.reduce((s,m)=>s+src(k,m)[c]*rate(m),0);
const kMin=k=>[0,1,2,3].reduce((s,c)=>s+kCatM(k,c),0);
const kThb=k=>[0,1,2,3].reduce((s,c)=>s+kCatT(k,c),0);
const kRun=k=>DATA.mcs.reduce((s,m)=>s+runOf(k,m),0);
const TOT=()=>KEYS().reduce((s,k)=>s+kThb(k),0);
const MINS=()=>KEYS().reduce((s,k)=>s+kMin(k),0);
const RUN=()=>KEYS().reduce((s,k)=>s+kRun(k),0);
const CATT=c=>KEYS().reduce((s,k)=>s+kCatT(k,c),0);
const CATM=c=>KEYS().reduce((s,k)=>s+kCatM(k,c),0);
const DAYS=()=>KEYS().reduce((s,k)=>s+daysOf(k),0);
const AVAIL=()=>{const r=RUN(),l=MINS();return (r+l)?r/(r+l):0;};
function gap(t){const T=RUN()+MINS(),tg=T*(1-t),cut=Math.max(MINS()-tg,0);
  return {cut,ratio:MINS()?cut/MINS():0,thb:MINS()?cut/MINS()*TOT():0};}
const mcCatT=(m,c)=>KEYS().reduce((s,k)=>s+src(k,m)[c]*rate(m),0);
const mcThb=m=>[0,1,2,3].reduce((s,c)=>s+mcCatT(m,c),0);
const mcMin=m=>KEYS().reduce((s,k)=>s+src(k,m).reduce((a,b)=>a+b,0),0);
function codeRows(){
  const idx=KEYS().map(k=>ALL().indexOf(k));
  return Object.entries(DATA.codesW).map(([n,o])=>({n,cat:o.cat,
    thb:idx.reduce((s,i)=>s+(isM()?o.mc:o.wc)[i],0),
    min:idx.reduce((s,i)=>s+(isM()?o.m:o.w)[i],0)}))
    .filter(x=>x.thb>0).sort((a,b)=>b.thb-a.thb);
}
const yr=v=>v/DAYS()*365, mon=v=>v/DAYS()*30;
const idleMc=()=>{const per=(RUN()+MINS())/60/LIVE.length;return per?MINS()/60/per:0;};
const lostEA=()=>MINS()/60*DATA.prodPerHour;

/* ============ SVG ============ */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;
  return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}

function combo(items,opt){
  opt=opt||{};
  const W=opt.w||1180,H=opt.h||360,L=68,R=92,T=52,B=42;
  const pw=W-L-R,ph=H-T-B;
  const maxM=niceMax(Math.max(...items.map(d=>d.parts.reduce((a,b)=>a+b,0)),1));
  const maxC=niceMax(Math.max(...items.map(d=>d.cost),1));
  const n=items.length,step=pw/n,bw=Math.min(step*.55,86);
  const yL=v=>T+ph-v/maxM*ph, yR=v=>T+ph-v/maxC*ph;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" preserveAspectRatio="xMidYMid meet">`;
  s+=`<rect x="${L}" y="${T-25}" width="11" height="11" fill="#C0281F"/>`;
  s+=`<text x="${L+16}" y="${T-15}" font-family="IBM Plex Mono" font-size="11.5" fill="#4A545E">막대 · 로스 합계 (시간 / 분) — 왼쪽 축</text>`;
  s+=`<line x1="${W-R-118}" x2="${W-R-104}" y1="${T-20}" y2="${T-20}" stroke="#14181C" stroke-width="2.4"/>`;
  s+=`<circle cx="${W-R-111}" cy="${T-20}" r="3.4" fill="#fff" stroke="#14181C" stroke-width="2"/>`;
  s+=`<text x="${W-R}" y="${T-15}" text-anchor="end" font-family="IBM Plex Mono" font-size="11.5" fill="#14181C">선 · 총 손실비용 (THB) — 오른쪽 축</text>`;
  [0,.25,.5,.75,1].forEach(t=>{const yy=yL(t*maxM);
    s+=`<line x1="${L}" x2="${W-R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}"
      stroke="${t===0?'#14181C':'#EDF0F3'}" stroke-width="${t===0?1.2:1}"/>`;
    s+=`<text x="${L-8}" y="${(yy+4).toFixed(1)}" text-anchor="end" font-family="IBM Plex Mono"
      font-size="10.5" fill="#79838D">${f(t*maxM/60)}${t===1?'h':''}</text>`;
    s+=`<text x="${W-R+8}" y="${(yy+4).toFixed(1)}" font-family="IBM Plex Mono"
      font-size="10.5" fill="#14181C">${K(t*maxC)}${t===1?' THB':''}</text>`;});
  const pts=[];
  items.forEach((d,i)=>{
    const x=L+step*i+(step-bw)/2;let acc=0;
    d.parts.forEach((p,ci)=>{const h=p/maxM*ph;
      if(h>0)s+=`<rect x="${x.toFixed(1)}" y="${(yL(acc)-h).toFixed(1)}" width="${bw.toFixed(1)}"
        height="${h.toFixed(1)}" fill="${CC[ci]}"><title>${d.label} · ${CN[ci]} · ${f(p)}분</title></rect>`;
      acc+=p;});
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(yL(acc)-19).toFixed(1)}" text-anchor="middle"
      font-family="IBM Plex Mono" font-size="12" font-weight="700" fill="#14181C">${f(acc/60)}시간</text>`;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(yL(acc)-7).toFixed(1)}" text-anchor="middle"
      font-family="IBM Plex Mono" font-size="10.5" font-weight="500" fill="#79838D">${f(acc)}분</text>`;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(T+ph+17).toFixed(1)}" text-anchor="middle"
      font-family="IBM Plex Mono" font-size="12" font-weight="600" fill="#14181C">${d.label}</text>`;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(T+ph+30).toFixed(1)}" text-anchor="middle"
      font-family="IBM Plex Mono" font-size="9.5" fill="#79838D">${d.sub}</text>`;
    pts.push([L+step*i+step/2,yR(d.cost),d]);
  });
  s+=`<polyline fill="none" stroke="#14181C" stroke-width="2.2" stroke-linejoin="round"
    points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>`;
  pts.forEach(p=>{
    s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.6" fill="#fff"
      stroke="#14181C" stroke-width="2.2"><title>${p[2].label} · ${f(p[2].cost)} THB</title></circle>`;
    const lab=f(p[2].cost)+' THB', bwid=lab.length*7.1+14, by=p[1]-25;
    s+=`<rect x="${(p[0]-bwid/2).toFixed(1)}" y="${by.toFixed(1)}" width="${bwid.toFixed(1)}" height="18"
      rx="2" fill="#14181C"/>`;
    s+=`<rect x="${(p[0]-bwid/2).toFixed(1)}" y="${by.toFixed(1)}" width="${bwid.toFixed(1)}" height="18"
      rx="2" fill="none" stroke="#14181C" stroke-width="0"/>`;
    s+=`<text x="${p[0].toFixed(1)}" y="${(by+13).toFixed(1)}" text-anchor="middle"
      font-family="IBM Plex Mono" font-size="11.5" font-weight="700" fill="#FFFFFF">${lab}</text>`;});
  return s+'</svg>';
}

function pareto(rows,W,H){
  W=W||760;H=H||290;
  const L=58,R=44,T=20,B=76,pw=W-L-R,ph=H-T-B;
  const tot=rows.reduce((s,r)=>s+r.thb,0)||1;
  const max=niceMax(Math.max(...rows.map(r=>r.thb)));
  const n=rows.length,step=pw/n,bw=step*.6;
  const y=v=>T+ph-v/max*ph, y2=p=>T+ph-p/100*ph;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  [0,.5,1].forEach(t=>{const v=t*max;
    s+=`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"
      stroke="${t===0?'#14181C':'#EDF0F3'}" stroke-width="${t===0?1.2:1}"/>`;
    s+=`<text x="${L-7}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" font-family="IBM Plex Mono"
      font-size="10" fill="#79838D">${K(v)}</text>`;});
  [50,100].forEach(p=>s+=`<text x="${W-R+7}" y="${(y2(p)+4).toFixed(1)}" font-family="IBM Plex Mono"
    font-size="10" fill="#79838D">${p}%</text>`);
  s+=`<line x1="${L}" x2="${W-R}" y1="${y2(50).toFixed(1)}" y2="${y2(50).toFixed(1)}"
    stroke="#C0281F" stroke-width="1" stroke-dasharray="5 4" opacity=".6"/>`;
  let acc=0;const pts=[],cum=[];
  rows.forEach((r,i)=>{
    const x=L+step*i+(step-bw)/2,h=r.thb/max*ph;
    s+=`<rect x="${x.toFixed(1)}" y="${y(r.thb).toFixed(1)}" width="${bw.toFixed(1)}"
      height="${h.toFixed(1)}" fill="${CC[CN.indexOf(r.cat)]}"><title>${r.n} · ${f(r.thb)} THB · ${f(r.min)}분</title></rect>`;
    acc+=r.thb;cum.push(acc/tot*100);pts.push([L+step*i+step/2,y2(acc/tot*100)]);
    s+=`<text transform="translate(${(L+step*i+step/2).toFixed(1)},${(T+ph+13).toFixed(1)}) rotate(-42)"
      text-anchor="end" font-family="IBM Plex Sans KR" font-size="10.5" fill="#14181C">${r.n}</text>`;});
  s+=`<polyline fill="none" stroke="#14181C" stroke-width="1.8"
    points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>`;
  pts.forEach((p,i)=>{s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#14181C"/>`;
    if(i%2===0||i===pts.length-1)
      s+=`<text x="${p[0].toFixed(1)}" y="${(p[1]-8).toFixed(1)}" text-anchor="middle"
        font-family="IBM Plex Mono" font-size="10" font-weight="600" fill="#14181C">${cum[i].toFixed(0)}%</text>`;});
  return s+'</svg>';
}

function compare(cur,tgt,W,H){
  W=W||330;H=H||180;
  const L=10,R=10,T=30,B=32,pw=W-L-R,ph=H-T-B;
  const y=v=>T+ph-v/100*ph,step=pw/2,bw=step*.5;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  s+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="#14181C" stroke-width="1.2"/>`;
  [[cur,'현재','#C0281F'],[tgt,'세계 수준','#1B6E58']].forEach((b,i)=>{
    const x=L+step*i+(step-bw)/2,h=b[0]/100*ph;
    s+=`<rect x="${x.toFixed(1)}" y="${y(b[0]).toFixed(1)}" width="${bw.toFixed(1)}"
      height="${h.toFixed(1)}" fill="${b[2]}"/>`;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y(b[0])-9).toFixed(1)}" text-anchor="middle"
      font-family="IBM Plex Mono" font-size="17" font-weight="700" fill="${b[2]}">${f1(b[0])}%</text>`;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(T+ph+17).toFixed(1)}" text-anchor="middle"
      font-family="IBM Plex Sans KR" font-size="11" fill="#4A545E">${b[1]} 가동률</text>`;});
  const x1=L+(step+bw)/2,x2=L+step+(step-bw)/2;
  s+=`<line x1="${x1.toFixed(1)}" x2="${x2.toFixed(1)}" y1="${y(tgt).toFixed(1)}" y2="${y(tgt).toFixed(1)}"
    stroke="#1B6E58" stroke-width="1" stroke-dasharray="4 3"/>`;
  s+=`<text x="${((x1+x2)/2).toFixed(1)}" y="${(y(tgt)+(y(cur)-y(tgt))/2+4).toFixed(1)}" text-anchor="middle"
    font-family="IBM Plex Mono" font-size="11.5" font-weight="700" fill="#14181C">격차 ${f1(tgt-cur)}%p</text>`;
  return s+'</svg>';
}

/* ============ render ============ */
function renderKpi(){
  const T=TOT(),M=MINS(),ks=KEYS(),A=AVAIL();
  const per=ks.map(k=>kThb(k)),last=per[per.length-1],prev=per.length>1?per[per.length-2]:null;
  const d=prev!=null?last-prev:0,pc=prev?d/prev*100:0;
  const unit=isM()?'월':'주';
  const arw=prev==null?'':(Math.abs(pc)<2?'→':(d>0?'▲':'▼'));
  const col=prev==null?'var(--mute)':(Math.abs(pc)<2?'var(--mute)':(d>0?'var(--loss)':'var(--gain)'));
  $('#kpis').innerHTML=`
    <div class="kpi hero"><div class="k">손실금액 · ${ks[0]}${ks.length>1?' ~ '+ks[ks.length-1]:''}</div>
      <div class="v">${f(T)}<small>THB</small></div>
      <div class="d">하루 ${f(T/DAYS())} · ${unit}평균 ${f(T/ks.length)} · 연 환산 ${f(yr(T))} THB</div></div>
    <div class="kpi"><div class="k">로스 시간</div><div class="v">${f(M/60)}<small>시간</small></div>
      <div class="d">${f(M)}분 · 최근 ${unit} <span style="color:${col}">${arw} ${prev==null?'—':f1(Math.abs(pc))+'%'}</span></div></div>
    <div class="kpi"><div class="k">가동률</div><div class="v">${f1(A*100)}<small>%</small></div>
      <div class="d">세계 수준 90% · 격차 ${f1(90-A*100)}%p</div></div>
    <div class="kpi"><div class="k">인건비 환산</div><div class="v">${f(T/S.wage)}<small>명</small></div>
      <div class="d">작업자 한 달 급여 기준 (월 ${f(S.wage)}밧)</div></div>
    <div class="kpi"><div class="k">못 만든 수량</div><div class="v">${f(lostEA()/10000)}<small>만 개</small></div>
      <div class="d">약 ${f(lostEA())}개 · 시간당 ${f(DATA.prodPerHour)}개 기준</div></div>`;
}

function renderMain(){
  const items=ALL().map(k=>({label:k,sub:perOf(k),
    parts:[0,1,2,3].map(c=>kCatM(k,c)),cost:kThb(k),on:KEYS().includes(k)}))
    .filter(d=>d.on);
  $('#mainTitle').textContent=`${isM()?'월간':'주간'} — 로스(분)와 비용(THB)`;
  $('#mainRange').textContent=`${KEYS()[0]} ~ ${KEYS()[KEYS().length-1]} · ${DAYS()}일`;
  $('#mainChart').innerHTML=combo(items,{h:items.length<=4?300:330});
  $('#mainLegend').innerHTML=CN.map((c,i)=>
    `<span><i style="background:${CC[i]}"></i>${c} · 막대(분)</span>`).join('')
    +`<span><i style="background:#14181C;height:3px;width:16px"></i>총 비용 · 선(THB)</span>`;
  const first=items[0],lastI=items[items.length-1];
  const dm=lastI.parts.reduce((a,b)=>a+b,0)-first.parts.reduce((a,b)=>a+b,0);
  const dc=lastI.cost-first.cost;
  const uneven = isM() && items.some(d=>daysOf(d.label)!==items[0].label&&daysOf(d.label));
  const partial = isM() && items.some(d=>MONS.find(x=>x[0]===d.label)[3]!=='완전');
  $('#mainNote').innerHTML= items.length<2 ? '단일 구간입니다. 비교하려면 기간을 넓히십시오.' :
    (partial
      ? `기간 길이가 다릅니다 — ${items.map(d=>`${d.label} ${daysOf(d.label)}일`).join(' · ')}. `
        +`총량 대신 <b>일평균</b>으로 보십시오 — `
        +items.map(d=>`${d.label} ${f(d.parts.reduce((a,b)=>a+b,0)/daysOf(d.label))}분 / ${f(d.cost/daysOf(d.label))} THB`).join(' · ')+'.'
      : `${first.label} ${f(first.parts.reduce((a,b)=>a+b,0))}분 / ${K(first.cost)} → `
        +`${lastI.label} ${f(lastI.parts.reduce((a,b)=>a+b,0))}분 / ${K(lastI.cost)}. `
        +`시간 ${dm>=0?'+':''}${f(dm)}분, 비용 ${dc>=0?'+':''}${f(dc)} THB. `
        +`같은 사건을 시간과 금액 두 단위로 잰 값입니다 (평균 ${f(DATA.rateAvg*60)} THB/시간). `
        +`막대는 줄었는데 선이 안 내려가면 분당 단가가 비싼 설비에서 로스가 난 것입니다.`);
}

function renderWorst(){
  const T=TOT();
  const rows=DATA.mcs.map(m=>({m,parts:[0,1,2,3].map(c=>mcCatT(m,c)),v:mcThb(m),min:mcMin(m)}))
    .filter(r=>r.v>0).sort((a,b)=>b.v-a.v);

    <span class="rv">${f(r.v)}<span>${f1(r.v/T*100)}% · ${f(r.min/60)}h</span></span></div>`).join('');
}

function renderPareto(){
  const cr=codeRows(),CT=cr.reduce((s,x)=>s+x.thb,0);
  let acc=0;const n50=cr.findIndex(x=>(acc+=x.thb)>=CT*.5)+1;
  $('#paretoNote').textContent=`상위 ${n50}개가 금액의 50% · 총 ${cr.length}종`;
  $('#paretoChart').innerHTML=pareto(cr.slice(0,12),760,290);
}

function renderAvail(){
  const A=AVAIL(),g90=gap(.90),g80=gap(.80);
  $('#availNote').textContent=`가동률 ${f1(A*100)}%`;
  $('#cmpChart').innerHTML=compare(A*100,90,330,180);
  $('#gapNote').innerHTML=
    `90% 도달 시 회수 <b style="color:var(--loss)">연 ${f(yr(g90.thb))} THB</b> (로스 ${f1(g90.ratio*100)}% 감축)<br>`
    +`80% 도달 시 회수 연 ${f(yr(g80.thb))} THB (로스 ${f1(g80.ratio*100)}% 감축)`;
  const idle=idleMc();
  $('#picto').innerHTML=LIVE.map((m,i)=>{
    const fl=Math.max(0,Math.min(1,idle-i));
    return `<div class="mch" title="${m}"><i style="height:${(fl*100).toFixed(0)}%"></i></div>`;}).join('');
  $('#pictoNote').innerHTML=`설비 ${LIVE.length}대 중 <b>${f1(idle)}대</b>가 전 기간 멈춰 있던 것과 같습니다 · 총 ${f(MINS()/60)}시간`;
}

    ${r.c.map(v=>`<td class="m">${z(v)}</td>`).join('')}
    <td class="m" style="font-weight:700">${z(r.thb)}</td>
    <td class="m zero">${z(r.min)}</td>
    <td class="l" style="color:${r.thb?CC[CN.indexOf(r.top)]:'#B4BDC5'}">${r.top}</td>
    <td class="m">${r.thb?f1(r.thb/T*100)+'%':'<span class="zero">—</span>'}</td>
    <td class="m">${r.thb?f1(r.thb/S.wage)+'명':'<span class="zero">—</span>'}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td class="l">TTL</td><td class="l">${LIVE.length}대</td>
    ${[0,1,2,3].map(c=>`<td>${f(CATT(c))}</td>`).join('')}
    <td>${f(T)}</td><td>${f(MINS())}</td><td class="l">THB</td><td>100%</td>
    <td>${f(T/S.wage)}명</td></tr></tfoot>`;
  $('#tbl').querySelectorAll('th[data-k]').forEach(t=>t.onclick=()=>{
    const id=t.dataset.k;S.sort=S.sort.k===id?{k:id,asc:!S.sort.asc}:{k:id,asc:false};renderTable();});
}

/* ============================================================================
   실시간 원본 연동 — OEE_RawData_APQ 「A_가동률」 게시 CSV
   주차 데이터를 사람이 손으로 옮겨 적을 필요가 없도록, 대시보드가 원본을 직접
   읽어 주간/월간·계통·원인·설비별 집계를 브라우저에서 만듭니다.
   → W35 이후 새 주차는 시트만 갱신하면 자동으로 나타납니다.
   원본 접근 실패 시 파일에 내장된 W27~W34 스냅샷(FB)으로 자동 폴백합니다.
   ========================================================================== */
const RAW_PUB_BASE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6U8gG0Mr3oJ-5XOOzr7Eh_oZGc-BGHFG0n1__eor4Zc8aJaMuf01NXCAHJECH6U8aUvtnQGLKD5-_/pub";
const RAW_GID = "345197688";                       // A_가동률 탭
const RAW_CANDIDATES = [
  `${RAW_PUB_BASE}?gid=${RAW_GID}&single=true&output=csv`,
  `${RAW_PUB_BASE}?output=csv`
];

/* 로스코드 → 4분류 (대시보드1과 동일 정의) */
const CODE4 = {
  '금형수리':'금형','금형파손':'금형','핀파손':'금형','슬라이드코어수리':'금형','청소':'금형',
  '금형냉각라인':'금형','제품소착':'금형','로트마크,사상':'금형',
  '설비수리':'설비-전기','취출기수리':'설비-전기','스프레이수리':'설비-전기','전기로회전':'설비-전기',
  '래들수리':'설비-전기','펌프이상':'설비-전기','전기로수리':'설비-전기','컨베이어수리':'설비-전기',
  '진공설비':'설비-전기','히터수리':'설비-전기',
  '조건변경':'설비-라인','팁교체':'설비-라인','스크랩용해':'설비-라인','스프레이조정':'설비-라인',
  '노즐막힘':'설비-라인','플런저오일막힘':'설비-라인','탈산처리':'설비-라인','바가지교체':'설비-라인',
  '설비냉각수':'설비-라인',
  '금형교체':'관리','휴식,설비교대':'관리','미팅/정전':'관리','기타':'관리'
};
const nrm = t => String(t||'').replace(/\s+/g,'').trim();
const CODE4L = {}; Object.keys(CODE4).forEach(k=>{ CODE4L[nrm(k)] = CODE4[k]; });

function toNum(v){ const n = parseFloat(String(v==null?'':v).replace(/[, ]/g,'')); return isNaN(n)?0:n; }
function normDate(raw){
  if(!raw) return null;
  raw = String(raw).trim();
  let m = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  m = raw.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  const d = new Date(raw);
  return isNaN(d) ? null : d.toISOString().slice(0,10);
}
function isoWeek(ds){
  const d = new Date(ds+'T00:00:00'), t = new Date(d.valueOf());
  const n = (d.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-n+3);
  return 1 + Math.round((t - new Date(t.getUTCFullYear(),0,4))/86400000/7);
}
function mcNo(v){ const n = parseInt(String(v==null?'':v).replace(/[^0-9]/g,''),10); return isNaN(n)?null:n; }
function looksLikeRaw(rows){
  if(!rows || !rows.length) return false;
  const keys = Object.keys(rows[0]).map(k=>String(k).trim());
  const hasD = keys.includes('일자'), hasM = keys.includes('설비명');
  const hasR = keys.some(k=>['가동시간_분','가동시간(분)','가동분'].includes(k));
  const hits = keys.filter(k=>CODE4L[nrm(k)]!==undefined).length;
  return hasD && hasM && hasR && hits >= 10;
}

/* ---- 원본 행 → 대시보드 DATA 구조 ---- */
function buildData(rows){
  const cats = ['금형','설비-전기','설비-라인','관리'];
  const RUN_K = ['가동시간_분','가동시간(분)','가동분'];
  const pick = (r,ks)=>{ for(const k of ks){ if(r[k]!==undefined) return toNum(r[k]); } return 0; };

  const rateNo = n => FB.rates['DC'+n] || 0;
  const W={}, RW={}, WDATE={}, M={}, RM={}, MDATE={};
  const codeW={}, mcSet=new Set();
  let codeCols=null, minDate=null, maxDate=null;

  rows.forEach(r=>{
    const d = normDate(r['일자']); const m = mcNo(r['설비명']);
    if(!d || !m) return;
    if(codeCols===null) codeCols = Object.keys(r).filter(k=>CODE4L[nrm(k)]!==undefined);
    const run = pick(r, RUN_K);
    const vals = codeCols.map(k=>toNum(r[k]));
    const lossSum = vals.reduce((a,b)=>a+b,0);
    if(run===0 && lossSum===0) return;                       // 미가동 교대 제외
    mcSet.add(m);
    if(!minDate || d<minDate) minDate=d;
    if(!maxDate || d>maxDate) maxDate=d;

    const wk = String(r['주차']||'').trim() || ('W'+isoWeek(d));
    const mo = d.slice(0,7);
    [[W,RW,WDATE,wk],[M,RM,MDATE,mo]].forEach(([BK,RK,DK,key])=>{
      if(!BK[key]){ BK[key]={}; RK[key]={}; DK[key]=new Set(); }
      if(!BK[key][m]) BK[key][m]=[0,0,0,0];
      RK[key][m] = (RK[key][m]||0) + run;
      DK[key].add(d);
    });
    codeCols.forEach((k,ci)=>{
      const v = vals[ci]; if(v<=0) return;
      const name = k.trim(), cat = CODE4L[nrm(k)] || '관리';
      const ai = cats.indexOf(cat);
      W[wk][m][ai] += v; M[mo][m][ai] += v;
      if(!codeW[name]) codeW[name] = { cat, w:{}, wc:{}, m:{}, mc:{} };
      const rt = rateNo(m);
      codeW[name].w[wk]  = (codeW[name].w[wk] ||0) + v;
      codeW[name].wc[wk] = (codeW[name].wc[wk]||0) + v*rt;
      codeW[name].m[mo]  = (codeW[name].m[mo] ||0) + v;
      codeW[name].mc[mo] = (codeW[name].mc[mo]||0) + v*rt;
    });
  });

  if(!mcSet.size) throw new Error('유효한 데이터 행이 없습니다');

  const wkNum = s => parseInt(String(s).replace(/[^0-9]/g,''),10)||0;
  const weeks  = Object.keys(W).sort((a,b)=>wkNum(a)-wkNum(b));
  const months = Object.keys(M).sort();
  const mcs    = [...mcSet].sort((a,b)=>a-b).map(n=>'DC'+n);

  /* 모든 주차/월에 전 설비 키를 채워 렌더 코드가 그대로 동작하게 함 */
  const fill = (BK,RK) => { Object.keys(BK).forEach(k=>{
    const o={}, ro={};
    mcs.forEach(s=>{ const n=+s.slice(2); o[s]=BK[k][n]||[0,0,0,0]; ro[s]=RK[k][n]||0; });
    BK[k]=o; RK[k]=ro; }); };
  fill(W,RW); fill(M,RM);

  const span = set => { const a=[...set].sort();
    return a.length ? a[0].slice(5).replace('-','/')+'~'+a[a.length-1].slice(5).replace('-','/') : '—'; };
  const periods = weeks.map(w=>span(WDATE[w]));
  const yrs = new Set(months.map(m=>m.slice(0,4)));
  const MONTHS = months.map(mo=>{
    const [y,mm] = mo.split('-').map(Number);
    const full = new Date(y, mm, 0).getDate();
    const got  = MDATE[mo].size;
    const lab  = (yrs.size>1 ? y+'.' : '') + mm + '월';
    return [lab, span(MDATE[mo]), got, got>=full ? '완전' : '부분'];
  });
  /* MONTHS 라벨 기준으로 M/RM 키를 바꿔줌 (원본 구조가 '8월' 라벨을 씀) */
  const M2={}, RM2={};
  months.forEach((mo,i)=>{ M2[MONTHS[i][0]] = M[mo]; RM2[MONTHS[i][0]] = RM[mo]; });

  const codesW = {};
  Object.keys(codeW).forEach(n=>{
    const o = codeW[n];
    codesW[n] = { cat:o.cat,
      w:  weeks.map(w=>o.w[w]||0),   wc: weeks.map(w=>o.wc[w]||0),
      m:  months.map(x=>o.m[x]||0),  mc: months.map(x=>o.mc[x]||0) };
  });

  let totMin=0, totThb=0;
  weeks.forEach(w=>mcs.forEach(s=>{ const v=W[w][s].reduce((a,b)=>a+b,0);
    totMin+=v; totThb+=v*rateNo(+s.slice(2)); }));

  const types={}, rates={};
  mcs.forEach(s=>{ types[s]=FB.types[s]||'-'; rates[s]=rateNo(+s.slice(2)); });

  return { weeks, periods, cats, mcs, types, rates,
    W, MONTHS, M:M2, codesW, RW, RM:RM2,
    WDAYS: Object.fromEntries(weeks.map(w=>[w, WDATE[w].size])),
    rateAvg: totMin ? totThb/totMin : FB.rateAvg,
    fx: FB.fx, prodPerHour: FB.prodPerHour, wageDay: FB.wageDay, wageMonth: FB.wageMonth,
    range: (minDate||'')+' ~ '+(maxDate||'') };
}

/* ---- 로딩 ---- */
function setSrc(txt, warn){
  const el = document.getElementById('srcTag');
  if(el){ el.textContent = txt; el.style.color = warn ? '#FF9E80' : '#8A949E'; }
}
function fetchCSV(url){
  return fetch(url, {cache:'no-store'}).then(r=>{
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  }).then(t=>{
    if(/^\s*</.test(t)) throw new Error('CSV가 아닌 응답(게시 설정 확인)');
    const out = Papa.parse(t, {header:true, skipEmptyLines:true});
    return out.data;
  });
}
async function loadLive(){
  setSrc('원본 불러오는 중…');
  for(const url of RAW_CANDIDATES){
    try{
      const rows = await fetchCSV(url);
      if(!looksLikeRaw(rows)) continue;
      const d = buildData(rows);
      initData(d, `실시간 원본 · ${d.weeks.length}주차 (${d.weeks[0]}~${d.weeks[d.weeks.length-1]})`);
      return;
    }catch(e){ console.warn('raw load failed', url, e.message); }
  }
  initData(FB, '내장 스냅샷 (원본 접근 실패)', true);
}

/* ============ boot ============ */
function fillSel(){
  if(!DATA) return;
  const o=ALL().map((k,i)=>`<option value="${i}">${k}  ${perOf(k)}</option>`).join('');
  $('#p1').innerHTML=o;$('#p2').innerHTML=o;$('#p1').value=S.i1;$('#p2').value=S.i2;
}
function render(){if(!DATA)return;renderKpi();renderMain();renderCats();renderWorst();renderPareto();renderAvail();renderTable();}
function setAxis(v){if(!DATA)return;S.axis=v;S.i1=0;S.i2=ALL().length-1;
  $('#axW').setAttribute('aria-pressed',v==='week');
  $('#axM').setAttribute('aria-pressed',v==='month');
  fillSel();render();}
$('#axW').onclick=()=>setAxis('week');
$('#axM').onclick=()=>setAxis('month');
$('#p1').onchange=e=>{S.i1=+e.target.value;if(S.i2<S.i1){S.i2=S.i1;$('#p2').value=S.i2;}render();};
$('#p2').onchange=e=>{S.i2=+e.target.value;if(S.i1>S.i2){S.i1=S.i2;$('#p1').value=S.i1;}render();};
$('#wage').oninput=e=>{S.wage=+e.target.value||DATA.wageMonth;render();};
$('#reload').onclick=()=>loadLive();

/* ---- 데이터 주입 후 부팅 ---- */
function initData(d, srcLabel, warn){
  DATA=d; CN=DATA.cats;
  FX=DATA.fx; WK=DATA.weeks; PER=DATA.periods; MONS=DATA.MONTHS; MN=MONS.map(x=>x[0]);
  LIVE=DATA.mcs.filter(m=>WK.some(w=>DATA.W[w][m].some(v=>v>0)));
  const wageEl=$('#wage');
  S.axis='week'; S.i1=0; S.i2=WK.length-1;
  S.wage=(+wageEl.value)||DATA.wageMonth;
  $('#axW').setAttribute('aria-pressed','true');
  $('#axM').setAttribute('aria-pressed','false');
  setSrc(srcLabel, warn);
  fillSel(); render(); renderFoot(warn);
}

function renderFoot(warn){
  const dead=DATA.mcs.filter(m=>!LIVE.includes(m));
  const part=MONS.filter(x=>x[3]!=='완전').map(x=>`${x[0]}(${x[2]}일)`).join('·');
  $('#foot').innerHTML=
    `<b>손실금액</b> · 로스(분) × 설비별 M/C Rate(THB/분) · 시트 「F-COST」 ⑥ 전체 손실비용과 총액 일치<br>`
  + `<b>집계</b> · 주간 = 수요일~화요일(사내 기준) · 월간 = 달력 1일~말일`
  + (part?` · ${part}은 부분 데이터`:'') + `<br>`
  + `<b>환산</b> · 인건비 = 촌부리 최저임금 ${DATA.wageDay}밧/일 × 26일 · 생산 = 기간 평균 시간당 ${DATA.prodPerHour}개 · 1 USD = ${DATA.fx} THB<br>`
  + `<b>정본</b> · 구글시트 OEE_RawData_APQ 「A_가동률」 일별 원자료`
  + (DATA.range?` · 수록 기간 ${DATA.range}`:'')
  + ` · DC14 결번` + (dead.length?` · ${dead.join('/')} 무실적`:'')
  + (warn?`<br><b style="color:#C0281F">⚠ 원본 시트를 읽지 못해 내장 스냅샷(W27~W34)을 표시 중입니다. 게시 설정을 확인하십시오.</b>`:'');
}
