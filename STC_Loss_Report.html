<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>비가동 로스 손실 현황 보고 · STC Co., Ltd.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF;--ink:#14181C;--sub:#4A545E;--mute:#7A848E;--rule:#D3D9DF;--rule2:#EAEEF1;
  --loss:#B3261E;--gain:#1F6F5C;
  --c1:#B3261E;--c2:#C77D0A;--c3:#2E5F8A;--c4:#8A929B;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans KR',system-ui,sans-serif;
  --serif:'Noto Serif KR',serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#8E959C;font-family:var(--sans);color:var(--ink);line-height:1.55;
  -webkit-font-smoothing:antialiased;font-size:10.5pt}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}

/* ---- toolbar (screen only) ---- */
.bar{position:sticky;top:0;z-index:20;background:#14181C;color:#EDF1F4;padding:11px 20px;
  display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.bar .t{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:#8A949E;margin-right:auto;padding-bottom:7px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:#7A848E}
.bar select{background:#242B33;color:#EDF1F4;border:1px solid #3A434D;border-radius:2px;
  padding:6px 9px;font-family:var(--mono);font-size:12px}
.bar button{background:#B3261E;color:#fff;border:0;border-radius:2px;padding:8px 16px;
  font-family:var(--mono);font-size:12px;cursor:pointer;letter-spacing:.04em}
.bar button.g{background:#242B33;border:1px solid #3A434D}
.bar button:focus-visible,.bar select:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ---- page ---- */
.page{width:210mm;min-height:297mm;background:var(--paper);margin:22px auto;padding:16mm 16mm 14mm;
  box-shadow:0 3px 16px rgba(0,0,0,.28);position:relative;display:flex;flex-direction:column}
.ph{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1.6pt solid var(--ink);padding-bottom:6px;margin-bottom:16px}
.ph .co{font-family:var(--mono);font-size:8.5pt;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.ph .pg{font-family:var(--mono);font-size:8.5pt;color:var(--mute)}
.pf{margin-top:auto;padding-top:9px;border-top:.6pt solid var(--rule);
  font-family:var(--mono);font-size:7.5pt;color:var(--mute);display:flex;justify-content:space-between;gap:14px}

h1{font-family:var(--serif);font-size:24pt;font-weight:700;letter-spacing:-.01em;margin:0 0 4px;line-height:1.25}
h2{font-family:var(--serif);font-size:13pt;font-weight:600;margin:0 0 9px;
  padding-bottom:5px;border-bottom:.8pt solid var(--rule)}
h3{font-size:10.5pt;font-weight:600;margin:14px 0 6px}
.lead{font-size:10.5pt;color:var(--sub);margin:0 0 14px}
.kicker{font-family:var(--mono);font-size:8.5pt;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}

/* headline money */
.hl{border:1.6pt solid var(--ink);padding:16px 18px 15px;margin:14px 0 16px;position:relative}
.hl .lab{font-family:var(--mono);font-size:8.5pt;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.hl .v{font-family:var(--mono);font-size:44pt;font-weight:700;color:var(--loss);line-height:1;
  letter-spacing:-.035em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.hl .v small{font-size:.28em;color:var(--sub);font-weight:500;margin-left:.16em;letter-spacing:0}
.hl .sub{font-family:var(--mono);font-size:9pt;color:var(--sub);margin-top:6px}
.hl3{display:grid;grid-template-columns:repeat(3,1fr);border-top:.8pt solid var(--rule);margin-top:13px;padding-top:12px;gap:14px}
.hl3 .k{font-family:var(--mono);font-size:8pt;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.hl3 .n{font-family:var(--mono);font-size:15pt;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}

/* findings */
ol.find{margin:0;padding:0;list-style:none;counter-reset:f}
ol.find li{counter-increment:f;display:grid;grid-template-columns:22px 1fr;gap:10px;
  padding:9px 0;border-bottom:.6pt solid var(--rule2)}
ol.find li::before{content:counter(f,decimal-leading-zero);font-family:var(--mono);font-size:9pt;
  color:var(--loss);font-weight:600;padding-top:2px}
ol.find b{font-weight:600}
ol.find .d{color:var(--sub);font-size:9.5pt;margin-top:2px}

/* tables */
table{width:100%;border-collapse:collapse;font-size:9pt}
th,td{padding:5px 7px;border-bottom:.6pt solid var(--rule2);text-align:right;
  font-variant-numeric:tabular-nums}
th{font-family:var(--mono);font-size:7.5pt;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mute);font-weight:500;border-bottom:.8pt solid var(--rule);white-space:nowrap}
td.l,th.l{text-align:left}
td.n{font-family:var(--mono)}
tfoot td{border-top:.8pt solid var(--ink);border-bottom:0;font-weight:700;font-family:var(--mono)}
.sw{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:baseline}

/* charts */
.chartbox{margin:8px 0 4px}
svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:8pt;color:var(--sub);margin:8px 0 2px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

.note{font-family:var(--mono);font-size:7.5pt;color:var(--mute);line-height:1.75;margin-top:8px}
.note a{color:var(--sub)}
.callout{border-left:3pt solid var(--loss);background:#FAF6F5;padding:10px 13px;margin:12px 0;font-size:9.5pt}
.callout.g{border-left-color:var(--gain);background:#F3F8F6}
.callout b{font-weight:600}

.band{display:flex;height:22px;margin-top:26px;position:relative}
.band i{height:100%;position:relative}
.band i span{position:absolute;left:6px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:7pt;color:#fff;white-space:nowrap}
.bmark{position:absolute;top:-24px;transform:translateX(-50%);text-align:center}
.bmark .l{font-family:var(--mono);font-size:9pt;font-weight:700;color:var(--ink);white-space:nowrap}
.bmark .t{width:1.6pt;height:28px;background:var(--ink);margin:2px auto 0}
.bscale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:7.5pt;color:var(--mute);margin-top:4px}

.scn{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:.8pt solid var(--rule);margin-top:10px}
.sc{padding:12px 13px;border-right:.8pt solid var(--rule)}
.sc:last-child{border-right:0}
.sc.hi{background:#FAF6F5}
.sc .tg{font-family:var(--mono);font-size:7.5pt;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.sc .nm{font-weight:600;font-size:10pt;margin:4px 0 3px}
.sc .bs{font-size:8pt;color:var(--sub);min-height:34px;line-height:1.5}
.sc .vv{font-family:var(--mono);font-size:17pt;font-weight:700;color:var(--loss);margin-top:7px;font-variant-numeric:tabular-nums}
.sc .vv small{font-size:.42em;color:var(--sub);font-weight:500;margin-left:3px}
.sc .ex{font-family:var(--mono);font-size:7.5pt;color:var(--mute);margin-top:3px}

@media print{
  body{background:#fff}
  .bar{display:none}
  .page{margin:0;box-shadow:none;width:auto;min-height:auto;padding:14mm 14mm 12mm;
    page-break-after:always;break-after:page}
  .page:last-child{page-break-after:auto;break-after:auto}
}
@page{size:A4 portrait;margin:0}
</style>
</head>

const wTot=w=>[0,1,2,3].reduce((s,c)=>s+wCat(w,c),0);
const wRun=w=>DATA.mcs.reduce((s,m)=>s+(DATA.RW[w][m]||0),0);
const mCat=(n,c)=>DATA.mcs.reduce((s,m)=>s+DATA.M[n][m][c]*rate(m),0);
const mTot=n=>[0,1,2,3].reduce((s,c)=>s+mCat(n,c),0);
const mRun=n=>DATA.mcs.reduce((s,m)=>s+(DATA.RM[n][m]||0),0);

const TOT =()=>sel().reduce((s,w)=>s+wTot(w),0);
const CAT =c=>sel().reduce((s,w)=>s+wCat(w,c),0);
const CATM=c=>sel().reduce((s,w)=>s+wCatMin(w,c),0);
const MIN =()=>[0,1,2,3].reduce((s,c)=>s+CATM(c),0);
const RUN =()=>sel().reduce((s,w)=>s+wRun(w),0);
const AVAIL=()=>{const r=RUN(),l=MIN();return (r+l)?r/(r+l):0;};
function gap(t){const T=RUN()+MIN(),tg=T*(1-t),cut=Math.max(MIN()-tg,0);
  return {cut,ratio:MIN()?cut/MIN():0,thb:MIN()?cut/MIN()*TOT():0};}
const mcCat=(m,c)=>sel().reduce((s,w)=>s+DATA.W[w][m][c]*rate(m),0);
const mcTot=m=>[0,1,2,3].reduce((s,c)=>s+mcCat(m,c),0);
const mcMin=m=>sel().reduce((s,w)=>s+DATA.W[w][m].reduce((a,b)=>a+b,0),0);
function codeRows(){
  const idx=sel().map(w=>WK.indexOf(w));
  return Object.entries(DATA.codesW).map(([n,o])=>({n,cat:o.cat,
    thb:idx.reduce((s,i)=>s+o.wc[i],0),min:idx.reduce((s,i)=>s+o.w[i],0)}))
    .filter(x=>x.thb>0).sort((a,b)=>b.thb-a.thb);
}
const yr=v=>v/D_()*365, mo=v=>v/D_()*30;

/* ============ svg: vertical stacked bars ============ */
function niceMax(v){
  if(v<=0) return 1;
  const p=Math.pow(10,Math.floor(Math.log10(v))), n=v/p;
  return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;
}
function vbar(items,opt){
  opt=opt||{};
  const W=opt.w||660, H=opt.h||210, L=opt.left||46, R=6, T=16, B=opt.bottom||30;
  const pw=W-L-R, ph=H-T-B;
  const max=niceMax(Math.max(...items.map(d=>d.parts.reduce((a,b)=>a+b,0)),1));
  const n=items.length, gapw=opt.gap||0.34;
  const bw=pw/n*(1-gapw), step=pw/n;
  const y=v=>T+ph-v/max*ph;
  const ticks=[0,.25,.5,.75,1].map(t=>t*max);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  ticks.forEach(t=>{
    s+=`<line x1="${L}" x2="${W-R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"
      stroke="${t===0?'#14181C':'#EAEEF1'}" stroke-width="${t===0?1:.8}"/>`;
    s+=`<text x="${L-7}" y="${(y(t)+3).toFixed(1)}" text-anchor="end"
      font-family="IBM Plex Mono" font-size="8" fill="#7A848E">${opt.fmt?opt.fmt(t):f(t/1000)+'k'}</text>`;
  });
  items.forEach((d,i)=>{
    const x=L+step*i+(step-bw)/2;
    let acc=0;
    d.parts.forEach((p,ci)=>{
      const h=p/max*ph;
      if(h>0) s+=`<rect x="${x.toFixed(1)}" y="${(y(acc)-h).toFixed(1)}" width="${bw.toFixed(1)}"
        height="${h.toFixed(1)}" fill="${CC[ci]}"><title>${d.label} · ${CN[ci]} · ${f(p)}</title></rect>`;
      acc+=p;
    });
    const tot=d.parts.reduce((a,b)=>a+b,0);
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y(tot)-5).toFixed(1)}" text-anchor="middle"
      font-family="IBM Plex Mono" font-size="8.5" font-weight="600" fill="#14181C">${opt.top?opt.top(tot):f(tot/1000)+'k'}</text>`;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(T+ph+12).toFixed(1)}" text-anchor="middle"
      font-family="IBM Plex Mono" font-size="8.5" font-weight="600" fill="#14181C">${d.label}</text>`;
    if(d.sub) s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(T+ph+22).toFixed(1)}" text-anchor="middle"
      font-family="IBM Plex Mono" font-size="7" fill="#7A848E">${d.sub}</text>`;
  });
  return s+'</svg>';
}
function vbarSimple(items,color,opt){
  opt=opt||{};
  const W=opt.w||300,H=opt.h||132,L=opt.left||38,R=4,T=14,B=24;
  const pw=W-L-R, ph=H-T-B;
  const max=niceMax(Math.max(...items.map(d=>d.v),1));
  const n=items.length, step=pw/n, bw=step*.6;
  const y=v=>T+ph-v/max*ph;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  [0,.5,1].forEach(t=>{const v=t*max;
    s+=`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"
      stroke="${t===0?'#14181C':'#EAEEF1'}" stroke-width="${t===0?1:.8}"/>`;
    s+=`<text x="${L-6}" y="${(y(v)+3).toFixed(1)}" text-anchor="end" font-family="IBM Plex Mono"
      font-size="7.5" fill="#7A848E">${f(v/1000)}k</text>`;});
  items.forEach((d,i)=>{
    const x=L+step*i+(step-bw)/2, h=d.v/max*ph;
    s+=`<rect x="${x.toFixed(1)}" y="${(y(d.v)).toFixed(1)}" width="${bw.toFixed(1)}"
      height="${Math.max(h,0).toFixed(1)}" fill="${color}"><title>${d.label} ${f(d.v)}</title></rect>`;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(T+ph+11).toFixed(1)}" text-anchor="middle"
      font-family="IBM Plex Mono" font-size="7.5" fill="#14181C">${d.label}</text>`;
  });
  return s+'</svg>';
}

        <tr><td class="l">세계 수준(90%) 도달</td><td class="n">${f(g90.cut/60)} h · ${f1(g90.ratio*100)}%</td>
          <td class="n">${f(g90.thb)}</td><td class="n" style="font-weight:700;color:#B3261E">${f(yr(g90.thb))}</td></tr>
      </tbody></table>

    <h2 style="margin-top:18px">회수 시나리오</h2>
    <div class="scn">${SCN.map(([tg,nm,cut,bs],i)=>`
      <div class="sc ${i===1?'hi':''}">
        <div class="tg">${tg}</div><div class="nm">${nm}</div>
        <div class="bs">${bs}</div>
        <div class="vv">${f(yr(T*cut))}<small>THB / 년</small></div>
        <div class="ex">로스 ${f1(cut*100)}% 감축 · 기간 ${f(T*cut)} THB · ≈ US$ ${f(yr(T*cut)/FX)}</div>
      </div>`).join('')}</div>

    <div class="callout g"><b>단계적 접근을 권고합니다.</b>
      예지보전의 감축폭은 무엇과 비교하느냐에 따라 달라집니다 — 계획보전 대비 8~12%, 사후보전 대비 30~40%입니다.
      도입 첫해부터 40%가 나오지 않습니다. 상위 손실 설비 1~2대에 상태감시를 시범 적용해 효과를 검증한 뒤 확대하는 것이 안전합니다.</div>

    <h2 style="margin-top:16px">인용 자료</h2>
    <div class="note" style="font-size:8pt;line-height:1.9">
      Siemens, <i>The True Cost of Downtime 2024</i> — 세계 500대 제조사의 비가동 손실은 연 1.4조 달러, 매출의 11%.<br>
      U.S. Department of Energy, <i>O&amp;M Best Practices</i> — 예지보전 도입 시 ROI 10배, 고장 70~75% 제거, 비가동 35~45% 감소, 유지비 25~30% 절감.<br>
      Deloitte — 예지보전으로 유지비 5~10% 절감, 가동률 10~20% 개선.<br>
      S. Nakajima, <i>TPM</i> — 세계 수준 OEE 85% = 가동률 90% × 성능 95% × 품질 99%.<br>
      TeepTrak, <i>World-Class OEE Benchmark 2026</i> — OEE 85% 이상 상위 10%, 이산 제조 평균 60~75%.<br>
      <br>
      ※ 위 수치는 외부 연구의 일반 벤치마크입니다. 우리 설비에 적용한 회수 시나리오는 추정치이며,
      실제 효과는 설비 상태와 투자 범위에 따라 달라집니다.
      "제조업 평균 비가동 원가 시간당 26만 달러"라는 자주 인용되는 수치는 대형 플랜트의 라인 전체 정지 기준이므로,
      설비 1대 기준인 본 보고서의 ${f(DATA.rateAvg*60)} 밧/시간과 직접 비교할 수 없습니다.
    </div>`);
}

function page5(){
  const T=TOT();
  const rows=DATA.mcs.map(m=>({m,ty:DATA.types[m],rate:rate(m),
    parts:[0,1,2,3].map(c=>mcCat(m,c)),v:mcTot(m),min:mcMin(m)})).sort((a,b)=>b.v-a.v);
  return pg(5,5,`
    <h2>부록 — 설비별 전체 집계</h2>
    <div class="note" style="margin:0 0 8px">보고 기간 ${sel()[0]} ~ ${sel()[sel().length-1]} ·
      DC14는 결번, DC1·DC7·DC17은 전 구간 무실적입니다.</div>
    <table><thead><tr><th class="l">설비</th><th class="l">형식</th><th>Rate</th>
      <th>금형</th><th>설비-전기</th><th>설비-라인</th><th>관리</th>
      <th>합계 (THB)</th><th>로스(분)</th><th>비중</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td class="l n">${r.m}</td><td class="l n" style="color:#7A848E">${r.ty}</td>
        <td class="n" style="color:#7A848E">${r.rate.toFixed(2)}</td>
        ${r.parts.map(p=>`<td class="n">${p?f(p):'—'}</td>`).join('')}
        <td class="n" style="font-weight:600">${r.v?f(r.v):'—'}</td>
        <td class="n" style="color:#7A848E">${r.min?f(r.min):'—'}</td>
        <td class="n">${r.v?f1(r.v/T*100)+'%':'—'}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td class="l">합계</td><td>${LIVE.length}대</td><td></td>
        ${[0,1,2,3].map(c=>`<td>${f(CAT(c))}</td>`).join('')}
        <td>${f(T)}</td><td>${f(MIN())}</td><td>100.0%</td></tr></tfoot></table>

    <h2 style="margin-top:16px">집계 기준</h2>
    <table><tbody>
      <tr><td class="l" style="width:34%">손실금액</td><td class="l">로스(분) × 설비별 M/C Rate(THB/분). 시트 「F-COST」 ⑥ 전체 손실비용과 총액 일치</td></tr>
      <tr><td class="l">주간</td><td class="l">사내 기준 수요일 ~ 화요일. W27 = 06/24~06/30 … W34 = 08/12~08/18</td></tr>
      <tr><td class="l">월간</td><td class="l">달력 1일 ~ 말일. 6월·8월은 원자료 범위상 부분 집계</td></tr>
      <tr><td class="l">가동률</td><td class="l">가동시간 ÷ (가동시간 + 로스시간). 원본 「주차별 추이」 탭 값과 일치</td></tr>
      <tr><td class="l">분류</td><td class="l">원본 「분류마스터」 로스코드 31종의 세분류를 그대로 적용</td></tr>
      <tr><td class="l">환율</td><td class="l">1 USD = ${FX} THB (2026-08-24 기준, 참고용)</td></tr>
    </tbody></table>
    <div class="note">분류 기준에 대한 검토 의견은 별도 엑셀 「8_분류검증」 시트를 참조하십시오.
      본 보고서는 현행 분류를 그대로 적용했습니다.</div>`);
}

/* ============ boot ============ */
function render(){ $('#report').innerHTML=[page1(),page2(),page3(),page4(),page5()].join(''); }
function fill(){
  const o=WK.map((w,i)=>`<option value="${i}">${w} ${PER[i]}</option>`).join('');
  $('#p1').innerHTML=o; $('#p2').innerHTML=o; $('#p1').value=ST.i1; $('#p2').value=ST.i2;
}
fill();
$('#p1').onchange=e=>{ST.i1=+e.target.value; if(ST.i2<ST.i1){ST.i2=ST.i1;$('#p2').value=ST.i2;} render();};
$('#p2').onchange=e=>{ST.i2=+e.target.value; if(ST.i1>ST.i2){ST.i1=ST.i2;$('#p1').value=ST.i1;} render();};
$('#btnAll').onclick=()=>{ST.i1=0;ST.i2=WK.length-1;fill();render();};
$('#btnPrint').onclick=()=>window.print();
$('#rev').oninput=e=>{ST.rev=+e.target.value||0; render();};
render();

</script>
</body>
</html>
