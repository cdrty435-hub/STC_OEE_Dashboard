<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STC 로스 달력</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --page: #f4f4f1; --surface: #ffffff; --raise: #fbfbf9;
    --ink: #111110; --ink2: #55544f; --muted: #8b8a84; --line: #e6e5df; --line2: #d4d3cb;
    --s0: #f1f1ed; --s1: #d6e6fb; --s2: #93bdf0; --s3: #3e8be3; --s4: #1d5aa8;
    --t1: #111110; --t2: #111110; --t3: #ffffff; --t4: #ffffff;
    --good: #0ca30c; --warning: #e0a10f; --critical: #d03b3b; --accent: #1d5aa8;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0e0e0d; --surface: #181817; --raise: #1f1f1e;
      --ink: #f0efec; --ink2: #c3c2b7; --muted: #8b8a84; --line: #2b2b29; --line2: #3a3a37;
      --s0: #222220; --s1: #123b70; --s2: #1d5aa8; --s3: #3e8be3; --s4: #93bdf0;
      --t1: #f0efec; --t2: #ffffff; --t3: #ffffff; --t4: #0b0b0b;
      --accent: #93bdf0; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--page); color: var(--ink); font: 13px/1.45 Pretendard, "Noto Sans KR", "Noto Sans Thai", -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; }
  button, input, select { font: inherit; color: inherit; }

  /* ---------- 상단 바 ---------- */
  .top { display: flex; align-items: center; gap: 14px; padding: 10px 18px; background: var(--surface);
    border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand b { font-size: 16px; letter-spacing: -.2px; }
  .brand span { color: var(--muted); font-size: 12px; }
  .seg { display: inline-flex; background: var(--s0); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: transparent; padding: 5px 14px; border-radius: 6px; color: var(--ink2); cursor: pointer; }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 600; }
  .period { display: flex; align-items: center; gap: 4px; }
  .period button { border: 1px solid var(--line2); background: var(--surface); border-radius: 7px; width: 30px; height: 30px; cursor: pointer; }
  .period .lbl { min-width: 150px; text-align: center; font-weight: 600; font-size: 14px; }
  .period select { border: 1px solid var(--line2); background: var(--surface); border-radius: 7px; padding: 4px 6px; }
  .grow { flex: 1; }
  .toggles { display: flex; gap: 6px; }
  .tg { border: 1px solid var(--line2); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 12px; color: var(--ink2); cursor: pointer; }
  .tg.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .upd { color: var(--muted); font-size: 11px; }

  /* ---------- KPI ---------- */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 12px 18px 0; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 12px; min-width: 0; }
  .kpi .k { color: var(--ink2); font-size: 12px; }
  .kpi .v { font-size: 22px; font-weight: 700; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  .kpi .v small { font-size: 12px; font-weight: 500; color: var(--ink2); margin-left: 2px; }
  .kpi .sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .bar { height: 6px; background: var(--s0); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .kpi .bar i { display: block; height: 100%; border-radius: 3px; }
  .kpi .txt { min-width: 0; flex: 1; }
  .kpi.clickable { cursor: pointer; }
  .kpi.clickable:hover { border-color: var(--line2); }
  @media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  /* ---------- 본문 2단 ---------- */
  .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 12px; padding: 12px 18px 16px; }
  @media (max-width: 1100px) {
    html, body { height: auto; }
    .layout { grid-template-columns: 1fr; }
    .board { height: 72vh; }
    .insp { max-height: none; }
    .insp .ib { overflow: visible; }
  }
  .board, .insp { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); min-height: 0; }
  .board { display: flex; flex-direction: column; overflow: hidden; }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--ink2); font-size: 11.5px; }
  .legend .sw { display: inline-block; width: 14px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 3px; }
  .legend .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); vertical-align: 1px; margin-right: 4px; }
  .legend .ring { display: inline-block; width: 14px; height: 10px; border-radius: 2px; box-shadow: inset 0 0 0 1.5px var(--critical); vertical-align: -1px; margin-right: 4px; }
  .scroll { overflow: auto; flex: 1; min-height: 0; }

  table.cal { border-collapse: separate; border-spacing: 2px; margin: 4px 8px 10px; }
  .cal th { position: sticky; background: var(--surface); z-index: 2; font-weight: 500; color: var(--muted); font-size: 10.5px; padding: 0; }
  .cal thead tr.mini th { top: 0; height: 30px; vertical-align: bottom; }
  .cal thead tr.days th { top: 30px; padding: 2px 0 4px; }
  .cal th .dn { display: block; color: var(--ink); font-size: 11.5px; font-weight: 600; }
  .cal th.we .dn { color: var(--muted); }
  .cal th.today .dn { color: var(--accent); }
  .mb { width: 70%; margin: 0 auto; background: var(--line2); border-radius: 2px 2px 0 0; min-height: 1px; }
  .cal th:hover .mb { background: var(--s3); }
  .cal .mc { position: sticky; left: 0; z-index: 3; background: var(--surface); text-align: left; padding: 0 10px 0 6px; min-width: 96px; }
  .cal thead .mc { z-index: 4; }
  .mc .nm { font-weight: 700; font-size: 12.5px; color: var(--ink); }
  .mc .tt { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .mc .tt i { display: block; height: 4px; background: var(--s2); border-radius: 2px; }
  td.c { width: 32px; min-width: 32px; height: 30px; border-radius: 5px; text-align: center; font-size: 10.5px; font-variant-numeric: tabular-nums;
    cursor: pointer; position: relative; background: var(--s0); color: var(--ink2); transition: opacity .15s; }
  .cal.week td.c { width: 58px; min-width: 58px; }
  td.c.l1 { background: var(--s1); color: var(--t1); }
  td.c.l2 { background: var(--s2); color: var(--t2); }
  td.c.l3 { background: var(--s3); color: var(--t3); }
  td.c.l4 { background: var(--s4); color: var(--t4); font-weight: 600; }
  td.c.empty { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
  td.c:hover { outline: 2px solid var(--ink2); outline-offset: 0; z-index: 1; }
  td.c.sel { outline: 2px solid var(--ink); outline-offset: 1px; z-index: 1; }
  td.c .d { position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--ink); }
  td.c.l3 .d, td.c.l4 .d { background: #fff; }
  .nodots td.c .d { display: none; }
  td.c.unx { box-shadow: inset 0 0 0 1.5px var(--critical); }
  td.c.unx .q { position: absolute; left: 3px; top: 1px; font-size: 9px; font-weight: 800; color: var(--critical); }
  td.c.l3.unx .q, td.c.l4.unx .q { color: #fff; }
  .focus td.c:not(.unx) { opacity: .28; }
  td.tot { color: var(--ink2); font-size: 11px; padding: 0 10px; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
  tr.sum td { color: var(--ink2); font-size: 10.5px; text-align: center; padding-top: 4px; font-variant-numeric: tabular-nums; }
  #loading { padding: 50px; text-align: center; color: var(--muted); }

  /* ---------- 오른쪽 인스펙터 ---------- */
  .insp { display: flex; flex-direction: column; overflow: hidden; }
  .ih { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .ih .t { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .ih .t button { border: 0; background: var(--s0); border-radius: 6px; padding: 2px 8px; cursor: pointer; color: var(--ink2); font-size: 12px; font-weight: 500; }
  .ih .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .ib { overflow: auto; padding: 12px 16px 20px; flex: 1; min-height: 0; }
  .sec { margin-bottom: 16px; }
  .sec h3 { font-size: 12px; color: var(--ink2); font-weight: 600; margin: 0 0 8px; display: flex; justify-content: space-between; }
  .sec h3 span { color: var(--muted); font-weight: 400; }
  .hb { display: grid; grid-template-columns: 104px 1fr 50px; align-items: center; gap: 8px; font-size: 12px; margin: 3px 0; }
  .hb > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hb .tr { height: 9px; }
  .hb .fl { height: 9px; background: var(--s3); border-radius: 0 4px 4px 0; min-width: 2px; }
  .hb .vv { text-align: right; color: var(--ink2); font-variant-numeric: tabular-nums; }
  .hb.click { cursor: pointer; border-radius: 4px; }
  .hb.click:hover { background: var(--s0); }
  .stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
  .stat3 > div { background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
  .stat3 .k { font-size: 11px; color: var(--muted); }
  .stat3 .v { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .warn { border: 1px solid var(--critical); background: color-mix(in srgb, var(--critical) 7%, transparent); border-radius: 8px; padding: 8px 10px; font-size: 12px; margin-bottom: 12px; }
  table.sh { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; margin-top: 6px; }
  table.sh td, table.sh th { padding: 4px 5px; border-bottom: 1px solid var(--line); text-align: right; font-size: 11.5px; }
  table.sh th { color: var(--muted); font-weight: 500; }
  table.sh td:first-child, table.sh th:first-child { text-align: left; }
  table.sh td.q { color: var(--critical); font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .chip { border: 1px solid var(--line2); background: var(--surface); color: var(--ink2); border-radius: 999px; padding: 3px 10px; font-size: 11.5px; cursor: pointer; }
  .chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .note { border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; margin-bottom: 8px; background: var(--raise); }
  .note .top2 { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11px; color: var(--ink2); }
  .badge { border-radius: 4px; padding: 1px 6px; font-size: 10.5px; font-weight: 600; }
  .b-def { background: color-mix(in srgb, var(--critical) 12%, transparent); color: var(--critical); }
  .b-rep { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
  .b-mtg { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .st { display: inline-flex; align-items: center; gap: 4px; }
  .st i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .note .ko { margin-top: 5px; font-size: 13px; line-height: 1.5; }
  .note details { margin-top: 3px; color: var(--muted); font-size: 11.5px; }
  .note details summary { cursor: pointer; }
  .ph { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; margin-top: 8px; }
  .ph img { width: 100%; height: 86px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); display: block; }
  .ph span, .note a.lk { font-size: 12px; color: var(--accent); text-decoration: none; }
  .empty { color: var(--muted); font-size: 12px; padding: 4px 0; }
  .ph .w { position: relative; }
  .ph .x { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(0,0,0,.6); color: #fff; font-size: 12px; line-height: 20px; padding: 0; }
  .ph .new img { outline: 2px solid var(--accent); outline-offset: -2px; }
  .phbar { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .addph { border: 1px dashed var(--line2); background: transparent; color: var(--muted); border-radius: 6px; padding: 4px 10px;
    font: inherit; font-size: 12px; cursor: pointer; }
  .addph:hover { color: var(--accent); border-color: var(--accent); }
  .addph:disabled { opacity: .5; cursor: wait; }
  .upmsg { font-size: 11.5px; color: var(--muted); }
  .upmsg.err { color: var(--critical); }
  .b-man { background: var(--raise); color: var(--ink); border: 1px solid var(--line2); }
  .note.drop { outline: 2px dashed var(--accent); outline-offset: -4px; background: color-mix(in srgb, var(--accent) 6%, var(--surface)); }
  .phbar .gap { flex: 1; }
  .phbar .addph.del { border-style: solid; }
  .memos { margin-top: 8px; border-left: 3px solid var(--line2); padding-left: 8px; }
  .memo { font-size: 12.5px; line-height: 1.45; margin: 4px 0; }
  .memo .m { color: var(--muted); font-size: 11px; margin-left: 4px; }
  .memo button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 11px; padding: 0 2px; }
  .memo button.armed, .x.armed, .addph.armed { color: var(--critical) !important; border-color: var(--critical) !important; }
  .mform { margin-top: 8px; }
  .mform textarea, .rform textarea, .rform select, .rform input[type=time] { width: 100%; box-sizing: border-box; border: 1px solid var(--line2); border-radius: 7px;
    padding: 7px 9px; font: inherit; font-size: 13px; background: var(--surface); color: var(--ink); }
  .mform textarea, .rform textarea { min-height: 64px; resize: vertical; }
  .fbtn { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; align-items: center; }
  .fbtn button { padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line2); background: transparent; font: inherit; font-size: 12px; cursor: pointer; }
  .fbtn button.ok { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .fbtn .upmsg { margin-right: auto; }
  .addrec { width: 100%; margin: 4px 0 10px; padding: 8px; border: 1px dashed var(--line2); border-radius: 8px; background: transparent;
    color: var(--muted); font: inherit; font-size: 12.5px; cursor: pointer; }
  .addrec:hover { color: var(--accent); border-color: var(--accent); }
  .rform { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: var(--raise); }
  .rform .row2 { display: grid; grid-template-columns: 1fr 1fr 90px; gap: 6px; margin-bottom: 6px; }
  .rform label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 2px; }
  .dz { margin-top: 6px; border: 1px dashed var(--line2); border-radius: 7px; padding: 10px; text-align: center; font-size: 12px; color: var(--muted); cursor: pointer; }
  .dz.drop { border-color: var(--accent); color: var(--accent); }
  .dz .th { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 6px; }
  .dz .th img { width: 54px; height: 54px; object-fit: cover; border-radius: 5px; }
  #pinbox { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; z-index: 60; }
  #pinbox .in { background: var(--surface); border-radius: 12px; padding: 20px 22px; width: 300px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  #pinbox h4 { margin: 0 0 12px; font-size: 15px; }
  #pinbox label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  #pinbox input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--line2); border-radius: 7px; font: inherit; font-size: 14px; }
  #pinbox .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  #pinbox button { padding: 7px 14px; border-radius: 7px; border: 1px solid var(--line2); background: transparent; font: inherit; cursor: pointer; }
  #pinbox button.ok { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  #pinbox .err { color: var(--critical); font-size: 12px; margin-top: 8px; min-height: 1em; }
  .trend { display: flex; align-items: flex-end; gap: 2px; height: 70px; border-bottom: 1px solid var(--line2); }
  .trend i { flex: 1; background: var(--s3); border-radius: 2px 2px 0 0; min-height: 1px; }
  .trend i:hover { background: var(--s4); }
  .hint { color: var(--muted); font-size: 11.5px; margin-top: 6px; }

  #tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12px; line-height: 1.5;
    padding: 7px 10px; border-radius: 7px; display: none; z-index: 50; max-width: 300px; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
</style>
</head>
<body>

<div class="top">
  <div class="brand"><b>STC 로스 달력</b><span>OEE 로스 × LINE 기록 × 아침조회</span></div>
  <div class="seg"><button id="vMonth" class="on">월간</button><button id="vWeek">주간</button></div>
  <div class="period">
    <button id="prev" aria-label="이전">‹</button>
    <div class="lbl" id="plbl">—</div>
    <button id="next" aria-label="다음">›</button>
    <select id="wn" style="display:none"><option value="8">8주</option><option value="12" selected>12주</option><option value="26">26주</option></select>
  </div>
  <div class="grow"></div>
  <div class="toggles">
    <button class="tg" id="tgFocus" title="이유 기록이 없는 칸만 강조">? 미기록만 보기</button>
    <button class="tg on" id="tgDots" title="LINE·아침조회 기록 표시">● 기록 표시</button>
  </div>
  <span class="upd" id="upd"></span>
</div>

<div class="kpis" id="kpis"></div>

<div class="layout">
  <section class="board">
    <div class="legend" id="legend"></div>
    <div class="scroll" id="scroll"><div id="loading">불러오는 중…</div><table class="cal" id="cal"></table></div>
  </section>
  <aside class="insp" id="insp">
    <div class="ih"><div class="t" id="it">요약</div><div class="s" id="is"></div></div>
    <div class="ib" id="ib"></div>
  </aside>
</div>
<div id="tip"></div>

<script>
// 데이터 주소: LINE수집기 웹앱 (Code.gs doGet 의 ?api=loss)
const API_URL = 'https://script.google.com/macros/s/AKfycbzmKgVmd2fuGfDIJS2ImMxzGBXXjuodifGQH5XgmPnQva91_AO4SzrUBAr5d4vjQBpX/exec';
const WD = ['일','월','화','수','목','금','토'];
const BINS = { month: [60, 180, 360], week: [300, 900, 1800] };
let D = null, VIEW = 'month', YM = null, weekEnd = null, SEL = null;

// ---------- 공통 ----------
const $ = id => document.getElementById(id);
function pad(n) { return String(n).padStart(2, '0'); }
function today() { const n = new Date(); return n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate()); }
function addDays(d, n) { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate()); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtMin(m) { m = Math.round(m); return m >= 60 ? (Math.floor(m / 60) + '시간' + (m % 60 ? ' ' + m % 60 + '분' : '')) : m + '분'; }
function hrs(m) { return m >= 600 ? Math.round(m / 60) + 'h' : (m / 60).toFixed(1) + 'h'; }
function md(d) { return (+d.slice(5, 7)) + '/' + (+d.slice(8, 10)); }
function wd(d) { return WD[new Date(d + 'T00:00:00').getDay()]; }
function lvl(m) { const b = BINS[VIEW]; return m <= 0 ? 0 : m < b[0] ? 1 : m < b[1] ? 2 : m < b[2] ? 3 : 4; }
function stColor(s) {
  s = s || '';
  if (/미해결|재발|미조치/.test(s)) return ['var(--critical)', s];
  if (/완료|조치/.test(s)) return ['var(--good)', s];
  if (/진행|대기/.test(s)) return ['var(--warning)', s];
  return ['var(--muted)', s || '보고'];
}

// ---------- 불러오기 ----------
function load() {
  $('loading').style.display = 'block'; $('loading').textContent = '불러오는 중…';
  $('cal').innerHTML = '';
  const ym = YM || today().slice(0, 7), n = $('wn').value, end = weekEnd || today();
  const ok = j => render(typeof j === 'string' ? JSON.parse(j) : j);
  const fail = e => { $('loading').textContent = '불러오기 실패: ' + (e && e.message || e); };
  if (window.google && google.script && google.script.run) {
    const r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail);
    VIEW === 'week' ? r.getLossWeekly(n, end) : r.getLossCalendar(ym);
  } else if (window.SAMPLE) {
    ok(VIEW === 'week' ? window.SAMPLE_WEEK : window.SAMPLE);
  } else {
    const q = VIEW === 'week' ? '?api=loss&view=week&n=' + n + '&end=' + end : '?api=loss&ym=' + ym;
    fetch(API_URL + q).then(r => r.json()).then(ok).catch(fail);
  }
}

// ---------- 그리기 ----------
function render(data) {
  if (VIEW === 'week' && data.view !== 'week') {
    $('loading').textContent = '주간 데이터를 받지 못했습니다. Apps Script를 「새 버전」으로 다시 배포해 주세요.'; return;
  }
  D = data; SEL = null;
  $('loading').style.display = 'none';
  $('upd').textContent = '갱신 ' + data.updated.slice(5);
  if (data.view === 'week') {
    const ws = data.weeks;
    $('plbl').textContent = ws[0].label + ' – ' + ws[ws.length - 1].label + '  (' + md(ws[0].start) + '~' + md(ws[ws.length - 1].end) + ')';
  } else {
    YM = data.ym; $('plbl').textContent = data.ym.slice(0, 4) + '년 ' + (+data.ym.slice(5)) + '월';
  }
  renderKpis(); renderLegend();
  data.view === 'week' ? renderWeek() : renderMonth();
  showSummary();
}

function renderKpis() {
  const s = D.summary;
  const rate = s.totalPlan ? (s.totalLoss / s.totalPlan * 100) : 0;
  const pct = s.bigLossCells ? Math.round(s.unexplained / s.bigLossCells * 100) : 0;
  const top = s.top[0], cause = (s.codeTop || [])[0];
  $('kpis').innerHTML =
    kpi('총 로스', Math.round(s.totalLoss / 60).toLocaleString() + '<small>시간</small>', '로스율 ' + rate.toFixed(1) + '% · 계획 ' + Math.round(s.totalPlan / 60).toLocaleString() + '시간', rate, 'var(--s3)') +
    kpi('로스 1위 호기', top ? top[0] + '<small>' + Math.round(top[1] / 60) + '시간</small>' : '—', cause ? '정지 원인 1위: ' + esc(cause[0]) + ' ' + Math.round(cause[1] / 60) + '시간' : '', null) +
    kpi('이유 기록 없는 큰 로스', s.unexplained + '<small>/ ' + s.bigLossCells + '칸</small>', pct + '% · 설비 로스 120분 이상인 날 기준', pct, 'var(--critical)', 'focus') +
    kpi('미결 기록', s.open + '<small>건</small>', (s.openFrom ? md(s.openFrom) + ' 이후 ' : '') + '미조치·진행·미해결', null);
  const f = document.querySelector('.kpi[data-act="focus"]');
  if (f) f.onclick = () => toggleFocus();
}
function kpi(k, v, sub, pct, color, act) {
  return '<div class="kpi' + (act ? ' clickable" data-act="' + act : '') + '"><div class="txt"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="sub">' + sub + '</div>' +
    (pct != null ? '<div class="bar"><i style="width:' + Math.min(100, pct) + '%;background:' + color + '"></i></div>' : '') + '</div></div>';
}

function renderLegend() {
  const b = BINS[VIEW], u = VIEW === 'week' ? '분/주' : '분/일';
  $('legend').innerHTML = '<span>로스(' + u + ')</span>' +
    '<span><i class="sw" style="background:var(--s1)"></i>1–' + (b[0] - 1) + '</span>' +
    '<span><i class="sw" style="background:var(--s2)"></i>' + b[0] + '–' + (b[1] - 1) + '</span>' +
    '<span><i class="sw" style="background:var(--s3)"></i>' + b[1] + '–' + (b[2] - 1) + '</span>' +
    '<span><i class="sw" style="background:var(--s4)"></i>' + b[2] + '+</span>' +
    '<span><i class="dot"></i>LINE·아침조회 기록 있음</span>' +
    '<span><i class="ring"></i>설비 로스 120분+ 인데 이유 기록 없음' + (VIEW === 'week' ? ' (숫자=일수)' : '') + '</span>';
}

function machinesShown() {
  return D.machines.filter(mc => (D.cells[mc] && Object.keys(D.cells[mc]).length) || (D.notes[mc] && Object.keys(D.notes[mc]).length));
}
function rowHead(mc, tot, max) {
  return '<td class="mc"><div class="nm">' + mc + '</div><div class="tt"><i style="width:' + (max ? Math.max(2, tot / max * 44) : 0) + 'px"></i>' + (tot ? hrs(tot) : '') + '</div></td>';
}

function renderMonth() {
  const days = D.days, byDay = D.summary.byDay || {};
  const dmax = Math.max(1, ...days.map(d => byDay[d] || 0));
  const td = today();
  let h = '<thead><tr class="mini"><th class="mc"></th>' + days.map(d =>
    '<th data-tip="' + md(d) + '(' + wd(d) + ') 전체 로스 ' + (byDay[d] ? fmtMin(byDay[d]) : '없음') + '"><div class="mb" style="height:' + ((byDay[d] || 0) / dmax * 26) + 'px"></div></th>').join('') + '<th></th></tr>';
  h += '<tr class="days"><th class="mc" style="text-align:left;padding-left:6px;color:var(--muted)">호기</th>' + days.map(d => {
    const w = new Date(d + 'T00:00:00').getDay();
    return '<th class="' + (w === 0 || w === 6 ? 'we ' : '') + (d === td ? 'today' : '') + '"><span class="dn">' + (+d.slice(8)) + '</span>' + WD[w] + '</th>';
  }).join('') + '<th>합계</th></tr></thead><tbody>';
  const ms = machinesShown();
  const tots = {}; ms.forEach(mc => { tots[mc] = days.reduce((a, d) => a + ((D.cells[mc] && D.cells[mc][d]) ? D.cells[mc][d].loss : 0), 0); });
  const tmax = Math.max(1, ...ms.map(m => tots[m]));
  ms.forEach(mc => {
    h += '<tr>' + rowHead(mc, tots[mc], tmax);
    days.forEach(d => {
      const c = D.cells[mc] && D.cells[mc][d], n = (D.notes[mc] && D.notes[mc][d]) || [];
      const loss = c ? c.loss : 0;
      const cls = ['c', loss > 0 ? 'l' + lvl(loss) : (c ? '' : 'empty'), c && c.unexplained ? 'unx' : ''].join(' ');
      h += '<td class="' + cls + '" data-k="' + mc + '|' + d + '">' + (loss > 0 ? Math.round(loss) : '') +
        (n.length ? '<i class="d"></i>' : '') + (c && c.unexplained ? '<span class="q">?</span>' : '') + '</td>';
    });
    h += '<td class="tot">' + (tots[mc] ? fmtMin(tots[mc]) : '') + '</td></tr>';
  });
  $('cal').className = 'cal' + ($('tgDots').classList.contains('on') ? '' : ' nodots') + (FOCUS ? ' focus' : '');
  $('cal').innerHTML = h + '</tbody>';
}

function renderWeek() {
  const ws = D.weeks;
  const colTot = ws.map(w => Object.keys(D.cells).reduce((a, mc) => a + (D.cells[mc][w.key] ? D.cells[mc][w.key].loss : 0), 0));
  const cmax = Math.max(1, ...colTot);
  let h = '<thead><tr class="mini"><th class="mc"></th>' + ws.map((w, i) =>
    '<th data-tip="' + esc(w.label) + ' 전체 로스 ' + (colTot[i] ? fmtMin(colTot[i]) : '없음') + '"><div class="mb" style="height:' + (colTot[i] / cmax * 26) + 'px"></div></th>').join('') + '<th></th></tr>';
  h += '<tr class="days"><th class="mc" style="text-align:left;padding-left:6px;color:var(--muted)">호기</th>' + ws.map(w =>
    '<th><span class="dn">' + esc(w.label) + '</span>' + md(w.start) + '~</th>').join('') + '<th>합계</th></tr></thead><tbody>';
  const ms = machinesShown();
  const tots = {}; ms.forEach(mc => { tots[mc] = ws.reduce((a, w) => a + ((D.cells[mc] && D.cells[mc][w.key]) ? D.cells[mc][w.key].loss : 0), 0); });
  const tmax = Math.max(1, ...ms.map(m => tots[m]));
  ms.forEach(mc => {
    h += '<tr>' + rowHead(mc, tots[mc], tmax);
    ws.forEach(w => {
      const c = D.cells[mc] && D.cells[mc][w.key], n = (D.notes[mc] && D.notes[mc][w.key]) || [];
      const loss = c ? c.loss : 0, q = c ? c.unexplainedDays : 0;
      h += '<td class="' + ['c', loss > 0 ? 'l' + lvl(loss) : (c ? '' : 'empty'), q ? 'unx' : ''].join(' ') + '" data-k="' + mc + '|' + w.key + '">' +
        (loss > 0 ? hrs(loss) : '') + (n.length ? '<i class="d"></i>' : '') + (q ? '<span class="q">?' + q + '</span>' : '') + '</td>';
    });
    h += '<td class="tot">' + (tots[mc] ? fmtMin(tots[mc]) : '') + '</td></tr>';
  });
  h += '<tr class="sum"><td class="mc" style="color:var(--ink2);font-weight:600">전체</td>' + colTot.map(t => '<td>' + (t ? hrs(t) : '') + '</td>').join('') + '<td></td></tr>';
  $('cal').className = 'cal week' + ($('tgDots').classList.contains('on') ? '' : ' nodots') + (FOCUS ? ' focus' : '');
  $('cal').innerHTML = h + '</tbody>';
}

// ---------- 인스펙터: 요약 ----------
function showSummary() {
  SEL = null; document.querySelectorAll('td.sel').forEach(x => x.classList.remove('sel'));
  const s = D.summary;
  $('it').innerHTML = (VIEW === 'week' ? '선택 기간' : '이번 달') + ' 요약';
  $('is').textContent = '달력 칸을 누르면 그 날(주)의 로스 내역과 기록이 여기에 나옵니다';
  const ct = s.codeTop || [], cmax = ct.length ? ct[0][1] : 1;
  const tp = s.top || [], tmax = tp.length ? tp[0][1] : 1;
  let h = '<div class="sec"><h3>정지 원인 Top 10 <span>전체 호기</span></h3>' + (ct.length ? ct.map(c =>
    '<div class="hb" data-tip="' + esc(c[0]) + ' · ' + fmtMin(c[1]) + ' (' + (s.totalLoss ? Math.round(c[1] / s.totalLoss * 100) : 0) + '%)"><span>' + esc(c[0]) +
    '</span><div class="tr"><div class="fl" style="width:' + (c[1] / cmax * 100) + '%"></div></div><span class="vv">' + Math.round(c[1] / 60) + 'h</span></div>').join('') : '<div class="empty">데이터 없음</div>') + '</div>';
  h += '<div class="sec"><h3>로스 Top 5 호기 <span>누르면 해당 호기 강조</span></h3>' + (tp.length ? tp.map(t =>
    '<div class="hb click" data-mc="' + t[0] + '"><span><b>' + t[0] + '</b></span><div class="tr"><div class="fl" style="width:' + (t[1] / tmax * 100) + '%;background:var(--s4)"></div></div><span class="vv">' + Math.round(t[1] / 60) + 'h</span></div>').join('') : '<div class="empty">데이터 없음</div>') + '</div>';
  // 추세
  let pts;
  if (D.view === 'week') pts = D.weeks.map(w => ({ t: w.label, v: Object.keys(D.cells).reduce((a, mc) => a + (D.cells[mc][w.key] ? D.cells[mc][w.key].loss : 0), 0) }));
  else pts = D.days.map(d => ({ t: md(d) + '(' + wd(d) + ')', v: (s.byDay || {})[d] || 0 }));
  const vmax = Math.max(1, ...pts.map(p => p.v)), wdat = pts.filter(p => p.v > 0);
  const avg = wdat.length ? wdat.reduce((a, p) => a + p.v, 0) / wdat.length : 0;
  h += '<div class="sec"><h3>' + (D.view === 'week' ? '주별' : '일별') + ' 로스 추세 <span>평균 ' + Math.round(avg / 60) + 'h</span></h3><div class="trend">' +
    pts.map(p => '<i data-tip="' + esc(p.t) + ' · ' + (p.v ? fmtMin(p.v) : '데이터 없음') + '" style="height:' + (p.v / vmax * 100) + '%"></i>').join('') + '</div></div>';
  $('ib').innerHTML = h;
  $('ib').querySelectorAll('.hb.click').forEach(el => el.onclick = () => flashRow(el.dataset.mc));
}
function flashRow(mc) {
  const tds = [...document.querySelectorAll('#cal td.c[data-k^="' + mc + '|"]')];
  if (!tds.length) return;
  tds[0].closest('tr').scrollIntoView({ block: 'center', behavior: 'smooth' });
  tds.forEach(t => { t.style.outline = '2px solid var(--ink)'; setTimeout(() => t.style.outline = '', 1600); });
}

// ---------- 인스펙터: 상세 ----------
function codeBars(codes) {
  const list = Object.entries(codes).sort((a, b) => b[1] - a[1]);
  if (!list.length) return '<div class="empty">정지 코드 기록 없음</div>';
  const max = list[0][1];
  return list.map(x => '<div class="hb"><span>' + esc(x[0]) + '</span><div class="tr"><div class="fl" style="width:' + (x[1] / max * 100) + '%"></div></div><span class="vv">' + x[1] + '분</span></div>').join('');
}
function head(title, sub) {
  $('it').innerHTML = '<button id="back">‹ 요약</button>' + esc(title);
  $('is').textContent = sub;
  $('back').onclick = showSummary;
}
function openDay(key) {
  const [mc, d] = key.split('|');
  const c = D.cells[mc] && D.cells[mc][d], notes = (D.notes[mc] && D.notes[mc][d]) || [];
  head(mc + ' · ' + md(d) + ' (' + wd(d) + ')', c ? '' : '이 날 OEE 기록 없음');
  let h = '';
  if (c) h += '<div class="stat3"><div><div class="k">로스</div><div class="v">' + fmtMin(c.loss) + '</div></div><div><div class="k">계획</div><div class="v">' + fmtMin(c.plan) +
    '</div></div><div><div class="k">로스율</div><div class="v">' + (c.plan ? Math.round(c.loss / c.plan * 100) : 0) + '%</div></div></div>';
  if (c && c.unexplained) h += '<div class="warn">⚠ 설비 관련 로스 ' + fmtMin(c.equip) + '인데 LINE·아침조회에 이유가 없습니다.</div>';
  if (c) {
    h += '<div class="sec"><h3>로스 내역 <span>OEE 정지 코드</span></h3>' + codeBars(c.codes) +
      '<table class="sh"><tr><th>교대</th><th>계획</th><th>가동</th><th>로스</th><th>주요 원인</th></tr>' + c.shifts.map(s => {
        const t = Object.entries(s.codes).sort((a, b) => b[1] - a[1])[0];
        return '<tr><td>' + esc(s.shift) + (s.kind && s.kind !== '정규' ? ' (' + esc(s.kind) + ')' : '') + '</td><td>' + s.plan + '</td><td>' + s.run + '</td><td>' + s.loss + '</td><td>' + (t ? esc(t[0]) : '') + '</td></tr>';
      }).join('') + '</table></div>';
  }
  h += notesSection(notes, false, '이 날의 기록') + '<div class="hint">※ 아침조회는 다음 날 아침 회의 내용을 전날 칸에 붙여서 보여줍니다.</div>';
  $('ib').innerHTML = h; drawNotes(); $('ib').scrollTop = 0; reveal();
}
function openWeek(key) {
  const [mc, k] = key.split('|');
  const w = D.weeks.find(x => x.key === k), c = D.cells[mc] && D.cells[mc][k], notes = (D.notes[mc] && D.notes[mc][k]) || [];
  head(mc + ' · ' + w.label, md(w.start) + ' ~ ' + md(w.end) + (c ? '' : ' · OEE 기록 없음'));
  let h = '';
  if (c) h += '<div class="stat3"><div><div class="k">로스</div><div class="v">' + hrs(c.loss) + '</div></div><div><div class="k">계획</div><div class="v">' + hrs(c.plan) +
    '</div></div><div><div class="k">로스율</div><div class="v">' + (c.plan ? Math.round(c.loss / c.plan * 100) : 0) + '%</div></div></div>';
  if (c && c.unexplainedDays) h += '<div class="warn">⚠ 설비 로스 120분+ 인데 이유 기록이 없는 날이 ' + c.unexplainedDays + '일 있습니다.</div>';
  h += '<div class="sec"><h3>로스 내역 <span>주 합계</span></h3>' + (c ? codeBars(c.codes) : '<div class="empty">OEE 데이터 없음</div>') + '</div>';
  h += '<div class="sec"><h3>요일별</h3><table class="sh"><tr><th>날짜</th><th>로스</th><th>설비</th><th>기록</th><th></th></tr>';
  for (let i = 0; i < 7; i++) {
    const d = addDays(w.start, i), x = c && c.daily[d];
    h += '<tr><td>' + md(d) + ' (' + wd(d) + ')</td><td>' + (x ? x.loss : '') + '</td><td>' + (x ? x.equip : '') + '</td><td>' + (x && x.notes ? x.notes + '건' : '') + '</td><td class="q">' + (x && x.unexplained ? '?' : '') + '</td></tr>';
  }
  h += '</table></div>' + notesSection(notes, true, '이 주의 기록');
  $('ib').innerHTML = h; drawNotes(); $('ib').scrollTop = 0; reveal();
}
function reveal() { if (window.innerWidth <= 1100) $('insp').scrollIntoView({ behavior: 'smooth', block: 'start' }); }

// ---------- 기록 필터 ----------
const SRC = ['LINE 불량', 'LINE 수리', '아침조회', '직접 입력'];
const FILTER = { 'LINE 불량': true, 'LINE 수리': true, '아침조회': true, '직접 입력': true, openOnly: false };
try { Object.assign(FILTER, JSON.parse(localStorage.getItem('lossNoteFilter') || '{}')); } catch (e) {}
let CUR = [], CUR_DATE = false;
const grp = n => /^아침조회/.test(n.src) ? '아침조회' : n.src;
const isOpen = n => /미해결|재발|진행|대기|미조치/.test(n.status || '');
function notesSection(notes, showDate, title) {
  CUR = notes; CUR_DATE = showDate;
  const canAdd = !showDate && VIEW === 'month' && SEL;
  return '<div class="sec"><h3>' + title + ' <span>' + notes.length + '건</span></h3>' +
    (canAdd ? '<button class="addrec" id="addrec">＋ 기록 직접 추가 (내용·사진)</button><div id="rformBox"></div>' : '') +
    '<div class="chips" id="chips"></div><div id="notelist"></div></div>';
}
function drawNotes() {
  const cnt = {}; CUR.forEach(n => { const g = grp(n); cnt[g] = (cnt[g] || 0) + 1; });
  $('chips').innerHTML = SRC.map(g => '<button class="chip' + (FILTER[g] ? ' on' : '') + '" data-g="' + g + '">' + g + ' ' + (cnt[g] || 0) + '</button>').join('') +
    '<button class="chip' + (FILTER.openOnly ? ' on' : '') + '" data-g="openOnly">미결만</button>';
  const shown = CUR.filter(n => FILTER[grp(n)] !== false && (!FILTER.openOnly || isOpen(n)))
    .sort((a, b) => ((a.date || '') + (a.time || '99')) < ((b.date || '') + (b.time || '99')) ? -1 : 1);
  $('notelist').innerHTML = shown.length ? shown.map(card).join('') : '<div class="empty">' + (CUR.length ? '선택한 조건에 맞는 기록이 없습니다' : 'LINE·아침조회 기록 없음') + '</div>';
}
function card(n) {
  const st = stColor(n.status), g = grp(n);
  const bc = g === 'LINE 불량' ? 'b-def' : g === 'LINE 수리' ? 'b-rep' : g === '직접 입력' ? 'b-man' : 'b-mtg';
  const memos = (n.memos || []).map(m => '<div class="memo">💬 ' + esc(m.text) + '<span class="m">' + esc(m.who || '') + ' ' + esc(m.at || '') + '</span>' +
    '<button class="mdel" data-id="' + esc(m.id) + '" title="메모 지우기">지우기</button></div>').join('');
  return '<div class="note"' + (n.key ? ' data-key="' + esc(n.key) + '"' : '') + '><div class="top2"><span class="badge ' + bc + '">' + esc(n.src) + '</span>' +
    (CUR_DATE && n.date ? '<b>' + md(n.date) + '(' + wd(n.date) + ')</b>' : '') + (n.time ? '<span>' + esc(n.time) + '</span>' : '') +
    (n.type ? '<span>· ' + esc(n.type) + '</span>' : '') + (n.manual && n.who ? '<span>· ' + esc(n.who) + '</span>' : '') +
    '<span class="st"><i style="background:' + st[0] + '"></i>' + esc(st[1]) + '</span></div>' +
    '<div class="ko">' + esc(n.ko && n.ko !== '(번역 대기)' ? n.ko : n.text) + '</div>' +
    (n.ko && n.text && n.ko !== '(번역 대기)' ? '<details><summary>원문</summary>' + esc(n.text) + '</details>' : '') + photos(n) +
    (memos ? '<div class="memos">' + memos + '</div>' : '') +
    (n.key ? '<div class="phbar"><button class="addph" data-key="' + esc(n.key) + '">📷 사진</button><button class="addmemo">💬 메모</button>' +
      '<span class="upmsg"></span><span class="gap"></span>' + (n.manual ? '<button class="addph del recdel">기록 삭제</button>' : '') + '</div><div class="mbox"></div>'
           : '<div class="phbar"><button class="addph" disabled>📷 사진</button><span class="upmsg err">Apps Script를 「새 버전」으로 배포하면 사용할 수 있습니다</span></div>') + '</div>';
}
function photos(n) {
  const ids = n.photos || [], added = n.added || [];
  if (!ids.length) return n.photo ? '<a class="lk" href="' + esc(n.photo) + '" target="_blank">📷 사진 보기 ↗</a>' : '';
  const lk = n.photo && ids.length === added.length ? '<a class="lk" href="' + esc(n.photo) + '" target="_blank">📷 사진 보기 ↗</a>' : '';
  return lk + '<div class="ph">' + ids.map(id => {
    const mine = added.indexOf(id) >= 0;
    return '<div class="w' + (mine ? ' new' : '') + '"><a href="https://drive.google.com/file/d/' + esc(id) + '/view" target="_blank">' +
      '<img loading="lazy" alt="사진" src="https://drive.google.com/thumbnail?id=' + esc(id) + '&sz=w400" ' +
      'onerror="thumbRetry(this)"></a>' +
      (mine ? '<button class="x" data-id="' + esc(id) + '" title="추가한 사진 지우기">×</button>' : '') + '</div>';
  }).join('') + '</div>';
}
// 방금 올린 사진은 드라이브 미리보기가 늦게 생김 → 몇 번 다시 시도 후 링크로 표시
function thumbRetry(img) {
  const t = +(img.dataset.t || 0);
  if (t < 4) { img.dataset.t = t + 1; setTimeout(() => { img.src = img.src.replace(/&r=\d+$/, '') + '&r=' + Date.now(); }, 2500); return; }
  img.replaceWith(Object.assign(document.createElement('span'), { textContent: '📷 사진 열기' }));
}

// ---------- 사진 추가 / 삭제 ----------
const phInput = Object.assign(document.createElement('input'), { type: 'file', accept: 'image/*', multiple: true });
phInput.style.display = 'none'; document.body.appendChild(phInput);
let PH_KEY = null;
const noteByKey = k => CUR.find(n => n.key === k);
// PIN·이름 입력창 (페이지 안에 표시 — 브라우저 팝업 차단과 무관)
const pinBox = document.createElement('div');
pinBox.id = 'pinbox';
pinBox.innerHTML = '<div class="in"><h4>📷 사진 추가</h4><label>PIN 번호</label><input id="pinIn" type="password" inputmode="numeric" autocomplete="off">' +
  '<label>올리는 사람 이름 (생략 가능)</label><input id="whoIn" type="text" autocomplete="name">' +
  '<div class="err" id="pinErr"></div><div class="btns"><button id="pinNo">취소</button><button class="ok" id="pinOk">확인</button></div></div>';
document.body.appendChild(pinBox);
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
function askPin(msg) {
  return new Promise(res => {
    $('pinIn').value = ''; $('whoIn').value = ls('photoWho') || ''; $('pinErr').textContent = msg || '';
    pinBox.style.display = 'flex'; setTimeout(() => $('pinIn').focus(), 50);
    const done = ok => {
      pinBox.style.display = 'none'; $('pinOk').onclick = $('pinNo').onclick = $('pinIn').onkeydown = $('whoIn').onkeydown = null;
      if (!ok) return res('');
      const p = $('pinIn').value.trim(); ls('photoPin', p); ls('photoWho', $('whoIn').value.trim()); res(p);
    };
    $('pinOk').onclick = () => done(true); $('pinNo').onclick = () => done(false);
    $('pinIn').onkeydown = $('whoIn').onkeydown = e => { if (e.key === 'Enter') done(true); if (e.key === 'Escape') done(false); };
  });
}
async function getPin(reset, msg) {
  const p = reset ? '' : ls('photoPin');
  return p || await askPin(msg);
}
function getWho() { return ls('photoWho') || ''; }
function shrink(file) {   // 긴 변 1600px, JPEG 85% 로 줄여서 올림
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('사진을 읽을 수 없습니다')); };
    img.src = url;
  });
}
function postApi(body) {
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(r => r.json());
}
function boxOf(key) { return document.querySelector('.note[data-key="' + key + '"]'); }
function setMsg(key, t, err) {
  const b = boxOf(key); if (!b) return;
  const m = b.querySelector('.upmsg'); m.textContent = t; m.classList.toggle('err', !!err);
  b.querySelector('.addph').disabled = !err && /올리는/.test(t);
}
// PIN 확인 후 서버 호출 (PIN이 틀리면 다시 물어봄)
async function api(body) {
  let pin = await getPin();
  if (!pin) throw new Error('PIN 번호를 입력해야 합니다');
  let r = await postApi(Object.assign({}, body, { pin, who: getWho() }));
  if (!r.ok && /PIN/.test(r.error || '')) {
    pin = await getPin(true, 'PIN 번호가 맞지 않습니다. 다시 입력하세요');
    if (!pin) throw new Error('PIN 번호가 필요합니다');
    r = await postApi(Object.assign({}, body, { pin, who: getWho() }));
  }
  return r;
}
async function uploadFiles(key, files) {
  const n = noteByKey(key);
  files = [...files].filter(f => /^image\//.test(f.type));
  if (!n || !files.length) { if (n) setMsg(key, '사진 파일만 올릴 수 있습니다', true); return; }
  const dc = (SEL || '').split('|')[0];
  for (let i = 0; i < files.length; i++) {
    setMsg(key, '올리는 중… ' + (i + 1) + '/' + files.length);
    try {
      const data = await shrink(files[i]);
      const r = await api({ action: 'addPhoto', key, dc, date: n.date, src: n.src, text: n.ko || n.text, data });
      if (!r.ok) { setMsg(key, '실패: ' + (r.error || ''), true); return; }
      n.photos = (n.photos || []).concat(r.id); n.added = (n.added || []).concat(r.id);
    } catch (e) { setMsg(key, '실패: ' + (e.message || e), true); return; }
  }
  drawNotes(); setMsg(key, '✅ ' + files.length + '장 추가됨');
}
phInput.addEventListener('change', () => { const f = [...phInput.files]; phInput.value = ''; uploadFiles(PH_KEY, f); });

// 두 번 눌러야 지워지는 버튼 (브라우저 확인창 대신)
function armed(btn, label) {
  if (btn.classList.contains('armed')) return true;
  const old = btn.textContent; btn.classList.add('armed'); btn.textContent = label || '한 번 더 누르면 삭제';
  setTimeout(() => { btn.classList.remove('armed'); btn.textContent = old; }, 3000);
  return false;
}

document.addEventListener('click', async e => {
  const a = e.target.closest('.addph:not(.del)');
  if (a && a.dataset.key) { PH_KEY = a.dataset.key; phInput.click(); return; }
  const box = e.target.closest('.note'), key = box && box.dataset.key, n = key && noteByKey(key);

  // 💬 메모 쓰기
  if (e.target.closest('.addmemo') && n) {
    const mb = box.querySelector('.mbox');
    if (mb.innerHTML) { mb.innerHTML = ''; return; }
    mb.innerHTML = '<div class="mform"><textarea placeholder="원인, 조치 내용, 부품 등을 적어 주세요"></textarea>' +
      '<div class="fbtn"><button class="mno">취소</button><button class="ok msave">저장</button></div></div>';
    mb.querySelector('textarea').focus(); return;
  }
  if (e.target.closest('.mno')) { box.querySelector('.mbox').innerHTML = ''; return; }
  if (e.target.closest('.msave') && n) {
    const ta = box.querySelector('.mbox textarea'), text = ta.value.trim(); if (!text) return;
    const b = e.target.closest('.msave'); b.disabled = true; b.textContent = '저장 중…';
    try {
      const r = await api({ action: 'addMemo', key, dc: (SEL || '').split('|')[0], date: n.date, text });
      if (!r.ok) throw new Error(r.error);
      n.memos = (n.memos || []).concat({ id: r.id, text, who: getWho(), at: r.at });
      drawNotes(); setMsg(key, '✅ 메모 저장됨');
    } catch (er) { b.disabled = false; b.textContent = '저장'; setMsg(key, '실패: ' + (er.message || er), true); }
    return;
  }
  // 메모 지우기
  const md_ = e.target.closest('.mdel');
  if (md_ && n) {
    if (!armed(md_, '정말 지우기')) return;
    try {
      const r = await api({ action: 'delManual', id: md_.dataset.id });
      if (!r.ok) throw new Error(r.error);
      n.memos = n.memos.filter(m => m.id !== md_.dataset.id); drawNotes();
    } catch (er) { setMsg(key, '실패: ' + (er.message || er), true); }
    return;
  }
  // 직접 넣은 기록 삭제
  const rd = e.target.closest('.recdel');
  if (rd && n) {
    if (!armed(rd, '한 번 더 누르면 삭제')) return;
    try {
      const r = await api({ action: 'delManual', id: key });
      if (!r.ok) throw new Error(r.error);
      removeNote(key); refreshDay();
    } catch (er) { setMsg(key, '실패: ' + (er.message || er), true); }
    return;
  }
  // 사진 지우기
  const x = e.target.closest('.ph .x');
  if (x && n) {
    e.preventDefault();
    if (!armed(x, '?')) return;
    const id = x.dataset.id; x.disabled = true;
    try {
      const r = await api({ action: 'delPhoto', key, id });
      if (!r.ok) throw new Error(r.error);
      n.photos = n.photos.filter(v => v !== id); n.added = n.added.filter(v => v !== id);
      drawNotes(); setMsg(key, '사진을 지웠습니다');
    } catch (er) { setMsg(key, '삭제 실패: ' + (er.message || er), true); x.disabled = false; }
    return;
  }
  // ＋ 기록 직접 추가
  if (e.target.closest('#addrec')) { openRecForm(); return; }
  if (e.target.closest('.rno')) { $('rformBox').innerHTML = ''; $('addrec').style.display = ''; return; }
  if (e.target.closest('.rsave')) { saveRecord(e.target.closest('.rsave')); return; }
  if (e.target.closest('.dz')) { recInput.click(); return; }
});

// ---------- 끌어다 놓기 (카드·기록 추가 창) ----------
document.addEventListener('dragover', e => {
  const t = e.target.closest('.note[data-key], .dz');
  if (!t || ![...(e.dataTransfer.types || [])].includes('Files')) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
  document.querySelectorAll('.drop').forEach(x => x !== t && x.classList.remove('drop'));
  t.classList.add('drop');
});
document.addEventListener('dragleave', e => {
  const t = e.target.closest('.drop'); if (t && !t.contains(e.relatedTarget)) t.classList.remove('drop');
});
document.addEventListener('drop', e => {
  const t = e.target.closest('.note[data-key], .dz');
  document.querySelectorAll('.drop').forEach(x => x.classList.remove('drop'));
  if (!t) { if (e.dataTransfer && e.dataTransfer.files.length) e.preventDefault(); return; }
  e.preventDefault();
  if (t.classList.contains('dz')) addRecFiles(e.dataTransfer.files);
  else uploadFiles(t.dataset.key, e.dataTransfer.files);
});
window.addEventListener('dragover', e => e.preventDefault());   // 사진을 빈 곳에 놓아도 새 탭으로 열리지 않게
window.addEventListener('drop', e => e.preventDefault());

// ---------- 기록 직접 추가 ----------
const recInput = Object.assign(document.createElement('input'), { type: 'file', accept: 'image/*', multiple: true });
recInput.style.display = 'none'; document.body.appendChild(recInput);
recInput.addEventListener('change', () => { addRecFiles(recInput.files); recInput.value = ''; });
let REC_FILES = [];
function addRecFiles(files) {
  [...files].filter(f => /^image\//.test(f.type)).forEach(f => REC_FILES.push(f));
  const th = document.querySelector('.dz .th'); if (!th) return;
  th.innerHTML = REC_FILES.map(f => '<img src="' + URL.createObjectURL(f) + '">').join('');
  document.querySelector('.dz .t').textContent = '📷 사진 ' + REC_FILES.length + '장 (더 놓거나 눌러서 추가)';
}
function openRecForm() {
  REC_FILES = [];
  const [mc, d] = SEL.split('|');
  const now = new Date(), isToday = d === today();
  const hm = isToday ? ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2) : '';
  const c = D.cells[mc] && D.cells[mc][d];
  const top = c ? Object.entries(c.codes).sort((a, b) => b[1] - a[1])[0] : null;
  $('addrec').style.display = 'none';
  $('rformBox').innerHTML = '<div class="rform">' +
    '<div class="row2"><div><label>분류</label><select id="rType">' +
    ['설비수리', '금형', '전기', '품질·불량', '취출·스프레이', '전기로·래들', '기타'].map(t => '<option>' + t + '</option>').join('') + '</select></div>' +
    '<div><label>상태</label><select id="rSt"><option>완료</option><option>진행·대기</option><option>미해결</option></select></div>' +
    '<div><label>시각</label><input type="time" id="rTime" value="' + hm + '"></div></div>' +
    '<label>내용 · ' + esc(mc) + ' ' + md(d) + (top ? ' (OEE 주 원인: ' + esc(top[0]) + ' ' + top[1] + '분)' : '') + '</label>' +
    '<textarea id="rText" placeholder="무슨 문제였고 어떻게 조치했는지 적어 주세요"></textarea>' +
    '<div class="dz"><span class="t">📷 사진을 여기로 끌어다 놓거나 눌러서 선택</span><div class="th"></div></div>' +
    '<div class="fbtn"><span class="upmsg" id="rMsg"></span><button class="rno">취소</button><button class="ok rsave">저장</button></div></div>';
  $('rText').focus();
}
async function saveRecord(btn) {
  const [mc, d] = SEL.split('|'), text = $('rText').value.trim();
  const msg = (t, err) => { $('rMsg').textContent = t; $('rMsg').classList.toggle('err', !!err); };
  if (!text) { msg('내용을 입력하세요', true); return; }
  btn.disabled = true;
  try {
    msg('저장 중…');
    const rec = { dc: mc, date: d, type: $('rType').value, status: $('rSt').value, time: $('rTime').value, text };
    const r = await api(Object.assign({ action: 'addRecord' }, rec));
    if (!r.ok) throw new Error(r.error);
    const n = { src: '직접 입력', key: r.id, date: d, time: rec.time, type: rec.type, status: rec.status, text, ko: '', who: getWho(), manual: true, photos: [], added: [] };
    for (let i = 0; i < REC_FILES.length; i++) {
      msg('사진 올리는 중… ' + (i + 1) + '/' + REC_FILES.length);
      const data = await shrink(REC_FILES[i]);
      const p = await api({ action: 'addPhoto', key: r.id, dc: mc, date: d, src: n.src, text, data });
      if (p.ok) { n.photos.push(p.id); n.added.push(p.id); }
    }
    ((D.notes[mc] = D.notes[mc] || {})[d] = D.notes[mc][d] || []).push(n);
    if (D.cells[mc] && D.cells[mc][d]) D.cells[mc][d].unexplained = false;
    refreshDay();
  } catch (er) { btn.disabled = false; msg('실패: ' + (er.message || er), true); }
}
function removeNote(key) {
  const [mc, d] = SEL.split('|');
  const list = (D.notes[mc] && D.notes[mc][d]) || [];
  const i = list.findIndex(n => n.key === key); if (i >= 0) list.splice(i, 1);
  if (D.cells[mc] && D.cells[mc][d]) D.cells[mc][d].unexplained = D.cells[mc][d].equip >= 120 && !list.length;
}
// 달력 점·빨간 테두리까지 다시 그리고 같은 칸을 다시 열기
function refreshDay() {
  const k = SEL; render(D);
  const td = document.querySelector('td.c[data-k="' + k + '"]'); if (td) td.click();
}

// ---------- 상호작용 ----------
const tip = $('tip');
document.addEventListener('mousemove', e => {
  const td = e.target.closest('#cal td.c'), t = e.target.closest('[data-tip]');
  if (td && D) {
    const [mc, k] = td.dataset.k.split('|');
    const c = D.cells[mc] && D.cells[mc][k], n = (D.notes[mc] && D.notes[mc][k]) || [];
    const top = c ? Object.entries(c.codes).sort((a, b) => b[1] - a[1]).slice(0, 3).map(x => esc(x[0]) + ' ' + x[1] + '분').join('<br>') : '';
    const ttl = VIEW === 'week' ? mc + ' · ' + esc((D.weeks.find(w => w.key === k) || {}).label) : mc + ' · ' + md(k) + '(' + wd(k) + ')';
    tip.innerHTML = '<b>' + ttl + '</b><br>' + (c ? '로스 ' + fmtMin(c.loss) + (top ? '<br><span style="opacity:.75">' + top + '</span>' : '') : 'OEE 기록 없음') +
      '<br>기록 ' + n.length + '건' + ((VIEW === 'week' ? c && c.unexplainedDays : c && c.unexplained) ? '<br>⚠ 이유 기록 없음' : '');
  } else if (t) {
    tip.textContent = t.dataset.tip;
  } else { tip.style.display = 'none'; return; }
  tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 310) + 'px';
  tip.style.top = Math.min(e.clientY + 14, window.innerHeight - 120) + 'px';
});
$('cal').addEventListener('click', e => {
  const td = e.target.closest('td.c'); if (!td) return;
  document.querySelectorAll('td.sel').forEach(x => x.classList.remove('sel'));
  td.classList.add('sel'); SEL = td.dataset.k;
  VIEW === 'week' ? openWeek(SEL) : openDay(SEL);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && D) showSummary(); });

let FOCUS = false;
function toggleFocus() { FOCUS = !FOCUS; $('tgFocus').classList.toggle('on', FOCUS); $('cal').classList.toggle('focus', FOCUS); }
$('tgFocus').onclick = toggleFocus;
$('tgDots').onclick = () => { const on = $('tgDots').classList.toggle('on'); $('cal').classList.toggle('nodots', !on); };

function setView(v) {
  VIEW = v;
  $('vMonth').classList.toggle('on', v === 'month'); $('vWeek').classList.toggle('on', v === 'week');
  $('wn').style.display = v === 'week' ? '' : 'none';
  load();
}
function move(delta) {
  if (VIEW === 'week') weekEnd = addDays(weekEnd || today(), delta * 7 * (+$('wn').value));
  else { const [y, m] = (YM || today().slice(0, 7)).split('-').map(Number); const d = new Date(y, m - 1 + delta, 1); YM = d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  load();
}
$('vMonth').onclick = () => setView('month');
$('vWeek').onclick = () => setView('week');
$('prev').onclick = () => move(-1);
$('next').onclick = () => move(1);
$('wn').onchange = () => load();

load();
</script>
