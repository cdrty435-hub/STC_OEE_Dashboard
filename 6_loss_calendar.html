<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STC 로스 달력</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --page: #f4f4f1; --surface: #ffffff; --raise: #fbfbf9;
    --ink: #111110; --ink2: #55544f; --muted: #8b8a84; --line: #e6e5df; --line2: #d4d3cb;
    --s0: #f1f1ed; --s1: #d6e6fb; --s2: #93bdf0; --s3: #3e8be3; --s4: #1d5aa8;
    --t1: #111110; --t2: #111110; --t3: #ffffff; --t4: #ffffff;
    --good: #0ca30c; --warning: #e0a10f; --critical: #d03b3b; --accent: #1d5aa8;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0e0e0d; --surface: #181817; --raise: #1f1f1e;
      --ink: #f0efec; --ink2: #c3c2b7; --muted: #8b8a84; --line: #2b2b29; --line2: #3a3a37;
      --s0: #222220; --s1: #123b70; --s2: #1d5aa8; --s3: #3e8be3; --s4: #93bdf0;
      --t1: #f0efec; --t2: #ffffff; --t3: #ffffff; --t4: #0b0b0b;
      --accent: #93bdf0; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--page); color: var(--ink); font: 13px/1.45 Pretendard, "Noto Sans KR", "Noto Sans Thai", -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; }
  button, input, select { font: inherit; color: inherit; }

  /* ---------- 상단 바 ---------- */
  .top { display: flex; align-items: center; gap: 14px; padding: 10px 18px; background: var(--surface);
    border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand b { font-size: 16px; letter-spacing: -.2px; }
  .brand span { color: var(--muted); font-size: 12px; }
  .seg { display: inline-flex; background: var(--s0); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: transparent; padding: 5px 14px; border-radius: 6px; color: var(--ink2); cursor: pointer; }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 600; }
  .period { display: flex; align-items: center; gap: 4px; }
  .period button { border: 1px solid var(--line2); background: var(--surface); border-radius: 7px; width: 30px; height: 30px; cursor: pointer; }
  .period .lbl { min-width: 150px; text-align: center; font-weight: 600; font-size: 14px; }
  .period select { border: 1px solid var(--line2); background: var(--surface); border-radius: 7px; padding: 4px 6px; }
  .grow { flex: 1; }
  .toggles { display: flex; gap: 6px; }
  .tg { border: 1px solid var(--line2); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 12px; color: var(--ink2); cursor: pointer; }
  .tg.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .upd { color: var(--muted); font-size: 11px; }

  /* ---------- KPI ---------- */
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; padding: 12px 18px 0; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 12px; min-width: 0; }
  .kpi .k { color: var(--ink2); font-size: 12px; }
  .kpi .v { font-size: 22px; font-weight: 700; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  .kpi .v small { font-size: 12px; font-weight: 500; color: var(--ink2); margin-left: 2px; }
  .kpi .sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .bar { height: 6px; background: var(--s0); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .kpi .bar i { display: block; height: 100%; border-radius: 3px; }
  .kpi .txt { min-width: 0; flex: 1; }
  .kpi.clickable { cursor: pointer; }
  .kpi.clickable:hover { border-color: var(--line2); }
  @media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  /* ---------- 본문 2단 ---------- */
  .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 12px; padding: 12px 18px 16px; }
  @media (max-width: 1100px) {
    html, body { height: auto; }
    .layout { grid-template-columns: 1fr; }
    .board { height: 72vh; }
    .insp { max-height: none; }
    .insp .ib { overflow: visible; }
  }
  .board, .insp { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); min-height: 0; }
  .board { display: flex; flex-direction: column; overflow: hidden; }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--ink2); font-size: 11.5px; }
  .legend .sw { display: inline-block; width: 14px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 3px; }
  .legend .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); vertical-align: 1px; margin-right: 4px; }
  .legend .ring { display: inline-block; width: 14px; height: 10px; border-radius: 2px; box-shadow: inset 0 0 0 1.5px var(--critical); vertical-align: -1px; margin-right: 4px; }
  .scroll { overflow: auto; flex: 1; min-height: 0; }

  table.cal { border-collapse: separate; border-spacing: 2px; margin: 4px 8px 10px; }
  .cal th { position: sticky; background: var(--surface); box-shadow: 0 0 0 3px var(--surface); z-index: 2; font-weight: 500; color: var(--muted); font-size: 10.5px; padding: 0; }
  .cal thead tr.mini th { top: 0; height: 30px; vertical-align: bottom; }
  .cal thead tr.days th { top: 30px; padding: 2px 0 4px; }
  .cal th .dn { display: block; color: var(--ink); font-size: 11.5px; font-weight: 600; }
  .cal th.we .dn { color: var(--muted); }
  .cal th.today .dn { color: var(--accent); }
  .mb { width: 70%; margin: 0 auto; background: var(--line2); border-radius: 2px 2px 0 0; min-height: 1px; }
  .cal th:hover .mb { background: var(--s3); }
  .cal .mc { position: sticky; left: 0; z-index: 3; background: var(--surface); text-align: left; padding: 0 10px 0 6px; min-width: 96px; }
  .cal thead .mc { z-index: 4; }
  .mc .nm { font-weight: 700; font-size: 12.5px; color: var(--ink); }
  .mc .tt { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .mc .tt i { display: block; height: 4px; background: var(--s2); border-radius: 2px; }
  td.c { width: 32px; min-width: 32px; height: 30px; border-radius: 5px; text-align: center; font-size: 10.5px; font-variant-numeric: tabular-nums;
    cursor: pointer; position: relative; background: var(--s0); color: var(--ink2); transition: opacity .15s; }
  .cal.week td.c { width: 58px; min-width: 58px; }
  td.c.l1 { background: var(--s1); color: var(--t1); }
  td.c.l2 { background: var(--s2); color: var(--t2); }
  td.c.l3 { background: var(--s3); color: var(--t3); }
  td.c.l4 { background: var(--s4); color: var(--t4); font-weight: 600; }
  td.c.empty { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
  td.c:hover { outline: 2px solid var(--ink2); outline-offset: 0; z-index: 1; }
  td.c.sel { outline: 2px solid var(--ink); outline-offset: 1px; z-index: 1; }
  td.c .d { position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--ink); }
  td.c.l3 .d, td.c.l4 .d { background: #fff; }
  .nodots td.c .d { display: none; }
  td.c.unx { box-shadow: inset 0 0 0 1.5px var(--critical); }
  td.c.unx .q { position: absolute; left: 3px; top: 1px; font-size: 9px; font-weight: 800; color: var(--critical); }
  td.c.l3.unx .q, td.c.l4.unx .q { color: #fff; }
  .focus td.c:not(.unx) { opacity: .28; }
  /* 일자별 워스트 4 */
  :root { --w1: #c2410c; --w2: #ea580c; --w3: #fb923c; --w4: #fdba74; }
  td.c.w1, td.c.w2, td.c.w3, td.c.w4 { z-index: 1; }
  td.c.w1 { outline: 2.5px solid var(--w1); outline-offset: -1px; }
  td.c.w2 { outline: 2.5px solid var(--w2); outline-offset: -1px; }
  td.c.w3 { outline: 2px solid var(--w3); outline-offset: -1px; }
  td.c.w4 { outline: 2px solid var(--w4); outline-offset: -1px; }
  td.c .wr { position: absolute; left: -3px; bottom: -3px; width: 13px; height: 13px; border-radius: 50%; font-size: 8.5px; line-height: 13px;
    font-weight: 800; color: #fff; text-align: center; box-shadow: 0 0 0 1.5px var(--surface); }
  td.c .wr.r1 { background: var(--w1); } td.c .wr.r2 { background: var(--w2); }
  td.c .wr.r3 { background: var(--w3); color: #431407; } td.c .wr.r4 { background: var(--w4); color: #431407; }
  .noworst td.c.w1, .noworst td.c.w2, .noworst td.c.w3, .noworst td.c.w4 { outline: none; }
  .noworst td.c .wr, .noworst ~ #worst { display: none; }
  /* 워스트 4 줄 (달력 맨 아래 고정, 날짜 칸과 같은 폭) */
  /* 함께 보기: 고장횟수는 보라색 작은 숫자 (파랑 칸 어디서나 읽히게 흰 바탕) */
  td.c .lv { display: block; line-height: 1.05; }
  td.c .nf { display: block; width: max-content; margin: 1px auto 0; padding: 0 4px; border-radius: 6px; font-size: 9px; line-height: 11px;
    font-weight: 700; color: #6d28d9; background: rgba(255,255,255,.9); }
  .legend .nfk { display: inline-block; padding: 0 4px; border-radius: 6px; font-size: 10px; font-weight: 700; color: #6d28d9; background: #f3e8ff; margin-right: 3px; }
  /* 일요일: 머리 빨강 + 빈 칸 연한 빨강 바탕, 데이터 칸은 아래 빨간 줄 */
  .cal thead tr.days th.sun, .cal thead tr.days th.sun .dn { color: #dc2626 !important; }
  .cal thead tr.days th.sun { background: #fef2f2; border-radius: 6px 6px 0 0; }
  td.c.sun:not(.l1):not(.l2):not(.l3):not(.l4) { background: #fef2f2; box-shadow: inset 0 0 0 1px #fecaca; }
  td.c.sun.l1, td.c.sun.l2, td.c.sun.l3, td.c.sun.l4 { box-shadow: inset 0 -3px 0 #f87171; }
  .cal tfoot td { position: sticky; background: var(--surface); z-index: 2; box-shadow: 0 0 0 2px var(--surface); }
  .cal tfoot td { height: 30px; box-sizing: border-box; } .cal tfoot td.wc, .cal tfoot td.oc { height: 28px; }
  .cal tfoot tr.wr1 td { bottom: 256px; } .cal tfoot tr.wr2 td { bottom: 224px; }
  .cal tfoot tr.wr3 td { bottom: 192px; } .cal tfoot tr.wr4 td { bottom: 160px; } .cal tfoot tr.wrs td { bottom: 128px; } .cal tfoot tr.wrp td { bottom: 96px; } .cal tfoot tr.wrk td { bottom: 64px; } .cal tfoot tr.wr5 td { bottom: 32px; } .cal tfoot tr.wro td { bottom: 0; }
  td.oc.f5 { background: #dcfce7; color: #14532d; outline: 1px solid #16a34a; }
  .cal tfoot td.mc .ok2.f5 { background: #16a34a; width: auto; padding: 0 3px; }
  td.oc.sf { background: #fef9c3; color: #713f12; outline: 1px solid #ca8a04; }
  .cal tfoot td.mc .ok2.sf { background: #ca8a04; }
  .b-sf { background: #fef9c3; color: #713f12; }
  .noworst tfoot tr.wro td { bottom: 0; } .noworst tfoot tr.wr5 td { bottom: 32px; } .noworst tfoot tr.wrk td { bottom: 64px; } .noworst tfoot tr.wrp td { bottom: 96px; } .noworst tfoot tr.wrs td { bottom: 128px; }
  td.oc.pm { background: #dbeafe; color: #1e3a8a; outline: 1px solid #2563eb; } .cal tfoot td.mc .ok2.pm { background: #2563eb; width: auto; padding: 0 3px; }
  td.oc.kz { background: #f3e8ff; color: #581c87; outline: 1px solid #9333ea; } .cal tfoot td.mc .ok2.kz { background: #9333ea; }
  td.oc { height: 26px; border-radius: 5px; text-align: center; font-size: 10.5px; font-weight: 700; cursor: pointer; color: #334155;
    background: #eef2f7; outline: 1px dashed #94a3b8; outline-offset: -1px; }
  td.oc:hover { outline: 2px solid var(--ink2); }
  .cal tfoot td.mc .ok2 { display: inline-block; width: 15px; height: 15px; border-radius: 4px; background: #94a3b8; color: #fff; font-size: 9.5px;
    line-height: 15px; text-align: center; font-weight: 800; margin-right: 4px; }
  .mvbar { display: flex; gap: 6px; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line2); font-size: 12px; }
  .mvbar select { border: 1px solid var(--line2); border-radius: 6px; padding: 3px 6px; font: inherit; font-size: 12px; background: var(--surface); color: var(--ink); }
  .mvbar button { border: 1px solid var(--ink); background: var(--ink); color: var(--surface); border-radius: 6px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .mvbar button.un { background: transparent; color: var(--ink2); border-color: var(--line2); }
  .eqtag { font-size: 11px; color: #334155; background: #eef2f7; border-radius: 4px; padding: 0 5px; }
  .cal tfoot tr.wr1 td { box-shadow: 0 0 0 2px var(--surface), 0 -8px 0 var(--surface), 0 -9px 0 var(--line); }
  .cal tfoot td.mc { z-index: 3; font-size: 11px; color: var(--ink2); font-weight: 600; white-space: nowrap; }
  .cal tfoot td.mc .rk { display: inline-block; width: 15px; height: 15px; border-radius: 50%; color: #fff; font-size: 9.5px; line-height: 15px;
    text-align: center; font-weight: 800; margin-right: 4px; }
  .rk.r1 { background: var(--w1); } .rk.r2 { background: var(--w2); } .rk.r3 { background: var(--w3); color: #431407 !important; } .rk.r4 { background: var(--w4); color: #431407 !important; }
  td.wc { height: 28px; border-radius: 5px; text-align: center; font-size: 10.5px; font-weight: 700; cursor: pointer; font-variant-numeric: tabular-nums; }
  td.wc.r1 { background: #fde3d3; color: #7c2d12; outline: 1.5px solid var(--w1); outline-offset: -1.5px; }
  td.wc.r2 { background: #feeadc; color: #7c2d12; outline: 1.5px solid var(--w2); outline-offset: -1.5px; }
  td.wc.r3 { background: #fff1e6; color: #7c2d12; outline: 1px solid var(--w3); outline-offset: -1px; }
  td.wc.r4 { background: #fff7ef; color: #7c2d12; outline: 1px solid var(--w4); outline-offset: -1px; }
  td.wc.nx::after { content: '!'; color: var(--critical); font-size: 9px; margin-left: 1px; vertical-align: super; }
  td.wc:hover { outline: 2px solid var(--ink2); outline-offset: -2px; }
  .noworst tfoot tr.wr1, .noworst tfoot tr.wr2, .noworst tfoot tr.wr3, .noworst tfoot tr.wr4 { display: none; }
  .cal thead tr.days th.colk { cursor: pointer; } .cal thead tr.days th.colk:hover .dn { text-decoration: underline; }
  .wpan .wit { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; }
  .wpan .wit .is { -webkit-line-clamp: 5; }
  .wnav { display: flex; gap: 6px; align-items: center; }
  .wnav button { border: 1px solid var(--line2); background: transparent; border-radius: 6px; padding: 1px 8px; cursor: pointer; font: inherit; font-size: 12px; }
  .wnav button:disabled { opacity: .35; cursor: default; }
  #worst { padding: 14px 4px 6px; border-top: 1px solid var(--line); margin-top: 10px; }
  #worst h3 { margin: 0 0 10px 6px; font-size: 13px; display: flex; align-items: baseline; gap: 8px; }
  #worst h3 span { font-size: 11.5px; color: var(--muted); font-weight: 400; }
  .wlist { display: flex; gap: 8px; overflow-x: auto; padding: 0 6px 8px; scroll-snap-type: x proximity; }
  .wday { flex: 0 0 214px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); scroll-snap-align: end; }
  .wday.today { border-color: var(--ink2); }
  .wday .wh { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 10px; border-bottom: 1px solid var(--line);
    font-size: 12.5px; font-weight: 700; }
  .wday .wh span { font-size: 11px; color: var(--muted); font-weight: 400; }
  .wit { display: grid; grid-template-columns: 18px 1fr; gap: 6px; padding: 7px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .wit:last-child { border-bottom: 0; border-radius: 0 0 10px 10px; }
  .wit:hover { background: var(--raise); }
  .wit .rk { width: 18px; height: 18px; border-radius: 50%; font-size: 10.5px; line-height: 18px; text-align: center; font-weight: 800; color: #fff; }
  .wit .rk.r1 { background: var(--w1); } .wit .rk.r2 { background: var(--w2); }
  .wit .rk.r3 { background: var(--w3); color: #431407; } .wit .rk.r4 { background: var(--w4); color: #431407; }
  .wit .l1x { font-size: 12.5px; display: flex; gap: 6px; align-items: baseline; }
  .wit .l1x b { font-size: 13px; } .wit .l1x .mn { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--ink2); font-weight: 600; }
  .wit .is { font-size: 11.5px; line-height: 1.4; color: var(--ink2); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 3;
    -webkit-box-orient: vertical; overflow: hidden; }
  .wit .is.no { color: var(--critical); }
  .wit .sb { font-size: 10px; color: var(--muted); margin-right: 3px; }
  td.tot { color: var(--ink2); font-size: 11px; padding: 0 10px; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
  tr.sum td { color: var(--ink2); font-size: 10.5px; text-align: center; padding-top: 4px; font-variant-numeric: tabular-nums; }
  #loading { padding: 50px; text-align: center; color: var(--muted); }

  /* ---------- 오른쪽 인스펙터 ---------- */
  .insp { display: flex; flex-direction: column; overflow: hidden; }
  .ih { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .ih .t { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .ih .t button { border: 0; background: var(--s0); border-radius: 6px; padding: 2px 8px; cursor: pointer; color: var(--ink2); font-size: 12px; font-weight: 500; }
  .ih .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .ib { overflow: auto; padding: 12px 16px 20px; flex: 1; min-height: 0; }
  .sec { margin-bottom: 16px; }
  .sec h3 { font-size: 12px; color: var(--ink2); font-weight: 600; margin: 0 0 8px; display: flex; justify-content: space-between; }
  .sec h3 span { color: var(--muted); font-weight: 400; }
  .hb { display: grid; grid-template-columns: 104px 1fr 50px; align-items: center; gap: 8px; font-size: 12px; margin: 3px 0; }
  .hb > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hb .tr { height: 9px; }
  .hb .fl { height: 9px; background: var(--s3); border-radius: 0 4px 4px 0; min-width: 2px; }
  .hb .vv { text-align: right; color: var(--ink2); font-variant-numeric: tabular-nums; }
  .hb.click { cursor: pointer; border-radius: 4px; }
  .hb.click:hover { background: var(--s0); }
  .stat3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 14px; }
  .stat3 > div { background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
  .stat3 .k { font-size: 11px; color: var(--muted); }
  .stat3 .v { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .warn { border: 1px solid var(--critical); background: color-mix(in srgb, var(--critical) 7%, transparent); border-radius: 8px; padding: 8px 10px; font-size: 12px; margin-bottom: 12px; }
  table.sh { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; margin-top: 6px; }
  table.sh td, table.sh th { padding: 4px 5px; border-bottom: 1px solid var(--line); text-align: right; font-size: 11.5px; }
  table.sh th { color: var(--muted); font-weight: 500; }
  table.sh td:first-child, table.sh th:first-child { text-align: left; }
  table.sh td.q { color: var(--critical); font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .chip { border: 1px solid var(--line2); background: var(--surface); color: var(--ink2); border-radius: 999px; padding: 3px 10px; font-size: 11.5px; cursor: pointer; }
  .chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .note { border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; margin-bottom: 8px; background: var(--raise); }

const I18N_KEYS = Object.keys(I18N).sort((a, b) => b.length - a.length);
const WD_T = { '일': ['Sun', 'อา'], '월': ['Mon', 'จ'], '화': ['Tue', 'อ'], '수': ['Wed', 'พ'], '목': ['Thu', 'พฤ'], '금': ['Fri', 'ศ'], '토': ['Sat', 'ส'] };
const MON_EN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function trText(t) {
  const L = LANG === 'en' ? 0 : 1;
  const EX = { '안': ['S', 'ป'], '기': ['O', 'อ'], '시간': ['h', 'ชม.'], '건': ['', 'รายการ'], '칸': ['cells', 'ช่อง'], '회': ['×', 'ครั้ง'], '분': ['m', 'น.'] };
  if (WD_T[t.trim()]) return t.replace(t.trim(), WD_T[t.trim()][L]);
  if (EX[t.trim()]) return t.replace(t.trim(), EX[t.trim()][L]);

function shrink(file) {   // 긴 변 1600px, JPEG 85% 로 줄여서 올림
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('사진을 읽을 수 없습니다')); };
    img.src = url;
  });
}

async function pasteFromClipboard(key) {
  if (!navigator.clipboard || !navigator.clipboard.read) { setMsg(key, '이 브라우저는 버튼 붙여넣기를 지원하지 않습니다 — 카드 위에서 Ctrl+V 하세요', true); return; }
  try {
    const items = await navigator.clipboard.read(), files = [];
    for (const it of items) {
      const t = it.types.find(x => x.startsWith('image/'));
      if (t) { const b = await it.getType(t); files.push(new File([b], 'paste_' + Date.now() + '.png', { type: b.type })); }
    }
    if (!files.length) { setMsg(key, '복사된 사진이 없습니다 — 사진을 복사(Ctrl+C)하거나 캡처(Win+Shift+S)한 뒤 누르세요', true); return; }
    uploadFiles(key, files);

    setMsg(key, '클립보드 읽기가 막혔습니다 — 주소창 왼쪽 🔒에서 「클립보드」 허용, 또는 카드 위에서 Ctrl+V', true);
  }
}

function reportHtml(J, d) {
  const all = []; Object.keys(J.notes || {}).forEach(mc => ((J.notes[mc] || {})[d] || []).forEach(n => all.push({ mc, n })));
  const cells = Object.keys(J.cells || {}).map(mc => ({ mc, c: J.cells[mc][d] })).filter(x => x.c);
  const loss = cells.reduce((a, x) => a + x.c.loss, 0), nof = cells.reduce((a, x) => a + (x.c.nof || 0), 0), eq = cells.reduce((a, x) => a + (x.c.equip || 0), 0);
  const byG = g => all.filter(x => grp(x.n) === g);
  const reps = byG('LINE 수리').concat(byG('직접 입력')), defs = byG('LINE 불량'), mtg = byG('아침조회');
  const isOpenN = n => /미조치|미해결|진행|대기/.test(n.status || '');
  const openN = all.filter(x => isOpenN(x.n)).length, unx = cells.filter(x => x.c.unexplained).length;
  const stc = st => { const c = stColor(st); return '<span class="st"><i style="background:' + c[0] + '"></i>' + esc(c[1]) + '</span>'; };
  const full = secOn('detail');
  const thumbs = n => { const p = n.photos || [], k = full ? 3 : 1;
    return p.slice(0, k).map(id => '<a href="https://drive.google.com/file/d/' + esc(id) + '/view" target="_blank"><img src="https://drive.google.com/thumbnail?id=' + esc(id) + '&sz=w200" alt="📷" ' +
      'onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{textContent:\'📷\',title:\'사진 열기 (드라이브 권한 필요)\'}))"></a>').join('') + (p.length > k ? '<span class="more">+' + (p.length - k) + '</span>' : ''); };
  // 앞에 붙은 @멘션(예: @🔧 와일드 우먼🔧) 은 보고서에서 뺌
  const MENTION = new RegExp('^\\s*@\\s*[\\u{1F300}-\\u{1FAFF}\\u2600-\\u27BF]?[^@\\n]{1,30}?[\\u{1F300}-\\u{1FAFF}\\u2600-\\u27BF]\\uFE0F?\\s*', 'u');
  const clean = t => String(t || '').replace(MENTION, '').replace(/^\s*@\S+\s+/, '');
  const body = n => '<span class="noi18n cl" title="' + esc(clean(mainTxt(n))) + '">' + esc(clean(mainTxt(n))) + '</span>';
  const byTime = (a, b) => (a.n.time || '99') < (b.n.time || '99') ? -1 : 1;
  const kp = (k, v, bad) => '<div><div class="k">' + k + '</div><div class="v' + (bad ? ' bad' : '') + '">' + v + '</div></div>';
  let h = '<div class="rhead"><div><h1>STC 설비보전 일일 작업현황</h1><div class="rsub">FAC1 다이캐스팅 · OEE 로스 × LINE 기록 × 아침조회</div></div>' +
    '<div style="text-align:right"><div style="font-size:18px;font-weight:800">' + d.replace(/-/g, '.') + ' (' + wd(d) + ')</div><div class="rsub">작성 ' + (J.updated || '') + '</div></div></div>';
  if (secOn('kpi')) h += '<div class="rkpi">' + kp('총 로스', cells.length ? fmtMin(loss) : '—') + kp('고장횟수', cells.length ? nof + '회' : '—') + kp('1회 평균 정지', nof ? Math.round(eq / nof) + '분' : '—') +
    kp('수리', reps.length + '건') + kp('불량 알림', defs.length + '건', defs.some(x => isOpenN(x.n))) + kp('미결', openN + '건', openN > 0) + '</div>';
  // 워스트 4
  const w = cells.filter(x => x.c.loss > 0).sort((a, b) => b.c.loss - a.c.loss).slice(0, 4);
  h += '<div class="rgrid">';
  if (secOn('worst')) {
  h += '<div class="rsec half"><h2>로스 워스트 4 <span>' + (cells.length ? '이유 기록 없는 큰 로스 ' + unx + '칸' : 'OEE 미입력') + '</span></h2>';
  if (w.length) {
    const col = ['var(--w1)', 'var(--w2)', 'var(--w3)', 'var(--w4)'];
    h += '<table class="rt"><colgroup><col style="width:36px"><col style="width:56px"><col style="width:84px"><col style="width:46px"><col style="width:150px"><col></colgroup><tr><th>순위</th><th>호기</th><th>로스</th><th>고장</th><th>주 원인</th><th>주요 이슈</th></tr>' + w.map((x, i) => {
      const top = Object.entries(x.c.codes).sort((a, b) => b[1] - a[1])[0];
      const ns = ((J.notes[x.mc] || {})[d] || []).slice().sort((a, b) => ISSUE_RANK(a) - ISSUE_RANK(b));
      return '<tr data-k="' + x.mc + '|' + d + '"><td><span class="rk1" style="background:' + col[i] + '">' + (i + 1) + '</span></td><td class="nw"><b>' + x.mc + '</b></td><td class="nw">' + fmtMin(x.c.loss) + '</td><td class="nw">' + (x.c.nof || 0) + '회</td>' +
        '<td class="nw">' + (top ? esc(top[0]) + ' ' + top[1] + '분' : '') + '</td><td>' + (ns.length ? body(ns[0]) : '<span style="color:#b91c1c">⚠ 이유 기록 없음</span>') + '</td></tr>';
    }).join('') + '</table>';
  } else h += '<div class="rnone">' + (cells.length ? '로스 없음' : 'OEE 데이터가 아직 입력되지 않았습니다') + '</div>';
  h += '</div>';
  }
  const table = (title, list, withPh, wide) => { withPh = withPh && secOn('photo'); return '<div class="rsec ' + (wide ? 'wide' : 'half') + '"><h2>' + title + ' <span>' + list.length + '건</span></h2>' + (list.length ?
    '<table class="rt"><colgroup><col class="c-t"><col class="c-m"><col class="c-y"><col><col class="c-s">' + (withPh ? '<col class="c-p">' : '') + '</colgroup>' +
    '<tr><th>시각</th><th>호기</th><th>분류</th><th>내용</th><th>상태</th>' + (withPh ? '<th>사진</th>' : '') + '</tr>' +
    list.sort(byTime).map(x => '<tr' + (/^DC\d|^FAC|^TP/.test(x.mc) ? ' data-k="' + esc(x.mc) + '|' + d + '"' : '') + '><td class="nw">' + esc(x.n.time || '') + '</td><td class="nw"><b>' + esc(x.mc) + '</b></td><td class="ty" title="' + esc(x.n.type || '') + '">' + esc(full ? (x.n.type || '') : String(x.n.type || '').split(/,\s*/)[0]) + '</td><td class="tx">' + body(x.n) +
      ((x.n.memos || []).length && full ? '<div style="color:#6b7280;margin-top:2px">💬 <span class="noi18n">' + esc(x.n.memos.map(m => m.text).join(' / ')) + '</span></div>' : '') + '</td><td class="nw">' + stc(x.n.status) + '</td>' +
      (withPh ? '<td class="rph">' + thumbs(x.n) + '</td>' : '') + '</tr>').join('') + '</table>' : '<div class="rnone">기록이 없습니다</div>') + '</div>'; };
  if (secOn('defect')) h += table('불량 알림', defs, true);
  if (secOn('repair')) h += table('수리 내역', reps, true, true);
  if (secOn('mtg')) h += table('아침조회', mtg, false);
  [['safety', '안전·전기', J.safety], ['pm', 'PM', J.pm], ['kaizen', '개선', J.kaizen], ['fives', '5S', J.fives], ['others', '기타', J.others]].forEach(([k, t, o]) => {
    if (secOn(k)) h += table(t, ((o || {})[d] || []).map(n => ({ mc: n.eq || '', n })), true);
  });
  h += '</div>';
  return h;
}
$('btnReport').onclick = () => document.body.classList.contains('rep-mode') ? closeReport() : openReport();
(function () { const m = location.search.match(/[?&]report=(\d{4}-\d{2}-\d{2})/); if (m) setTimeout(() => openReport(m[1]), 50); })();
(function () { const m = location.search.match(/[?&]lang=(ko|en|th)/); if (m && m[1] !== LANG) { try { localStorage.setItem('lossLang', m[1]); } catch (e) {} location.replace(location.pathname + location.search.replace(/[?&]lang=\w+/, '').replace(/^&/, '?')); } })();

// 언어 버튼
(function () {
  const seg = document.getElementById('langSeg'); if (!seg) return;
  seg.querySelectorAll('button').forEach(b => {
    b.classList.toggle('on', b.dataset.l === LANG);
    b.onclick = () => { if (b.dataset.l === LANG) return; try { localStorage.setItem('lossLang', b.dataset.l); } catch (e) {} location.reload(); };
  });
})();
startI18n();

load();
</script>
</body>
</html>
